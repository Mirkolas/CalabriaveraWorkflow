name: Scheduled - Health guard

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scheduled-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://calabriavera.com
    steps:
      - name: Verifica gli ultimi cicli schedulati
        shell: bash
        run: |
          set -euo pipefail

          check_workflow() {
            local workflow="$1"
            local max_age_minutes="$2"
            local label="$3"
            local payload latest conclusion created now created_epoch age

            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=schedule&branch=main&per_page=10")"
            latest="$(printf '%s' "$payload" | jq -c '.workflow_runs | map(select(.status == "completed")) | .[0] // empty')"
            test -n "$latest" || { echo "::error::${label}: nessun ciclo schedulato completato trovato"; return 1; }

            conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
            created="$(printf '%s' "$latest" | jq -r '.created_at // ""')"
            test "$conclusion" = "success" || { echo "::error::${label}: ultimo ciclo concluso con ${conclusion:-stato-sconosciuto}"; return 1; }

            now="$(date -u +%s)"
            created_epoch="$(date -u -d "$created" +%s)"
            age="$(( (now - created_epoch) / 60 ))"
            if [ "$age" -gt "$max_age_minutes" ]; then
              echo "::error::${label}: ultimo ciclo riuscito troppo vecchio (${age} minuti; massimo ${max_age_minutes})"
              return 1
            fi
            echo "OK ${label}: success, ${age} minuti fa"
          }

          # Soglie volutamente più larghe della cadenza per tollerare ritardi GitHub Actions.
          check_workflow seo-sync.yml 45 "SEO/sitemap (ogni 5 min)"
          check_workflow magazine-sync.yml 75 "Magazine/social (ogni 15 min)"
          check_workflow source-watch.yml 180 "Source watch (ogni ora)"
          check_workflow daily-backup.yml 2160 "Backup giornaliero"
          check_workflow firebase-deploy.yml 2160 "Manutenzione Firebase giornaliera"
          check_workflow smoke-browser.yml 2160 "Smoke browser giornaliero"

      - name: Verifica dominio canonico, sitemap e cinque lingue
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "$SITE_URL/sitemap-generation.json?health=${GITHUB_RUN_ID}" -o "$tmp/manifest.json"

          test "$(jq -r '.site' "$tmp/manifest.json")" = "$SITE_URL" || { echo "::error::Manifest SEO con dominio non canonico"; exit 1; }
          test "$(jq -c '.languages' "$tmp/manifest.json")" = '["it","en","fr","de","es"]' || { echo "::error::Manifest SEO senza le 5 lingue richieste"; exit 1; }

          approved="$(jq -r '.approvedBusinesses // 0' "$tmp/manifest.json")"
          prerendered="$(jq -r '.prerenderedBusinessPages // 0' "$tmp/manifest.json")"
          test "$prerendered" -eq "$((approved * 5))" || { echo "::error::Ogni attività approvata deve avere 5 pagine prerenderizzate"; exit 1; }

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "$SITE_URL/sitemap.xml?health=${GITHUB_RUN_ID}" -o "$tmp/sitemap.xml"
          if grep -Eqi 'https?://[^<[:space:]]*\.web\.app' "$tmp/sitemap.xml"; then
            echo "::error::Alias Firebase web.app presente nell'indice sitemap"
            exit 1
          fi

          while IFS= read -r file; do
            test -n "$file" || continue
            case "$file" in
              sitemap-pages.xml|sitemap-main.xml|sitemap-[0-9]*.xml) ;;
              *) echo "::error::Nome sitemap non atteso: $file"; exit 1 ;;
            esac
            curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "$SITE_URL/$file?health=${GITHUB_RUN_ID}" -o "$tmp/$file"
            if grep -Eqi 'https?://[^<[:space:]]*\.web\.app' "$tmp/$file"; then
              echo "::error::Alias Firebase web.app presente in $file"
              exit 1
            fi
            bad="$(grep -oE '<loc>[^<]+</loc>' "$tmp/$file" | sed -E 's#</?loc>##g' | grep -Ev '^https://calabriavera\.com(?:/|$)' || true)"
            test -z "$bad" || { echo "::error::URL non canonici in $file"; printf '%s\n' "$bad"; exit 1; }
          done < <(jq -r '.files[]' "$tmp/manifest.json")

          echo "Health SEO OK: ${approved} attività approvate, ${prerendered} pagine attività, dominio $SITE_URL, lingue it/en/fr/de/es."
