name: Scheduled - Health guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-health.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: scheduled-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://calabriavera.com
    steps:
      - name: Verifica e ripristina i cicli schedulati
        shell: bash
        run: |
          set -euo pipefail

          ensure_workflow() {
            local workflow="$1" max_age_minutes="$2" label="$3"
            local payload latest conclusion created run_url now created_epoch age reason=""
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=schedule&branch=main&per_page=10")"
            latest="$(printf '%s' "$payload" | jq -c '.workflow_runs | map(select(.status == "completed")) | .[0] // empty')"
            if [ -z "$latest" ]; then
              reason="nessun ciclo schedulato completato"
            else
              conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
              created="$(printf '%s' "$latest" | jq -r '.created_at // ""')"
              run_url="$(printf '%s' "$latest" | jq -r '.html_url // ""')"
              echo "${label}: ${run_url:-run-non-disponibile} (${created:-data-sconosciuta}, ${conclusion:-stato-sconosciuto})"
              if [ "$conclusion" != "success" ]; then
                reason="ultimo ciclo ${conclusion:-senza-stato}"
              else
                now="$(date -u +%s)"
                created_epoch="$(date -u -d "$created" +%s)"
                age="$(( (now - created_epoch) / 60 ))"
                if [ "$age" -gt "$max_age_minutes" ]; then reason="ultimo successo vecchio di ${age} minuti"; fi
              fi
            fi

            if [ -n "$reason" ]; then
              echo "::warning::${label}: ${reason}; avvio recupero workflow_dispatch"
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
              echo "RECOVERY ${label}: dispatch accettato"
            else
              echo "OK ${label}"
            fi
          }

          # Il guard orario controlla solo i workflow che hanno davvero un trigger schedule.
          # Se GitHub ritarda o salta il cron, avvia automaticamente un workflow_dispatch di recupero.
          ensure_workflow seo-sync.yml 45 "SEO/sitemap (ogni 5 min)"
          ensure_workflow magazine-sync.yml 75 "Magazine/social (ogni 15 min)"
          ensure_workflow source-watch.yml 180 "Source watch (ogni ora)"
          ensure_workflow daily-backup.yml 2160 "Backup giornaliero"
          ensure_workflow firebase-deploy.yml 2160 "Manutenzione Firebase giornaliera"

      - name: Verifica dominio canonico, sitemap e cinque lingue
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "$SITE_URL/sitemap-generation.json?health=${GITHUB_RUN_ID}" -o "$tmp/manifest.json"
          test "$(jq -r '.site' "$tmp/manifest.json")" = "$SITE_URL" || { echo "::error::Manifest SEO con dominio non canonico"; exit 1; }
          test "$(jq -c '.languages' "$tmp/manifest.json")" = '["it","en","fr","de","es"]' || { echo "::error::Manifest SEO senza le 5 lingue richieste"; exit 1; }

          approved="$(jq -r '.approvedBusinesses // 0' "$tmp/manifest.json")"
          prerendered="$(jq -r '.prerenderedBusinessPages // 0' "$tmp/manifest.json")"
          test "$prerendered" -eq "$((approved * 5))" || { echo "::error::Ogni attività approvata deve avere 5 pagine prerenderizzate"; exit 1; }

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "$SITE_URL/sitemap.xml?health=${GITHUB_RUN_ID}" -o "$tmp/sitemap.xml"
          if grep -Eqi 'https?://[^<[:space:]]*\.web\.app' "$tmp/sitemap.xml"; then
            echo "::error::Alias Firebase web.app presente nell'indice sitemap"; exit 1
          fi

          while IFS= read -r file; do
            test -n "$file" || continue
            case "$file" in sitemap-pages.xml|sitemap-main.xml|sitemap-[0-9]*.xml) ;; *) echo "::error::Nome sitemap non atteso: $file"; exit 1 ;; esac
            curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$SITE_URL/$file?health=${GITHUB_RUN_ID}" -o "$tmp/$file"
            if grep -Eqi 'https?://[^<[:space:]]*\.web\.app' "$tmp/$file"; then echo "::error::Alias Firebase web.app presente in $file"; exit 1; fi
            bad="$(grep -oE '<loc>[^<]+</loc>' "$tmp/$file" | sed -E 's#</?loc>##g' | grep -Ev '^https://calabriavera\.com(/|$)' || true)"
            test -z "$bad" || { echo "::error::URL non canonici in $file"; printf '%s\n' "$bad"; exit 1; }
          done < <(jq -r '.files[]' "$tmp/manifest.json")

          echo "Health SEO OK: ${approved} attività approvate, ${prerendered} pagine attività, dominio $SITE_URL, lingue it/en/fr/de/es."
