name: Architettura reale e quote - sola lettura

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: resource-audit-read-only
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_BACKUP_SERVICE_ACCOUNT }}
      - name: Identifica database senza leggere documenti
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import { google } from './tools/backup/api.mjs';
          const data = await google('https://firestore.googleapis.com/v1/projects/calabriavera-e08d4/databases');
          console.log(JSON.stringify({databases:(data.databases||[]).map(db=>({name:db.name,type:db.type,databaseEdition:db.databaseEdition,locationId:db.locationId,deleteProtectionState:db.deleteProtectionState})),documentReads:0,productionWrites:0}));
          NODE
