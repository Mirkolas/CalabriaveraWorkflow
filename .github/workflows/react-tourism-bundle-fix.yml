name: React migration - bundle tourism module

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-tourism-bundle-fix.yml'

permissions:
  contents: read

jobs:
  patch-private-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT mancante"; exit 1; }

      - name: Checkout branch React privata
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Genera modulo turismo dentro il sorgente React
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cat > frontend-react/scripts/copy-legacy-assets.mjs <<'EOF'
          import { copyFileSync, existsSync, mkdirSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";

          const scriptDir = dirname(fileURLToPath(import.meta.url));
          const repoRoot = resolve(scriptDir, "../..");
          const reactRoot = resolve(scriptDir, "..");
          const source = resolve(repoRoot, "assets/js/tourism-data-core.js");
          const targetDir = resolve(reactRoot, "src/generated");
          const target = resolve(targetDir, "tourism-data-core.js");

          if (!existsSync(source)) throw new Error(`Asset turismo sorgente non trovato: ${source}`);
          mkdirSync(targetDir, { recursive: true });
          copyFileSync(source, target);
          console.log(`Modulo turismo generato: ${target}`);
          EOF

          mkdir -p frontend-react/src/generated
          cat > frontend-react/src/generated/tourism-data-core.d.ts <<'EOF'
          import type { Business } from "../types";
          export const TOURISM_BUSINESSES: Business[];
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend-react/src/lib/public-data.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    tourismPromise = (async () => {
                const runtimeUrl = "/legacy-assets/tourism-data-core.js";
                const module = await import(/* @vite-ignore */ runtimeUrl) as { TOURISM_BUSINESSES?: Business[] };
                return Array.isArray(module.TOURISM_BUSINESSES) ? module.TOURISM_BUSINESSES : [];
              })();'''
          new = '''    tourismPromise = (async () => {
                const module = await import("../generated/tourism-data-core.js") as { TOURISM_BUSINESSES?: Business[] };
                return Array.isArray(module.TOURISM_BUSINESSES) ? module.TOURISM_BUSINESSES : [];
              })();'''
          if old not in text:
              raise SystemExit('Blocco turismo atteso non trovato: patch interrotta')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check

      - name: TypeScript e build Vite
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          if grep -R '/legacy-assets/tourism-data-core.js' dist --include='*.js'; then
            echo "::error::Il build usa ancora il modulo turismo remoto"
            exit 1
          fi
          grep -R 'turismo-centro-storico-tropea' dist/assets --include='*.js' >/dev/null

      - name: Pubblica fix su react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/lib/public-data.ts frontend-react/src/generated/tourism-data-core.d.ts
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria."
            exit 0
          fi
          git commit -m "perf: bundle tourism data with React"
          git push origin HEAD:react-migration
