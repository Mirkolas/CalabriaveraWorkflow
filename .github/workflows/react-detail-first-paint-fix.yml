name: React migration - detail first paint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-detail-first-paint-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-private-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verifica accesso
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT mancante"; exit 1; }

      - name: Checkout branch React privata
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - name: Usa subito gli snapshot nelle pagine dettaglio
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          business = Path('frontend-react/src/pages/BusinessPage.tsx')
          text = business.read_text(encoding='utf-8')
          old_import = 'import { findPublicBusiness } from "../lib/public-data";'
          new_import = 'import { findPublicBusiness, readInlineBusiness } from "../lib/public-data";'
          if old_import not in text and new_import not in text:
              raise SystemExit('Import public-data BusinessPage inatteso')
          text = text.replace(old_import, new_import)
          old_state = 'const [business, setBusiness] = useState<Business | null | undefined>(undefined);'
          new_state = 'const [business, setBusiness] = useState<Business | null | undefined>(() => readInlineBusiness() || undefined);'
          if old_state not in text and new_state not in text:
              raise SystemExit('State BusinessPage inatteso')
          text = text.replace(old_state, new_state)
          business.write_text(text, encoding='utf-8')

          blog = Path('frontend-react/src/pages/BlogPostPage.tsx')
          text = blog.read_text(encoding='utf-8')
          old_date = 'new Intl.DateTimeFormat(LOCALES[language], { dateStyle: "long" }).format(stamp)'
          new_date = 'new Intl.DateTimeFormat(LOCALES[language], { dateStyle: "long", timeZone: "Europe/Rome" }).format(stamp)'
          if old_date not in text and new_date not in text:
              raise SystemExit('Date formatter BlogPostPage inatteso')
          text = text.replace(old_date, new_date)
          blog.write_text(text, encoding='utf-8')
          PY

          cd frontend-react
          npm install --no-audit --no-fund
          npm run build
          cd ..
          git diff --check
          if git diff --quiet; then
            echo "Nessuna modifica necessaria."
            exit 0
          fi
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react/src/pages/BusinessPage.tsx frontend-react/src/pages/BlogPostPage.tsx
          git commit -m "perf: render detail snapshots on first paint"
          git push origin HEAD:react-migration
