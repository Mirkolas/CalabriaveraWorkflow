name: React migration - Firebase live public data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-live-data.yml'
      - 'scripts/patch-react-firebase-live-data.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply live public-data bridge
        run: python automation/scripts/patch-react-firebase-live-data.py
      - name: Build complete Firebase/Worker artifact
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build | tee /tmp/firebase-live-data-build.log
          grep -q 'Prerender produzione completo: 1615 pagine pubbliche.' /tmp/firebase-live-data-build.log
          grep -q 'turismo-isola-dino' dist/catalogo/index.html
          grep -q 'data-prerender-path="/mappa"' dist/mappa/index.html
          test "$(find dist -path '*/blog/*/index.html' -type f | wc -l)" -ge 1300
          npx wrangler deploy --dry-run
      - name: Validate Firebase Hosting emulator
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat dist/build-version.txt)"
          export EXPECTED_SHA
          npx --yes firebase-tools@15.22.1 emulators:exec --only hosting --project demo-calabriavera --config firebase.react.json "node scripts/smoke-firebase-static.mjs"
      - name: Validate live-data contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PUBLIC_DATA_WORKER_ORIGIN' frontend-react/src/lib/public-data.ts
          grep -q 'const live = await firestoreDataset(targetPath);' frontend-react/worker.ts
          grep -q 'Access-Control-Allow-Origin.*\*' frontend-react/worker.ts
          grep -q 'const magazine = blogRows;' frontend-react/scripts/prerender-home.mjs
          git diff --check
      - name: Commit and push
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/lib/public-data.ts frontend-react/worker.ts frontend-react/scripts/prerender-home.mjs
          git commit -m 'fix: keep Firebase public data live after cutover'
          git push origin HEAD:react-migration
          echo "REACT_FIREBASE_LIVE_DATA_SHA=$(git rev-parse HEAD)"
