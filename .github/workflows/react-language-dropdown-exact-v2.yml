name: React exact language dropdown v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-language-dropdown-exact-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-gate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 5f145eee5a37c4d765a758f01b83e61e62c3ef0c
    steps:
      - uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 8
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Apply exact site header wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          cd source
          python3 ../workflow/scripts/patch-react-exact-site-header.py
          grep -Fq '<div id="site-header">' frontend-react/src/components/Layout.tsx
          git diff --check

      - name: Build exact backup and React
        shell: bash
        run: |
          set -euo pipefail
          (cd legacy && npm ci && npm run build)
          (cd source/frontend-react && npm ci && npm run build)

      - name: Install browser and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-lang-v2
          npm install --prefix /tmp/cv-lang-v2 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-lang-v2/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-lang-v2/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-lang-v2-legacy.log 2>&1 & echo $! >/tmp/cv-lang-v2-legacy.pid
          nohup /tmp/cv-lang-v2/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-lang-v2-react.log 2>&1 & echo $! >/tmp/cv-lang-v2-react.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4184/index.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1

      - name: Gate exact dropdown geometry and interaction
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-lang-v2/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const failures=[];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          const near=(a,b,t=.35)=>Math.abs(Number(a)-Number(b))<=t;
          async function ctx(viewport){const c=await browser.newContext({viewport,serviceWorkers:'block'});await c.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});return c}
          async function open(origin,path,viewport){const c=await ctx(viewport),p=await c.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));await p.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});await p.locator('details.header-language').waitFor({state:'visible',timeout:15000});await p.locator('details.header-language>summary').click();await p.waitForTimeout(120);return{c,p,errors}}
          async function snap(p){return p.evaluate(()=>{const q=s=>document.querySelector(s),rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}:null},sty=e=>{const s=e?getComputedStyle(e):null;return s?{position:s.position,z:s.zIndex,overflow:s.overflow,overflowX:s.overflowX,overflowY:s.overflowY}:null};const list=q('.cv-language-list'),r=list?.getBoundingClientRect();const point=r?document.elementFromPoint(r.left+r.width/2,r.top+r.height/2):null;return{summary:rect(q('details.header-language>summary')),list:rect(list),header:rect(q('.site-header')),inner:rect(q('.header-inner')),actions:rect(q('.header-actions')),siteHeader:rect(q('#site-header')),siteHeaderStyle:sty(q('#site-header')),open:q('details.header-language')?.hasAttribute('open')||false,hit:!!(point&&list?.contains(point)),options:q('.cv-language-list')?.querySelectorAll('.cv-language-option').length||0}})}
          for(const [mode,v] of modes){const L=await open('http://127.0.0.1:4184','/index.html',v),R=await open('http://127.0.0.1:4185','/',v);const a=await snap(L.p),b=await snap(R.p),m=[];for(const key of ['summary','list','header','inner','siteHeader']){const x=a[key],y=b[key];if(!x||!y)m.push(`${key}:missing`);else for(const d of ['x','y','w','h'])if(!near(x[d],y[d]))m.push(`${key}.${d}:${x[d]}/${y[d]}`)}if(!b.open)m.push('not-open');if(!b.hit)m.push('not-hit-testable');if(b.options!==5)m.push(`options:${b.options}`);if(mode==='mobile'&&b.actions?.right>390.35)m.push(`actions-overflow:${b.actions.right}`);if(JSON.stringify(a.siteHeaderStyle)!==JSON.stringify(b.siteHeaderStyle))m.push(`siteHeaderStyle:${JSON.stringify(a.siteHeaderStyle)}/${JSON.stringify(b.siteHeaderStyle)}`);if(R.errors.length)m.push(`errors:${R.errors.join(';')}`);console.log(`${mode}: ${m.length?m.join(' | '):'OK'}`);if(m.length)failures.push(...m.map(x=>`${mode}/${x}`));await L.c.close();await R.c.close()}
          {
            const c=await ctx({width:390,height:844}),p=await c.newPage();await p.goto('http://127.0.0.1:4185/',{waitUntil:'domcontentloaded'});await p.locator('details.header-language>summary').click();await p.locator('[data-language-value="en"]').click();await p.waitForURL(/\/en\/?$/,{timeout:10000});if(!p.url().match(/\/en\/?$/))failures.push(`language-navigation:${p.url()}`);await c.close();
          }
          await browser.close();if(failures.length){console.error(failures.join('\n'));process.exit(1)}console.log('EXACT_LANGUAGE_DROPDOWN_GREEN');
          NODE

      - name: Commit only after green gate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/components/Layout.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: restore exact legacy language header shell'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-lang-v2-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-lang-v2-react.pid 2>/dev/null)" 2>/dev/null || true
