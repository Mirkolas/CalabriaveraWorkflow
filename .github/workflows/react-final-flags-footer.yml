name: React migration - final flags footer parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-flags-footer.yml'
      - 'scripts/patch-react-final-flags-footer.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-final-flags-footer
  cancel-in-progress: true

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Assert expected migration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "e8d9997e12fca448001146f94e71c61a1d7995ad"

      - name: Apply final flags and footer patch
        run: python3 automation/scripts/patch-react-final-flags-footer.py

      - name: Build React migration
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Validate flag assets and footer labels
        shell: bash
        run: |
          set -euo pipefail
          for lang in it en fr de es; do
            test -s "source/frontend-react/public/assets/flags/$lang.svg"
            test -s "source/frontend-react/dist/assets/flags/$lang.svg"
          done
          grep -q 'footerActivities: "Attività"' source/frontend-react/src/lib/language.ts
          grep -q 'footerActivities: "Activities"' source/frontend-react/src/lib/language.ts
          grep -q 'footerActivities: "Activités"' source/frontend-react/src/lib/language.ts
          grep -q 'footerActivities: "Aktivitäten"' source/frontend-react/src/lib/language.ts
          grep -q 'footerActivities: "Actividades"' source/frontend-react/src/lib/language.ts
          grep -q 'uiText("footerActivities", language)' source/frontend-react/src/components/Layout.tsx
          grep -q 'assets/flags/it.svg' source/frontend-react/scripts/copy-legacy-assets.mjs
          git -C source diff --check

      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/lib/language.ts frontend-react/src/components/Layout.tsx frontend-react/public/assets/flags frontend-react/dist/assets/flags
          git -C source commit -m 'fix: restore language flags and final footer parity'
          git -C source push origin HEAD:react-migration
