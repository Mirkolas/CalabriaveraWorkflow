name: SEO - Indicizzazione completa Google

on:
  # A change to this audit workflow starts a one-off exhaustive Search Console inspection.
  # Normal deployments keep the cheaper 20-URL sample to protect API quotas.
  push:
    branches: [main]
    paths: ['.github/workflows/search-console-audit.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: search-console-full-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scarica sorgente privato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Installa strumenti di verifica
        working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Ispeziona tutte le URL della sitemap live senza pubblicare
        working-directory: source
        env:
          SEARCH_CONSOLE_SITE: ${{ vars.SEARCH_CONSOLE_SITE || 'https://calabriavera.com/' }}
          SEARCH_CONSOLE_LIVE_SITEMAP: '1'
          SEARCH_CONSOLE_INSPECT_ALL: '1'
        run: node tools/check-search-console-indexing.mjs
      - name: Conserva report indicizzazione completo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-console-full-indexing
          path: source/search-console-indexing.json
          if-no-files-found: ignore
          retention-days: 7
