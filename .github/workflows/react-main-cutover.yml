name: React migration - guarded main cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-main-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-main-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_MAIN_SHA: f622dfd5f24810f06aca0206594c1002fcdbe2f6
      EXPECTED_REACT_SHA: 243c33a029eb55ae94310b2daabd75cd66154a86
      BACKUP_BRANCH: backup-main-pre-react-cutover-2026-09-12-0600z
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout validated React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact validated branch heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REACT_SHA"
          git fetch origin main react-migration --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/react-migration)" = "$EXPECTED_REACT_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_REACT_SHA"

      - name: Create immutable pre-cutover backup branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$BACKUP_BRANCH" >/tmp/existing-backup 2>/dev/null; then
            existing="$(awk '{print $1}' /tmp/existing-backup)"
            test "$existing" = "$EXPECTED_MAIN_SHA" || {
              echo "::error::$BACKUP_BRANCH already exists at unexpected SHA $existing"
              exit 1
            }
          else
            git push origin "$EXPECTED_MAIN_SHA:refs/heads/$BACKUP_BRANCH"
          fi
          backup="$(git ls-remote --heads origin "refs/heads/$BACKUP_BRANCH" | awk '{print $1}')"
          test "$backup" = "$EXPECTED_MAIN_SHA"
          echo "PRE_CUTOVER_BACKUP_GREEN=$BACKUP_BRANCH@$backup"

      - name: Recheck branches immediately before cutover
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main react-migration --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main moved after readiness validation; refusing cutover"
            exit 1
          }
          test "$(git rev-parse origin/react-migration)" = "$EXPECTED_REACT_SHA" || {
            echo "::error::react-migration moved after readiness validation; refusing cutover"
            exit 1
          }
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_REACT_SHA"

      - name: Fast-forward main to validated React revision
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$EXPECTED_REACT_SHA:refs/heads/main"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_REACT_SHA"
          echo "REACT_MAIN_CUTOVER_GREEN=$EXPECTED_REACT_SHA"
