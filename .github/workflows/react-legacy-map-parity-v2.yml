name: React legacy parity - map v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-legacy-map-parity-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-legacy-map-parity-v2
  cancel-in-progress: true

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - name: Verify access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false

      - name: Checkout exact backup
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify backup map contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          grep -q 'disableClusteringAtZoom: 13' legacy/assets/js/map.js
          grep -q 'maxClusterRadius: 52' legacy/assets/js/map.js
          grep -q 'chunkDelay: 24' legacy/assets/js/map.js
          grep -q 'keyboard: false' legacy/assets/js/map.js
          grep -q 'maxWidth: 260, closeButton: true' legacy/assets/js/map.js
          grep -q 'item.category !== filters.category' legacy/assets/js/map.js
          grep -q 'normalizeText(item.comune).includes(filters.comuneNormalized)' legacy/assets/js/map.js
          grep -q 'padding: \[28, 28\], maxZoom: 12' legacy/assets/js/map.js

      - name: Apply map parity patch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../workflow/scripts/patch-react-map-parity.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend-react/src/pages/MapPage.tsx')
          s=p.read_text()
          old='setCategory(""); setProvince(""); setCity(""); setService(""); setVerified(false);'
          new='setCategory(""); setProvince(""); setCity(""); setVerified(false);'
          if old not in s:
              raise SystemExit('reset service residue not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Assert source contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'disableClusteringAtZoom: 13' frontend-react/src/pages/MapPage.tsx
          grep -q 'maxClusterRadius: 52' frontend-react/src/pages/MapPage.tsx
          grep -q 'chunkDelay: 24' frontend-react/src/pages/MapPage.tsx
          grep -q 'keyboard: false' frontend-react/src/pages/MapPage.tsx
          grep -q 'maxWidth: 260, closeButton: true' frontend-react/src/pages/MapPage.tsx
          grep -q 'cv-map-popup__foot' frontend-react/src/pages/MapPage.tsx
          grep -q 'item.category !== category' frontend-react/src/pages/MapPage.tsx
          grep -q 'normalizeText(item.comune).includes(normalizeText(city))' frontend-react/src/pages/MapPage.tsx
          ! grep -q 'is-verified' frontend-react/src/pages/MapPage.tsx
          ! grep -q 'setService' frontend-react/src/pages/MapPage.tsx
          ! grep -q 'id="service"' frontend-react/src/pages/MapPage.tsx

      - name: Build React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install browser gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-map-gate
          npm install --prefix /tmp/cv-map-gate --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-map-gate/node_modules/.bin/playwright install --with-deps chromium

      - name: Start built app
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-map-gate/node_modules/.bin/serve -s source/frontend-react/dist -l 4176 >/tmp/cv-map-gate.log 2>&1 &
          echo $! >/tmp/cv-map-gate.pid
          for attempt in {1..30}; do
            curl -fsS --max-time 3 http://127.0.0.1:4176/mappa >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Browser parity gate
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-map-gate/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url);
          const { chromium }=require(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          try {
            const context=await browser.newContext({serviceWorkers:'block',viewport:{width:1365,height:900}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:4176/mappa',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(() => document.querySelector('#map-count')?.textContent?.includes('53 attività sulla mappa'),null,{timeout:15000});
            await page.waitForTimeout(1800);
            const total=(await page.locator('#map-count').innerText()).trim();
            const clusters=await page.locator('.cv-map-cluster-shell').count();
            if(total!=='53 attività sulla mappa') throw new Error(`MAP_TOTAL_${total}`);
            if(clusters<1) throw new Error('MAP_CLUSTERS_MISSING');
            if(await page.locator('#service').count()) throw new Error('SERVICE_FILTER_PRESENT');
            for(let i=0;i<5;i++) await page.locator('.leaflet-control-zoom-in').click();
            await page.waitForTimeout(1000);
            const pins=await page.locator('.cv-map-pin-shell').count();
            if(pins<1) throw new Error('PINS_MISSING_Z13');
            await page.locator('.cv-map-pin-shell').first().click();
            await page.waitForSelector('.cv-map-popup',{timeout:5000});
            for(const selector of ['.cv-map-popup__body','.cv-map-popup__category','.cv-map-popup__place','.cv-map-popup__foot','.cv-map-popup__link']) if(await page.locator(selector).count()!==1) throw new Error(`POPUP_${selector}`);
            await page.goto('http://127.0.0.1:4176/mappa?comune=trop',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(3000);
            const partial=(await page.locator('#map-count').innerText()).trim();
            const n=Number.parseInt(partial,10);
            if(!(n>0 && n<53)) throw new Error(`PARTIAL_CITY_${partial}`);
            if(errors.length) throw new Error(`PAGE_ERRORS_${errors.join('|')}`);
            console.log(`LEGACY_MAP_GREEN total=${total} clusters=${clusters} pins=${pins} partial=${partial}`);
            await context.close();
          } finally { await browser.close(); }
          NODE

      - name: Commit to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/MapPage.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: align React map with exact pre-React backup'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/cv-map-gate.pid 2>/dev/null)" 2>/dev/null || true
