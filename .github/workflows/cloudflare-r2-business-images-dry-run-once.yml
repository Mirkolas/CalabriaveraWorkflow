name: Cloudflare R2 - Business Images Dry Run Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-r2-business-images-dry-run-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-r2-business-image-migration
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: calabriavera-e08d4
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT repository privato mancante"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Installa dipendenze amministrative
        run: npm --prefix source/tools ci --no-audit --no-fund

      - name: Verifica ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Analizza immagini business legacy senza scritture
        working-directory: source
        env:
          MIGRATE_APPLY: 'false'
          MIGRATE_LIMIT: '100'
        run: node tools/admin/migrate-business-images-r2.mjs

      - name: Conferma modalità non distruttiva
        if: always()
        run: echo 'DRY-RUN completato: nessuna scrittura su R2 o Firestore.'
