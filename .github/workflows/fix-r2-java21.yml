name: Fix R2 editor validation with Java 21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-r2-java21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-r2-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - name: Verify private-repo access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT mancante"; exit 1; }

      - name: Checkout React private branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java 21 for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Repair additive R2 rules
        working-directory: source
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/cv-r2-rules.py
          python3 /tmp/cv-r2-rules.py

      - name: Validate React build and Firestore rules
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --version
          java -version
          python3 -c "import json; from pathlib import Path; cfg=json.loads(Path('firebase.json').read_text()); assert cfg['firestore']['rules']=='firestore.rules'; rules=Path('firestore.rules').read_text(); assert '\n          );base64,[A-Za-z0-9+/=]+$\x27)\n' not in rules; assert '[A-Fa-f0-9]{64}-1400[.]webp' in rules; assert 'https://img.calabriavera.com/' in rules"
          cd frontend-react
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          npx --yes firebase-tools@15.22.1 emulators:exec --project demo-calabriavera --only firestore "echo Firestore-rules-OK"
          git diff --check

      - name: Commit repaired rules to migration branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add firestore.rules
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria."
            exit 0
          fi
          git commit -m "fix: validate additive R2 image rules"
          git push origin HEAD:react-migration
