name: Fix R2 editor validation with Java 21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-r2-java21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-r2-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - name: Verify private-repo access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT mancante"; exit 1; }

      - name: Checkout React private branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java 21 for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Repair additive R2 rules
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('firestore.rules')
          s = p.read_text(encoding='utf-8')

          start = s.index('    function validImage(data) {')
          end = s.index('\n    function validBusinessCreateShape', start)
          valid_image = r'''    function validImage(data, businessId) {
      return (!data.keys().hasAny(["imageDataUrl"]) || (
          data.imageDataUrl is string
          && data.imageDataUrl.size() <= 650000
          && data.imageDataUrl.matches('^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$')
          && (!data.keys().hasAny(["imageMime"]) || data.imageMime in ["image/jpeg", "image/png", "image/webp"])
          && (!data.keys().hasAny(["imageBytes"]) || (data.imageBytes is int && data.imageBytes >= 0 && data.imageBytes <= 450000))
        ))
        && (!data.keys().hasAny(["imageKey","r2ImageKey"]) || (
          (
            (data.keys().hasAny(["imageKey"])
              && data.imageKey is string
              && data.imageKey.matches('^activities/' + businessId + '/[A-Fa-f0-9]{64}-1400[.]webp$')
              && (!data.keys().hasAny(["r2ImageKey"]) || data.r2ImageKey == data.imageKey))
            || (!data.keys().hasAny(["imageKey"])
              && data.r2ImageKey is string
              && data.r2ImageKey.matches('^activities/' + businessId + '/[A-Fa-f0-9]{64}-1400[.]webp$'))
          )
          && data.keys().hasAny(["imageUrl"])
          && data.imageUrl is string
          && data.imageUrl.size() <= 2000
          && (
            (data.keys().hasAny(["imageKey"]) && data.imageUrl == 'https://img.calabriavera.com/' + data.imageKey)
            || (!data.keys().hasAny(["imageKey"]) && data.imageUrl == 'https://img.calabriavera.com/' + data.r2ImageKey)
          )
        ))
        && (data.keys().hasAny(["imageKey","r2ImageKey"]) || !data.keys().hasAny(["imageUrl"]) || (data.imageUrl is string && data.imageUrl.size() <= 2000));
    }'''
          s = s[:start] + valid_image + s[end:]

          old_call = 'validImage(request.resource.data)'
          count = s.count(old_call)
          if count != 2:
              raise SystemExit(f'expected 2 validImage call sites, found {count}')
          s = s.replace(old_call, 'validImage(request.resource.data, id)')

          image_match = s.index('      match /images/{imageId} {')
          allow_start = s.index('        allow create, update:', image_match)
          allow_end = s.index('\n        allow delete:', allow_start)
          image_rule = r'''        allow create, update: if verified() && businessOwner(id)
          && request.resource.data.keys().hasOnly(['imageDataUrl','imageMime','imageBytes','imageUrl','imageKey','r2ImageKey','order','ownerId'])
          && request.resource.data.ownerId == request.auth.uid
          && request.resource.data.order is int && request.resource.data.order >= 0 && request.resource.data.order < 10
          && (
            (request.resource.data.keys().hasAny(['imageDataUrl'])
              && !request.resource.data.keys().hasAny(['imageKey','r2ImageKey','imageUrl'])
              && request.resource.data.imageDataUrl is string && request.resource.data.imageDataUrl.size() <= 650000
              && request.resource.data.imageDataUrl.matches('^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$')
              && request.resource.data.imageMime in ['image/jpeg','image/png','image/webp']
              && request.resource.data.imageBytes is int && request.resource.data.imageBytes >= 0 && request.resource.data.imageBytes <= 450000)
            || (!request.resource.data.keys().hasAny(['imageDataUrl','imageMime','imageBytes','imageKey','r2ImageKey'])
              && request.resource.data.imageUrl is string && request.resource.data.imageUrl.size() <= 2000
              && request.resource.data.imageUrl.matches('^https://.*'))
            || (!request.resource.data.keys().hasAny(['imageDataUrl','imageMime','imageBytes'])
              && (
                (request.resource.data.keys().hasAny(['imageKey'])
                  && request.resource.data.imageKey is string
                  && request.resource.data.imageKey.matches('^activities/' + id + '/[A-Fa-f0-9]{64}-1400[.]webp$')
                  && (!request.resource.data.keys().hasAny(['r2ImageKey']) || request.resource.data.r2ImageKey == request.resource.data.imageKey)
                  && request.resource.data.imageUrl == 'https://img.calabriavera.com/' + request.resource.data.imageKey)
                || (!request.resource.data.keys().hasAny(['imageKey'])
                  && request.resource.data.r2ImageKey is string
                  && request.resource.data.r2ImageKey.matches('^activities/' + id + '/[A-Fa-f0-9]{64}-1400[.]webp$')
                  && request.resource.data.imageUrl == 'https://img.calabriavera.com/' + request.resource.data.r2ImageKey)
              )
              && request.resource.data.imageUrl is string && request.resource.data.imageUrl.size() <= 2000)
          );'''
          s = s[:allow_start] + image_rule + s[allow_end:]

          if ');base64,[A-Za-z0-9+/=]+$' in s:
              raise SystemExit('stale malformed rule fragment remains')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate React build and Firestore rules
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --version
          java -version
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('firebase.json').read_text())
          assert cfg['firestore']['rules'] == 'firestore.rules'
          rules = Path('firestore.rules').read_text()
          assert ');base64,[A-Za-z0-9+/=]+$' not in rules
          assert "[A-Fa-f0-9]{64}-1400[.]webp" in rules
          assert "https://img.calabriavera.com/" in rules
          PY
          cd frontend-react
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          npx --yes firebase-tools@15.22.1 emulators:exec --project demo-calabriavera --only firestore "echo Firestore-rules-OK"
          git diff --check

      - name: Commit repaired rules to migration branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add firestore.rules
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria."
            exit 0
          fi
          git commit -m "fix: validate additive R2 image rules"
          git push origin HEAD:react-migration
