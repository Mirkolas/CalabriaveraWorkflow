name: One-time Firestore index query check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-firestore-index-query-check.yml'

permissions:
  contents: write
  id-token: write

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Autentica backend Magazine/Social
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_BLOG_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_BLOG_SERVICE_ACCOUNT }}
      - name: Installa dipendenze tools
        working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund
      - name: Verifica query composite reali
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            echo "Tentativo indici ${attempt}/24"
            set +e
            output="$(node --input-type=module <<'NODE' 2>&1
          import { backendFirestore } from './tools/backend-firestore.mjs';
          const db = backendFirestore(process.env.FIREBASE_PROJECT_ID);
          const social = await db.collection('blogPosts')
            .where('socialPending', '==', true)
            .orderBy('sourcePublishedAt', 'desc')
            .limit(1)
            .get();
          const ingv = await db.collection('blogPosts')
            .where('sourceId', '==', 'ingv')
            .orderBy('importedAt', 'desc')
            .limit(1)
            .get();
          console.log(JSON.stringify({
            indexesReady: true,
            socialQueryDocs: social.size,
            ingvQueryDocs: ingv.size
          }));
          NODE
            )"
            code=$?
            set -e
            printf '%s\n' "$output"
            if [ "$code" -eq 0 ]; then
              echo 'Entrambi gli indici Firestore sono utilizzabili dal backend reale.'
              exit 0
            fi
            if printf '%s' "$output" | grep -Eqi 'FAILED_PRECONDITION|requires an index|index is currently building'; then
              sleep 15
              continue
            fi
            exit "$code"
          done
          echo '::error::Gli indici sono stati distribuiti ma non sono diventati utilizzabili entro la finestra di verifica.'
          exit 1
      - name: Rimuovi trigger monouso
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Workflow Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-firestore-index-query-check.yml
          git commit -m 'chore: remove one-time Firestore index check'
          git push origin HEAD:main
