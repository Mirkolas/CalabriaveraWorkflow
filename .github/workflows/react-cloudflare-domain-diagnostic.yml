name: React Cloudflare domain diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-cloudflare-domain-diagnostic.yml'

permissions:
  contents: read

env:
  ZONE_ID: e49caf5317f6b047d8e87b1a44fe3b8f

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect DNS proxy, Worker routes and custom domains
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          echo '=== DNS records (read-only) ==='
          for host in calabriavera.com www.calabriavera.com img.calabriavera.com; do
            raw="$(curl --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$host&per_page=100" || true)"
            node -e '
              const host=process.argv[1], raw=process.argv[2]||"";
              if (!raw) { console.log(host+": unavailable"); process.exit(0); }
              const j=JSON.parse(raw);
              console.log(JSON.stringify({host,success:j.success,errors:j.errors,records:(j.result||[]).map(r=>({id:r.id,type:r.type,name:r.name,content:r.content,proxied:r.proxied,ttl:r.ttl}))},null,2));
            ' "$host" "$raw"
          done

          echo '=== Worker routes (read-only) ==='
          raw="$(curl --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" || true)"
          node -e '
            const raw=process.argv[1]||"";
            if (!raw) { console.log("routes unavailable"); process.exit(0); }
            const j=JSON.parse(raw);
            console.log(JSON.stringify({success:j.success,errors:j.errors,routes:(j.result||[]).map(r=>({id:r.id,pattern:r.pattern,script:r.script}))},null,2));
          ' "$raw"

          echo '=== Worker custom domains (read-only) ==='
          raw="$(curl --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" || true)"
          node -e '
            const raw=process.argv[1]||"";
            if (!raw) { console.log("domains unavailable"); process.exit(0); }
            const j=JSON.parse(raw);
            console.log(JSON.stringify({success:j.success,errors:j.errors,domains:(j.result||[]).map(d=>({id:d.id,hostname:d.hostname,service:d.service,zone_id:d.zone_id,zone_name:d.zone_name,environment:d.environment}))},null,2));
          ' "$raw"

          echo '=== Endpoint build versions ==='
          for base in https://calabriavera.sonotacamirko.workers.dev https://calabriavera.com https://www.calabriavera.com; do
            printf '%s -> ' "$base"
            curl --silent --show-error --location --connect-timeout 8 --max-time 20 "$base/build-version.txt?diag=$GITHUB_RUN_ID" || true
            echo
          done
