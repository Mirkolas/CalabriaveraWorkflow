name: React exact legacy catalog logic v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-exact-catalog-logic-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 0232d0b9bcb4f44a5ace2977b964e9f9e942fe38
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 8
      - uses: actions/setup-node@v7
        with: {node-version: '24'}

      - name: Verify exact legacy catalog contract and branch base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          grep -Fq 'if (filters.category && item.category !== filters.category) return false;' legacy/assets/js/catalog.js
          grep -Fq 'if (filters.sort === "rating")' legacy/assets/js/catalog.js
          grep -Fq 'return filters.sort === "oldest" ? -delta : delta;' legacy/assets/js/catalog.js
          if grep -Fq 'filters.sort === "name"' legacy/assets/js/catalog.js; then echo 'Unexpected legacy name sort'; exit 1; fi
          grep -Fq 'localized(item, "name", currentLang())' legacy/assets/js/catalog.js
          grep -Fq '...(item.keywords || [])' legacy/assets/js/catalog.js

      - name: Apply exact catalog logic and build
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 ../workflow/scripts/patch-react-exact-catalog-logic.py
          grep -Fq 'if (category && item.category !== category) return false;' frontend-react/src/pages/CatalogPage.tsx
          grep -Fq 'localizedField<string>(item, "name", language)' frontend-react/src/pages/CatalogPage.tsx
          ! grep -Fq 'JSON.stringify((item as Record<string, unknown>).translations' frontend-react/src/pages/CatalogPage.tsx
          ! grep -Fq 'sort === "name"' frontend-react/src/pages/CatalogPage.tsx
          ! grep -Fq 'CATEGORY_GROUPS' frontend-react/src/pages/CatalogPage.tsx
          cd frontend-react
          npm ci
          npm run build

      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-catalog-v1
          npm install --prefix /tmp/cv-catalog-v1 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-catalog-v1/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-catalog-v1/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-catalog-v1.log 2>&1 & echo $! >/tmp/cv-catalog-v1.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4185/catalogo >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1

      - name: Gate catalog runtime behavior
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-catalog-v1/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1365,height:900},serviceWorkers:'block'});
          await ctx.addInitScript(()=>{
            const now=Date.now();
            localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(now).toISOString(),expiresAt:new Date(now+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}));
          });
          const errors=[];
          async function check(path, expectedCount, expectedVisible){
            const p=await ctx.newPage();p.on('pageerror',e=>errors.push(`${path}: ${String(e.message||e)}`));
            await p.goto('http://127.0.0.1:4185'+path,{waitUntil:'domcontentloaded',timeout:30000});
            await p.locator('#result-count').waitFor({state:'visible',timeout:15000});
            await p.waitForFunction(n=>document.querySelector('#result-count')?.textContent?.trim().startsWith(String(n)+' '),expectedCount,{timeout:15000});
            const count=await p.locator('#results > *').count().catch(()=>0);
            if(count!==expectedVisible) throw new Error(`${path}: visible cards ${count}, expected ${expectedVisible}`);
            const text=(await p.locator('#result-count').textContent())?.trim();
            console.log(`${path}: ${text}; cards=${count}`);
            return p;
          }
          let p=await check('/catalogo',53,18);await p.close();
          p=await check('/catalogo?categoria=Turismo%20ed%20esperienze',0,0);await p.close();
          p=await check('/catalogo?categoria=Turismo',52,18);await p.close();
          p=await check('/catalogo?categoria=B%26B',1,1);await p.close();
          p=await check('/catalogo?ordine=name',53,18);
          await p.waitForFunction(()=>!new URLSearchParams(location.search).has('ordine'),null,{timeout:5000});
          if(await p.locator('#sort').inputValue()!=='newest') throw new Error('ordine=name did not normalize to newest');
          await p.close();
          if(errors.length) throw new Error(`Browser page errors: ${errors.join(' | ')}`);
          await ctx.close();await browser.close();
          console.log('EXACT_CATALOG_LOGIC_GREEN');
          NODE

      - name: Commit exact catalog logic
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/CatalogPage.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: match catalog filtering to exact pre-React behavior'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/cv-catalog-v1.pid 2>/dev/null)" 2>/dev/null || true
