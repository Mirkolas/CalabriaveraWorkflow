name: React migration - canonical language query

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-language-query-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-private-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - name: Verifica accesso
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT mancante"; exit 1; }

      - name: Checkout branch React privata
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Canonicalizza query lingua e aggiungi test
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('frontend-react/worker.ts')
          text = worker.read_text(encoding='utf-8')
          marker = 'function isPrivateRoute(path: string) {'
          helper_lines = [
              'function languageQueryRedirect(url: URL) {',
              '  const requested = url.searchParams.get("lang") as Language | null;',
              '  if (!requested || !(["it", "en", "fr", "de", "es"] as Language[]).includes(requested)) return "";',
              '  const clean = cleanPath(url.pathname);',
              '  const next = new URL(url.toString());',
              '  next.pathname = requested === "it" ? clean : `/${requested}${clean === "/" ? "/" : clean}`;',
              '  next.searchParams.delete("lang");',
              '  return `${next.pathname}${next.search}${next.hash}` || "/";',
              '}',
              '',
          ]
          helper = '\n'.join(helper_lines) + '\n'
          if 'function languageQueryRedirect(url: URL)' not in text:
              if marker not in text:
                  raise SystemExit('Marker isPrivateRoute non trovato')
              text = text.replace(marker, helper + marker, 1)
          old = '      const redirect = canonicalRedirect(url);\n      if (redirect) return Response.redirect(`${url.origin}${redirect}`, 301);'
          new = '      const languageRedirect = languageQueryRedirect(url);\n      if (languageRedirect) return Response.redirect(`${url.origin}${languageRedirect}`, 302);\n      const redirect = canonicalRedirect(url);\n      if (redirect) return Response.redirect(`${url.origin}${redirect}`, 301);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Blocco redirect Worker inatteso')
          worker.write_text(text, encoding='utf-8')

          smoke = Path('tests/react-staging-smoke.cjs')
          test = smoke.read_text(encoding='utf-8')
          anchor = "    assert(/noindex/i.test(String(robots || '')), 'Staging workers.dev deve restare noindex');\n"
          addition_lines = [
              '',
              '    await page.evaluate(() => {',
              "      localStorage.setItem('cv-lang', 'en');",
              "      localStorage.setItem('cv-language', 'en');",
              '    });',
              "    await open(page, '/');",
              "    assert((await page.locator('html').getAttribute('lang')) === 'it', 'Home root: la lingua salvata non deve cambiare la URL italiana');",
              '',
              "    const langRedirect = await page.goto(`${base}/?lang=en`, { waitUntil: 'domcontentloaded', timeout: 20000 });",
              "    assert(langRedirect && langRedirect.status() < 400, 'Redirect ?lang=en non raggiungibile');",
              '    const langUrl = new URL(page.url());',
              "    assert(langUrl.pathname === '/en/', `Redirect ?lang=en errato: ${page.url()}`);",
              "    assert(!langUrl.searchParams.has('lang'), 'Redirect lingua deve rimuovere il parametro lang');",
          ]
          addition = '\n'.join(addition_lines) + '\n'
          if 'Home root: la lingua salvata non deve cambiare' not in test:
              if anchor not in test:
                  raise SystemExit('Anchor smoke Home non trovato')
              test = test.replace(anchor, anchor + addition, 1)
          smoke.write_text(test, encoding='utf-8')
          PY

          cd frontend-react
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          git diff --check
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react/worker.ts tests/react-staging-smoke.cjs
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria."
            exit 0
          fi
          git commit -m "fix: canonicalize legacy language query URLs"
          git push origin HEAD:react-migration
