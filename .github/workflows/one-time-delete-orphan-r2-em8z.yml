name: One-time - Delete orphan R2 legacy business Em8z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-delete-orphan-r2-em8z.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: one-time-delete-orphan-r2-em8z
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: calabriavera-e08d4
  R2_BUCKET: calabriavera-images
  BUSINESS_ID: Em8zRcWEhZtzK7TdH3Xu
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN mancante"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID mancante"; exit 1; }

      - name: Autentica Firebase
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Controlla se il business esiste ancora in Firestore
        id: firestore
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          url="https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/businesses/${BUSINESS_ID}"
          code="$(curl -sS -o business.json -w '%{http_code}' -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Accept: application/json' "$url")"
          if [ "$code" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Business ${BUSINESS_ID} assente da Firestore: immagini R2 considerate orfane."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            cat business.json || true
            echo "::error::Controllo Firestore fallito: HTTP ${code}"
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('business.json', 'utf8'));
          const f = doc.fields || {};
          const pick = (name) => f[name]?.stringValue || '';
          console.log(`Business ancora presente in Firestore. name=${pick('name') || '(senza nome)'} status=${pick('status') || '(senza status)'}`);
          NODE

      - name: Non eliminare se il business esiste ancora
        if: steps.firestore.outputs.exists == 'true'
        shell: bash
        run: |
          echo "Business presente in Firestore: nessuna immagine R2 eliminata."

      - name: Elimina le 10 immagini R2 orfane
        if: steps.firestore.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          keys=(
            "activities/${BUSINESS_ID}/29ac94f5839fd3ba6fd6516a95838bc69f49aae7a0ceb2e961df5b375cc79c4f-1400.webp"
            "activities/${BUSINESS_ID}/03d079f1f26a1ca71d05de10c44a134c0afde1184ff6de2d5fd40c9d7e778507-1400.webp"
            "activities/${BUSINESS_ID}/6fe07ecd9a160ec2ff0ccdcaa215b94f26e5c2c791502db3aa401dadd7885a94-1400.webp"
            "activities/${BUSINESS_ID}/db66a34f7e9cbde59c7e240f30b6360ed91e946681ff57b9c593f5babaad4bcc-1400.webp"
            "activities/${BUSINESS_ID}/d9664d547570d1f91e25aa4abc308365f50354ca19ac232b3190621585c8e04c-1400.webp"
            "activities/${BUSINESS_ID}/981cc78c9434b6d345d23860469e8df7bad591bcaed03b86774c6dcb7543719b-1400.webp"
            "activities/${BUSINESS_ID}/c69aece4e94f33fa8017d1d73ccd79a2d99e98a517c66eb295d3dc6573e856cd-1400.webp"
            "activities/${BUSINESS_ID}/590f4d0c5064cdf89ff4b468ec35e080181e129a06a9de896c4db39cfe8d5ef9-1400.webp"
            "activities/${BUSINESS_ID}/bf2e5ecfc44f09278ecea5bbd7f098694247d2347a9307521c8d7c42f1da7480-1400.webp"
            "activities/${BUSINESS_ID}/97f25848fb1daddfb75ca46e268fe020a980c27b16928b33b09b3e11d4f3c40b-1400.webp"
          )
          for key in "${keys[@]}"; do
            echo "Elimino ${key}"
            npx --yes wrangler@4 r2 object delete "${R2_BUCKET}/${key}" --remote
          done
          echo "Eliminate ${#keys[@]} immagini R2 orfane per ${BUSINESS_ID}."

      - name: Verifica eliminazione R2
        if: steps.firestore.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          key="activities/${BUSINESS_ID}/29ac94f5839fd3ba6fd6516a95838bc69f49aae7a0ceb2e961df5b375cc79c4f-1400.webp"
          if npx --yes wrangler@4 r2 object get "${R2_BUCKET}/${key}" --remote --pipe >/dev/null 2>&1; then
            echo "::error::Verifica fallita: almeno il primo oggetto risulta ancora presente."
            exit 1
          fi
          echo "Verifica OK: oggetto campione non più presente in R2."
