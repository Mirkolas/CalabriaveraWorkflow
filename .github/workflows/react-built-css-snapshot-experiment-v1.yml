name: React built CSS snapshot experiment v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-built-css-snapshot-experiment-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 5f145eee5a37c4d765a758f01b83e61e62c3ef0c
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build exact legacy and copy final page bundles
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd legacy && npm ci && npm run build)
          mkdir -p source/frontend-react/public/assets/css/exact-built
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const pages={notFound:'404.html',about:'chi-siamo.html',contacts:'contatti.html',login:'login.html'};
          for(const [name,file] of Object.entries(pages)){
            const html=fs.readFileSync(path.join('legacy/dist',file),'utf8');
            const matches=[...html.matchAll(/<link\b[^>]*rel=["']stylesheet["'][^>]*href=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1].split(/[?#]/)[0]).filter(x=>x.startsWith('/assets/css/'));
            if(matches.length!==1)throw new Error(`${file}: expected one final local stylesheet, got ${JSON.stringify(matches)}`);
            const css=fs.readFileSync(path.join('legacy/dist',matches[0].replace(/^\//,'')),'utf8');
            fs.writeFileSync(`source/frontend-react/public/assets/css/exact-built/${name}.css`,css);
            console.log(`${name} ${matches[0]} ${css.length}`);
          }
          NODE
          (cd source && python3 ../workflow/scripts/patch-react-exact-404.py)
          (cd source/frontend-react && npm ci && npm run build)
      - name: Install browser and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cvbcss
          npm install --prefix /tmp/cvbcss --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cvbcss/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cvbcss/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/l.log 2>&1 & echo $! >/tmp/l.pid
          nohup /tmp/cvbcss/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/r.log 2>&1 & echo $! >/tmp/r.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4184/404.html >/dev/null && curl -fsS http://127.0.0.1:4185/ >/dev/null && exit 0;sleep 1;done;exit 1
      - name: Compare with final legacy CSS injected last
        env:
          PLAYWRIGHT_MODULE: /tmp/cvbcss/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);const browser=await chromium.launch({headless:true});
          const routes=[['notFound','/404.html','/zz-not-found'],['about','/chi-siamo.html','/chi-siamo'],['contacts','/contatti.html','/contatti'],['login','/login.html','/login']];const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          async function page(origin,path,viewport,snapshot){const c=await browser.newContext({viewport,serviceWorkers:'block'});await c.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});const p=await c.newPage();await p.goto(origin+path,{waitUntil:'domcontentloaded'});if(snapshot){await p.addStyleTag({url:`/assets/css/exact-built/${snapshot}.css`});}await p.locator('main h1').waitFor({state:'visible'});await p.waitForTimeout(180);const out=await p.evaluate(()=>{const q=s=>document.querySelector(s),rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height}:null},h=q('main h1'),hs=h?getComputedStyle(h):null,head=q('.site-header'),heads=head?getComputedStyle(head):null,section=q('main .section,main .auth-shell,main .cv-auth-shell');return{page:document.body.dataset.page||'',header:rect(head),headerStyle:heads?{bg:heads.backgroundColor,pos:heads.position,color:heads.color}:null,main:rect(q('main')),section:rect(section),h1:h?.textContent?.trim()||'',h1Rect:rect(h),h1Style:hs?{font:hs.fontFamily,size:hs.fontSize,weight:hs.fontWeight,line:hs.lineHeight,letter:hs.letterSpacing,color:hs.color}:null}});await c.close();return out;}
          for(const [mode,v] of modes)for(const [name,lp,rp] of routes){const l=await page('http://127.0.0.1:4184',lp,v),r=await page('http://127.0.0.1:4185',rp,v,name);console.log(JSON.stringify({mode,name,legacy:l,reactWithBuiltCss:r}));}
          await browser.close();
          NODE
      - name: Stop
        if: always()
        run: |
          kill "$(cat /tmp/l.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/r.pid 2>/dev/null)" 2>/dev/null || true
