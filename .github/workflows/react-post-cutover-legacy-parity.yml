name: React post-cutover - legacy parity audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-post-cutover-legacy-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-post-cutover-legacy-parity
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_REF: backup-main-pre-react-cutover-2026-09-12-0600z
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout legacy reference
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: ${{ env.LEGACY_REF }}
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout current React main
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: current
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build current React
        working-directory: current/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install isolated audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-post-parity
          npm install --prefix /tmp/cv-post-parity --no-package-lock --no-save playwright@1.62.1 pixelmatch@7.1.0 pngjs@7.0.0 serve@14.2.4
          /tmp/cv-post-parity/node_modules/.bin/playwright install --with-deps chromium

      - name: Start local legacy and React servers
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-post-parity/node_modules/.bin/serve legacy -l 4173 > /tmp/legacy-serve.log 2>&1 &
          echo $! > /tmp/legacy-serve.pid
          nohup /tmp/cv-post-parity/node_modules/.bin/serve -s current/frontend-react/dist -l 4174 > /tmp/react-serve.log 2>&1 &
          echo $! > /tmp/react-serve.pid
          for attempt in {1..30}; do
            if curl -fsS --max-time 3 http://127.0.0.1:4173/index.html >/dev/null && curl -fsS --max-time 3 http://127.0.0.1:4174/ >/dev/null; then
              echo "Both local sites are ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/legacy-serve.log || true
          cat /tmp/react-serve.log || true
          exit 1

      - name: Run legacy vs React browser audit
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-post-parity/node_modules/playwright
          PIXELMATCH_MODULE: /tmp/cv-post-parity/node_modules/pixelmatch
          PNGJS_MODULE: /tmp/cv-post-parity/node_modules/pngjs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity-post-cutover
          cat > /tmp/cv-post-cutover-audit.cjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require(process.env.PLAYWRIGHT_MODULE);
          const pixelmatch = require(process.env.PIXELMATCH_MODULE).default || require(process.env.PIXELMATCH_MODULE);
          const { PNG } = require(process.env.PNGJS_MODULE);

          const legacyBase = 'http://127.0.0.1:4173';
          const reactBase = 'http://127.0.0.1:4174';
          const out = path.resolve('parity-post-cutover');
          const pairs = [
            ['home','/index.html','/'],
            ['catalogo','/catalogo.html','/catalogo'],
            ['mappa','/mappa.html','/mappa'],
            ['blog','/blog.html','/blog'],
            ['turismo','/attivita.html?turismo=centro-storico-di-tropea','/attivita?turismo=centro-storico-di-tropea'],
            ['login','/login.html','/login'],
            ['registrazione','/registrazione.html','/registrazione'],
            ['profilo','/profilo.html','/profilo'],
            ['preferiti','/preferiti.html','/preferiti'],
            ['dashboard','/dashboard.html','/dashboard'],
            ['messaggi','/messaggi.html','/messaggi'],
            ['editor','/aggiungi-attivita.html','/aggiungi-attivita'],
            ['chi-siamo','/chi-siamo.html','/chi-siamo'],
            ['contatti','/contatti.html','/contatti'],
            ['privacy','/privacy-policy.html','/privacy-policy'],
            ['cookie','/cookie-policy.html','/cookie-policy'],
            ['termini','/termini.html','/termini'],
            ['note-legali','/note-legali.html','/note-legali'],
            ['admin','/pages/admin/index.html','/admin'],
            ['admin-attivita','/pages/admin/attivita.html','/admin/attivita'],
            ['admin-blog','/pages/admin/blog.html','/admin/blog'],
            ['admin-utenti','/pages/admin/utenti.html','/admin/utenti']
          ];

          const normalize = (s='') => String(s).replace(/\s+/g,' ').trim();
          const words = s => new Set(normalize(s).toLowerCase().split(/[^a-zà-ÿ0-9]+/i).filter(x=>x.length>2));
          function similarity(a,b){
            const A=words(a), B=words(b); if(!A.size&&!B.size) return 1;
            let common=0; for(const x of A) if(B.has(x)) common++;
            return common/Math.max(1,new Set([...A,...B]).size);
          }
          const safeName = s => s.replace(/[^a-z0-9-]+/gi,'-');

          async function snap(browser, base, route, name, vp) {
            const context = await browser.newContext({
              viewport:{width:vp.width,height:vp.height},
              isMobile:vp.mobile,
              serviceWorkers:'block',
              locale:'it-IT'
            });
            const page = await context.newPage();
            const errors=[]; const failed=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            page.on('requestfailed',r=>{
              const u=r.url();
              if(u.startsWith(base)) failed.push(`${r.method()} ${new URL(u).pathname}: ${r.failure()?.errorText||'failed'}`);
            });
            const response = await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000}).catch(()=>null);
            await page.waitForTimeout(1800);
            const data = await page.evaluate(() => {
              const visible = el => {
                const r=el.getBoundingClientRect(), s=getComputedStyle(el);
                return r.width>0 && r.height>0 && s.display!=='none' && s.visibility!=='hidden' && Number(s.opacity)!==0;
              };
              const forms=[...document.querySelectorAll('form')].filter(visible).map(x=>x.id||x.className||'form');
              const inputs=[...document.querySelectorAll('input,select,textarea')].filter(visible).map(x=>({tag:x.tagName.toLowerCase(),type:x.getAttribute('type')||'',name:x.getAttribute('name')||'',id:x.id||'',options:x.tagName==='SELECT'?x.options.length:undefined}));
              const buttons=[...document.querySelectorAll('button')].filter(visible).map(x=>normalizeText(x.textContent||x.getAttribute('aria-label')||'')).filter(Boolean);
              function normalizeText(v){ return String(v).replace(/\s+/g,' ').trim(); }
              const rect = sel => { const e=document.querySelector(sel); if(!e) return null; const r=e.getBoundingClientRect(); return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}; };
              return {
                finalPath:location.pathname+location.search,
                title:document.title,
                lang:document.documentElement.lang,
                page:document.body.dataset.page||'',
                h1:[...document.querySelectorAll('h1')].filter(visible).map(x=>normalizeText(x.textContent)),
                h2:[...document.querySelectorAll('h2')].filter(visible).map(x=>normalizeText(x.textContent)).slice(0,12),
                forms, inputs, buttons,
                text:normalizeText(document.body.innerText),
                internalLinks:[...document.querySelectorAll('a[href]')].filter(visible).map(x=>x.getAttribute('href')||'').filter(x=>x.startsWith('/')),
                images:[...document.querySelectorAll('img')].filter(visible).map(x=>({src:x.getAttribute('src')||'',alt:x.getAttribute('alt')||''})).slice(0,40),
                header:rect('header'), main:rect('main'), footer:rect('footer'),
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                activityItems:document.querySelectorAll('.activity-item').length,
                resultCards:document.querySelectorAll('#results .activity-item, #results article, #results .card').length,
                socialLinks:document.querySelectorAll('.social-links .social-link').length,
                mapPresent:Boolean(document.querySelector('#map')),
                leaflet:Boolean(document.querySelector('.leaflet-container')),
                clusters:document.querySelectorAll('.marker-cluster, .cv-map-cluster-shell').length,
                mapFilters:Boolean(document.querySelector('#map-filters')),
                resultCount:normalizeText(document.querySelector('#result-count')?.textContent||''),
                mapCount:normalizeText(document.querySelector('#map-count')?.textContent||'')
              };
            });
            const screenshot=path.join(out,`${vp.name}-${name}-${base===legacyBase?'legacy':'react'}.png`);
            await page.screenshot({path:screenshot,fullPage:false});
            await context.close();
            return {...data,status:response?.status()||0,errors,failed,screenshot};
          }

          function comparePng(aPath,bPath,diffPath){
            const a=PNG.sync.read(fs.readFileSync(aPath)); const b=PNG.sync.read(fs.readFileSync(bPath));
            if(a.width!==b.width||a.height!==b.height) return {ratio:1,sizeMismatch:true};
            const diff=new PNG({width:a.width,height:a.height});
            const mismatched=pixelmatch(a.data,b.data,diff.data,a.width,a.height,{threshold:0.12,includeAA:false});
            fs.writeFileSync(diffPath,PNG.sync.write(diff));
            return {ratio:mismatched/(a.width*a.height),sizeMismatch:false};
          }

          (async()=>{
            fs.mkdirSync(out,{recursive:true});
            const browser=await chromium.launch({headless:true});
            const report={legacyRef:process.env.LEGACY_REF||'',legacySha:require('child_process').execSync('git -C legacy rev-parse HEAD').toString().trim(),reactSha:require('child_process').execSync('git -C current rev-parse HEAD').toString().trim(),generatedAt:new Date().toISOString(),rows:[]};
            try{
              for(const vp of [{name:'desktop',width:1365,height:900,mobile:false},{name:'mobile',width:390,height:844,mobile:true}]){
                for(const [name,legacyRoute,reactRoute] of pairs){
                  const legacy=await snap(browser,legacyBase,legacyRoute,name,vp);
                  const react=await snap(browser,reactBase,reactRoute,name,vp);
                  const diffPath=path.join(out,`${vp.name}-${name}-diff.png`);
                  const visual=comparePng(legacy.screenshot,react.screenshot,diffPath);
                  const inputSig=x=>x.inputs.map(i=>`${i.tag}:${i.type}:${i.name}:${i.options??''}`).sort().join('|');
                  const formSig=x=>[...x.forms].sort().join('|');
                  const finalLegacy=legacy.finalPath.replace(/\.html(?=\?|$)/,'').replace(/^\/index$/,'/').replace(/^\/pages\/admin\/index$/,'/admin').replace(/^\/pages\/admin\//,'/admin/');
                  const finalReact=react.finalPath;
                  report.rows.push({viewport:vp.name,name,legacyRoute,reactRoute,legacy,react,
                    metrics:{
                      textSimilarity:similarity(legacy.text,react.text),
                      visualDifference:visual.ratio,
                      sameH1:normalize(legacy.h1.join('|'))===normalize(react.h1.join('|')),
                      sameInputs:inputSig(legacy)===inputSig(react),
                      sameForms:formSig(legacy)===formSig(react),
                      samePageMarker:!legacy.page||legacy.page===react.page,
                      normalizedFinalMatch:finalLegacy===finalReact,
                      linkCountDelta:react.internalLinks.length-legacy.internalLinks.length,
                      buttonCountDelta:react.buttons.length-legacy.buttons.length,
                      imageCountDelta:react.images.length-legacy.images.length,
                      headerHeightDelta:(react.header?.h||0)-(legacy.header?.h||0),
                      overflowDelta:react.overflow-legacy.overflow
                    }});
                }
              }
            } finally { await browser.close(); }
            fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));
            const issues=[];
            for(const r of report.rows){
              const m=r.metrics;
              const reasons=[];
              if(r.react.status>=400||!r.react.status) reasons.push(`reactHTTP=${r.react.status}`);
              if(r.react.errors.length) reasons.push(`errors=${r.react.errors.length}`);
              if(r.react.overflow>3) reasons.push(`overflow=${r.react.overflow}`);
              if(m.textSimilarity<0.62) reasons.push(`text=${m.textSimilarity.toFixed(2)}`);
              if(!m.sameH1) reasons.push('h1');
              if(!m.sameInputs && ['catalogo','mappa','login','registrazione','editor'].includes(r.name)) reasons.push('inputs');
              if(Math.abs(m.headerHeightDelta)>12) reasons.push(`headerΔ=${m.headerHeightDelta}`);
              if(m.visualDifference>0.30) reasons.push(`visual=${m.visualDifference.toFixed(2)}`);
              if(reasons.length) issues.push(`${r.viewport} ${r.name}: ${reasons.join(', ')}`);
            }
            fs.writeFileSync(path.join(out,'summary.txt'),issues.join('\n')||'NO_MAJOR_PARITY_DIFFERENCES');
            console.log(fs.readFileSync(path.join(out,'summary.txt'),'utf8'));
            console.log(`Compared ${report.rows.length} legacy/React route-viewports.`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/cv-post-cutover-audit.cjs

      - name: Upload parity artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: react-post-cutover-legacy-parity
          path: parity-post-cutover
          if-no-files-found: error
          retention-days: 7

      - name: Stop local servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/legacy-serve.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/react-serve.pid 2>/dev/null)" 2>/dev/null || true
