name: React migration - local public snapshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-local-snapshots.yml'
      - 'scripts/patch-react-local-snapshots.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-local-public-snapshots
  cancel-in-progress: true

jobs:
  snapshot-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Capture current public snapshots from main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/frontend-react/public/assets/data
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 'https://calabriavera.com/assets/data/public-businesses-v1.json?snapshot=react-migration' -o source/frontend-react/public/assets/data/public-businesses-v1.json
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 'https://calabriavera.com/assets/data/public-blog-v1.json?snapshot=react-migration' -o source/frontend-react/public/assets/data/public-blog-v1.json
          node <<'NODE'
          const fs=require('fs');
          for (const [name,min] of [['public-businesses-v1.json',1],['public-blog-v1.json',1]]) {
            const p='source/frontend-react/public/assets/data/'+name;
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            if (!Array.isArray(j.items) || j.items.length < min) throw new Error(`${name}: snapshot vuoto/non valido`);
            console.log(`${name}: ${j.items.length} elementi, version=${j.version ?? 'n/a'}`);
          }
          NODE
      - name: Make Worker prefer bundled snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-react-local-snapshots.py
      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate snapshot output
        shell: bash
        run: |
          set -euo pipefail
          test -s source/frontend-react/public/assets/data/public-businesses-v1.json
          test -s source/frontend-react/public/assets/data/public-blog-v1.json
          test -s source/frontend-react/dist/assets/data/public-businesses-v1.json
          test -s source/frontend-react/dist/assets/data/public-blog-v1.json
          grep -q 'readDataset(targetPath: string, env?: Env)' source/frontend-react/worker.ts
          grep -q 'env.ASSETS.fetch' source/frontend-react/worker.ts
          git -C source diff --check
      - name: Commit verified local snapshots
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No snapshot changes needed.'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react
          git -C source commit -m 'fix: bundle public snapshots with React migration'
          git -C source push origin HEAD:react-migration
