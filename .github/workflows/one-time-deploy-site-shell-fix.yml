name: One-time - Verify site shell production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-deploy-site-shell-fix.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EXPECTED_BUILD: 54f425a3384ba8e5b8b5fb6e1a444dc722810f6a
    steps:
      - name: Verifica Firebase Hosting e dominio pubblico
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for origin in "https://calabriavera.web.app" "https://calabriavera.com"; do
            safe="$(echo "$origin" | tr -cd 'a-zA-Z0-9')"
            echo "===== ${origin} ====="
            curl -fsSL --retry 4 --retry-delay 2 -H 'Cache-Control: no-cache' -D "headers-${safe}.txt" "${origin}/build-version.txt?verify=${nonce}" -o "build-${safe}.txt"
            live="$(tr -d '\r\n' < "build-${safe}.txt")"
            echo "build-version=${live}"
            echo "expected=${EXPECTED_BUILD}"
            echo "--- headers build-version ---"
            cat "headers-${safe}.txt"
            curl -fsSL --retry 4 --retry-delay 2 -H 'Cache-Control: no-cache' "${origin}/?verify=${nonce}" -o "home-${safe}.html"
            if grep -Eqi 'name=["'\'' ]*robots' "home-${safe}.html"; then
              echo "robots meta: PRESENTE"
            else
              echo "robots meta: MANCANTE"
            fi
            for label in 'Esplora' 'Mappa' 'Eventi &amp; Blog' 'Chi siamo'; do
              if grep -Fq "$label" "home-${safe}.html"; then
                echo "nav ${label}: OK"
              else
                echo "nav ${label}: MANCANTE"
              fi
            done
            if [ "$live" = "$EXPECTED_BUILD" ]; then
              echo "build ${origin}: OK"
            else
              echo "build ${origin}: STALE"
            fi
          done
