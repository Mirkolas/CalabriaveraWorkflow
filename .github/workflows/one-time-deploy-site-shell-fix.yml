name: One-time - Deploy site shell fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-deploy-site-shell-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Avvia deploy del sorgente privato
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GH_REPO}/dispatches" -f event_type=source-deploy >/dev/null
          echo "Dispatch source-deploy inviato."
