name: One-time - Deploy site shell fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-deploy-site-shell-fix.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Avvia deploy manuale Firebase
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GH_REPO}/actions/workflows/firebase-deploy.yml/dispatches" -f ref=main >/dev/null
          echo "Workflow Firebase avviato manualmente per bypassare il gate giornaliero della sola automazione."
