name: React migration - Firebase browser gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-browser-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-firebase-browser-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_SHA: 186962e16eb491252f6d934e57f068c6278ecd2b
      STAGING_URL: https://calabriavera.sonotacamirko.workers.dev
      LOCAL_URL: http://127.0.0.1:5000
    steps:
      - name: Checkout exact React candidate
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.EXPECTED_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Assert exact source and Worker revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          for attempt in {1..30}; do
            actual="$(curl --fail --silent --show-error --max-time 15 "$STAGING_URL/build-version.txt?firebasegate=$attempt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "WORKER_SHA_GREEN=$actual"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Worker staging did not publish $EXPECTED_SHA"
          exit 1

      - name: Verify R2 upload CORS on real Worker
        shell: bash
        run: |
          set -euo pipefail
          allowed="$(mktemp)"
          evil="$(mktemp)"
          curl -sS -D "$allowed" -o /dev/null -X OPTIONS "$STAGING_URL/api/images/upload" \
            -H 'Origin: https://calabriavera.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-user-id,x-business-id'
          grep -Eqi '^HTTP/[^ ]+ 204' "$allowed"
          grep -Eqi '^access-control-allow-origin: https://calabriavera\.com' "$allowed"
          grep -Eqi '^access-control-allow-methods: POST, OPTIONS' "$allowed"
          code="$(curl -sS -D "$evil" -o /dev/null -w '%{http_code}' -X OPTIONS "$STAGING_URL/api/images/upload" \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST')"
          test "$code" = 403
          ! grep -Eqi '^access-control-allow-origin:' "$evil"
          unauth_headers="$(mktemp)"
          unauth_code="$(curl -sS -D "$unauth_headers" -o /tmp/unauth-body -w '%{http_code}' -X POST "$STAGING_URL/api/images/upload" \
            -H 'Origin: https://calabriavera.com' \
            -H 'Content-Type: image/webp' \
            -H 'X-User-Id: anonymous' \
            -H 'X-Business-Id: anonymous' \
            --data-binary 'not-an-image')"
          test "$unauth_code" = 401
          grep -Eqi '^access-control-allow-origin: https://calabriavera\.com' "$unauth_headers"
          echo R2_CORS_GATE_GREEN

      - name: Build exact Firebase Hosting candidate
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test "$(cat dist/build-version.txt)" = "$EXPECTED_SHA"
          test -s dist/app-shell.html
          grep -q 'Le Ninfee' dist/catalogo/index.html
          grep -q '/assets/data/public-businesses-v1.json' "$(grep -rl '/assets/data/public-businesses-v1.json' dist/assets --include='*.js' | head -1)"

      - name: Start Firebase Hosting Emulator
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 emulators:start --project demo-calabriavera --only hosting --config firebase.react.json > /tmp/firebase-react-hosting.log 2>&1 &
          echo $! > /tmp/firebase-react-hosting.pid
          ready=0
          for attempt in {1..60}; do
            if curl -fsS "$LOCAL_URL/build-version.txt?ready=$attempt" >/tmp/local-version 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/firebase-react-hosting.log; exit 1; fi
          test "$(tr -d '\r\n' </tmp/local-version)" = "$EXPECTED_SHA"
          echo FIREBASE_EMULATOR_READY

      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-firebase-browser
          npm install --prefix /tmp/cv-firebase-browser --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-firebase-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Browser gate Firebase Hosting candidate
        shell: bash
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-firebase-browser/node_modules/playwright
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url);
          const { chromium }=require(process.env.PLAYWRIGHT_MODULE);
          const base=process.env.LOCAL_URL.replace(/\/$/,'');
          const failures=[];
          const browser=await chromium.launch({headless:true});
          const ignore=/favicon|ERR_BLOCKED_BY_CLIENT|tile|net::ERR_ABORTED|(?:status of )?429|RESOURCE_EXHAUSTED|googleapis.*429/i;
          async function open(route,{mobile=false,wait='main'}={}) {
            const context=await browser.newContext({viewport:mobile?{width:390,height:844}:{width:1365,height:900},serviceWorkers:'block'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(`page:${e.message||e}`));
            page.on('console',m=>{if(m.type()==='error'&&!ignore.test(m.text())) errors.push(`console:${m.text()}`)});
            const response=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:20000}).catch(()=>null);
            if(wait) await page.waitForSelector(wait,{timeout:12000}).catch(()=>{});
            await page.waitForTimeout(route.startsWith('/mappa')?2500:700);
            const data=await page.evaluate(()=>({
              path:location.pathname,
              title:document.title,
              h1:document.querySelector('main h1')?.textContent?.trim()||'',
              body:document.body.innerText,
              overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),
              cards:document.querySelectorAll('#results>.activity-item').length,
              resultCount:document.querySelector('#result-count')?.textContent?.trim()||'',
              mapCount:document.querySelector('#map-count')?.textContent?.trim()||'',
              leaflet:Boolean(document.querySelector('.leaflet-container')),
              clusters:document.querySelectorAll('.cv-map-cluster-shell').length,
              pins:document.querySelectorAll('.cv-map-pin-shell').length,
              blogCards:document.querySelectorAll('.blog-card').length,
              cityOptions:document.querySelector('#city')?.querySelectorAll('option').length||0,
              categoryOptions:document.querySelector('#category')?.querySelectorAll('option').length||0,
              provinceOptions:document.querySelector('#province')?.querySelectorAll('option').length||0,
              backupRoot:Boolean(document.querySelector('#backup-root')),
            }));
            await context.close();
            return {status:response?.status()||0,errors,...data};
          }
          function count(text){const m=String(text).match(/(\d+)\s+attivit/i);return m?Number(m[1]):-1;}
          try {
            for(const route of ['/','/chi-siamo','/contatti','/privacy-policy','/cookie-policy','/termini','/note-legali','/login','/registrazione','/en/','/fr/','/de/','/es/']){
              const row=await open(route);
              if(row.status!==200) failures.push(`${route}: HTTP ${row.status}`);
              if(row.errors.length) failures.push(`${route}: ${row.errors.join(' | ')}`);
              if(row.overflow>4) failures.push(`${route}: overflow ${row.overflow}`);
              if(!row.h1) failures.push(`${route}: H1 missing`);
            }
            const catalog=await open('/catalogo',{wait:'#results'});
            if(catalog.status!==200||count(catalog.resultCount)!==53||catalog.cards!==18) failures.push(`catalog: ${JSON.stringify(catalog)}`);
            if(catalog.categoryOptions!==11||catalog.provinceOptions!==6||catalog.cityOptions!==117) failures.push(`catalog options: ${catalog.categoryOptions}/${catalog.provinceOptions}/${catalog.cityOptions}`);
            const catalogMobile=await open('/catalogo',{mobile:true,wait:'#results'});
            if(catalogMobile.overflow>4||count(catalogMobile.resultCount)!==53) failures.push(`catalog mobile: ${JSON.stringify(catalogMobile)}`);
            const map=await open('/mappa',{wait:'.leaflet-container'});
            if(map.status!==200||count(map.mapCount)!==53||!map.leaflet||map.clusters<1||map.pins<1) failures.push(`map: ${JSON.stringify(map)}`);
            if(map.categoryOptions!==11||map.provinceOptions!==6||map.cityOptions!==117) failures.push(`map options: ${map.categoryOptions}/${map.provinceOptions}/${map.cityOptions}`);
            const blog=await open('/blog',{wait:'.blog-card'});
            if(blog.status!==200||blog.blogCards<1) failures.push(`blog: ${JSON.stringify(blog)}`);
            const tourism=await open('/attivita?turismo=centro-storico-di-tropea',{wait:'main h1'});
            if(tourism.status!==200||!/Tropea/i.test(tourism.body)) failures.push(`tourism detail: ${JSON.stringify(tourism)}`);
            for(const route of ['/profilo','/preferiti','/dashboard','/messaggi','/aggiungi-attivita','/admin','/admin/blog']){
              const context=await browser.newContext({serviceWorkers:'block'});
              const page=await context.newPage();
              const errs=[]; page.on('pageerror',e=>errs.push(String(e.message||e)));
              await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:20000}).catch(()=>null);
              await page.waitForFunction(()=>location.pathname==='/login',{timeout:12000}).catch(()=>{});
              if(new URL(page.url()).pathname!=='/login') failures.push(`${route}: unauth gate -> ${page.url()}`);
              if(errs.length) failures.push(`${route}: ${errs.join(' | ')}`);
              await context.close();
            }
            const backup=await open('/backup',{wait:'#backup-root'});
            if(backup.status!==200||!backup.backupRoot||!/Backup e ripristino/i.test(backup.h1)) failures.push(`backup: ${JSON.stringify(backup)}`);
          } finally { await browser.close(); }
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          console.log('FIREBASE_BROWSER_GATE_GREEN');
          NODE

      - name: Verify production-security headers in emulator
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI "$LOCAL_URL/dashboard" | tr -d '\r' | grep -qi '^x-robots-tag: noindex,nofollow'
          curl -fsSI "$LOCAL_URL/admin" | tr -d '\r' | grep -qi '^x-robots-tag: noindex,nofollow'
          curl -fsS "$LOCAL_URL/" | grep -q 'index,follow,max-image-preview:large'
          echo FIREBASE_HEADERS_GATE_GREEN

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/firebase-react-hosting.pid ]; then kill "$(cat /tmp/firebase-react-hosting.pid)" || true; fi
