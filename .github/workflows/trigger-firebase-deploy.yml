name: Trigger Firebase deploy

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia workflow Firebase deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run firebase-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
