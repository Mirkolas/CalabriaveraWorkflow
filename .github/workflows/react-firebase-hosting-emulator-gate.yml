name: React migration - Firebase hosting emulator gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-hosting-emulator-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
      EXPECTED_SHA: c8a420ba5302cd8ce223e344aedb3103e4468c75
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.EXPECTED_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Build exact Firebase candidate
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test "$(cat dist/build-version.txt | tr -d '\r\n')" = "$EXPECTED_SHA"
      - name: Start Firebase Hosting emulator
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 emulators:start --only hosting --project calabriavera-e08d4 --config firebase.react.json > /tmp/firebase-hosting.log 2>&1 &
          echo $! > /tmp/firebase-hosting.pid
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:5000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/firebase-hosting.log
          exit 1
      - name: Verify exact Firebase routing and prerender
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:5000
          test "$(curl -fsS "$base/build-version.txt" | tr -d '\r\n')" = "$EXPECTED_SHA"
          for route in / /catalogo /mappa /blog /chi-siamo /privacy-policy /en/ /en/catalogo /en/blog /login /profilo /admin /backup; do
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "$base$route")"
            test "$code" = 200 || { echo "::error::$route HTTP $code"; exit 1; }
            grep -q '<div id="root"' /tmp/page.html
          done
          curl -fsS "$base/catalogo" -o /tmp/catalog.html
          grep -q 'data-prerender-path="/catalogo"' /tmp/catalog.html
          grep -q 'turismo-isola-dino' /tmp/catalog.html
          curl -fsS "$base/mappa" -o /tmp/map.html
          grep -q 'data-prerender-path="/mappa"' /tmp/map.html
          grep -q 'Mappa delle attività in Calabria' /tmp/map.html
          curl -fsS "$base/chi-siamo" -o /tmp/about.html
          grep -q 'data-prerender-path="/chi-siamo"' /tmp/about.html
          grep -q 'La Calabria raccontata da chi la vive' /tmp/about.html
          curl -fsS "$base/en/blog" -o /tmp/en-blog.html
          grep -q 'data-prerender-path="/en/blog"' /tmp/en-blog.html
          curl -fsS "$base/legacy-data/public-businesses-v1.json" -o /tmp/businesses.json
          curl -fsS "$base/legacy-data/public-blog-v1.json" -o /tmp/blog.json
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['/tmp/businesses.json','/tmp/blog.json']){
            const v=JSON.parse(fs.readFileSync(p,'utf8'));
            if(!Array.isArray(v.items)||!v.items.length) throw new Error(`${p} empty`);
          }
          NODE
          echo FIREBASE_HOSTING_EMULATOR_GREEN
      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/firebase-hosting.pid 2>/dev/null)" 2>/dev/null || true
          tail -80 /tmp/firebase-hosting.log 2>/dev/null || true
