name: Verifica codice e backup

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-verify]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - working-directory: source
        run: npm ci && npm --prefix tools ci --no-audit --no-fund

      - name: Audit dipendenze high/critical
        working-directory: source
        shell: bash
        run: |
          audit_with_retry() {
            local label="$1"
            shift
            local output code attempt
            for attempt in 1 2; do
              echo "Audit ${label} - tentativo ${attempt}/2"
              set +e
              output="$(timeout 35s npm "$@" audit --audit-level=high 2>&1)"
              code=$?
              set -e
              printf '%s\n' "$output"
              if [ "$code" -eq 0 ]; then
                return 0
              fi

              if [ "$code" -eq 124 ] || printf '%s' "$output" | grep -Eqi '503|Service Unavailable|audit endpoint returned an error|ECONNRESET|ECONNREFUSED|ETIMEDOUT|EAI_AGAIN'; then
                echo "Registry npm temporaneamente non disponibile per ${label}."
                if [ "$attempt" -lt 2 ]; then sleep 3; fi
                continue
              fi

              echo "Audit ${label} ha rilevato un problema reale (exit ${code})."
              return "$code"
            done

            echo "::warning::Audit ${label} non disponibile dopo due tentativi; nessuna vulnerabilità è stata segnalata, continuo con test/validate/build."
            return 0
          }
          audit_with_retry root
          audit_with_retry tools --prefix tools

      - working-directory: source
        run: npm test && npm run test:backup && npm run validate && npm run build
