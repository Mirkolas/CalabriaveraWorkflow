name: React exact final admin diagnostic v3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-exact-final-admin-diagnostic-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 0dfc13772604f64cd9712468f6aca7cdd7c8a944
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build exact backup, inspect final admin HTML, build candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd legacy && npm ci && npm run build)
          echo '--- final admin script tags ---'
          grep -oE '<script[^>]+src="[^"]+"[^>]*>' legacy/dist/pages/admin/index.html | grep -E 'admin|page-loader' || true
          grep -Fq '/assets/js/admin-upgrade.js' legacy/dist/pages/admin/index.html
          grep -Fq '/assets/js/admin-console.js' legacy/dist/pages/admin/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='legacy/dist/pages/admin/index.html';let html=fs.readFileSync(p,'utf8');
          html=html.replace(/<body([^>]*)>/i,'<body$1><script data-cv-ci-clean-route>history.replaceState({},"","/admin");</script>');
          fs.writeFileSync(p,html);
          NODE
          cd source
          python3 ../workflow/scripts/patch-react-exact-final-admin-runtime.py
          python3 ../workflow/scripts/copy-exact-built-admin-runtime.py ../legacy/dist frontend-react/public
          cd frontend-react
          npm ci
          npm run build
      - name: Install browser and prepare one-route diagnostic gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-admin-diag
          npm install --prefix /tmp/cv-admin-diag --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-admin-diag/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-admin-diag/node_modules/.bin/serve legacy/dist -l 4190 >/tmp/cv-admin-diag-legacy.log 2>&1 & echo $! >/tmp/cv-admin-diag-legacy.pid
          nohup /tmp/cv-admin-diag/node_modules/.bin/serve -s source/frontend-react/dist -l 4191 >/tmp/cv-admin-diag-react.log 2>&1 & echo $! >/tmp/cv-admin-diag-react.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4190/pages/admin/index.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4191/admin >/dev/null 2>&1 && break; sleep 1; done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workflow/scripts/gate-exact-final-admin.mjs')
          s=p.read_text()
          a=s.index('const routes=['); b=s.index('\nconst browser=',a)
          s=s[:a]+"const routes=[['index','/pages/admin/index.html','/admin']];"+s[b:]
          old="const bad=[];if(clean(a)!==clean(b))bad.push('admin-root DOM mismatch');"
          new="const bad=[];if(L.errors.length)bad.push('legacy errors: '+L.errors.join('; '));if(clean(a)!==clean(b))bad.push('admin-root DOM mismatch');"
          if old not in s: raise SystemExit('bad-array diagnostic anchor changed')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Run focused browser diagnostic
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-admin-diag/node_modules/playwright
        shell: bash
        run: |
          set +e
          node workflow/scripts/gate-exact-final-admin.mjs
          code=$?
          echo '--- legacy server log ---'; cat /tmp/cv-admin-diag-legacy.log || true
          echo '--- react server log ---'; cat /tmp/cv-admin-diag-react.log || true
          exit $code
      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-admin-diag-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-admin-diag-react.pid 2>/dev/null)" 2>/dev/null || true
