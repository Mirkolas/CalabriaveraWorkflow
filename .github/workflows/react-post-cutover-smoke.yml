name: React migration - post-cutover production smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-post-cutover-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-post-cutover-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_BASE_URL: https://calabriavera.com
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve exact private main revision
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $PRIVATE_REPO_PAT" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$PRIVATE_REPO/branches/main" > /tmp/main.json
          sha="$(node -e "const x=require('/tmp/main.json');process.stdout.write(x.commit.sha)")"
          test -n "$sha"
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "Production target SHA: $sha"

      - name: Wait for exact production revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            actual="$(curl --fail --silent --show-error --max-time 15 "$PRODUCTION_BASE_URL/build-version.txt?postcutover=$attempt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "PRODUCTION_SHA_GREEN=$actual"
              exit 0
            fi
            echo "Waiting for production ($attempt/90): ${actual:-no version}"
            sleep 10
          done
          echo "::error::Production did not publish $EXPECTED_SHA"
          exit 1

      - name: Verify Firebase static data and prerender
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$PRODUCTION_BASE_URL/legacy-data/public-businesses-v1.json?postcutover=$EXPECTED_SHA" > /tmp/businesses.json
          curl -fsS --max-time 20 "$PRODUCTION_BASE_URL/legacy-data/public-blog-v1.json?postcutover=$EXPECTED_SHA" > /tmp/blog.json
          node - <<'NODE'
          const fs=require('node:fs');
          for (const p of ['/tmp/businesses.json','/tmp/blog.json']) {
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            if(!Array.isArray(x.items)||!x.items.length) throw new Error(`${p} empty`);
          }
          NODE
          curl -fsS --max-time 20 "$PRODUCTION_BASE_URL/catalogo?postcutover=$EXPECTED_SHA" > /tmp/catalog.html
          grep -q 'data-prerender-path="/catalogo"' /tmp/catalog.html
          grep -q 'turismo-isola-dino' /tmp/catalog.html
          grep -q '53 attività trovate' /tmp/catalog.html
          curl -fsS --max-time 20 "$PRODUCTION_BASE_URL/mappa?postcutover=$EXPECTED_SHA" > /tmp/map.html
          grep -q 'data-prerender-path="/mappa"' /tmp/map.html
          grep -q '53 attività sulla mappa' /tmp/map.html
          curl -fsS --max-time 20 "$PRODUCTION_BASE_URL/chi-siamo?postcutover=$EXPECTED_SHA" > /tmp/about.html
          grep -q 'data-prerender-path="/chi-siamo"' /tmp/about.html
          echo PRODUCTION_FIREBASE_PRERENDER_GREEN

      - name: Verify production-origin R2 bridge
        shell: bash
        run: |
          set -euo pipefail
          worker='https://calabriavera.sonotacamirko.workers.dev/api/images/upload'
          origin='https://calabriavera.com'
          curl -sS -D /tmp/cors.h -o /dev/null -X OPTIONS "$worker" \
            -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-user-id,x-business-id'
          grep -qi '^HTTP/.* 204' /tmp/cors.h
          grep -qi "^access-control-allow-origin: $origin" /tmp/cors.h
          echo PRODUCTION_R2_BRIDGE_GREEN

      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-production-smoke
          npm install --prefix /tmp/cv-production-smoke --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-production-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Run production browser smoke
        shell: bash
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-production-smoke/node_modules/playwright
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url);
          const { chromium }=require(process.env.PLAYWRIGHT_MODULE);
          const base=process.env.PRODUCTION_BASE_URL.replace(/\/$/,'');
          const sha=process.env.EXPECTED_SHA;
          const browser=await chromium.launch({headless:true});
          const failures=[];
          try {
            const checks=[
              ['/', async page=>{
                const r=await page.evaluate(()=>({socials:document.querySelectorAll('.social-links .social-link').length, flag:getComputedStyle(document.querySelector('.cv-language-flag')).backgroundImage, bodyWidth:document.body.scrollWidth, viewport:document.documentElement.clientWidth}));
                if(r.socials!==3) failures.push(`home social links=${r.socials}`);
                if(!String(r.flag).includes('/assets/flags/it.svg')) failures.push(`home flag missing: ${r.flag}`);
                if(r.bodyWidth>r.viewport+2) failures.push(`home overflow ${r.bodyWidth}>${r.viewport}`);
              }],
              ['/catalogo', async page=>{
                await page.waitForSelector('.catalog-layout',{timeout:12000});
                const text=(await page.locator('body').innerText()).toLowerCase();
                if(!text.includes('53 attività trovate')||!text.includes('isola di dino')) failures.push('catalog data/parity missing');
              }],
              ['/mappa', async page=>{
                await page.waitForSelector('.leaflet-container',{timeout:15000});
                const text=(await page.locator('body').innerText()).toLowerCase();
                if(!text.includes('53 attività sulla mappa')) failures.push('map count mismatch');
                const clusters=await page.locator('.cv-map-cluster-shell').count();
                if(clusters<1) failures.push('map clusters missing');
              }],
              ['/blog', async page=>{ await page.waitForSelector('main',{timeout:12000}); }],
              ['/chi-siamo', async page=>{ if(!(await page.locator('body').innerText()).includes('La Calabria raccontata da chi la vive')) failures.push('about content missing'); }],
              ['/en/blog', async page=>{ await page.waitForSelector('main',{timeout:12000}); }],
            ];
            for(const [route,check] of checks){
              const context=await browser.newContext({serviceWorkers:'block',viewport:{width:1365,height:900}});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              const response=await page.goto(`${base}${route}?postcutover=${sha}`,{waitUntil:'domcontentloaded',timeout:25000}).catch(()=>null);
              if(!response||response.status()>=400) failures.push(`${route}: HTTP ${response?.status()||0}`);
              try{await check(page);}catch(e){failures.push(`${route}: ${e?.message||e}`);}
              if(errors.length) failures.push(`${route}: page errors ${errors.join(' | ')}`);
              await context.close();
            }
            for(const route of ['/profilo','/preferiti','/dashboard','/messaggi','/aggiungi-attivita','/admin','/admin/blog']){
              const context=await browser.newContext({serviceWorkers:'block'});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto(`${base}${route}?postcutover=${sha}`,{waitUntil:'domcontentloaded',timeout:20000}).catch(()=>null);
              await page.waitForFunction(()=>location.pathname==='/login',{timeout:12000}).catch(()=>{});
              if(new URL(page.url()).pathname!=='/login') failures.push(`${route}: anonymous user not redirected`);
              if(errors.length) failures.push(`${route}: page errors ${errors.join(' | ')}`);
              await context.close();
            }
            const context=await browser.newContext({serviceWorkers:'block'});
            const page=await context.newPage();
            const res=await page.goto(`${base}/backup?postcutover=${sha}`,{waitUntil:'domcontentloaded',timeout:20000}).catch(()=>null);
            await page.waitForSelector('#backup-root',{state:'visible',timeout:12000}).catch(()=>{});
            if(res?.status()!==200||!(await page.locator('#backup-root').count())) failures.push('/backup mismatch');
            await context.close();
          } finally { await browser.close(); }
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          console.log('PRODUCTION_BROWSER_SMOKE_GREEN');
          NODE
