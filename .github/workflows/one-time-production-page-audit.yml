name: One-time production page audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-production-page-audit.yml'
      - 'scripts/production-page-audit.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-page-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installa Playwright e Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-audit
          npm install --prefix /tmp/cv-audit --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-audit/node_modules/.bin/playwright install --with-deps chromium

      - name: Audit grafico e logico produzione
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-audit/node_modules/playwright
          AUDIT_BASE_URL: https://calabriavera.com
          AUDIT_OUTPUT_DIR: page-audit
        run: node scripts/production-page-audit.cjs

      - name: Carica screenshot e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-page-audit
          path: page-audit
          if-no-files-found: warn
          retention-days: 7
