name: One-time Firestore indexes deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-firestore-indexes-deploy.yml'

permissions:
  contents: write
  id-token: write

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy only Firestore indexes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"fieldPath":"socialPending"' firestore.indexes.json
          grep -Fq '"fieldPath":"sourcePublishedAt"' firestore.indexes.json
          npx --yes firebase-tools@15.22.1 deploy --project calabriavera-e08d4 --only firestore:indexes --non-interactive
      - name: Rimuovi trigger monouso
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Workflow Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-firestore-indexes-deploy.yml
          git commit -m 'chore: remove one-time Firestore indexes deploy'
          git push origin HEAD:main
