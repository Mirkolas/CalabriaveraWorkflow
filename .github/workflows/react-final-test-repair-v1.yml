name: React final stale-test repair v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-test-repair-v1.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout private React branch
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Replace stale routing assertion with semantic equivalent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('source/tests/activity-url-favorites.test.mjs')
          text = path.read_text()
          old = "  assert.match(loader, /dataset\\?\\.page==='business'/);"
          new = "  assert.match(loader, /if \\(page === ['\"]business['\"]\\)/);"
          if old not in text:
              raise SystemExit('Stale assertion not found')
          path.write_text(text.replace(old, new))
          PY
          git -C source diff --check

      - name: Run repaired parity test
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/activity-url-favorites.test.mjs

      - name: Commit test repair
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/activity-url-favorites.test.mjs
          git commit -m 'test: align activity routing parity assertion'
          git push origin HEAD:react-migration
