name: React migration - R2 CORS smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-r2-cors-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify production-origin preflight and unauthorized POST
        shell: bash
        run: |
          set -euo pipefail
          url='https://calabriavera.sonotacamirko.workers.dev/api/images/upload'
          origin='https://calabriavera.com'
          curl -sS -D /tmp/preflight.h -o /tmp/preflight.b -X OPTIONS "$url" \
            -H "Origin: $origin" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-user-id,x-business-id'
          grep -qi '^HTTP/.* 204' /tmp/preflight.h
          grep -qi "^access-control-allow-origin: $origin" /tmp/preflight.h
          grep -qi '^access-control-allow-methods: .*POST.*OPTIONS' /tmp/preflight.h
          grep -qi '^access-control-allow-headers: .*Authorization.*Content-Type.*X-User-Id.*X-Business-Id' /tmp/preflight.h
          code="$(curl -sS -o /tmp/post.b -D /tmp/post.h -w '%{http_code}' -X POST "$url" \
            -H "Origin: $origin" -H 'Content-Type: image/webp' -H 'X-User-Id: anonymous' -H 'X-Business-Id: anonymous' --data-binary 'not-image')"
          test "$code" = 401
          grep -qi "^access-control-allow-origin: $origin" /tmp/post.h
          echo R2_CORS_BRIDGE_GREEN
