name: React CSS isolation diagnostic v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-css-isolation-diagnostic-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_BASE: f16b18b93d91b4e1ac278351c6ef7507f3f7a04e
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Patch built cascade and wrappers then build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd source && python3 ../workflow/scripts/patch-react-built-cascade-parity.py)
          (cd source/frontend-react && npm ci && npm run build)
      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-css-isolation
          npm install --prefix /tmp/cv-css-isolation --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-css-isolation/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-css-isolation/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-css-isolation.log 2>&1 & echo $! >/tmp/cv-css-isolation.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4185/questa-pagina-non-esiste >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - name: Isolate Vite bundle and shell metrics
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-css-isolation/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          for(const [mode,viewport] of modes){
            const ctx=await browser.newContext({viewport,serviceWorkers:'block'});
            await ctx.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});
            const p=await ctx.newPage();
            await p.goto('http://127.0.0.1:4185/questa-pagina-non-esiste',{waitUntil:'domcontentloaded',timeout:30000});
            await p.locator('main h1').waitFor({state:'visible',timeout:15000});await p.waitForTimeout(500);
            async function state(label){return p.evaluate((label)=>{const q=s=>document.querySelector(s),h=q('main h1'),head=q('.site-header'),inner=q('.header-inner'),section=q('main section.section.container');const r=e=>{const x=e?.getBoundingClientRect();return x?{x:x.x,y:x.y,w:x.width,h:x.height}:null};const hs=h?getComputedStyle(h):null;return {label,h1:hs?{font:hs.fontFamily,weight:hs.fontWeight,size:hs.fontSize,line:hs.lineHeight,letter:hs.letterSpacing}:null,header:r(head),inner:r(inner),section:r(section),vite:[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>new URL(x.href,location.href).pathname).filter(x=>x.startsWith('/assets/index-'))};},label)}
            console.log('ISOLATION '+mode+' '+JSON.stringify(await state('baseline')));
            await p.evaluate(()=>{for(const link of [...document.querySelectorAll('link[rel="stylesheet"]')]){const path=new URL(link.href,location.href).pathname;if(path.startsWith('/assets/index-'))link.disabled=true;}});
            await p.waitForTimeout(100);
            console.log('ISOLATION '+mode+' '+JSON.stringify(await state('vite-disabled')));
            await p.evaluate(()=>{for(const link of [...document.querySelectorAll('link[rel="stylesheet"]')])link.disabled=false;const style=document.createElement('style');style.id='cv-diag-force-serif';style.textContent='h1,h2,h3{font-family:Georgia,"Times New Roman",serif!important;font-weight:700!important}';document.head.appendChild(style)});
            await p.waitForTimeout(100);
            console.log('ISOLATION '+mode+' '+JSON.stringify(await state('forced-serif')));
            await p.close();await ctx.close();
          }
          await browser.close();
          NODE
      - name: Stop
        if: always()
        run: kill "$(cat /tmp/cv-css-isolation.pid 2>/dev/null)" 2>/dev/null || true
