name: Firebase - Restore

on:
  workflow_dispatch:
    inputs:
      backup_tag:
        description: 'Tag della release backup da ripristinare'
        required: true
        type: string
      apply:
        description: 'Modificare Firebase? false = sola simulazione'
        type: boolean
        default: false
      confirmation:
        description: 'Conferma richiesta dal tool privato'
        type: string
      exact:
        description: 'Eliminare anche elementi creati dopo il backup'
        type: boolean
        default: false
      delete_confirmation:
        description: 'Conferma aggiuntiva per exact'
        type: string
      site_settings:
        description: 'Ripristinare anche Hosting/regole/impostazioni supportate'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  restore:
    if: vars.BACKUPS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installa, compila e testa
        working-directory: source
        run: npm ci && npm --prefix tools ci --no-audit --no-fund && npm run build && npm run test:backup

      - name: Autentica Google Cloud con WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_RESTORE_SERVICE_ACCOUNT }}

      - name: Simulazione o ripristino con copia preventiva
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          GITHUB_REPOSITORY: ${{ secrets.PRIVATE_REPO }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
          RESTORE_BACKUP_TAG: ${{ inputs.backup_tag }}
          RESTORE_APPLY: ${{ inputs.apply }}
          RESTORE_CONFIRM: ${{ inputs.confirmation }}
          RESTORE_EXACT: ${{ inputs.exact }}
          RESTORE_DELETE_CONFIRM: ${{ inputs.delete_confirmation }}
          RESTORE_SITE_SETTINGS: ${{ inputs.site_settings }}
        run: node tools/backup/restore.mjs
