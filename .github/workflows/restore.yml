name: Firebase restore

on:
  workflow_dispatch:
    inputs:
      backup_tag:
        description: 'Tag del backup da ripristinare'
        required: true
        type: string
      apply:
        description: 'Applica realmente il ripristino'
        type: boolean
        default: false
      confirmation:
        description: 'Conferma richiesta dal tool di ripristino'
        type: string
      exact:
        description: 'Rimuove anche gli elementi successivi al backup'
        type: boolean
        default: false
      delete_confirmation:
        description: 'Conferma aggiuntiva per la modalità exact'
        type: string
      site_settings:
        description: 'Ripristina anche le impostazioni del sito supportate'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_RESTORE_SERVICE_ACCOUNT }}
      FIREBASE_WIF_PROVIDER: ${{ secrets.FIREBASE_WIF_PROVIDER }}
      FIREBASE_WIF_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_RESTORE_WIF_SERVICE_ACCOUNT }}

    steps:
      - name: Verifica configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO PRIVATE_REPO_PAT FIREBASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret richiesto non configurato: $name"
              exit 1
            fi
          done
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ] && { [ -z "${FIREBASE_WIF_PROVIDER:-}" ] || [ -z "${FIREBASE_WIF_SERVICE_ACCOUNT:-}" ]; }; then
            echo "::error::Configura l'autenticazione Firebase per il restore."
            exit 1
          fi

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installa, compila e testa
        working-directory: source
        run: npm ci && npm --prefix tools ci --no-audit --no-fund && npm run build && npm run test:backup

      - name: Autentica Google Cloud con JSON
        if: env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_RESTORE_SERVICE_ACCOUNT }}

      - name: Autentica Google Cloud con Workload Identity Federation
        if: env.FIREBASE_SERVICE_ACCOUNT_JSON == ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_RESTORE_WIF_SERVICE_ACCOUNT }}

      - name: Simulazione o ripristino
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
          RESTORE_BACKUP_TAG: ${{ inputs.backup_tag }}
          RESTORE_APPLY: ${{ inputs.apply }}
          RESTORE_CONFIRM: ${{ inputs.confirmation }}
          RESTORE_EXACT: ${{ inputs.exact }}
          RESTORE_DELETE_CONFIRM: ${{ inputs.delete_confirmation }}
          RESTORE_SITE_SETTINGS: ${{ inputs.site_settings }}
        run: node tools/backup/restore.mjs
