name: Firebase - Restore

on:
  workflow_dispatch:
    inputs:
      backup_tag:
        description: 'Tag della release backup da ripristinare'
        required: true
        type: string
      apply:
        description: 'Modificare Firebase? false = sola simulazione'
        type: boolean
        default: false
      offline_verify:
        description: 'Verifica cifratura, manifest e ripristinabilità senza leggere o scrivere Firebase'
        type: boolean
        default: true
      emulator_drill:
        description: 'Prova restore reale nei soli emulatori locali, senza leggere o scrivere Firebase'
        type: boolean
        default: false
      confirmation:
        description: 'Conferma richiesta dal tool privato'
        type: string
      exact:
        description: 'Eliminare anche elementi creati dopo il backup'
        type: boolean
        default: false
      delete_confirmation:
        description: 'Conferma aggiuntiva per exact'
        type: string
      site_settings:
        description: 'Ripristinare anche Hosting/regole/impostazioni supportate'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  restore:
    if: vars.BACKUPS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Installa, compila e testa
        working-directory: source
        run: npm ci && npm --prefix tools ci --no-audit --no-fund && npm run build && npm run test:backup

      - name: Autentica Google Cloud con WIF
        if: inputs.offline_verify != true && inputs.emulator_drill != true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_RESTORE_SERVICE_ACCOUNT }}

      - name: Simulazione o ripristino con copia preventiva
        if: inputs.emulator_drill != true
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          GITHUB_REPOSITORY: ${{ secrets.PRIVATE_REPO }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
          RESTORE_BACKUP_TAG: ${{ inputs.backup_tag }}
          RESTORE_APPLY: ${{ inputs.apply }}
          RESTORE_OFFLINE_VERIFY: ${{ inputs.offline_verify }}
          RESTORE_CONFIRM: ${{ inputs.confirmation }}
          RESTORE_EXACT: ${{ inputs.exact }}
          RESTORE_DELETE_CONFIRM: ${{ inputs.delete_confirmation }}
          RESTORE_SITE_SETTINGS: ${{ inputs.site_settings }}
        run: node tools/backup/restore.mjs

      - name: Verifica parametri del drill isolato
        if: inputs.emulator_drill == true
        env:
          RESTORE_APPLY: ${{ inputs.apply }}
        run: test "$RESTORE_APPLY" != 'true' || { echo '::error::Il drill emulatore non consente apply'; exit 1; }

      - name: Prepara Java per gli emulatori locali
        if: inputs.emulator_drill == true
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prova il backup nei soli emulatori locali
        if: inputs.emulator_drill == true
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          RESTORE_BACKUP_TAG: ${{ inputs.backup_tag }}
        run: npx --yes firebase-tools@15.28.1 emulators:exec --project demo-calabriavera --only firestore,auth 'node tools/backup/drill.mjs'
