name: React migration - production apex cutover smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-production-apex-cutover-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EXPECTED_SHA: 7a95c570f470bb59e81da376795d7a5e14878301
      STAGING_URL: https://calabriavera.sonotacamirko.workers.dev
      PROD_URL: https://calabriavera.com
    steps:
      - name: Wait for exact Worker revision on staging
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            got="$(curl --fail --silent --show-error --max-time 15 "$STAGING_URL/build-version.txt?staging=$attempt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$got" = "$EXPECTED_SHA" ]; then
              echo "STAGING_SHA_GREEN=$got"
              exit 0
            fi
            echo "staging attempt $attempt: ${got:-none}"
            sleep 10
          done
          echo "::error::staging did not reach $EXPECTED_SHA"
          exit 1

      - name: Wait for exact Worker revision on production apex
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            got="$(curl --fail --silent --show-error --max-time 15 "$PROD_URL/build-version.txt?production=$attempt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$got" = "$EXPECTED_SHA" ]; then
              echo "PRODUCTION_SHA_GREEN=$got"
              exit 0
            fi
            echo "production attempt $attempt: ${got:-legacy-or-unavailable}"
            sleep 10
          done
          echo "::error::production apex did not reach $EXPECTED_SHA"
          exit 1

      - name: Verify Cloudflare routing and critical public endpoints
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSIL --max-time 20 "$PROD_URL/")"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -Eqi '^server: cloudflare'
          for path in / /catalogo /mappa /blog /login /registrazione /privacy-policy /cookie-policy /assets/data/public-businesses-v1.json /assets/data/blog-posts-v1.json; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$PROD_URL$path?cutover=1")"
            echo "$path -> $code"
            test "$code" -ge 200 -a "$code" -lt 400
          done
          echo "PRODUCTION_APEX_CUTOVER_GREEN=$EXPECTED_SHA"
