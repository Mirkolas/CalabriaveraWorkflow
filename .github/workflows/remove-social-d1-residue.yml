name: One-time remove Social D1 residue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-social-d1-residue.yml'

permissions:
  contents: read

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Rimuovi codice D1 residuo da Social
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path('tools/publish-social-pair.mjs')
          s = file.read_text()
          s = s.replace('import { d1Query, d1Rows } from "./lib/d1-workflow-store.mjs";\n', '')
          s = re.sub(r'^const workflowStateBackend = .*?;\n', '', s, flags=re.M)
          s = s.replace('const SOCIAL_QUEUE_NAMESPACE = "socialQueue";\n', '')
          s = s.replace('const SOCIAL_QUEUE_KEY = "legacyDrained";\n', '')
          s = re.sub(r'function jsonSafe\(value\) \{.*?\n\}\n\n', '', s, count=1, flags=re.S)

          start = s.find('async function saveD1SocialQueueState')
          end = s.find('async function loadPendingCandidates')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Blocco D1 Social non trovato')
          replacement = '''async function loadSocialQueueState() {
            return loadFirestoreSocialQueueState();
          }

          async function saveSocialQueueState(drained) {
            await socialQueueStateRef.set({ legacyDrained: drained, updatedAt: FieldValue.serverTimestamp() }, { merge: true });
          }

          async function loadPublicationState(postId) {
            const ref = db.collection("socialPublications").doc(postId);
            const snap = await ref.get();
            return snap.exists ? snap.data() || {} : {};
          }

          '''
          s = s[:start] + replacement + s[end:]
          forbidden = ['d1-workflow-store', 'd1Query', 'd1Rows', 'workflowStateBackend', 'saveD1', 'D1']
          found = [token for token in forbidden if token in s]
          if found:
              raise SystemExit('Residui D1 ancora presenti in publish-social-pair: ' + ', '.join(found))
          file.write_text(s)

          test_file = Path('tests/automation-cadence.test.mjs')
          t = test_file.read_text()
          anchor = '  assert.match(socialPair, /collection\\("socialPublications"\\)/);\n'
          addition = '  assert.doesNotMatch(socialPair, /d1-workflow-store|d1Query|d1Rows|workflowStateBackend|AUTOMATION_STATE_BACKEND/);\n'
          if addition not in t:
              if anchor not in t:
                  raise SystemExit('Anchor test Social non trovato')
              t = t.replace(anchor, anchor + addition)
          test_file.write_text(t)
          PY
          node --check tools/publish-social-pair.mjs
          git diff --check -- tools/publish-social-pair.mjs tests/automation-cadence.test.mjs
          ! grep -Eqi 'd1-workflow-store|d1Query|d1Rows|workflowStateBackend|AUTOMATION_STATE_BACKEND' tools/publish-social-pair.mjs
          git diff -- tools/publish-social-pair.mjs tests/automation-cadence.test.mjs
      - name: Suite completa repository privato
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
      - name: Commit privato senza Actions private
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Public Workflow'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/publish-social-pair.mjs tests/automation-cadence.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove stale D1 Social state [skip ci]'
            git push origin HEAD:main
          fi
          echo "Private main: $(git rev-parse HEAD)"
