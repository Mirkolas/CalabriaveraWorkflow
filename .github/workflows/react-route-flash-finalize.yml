name: React route transition no-flash finalize

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-route-flash-finalize.yml'
      - 'scripts/react-route-css-transition-fix.py'
      - 'scripts/react-route-css-no-flash.mjs'

permissions:
  contents: read

env:
  EXPECTED_CANDIDATE_SHA: 0ea51f3629e6069d5cb5eaff87c6d318f5927061

jobs:
  certify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout exact private integration candidate
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-main-integration-final
          path: source
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pin candidate and apply atomic route CSS swap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          python runner/scripts/react-route-css-transition-fix.py source
          git -C source diff --check -- frontend-react/src/components/Layout.tsx
          git -C source diff -- frontend-react/src/components/Layout.tsx

      - name: Full private regression suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: Build React production candidate
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-flash
          npm install --prefix /tmp/cv-flash --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-flash/node_modules/.bin/playwright install --with-deps chromium
          cp runner/scripts/react-route-css-no-flash.mjs /tmp/cv-flash/test.mjs

      - name: Prove no route CSS flash with 450ms delayed styles
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/cv-flash/test.mjs "$GITHUB_WORKSPACE/source/frontend-react/dist"

      - name: Push only the certified no-flash fix
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin react-main-integration-final
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_CANDIDATE_SHA" || { echo '::error::Integration branch changed during certification'; exit 1; }
          git add frontend-react/src/components/Layout.tsx
          git diff --cached --quiet && { echo '::error::Expected Layout no-flash change is missing'; exit 1; }
          git config user.name 'CalabriaVera Public Runner'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: eliminate route CSS flash and giant logo [skip ci]'
          git push origin HEAD:react-main-integration-final
          echo "Certified candidate SHA: $(git rev-parse HEAD)"
