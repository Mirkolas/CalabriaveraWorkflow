name: React migration - cutover readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-cutover-readiness.yml'
      - 'scripts/react-parity-audit-v2.cjs'
      - 'scripts/prepare-final-parity-audit.py'
      - 'scripts/react-catalog-map-live-gate.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-cutover-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_REACT_SHA: b3e3bc4e06f038b8cb6bb9065a3e94c95db551f9
      EXPECTED_MAIN_SHA: c008d517ded2ae66836ea08d45541a82bccd8653
      MAIN_BASE_URL: https://calabriavera.com
      STAGING_BASE_URL: https://calabriavera.sonotacamirko.workers.dev
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false

      - name: Checkout exact React migration branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Verify branch ancestry and current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_REACT_SHA"
          git -C source fetch origin main --prune
          test "$(git -C source rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git -C source merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_REACT_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/frontend-react/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        working-directory: source
        run: npm ci

      - name: Run Auth and Firestore emulator tests
        working-directory: source
        env:
          CI: 'true'
        run: npm run test:emulators

      - name: Build final React client SSR and prerender
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build | tee /tmp/react-cutover-build.log
          ! grep -q 'Tourism prerender fallback' /tmp/react-cutover-build.log

      - name: Validate generated and authenticated contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s source/frontend-react/dist/index.html
          test -s source/frontend-react/dist/catalogo/index.html
          test -s source/frontend-react/dist/blog/index.html
          test ! -e source/frontend-react/src/generated/tourism-data-core.js
          test ! -e source/frontend-react/src/generated/tourism-data-core.d.ts
          grep -q 'react-live-parity.css' source/frontend-react/dist/catalogo/index.html
          grep -q 'catalog-activity-cover.css' source/frontend-react/dist/catalogo/index.html
          grep -q 'cv-react-magazine' source/frontend-react/dist/blog/index.html
          grep -q 'data-cv-main-parity' source/frontend-react/dist/catalogo/index.html
          grep -q 'turismo-isola-dino' source/frontend-react/dist/catalogo/index.html
          grep -q 'turismo-catanzaro-centro' source/frontend-react/dist/catalogo/index.html
          for lang in it en fr de es; do test -s "source/frontend-react/dist/assets/flags/$lang.svg"; done
          grep -q 'footerActivities: "Attività"' source/frontend-react/src/lib/language.ts
          grep -q 'social-links' source/frontend-react/src/components/Layout.tsx
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          generated=Path('source/frontend-react/src/generated/tourism-data-core.ts').read_text(encoding='utf-8')
          ids=re.findall(r'"id"\s*:\s*"([^"]+)"',generated)
          assert len(ids)==52 and len(set(ids))==52, len(ids)
          html=Path('source/frontend-react/dist/catalogo/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="application/json" id="cv-react-businesses">(.*?)</script>',html,re.S)
          assert m, 'catalog prerender snapshot missing'
          payload=json.loads(m.group(1))
          tourism=[str(x.get('id','')) for x in payload.get('items',[]) if str(x.get('id','')).startswith('turismo-')]
          assert len(tourism)==52 and len(set(tourism))==52, len(tourism)
          print('CUTOVER_GENERATED_ASSETS_GREEN')
          PY
          favorites=source/frontend-react/src/pages/FavoritesPage.tsx
          account=source/frontend-react/src/lib/account.ts
          profile=source/frontend-react/src/pages/ProfilePage.tsx
          dashboard=source/frontend-react/src/pages/DashboardPage.tsx
          messages=source/frontend-react/src/pages/MessagesPage.tsx
          editor=source/frontend-react/src/pages/BusinessEditorPage.tsx
          admin=source/frontend-react/src/pages/AdminPage.tsx
          adminlib=source/frontend-react/src/lib/admin.ts
          grep -q 'cv-favorites-toolbar' "$favorites"
          grep -q 'ALL_TOURISM' "$account"
          grep -q 'id="profile-root"' "$profile"
          grep -q 'id="profile-form"' "$profile"
          grep -q 'id="password-form"' "$profile"
          grep -q 'verification-controls' "$profile"
          grep -q 'await ensureUserDoc(user);' "$account"
          grep -q 'id="dashboard-root"' "$dashboard"
          grep -q 'cv-analytics-grid' "$dashboard"
          grep -q 'deleteOwnBusiness' "$dashboard"
          grep -q 'id="messages-root"' "$messages"
          grep -q 'cv-messages-shell cv-messages-v2' "$messages"
          grep -q 'watchConversations' "$messages"
          grep -q 'watchMessages' "$messages"
          grep -q 'watchUnreadCounts' "$messages"
          grep -q 'hideConversation' "$messages"
          grep -q 'saveQuickReplies' "$messages"
          grep -q 'id="add-business-root"' "$editor"
          grep -q 'id="business-form"' "$editor"
          grep -q 'business-truthful' "$editor"
          grep -q 'name="phone" type="tel" required' "$editor"
          grep -q 'replaceBusinessImages' "$editor"
          grep -q 'id="admin-root"' "$admin"
          grep -q 'id="admin-content"' "$admin"
          grep -q 'className="admin-layout"' "$admin"
          grep -q 'magazineSources' "$admin"
          grep -q 'listConversationsAdmin' "$admin"
          grep -q 'deleteConversationAdmin' "$admin"
          grep -q 'auditEvent("admin_conversation_deleted"' "$adminlib"
          grep -q "admin() && request.resource.data.event == 'admin_conversation_deleted'" source/firestore.rules
          test -s source/frontend-react/src/pages/BackupPage.tsx
          grep -q 'id="backup-root"' source/frontend-react/src/pages/BackupPage.tsx
          git -C source diff --check
          echo CUTOVER_PRIVATE_CONTRACTS_GREEN

      - name: Wait for exact Cloudflare staging commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..72}; do
            actual="$(curl --fail --silent --show-error --max-time 15 "$STAGING_BASE_URL/build-version.txt?cutover=$attempt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$actual" = "$EXPECTED_REACT_SHA" ]; then
              echo "CUTOVER_STAGING_SHA_GREEN=$actual"
              exit 0
            fi
            echo "Waiting for staging ($attempt/72): ${actual:-no version}"
            sleep 10
          done
          echo "::error::Cloudflare did not publish $EXPECTED_REACT_SHA"
          exit 1

      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-cutover
          npm install --prefix /tmp/cv-cutover --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-cutover/node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare final parity audit
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/prepare-final-parity-audit.py

      - name: Run public browser parity gates
        working-directory: source
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-cutover/node_modules/playwright
          EXPECTED_SHA: ${{ env.EXPECTED_REACT_SHA }}
          PARITY_OUT: parity-audit-fast
        shell: bash
        run: |
          set -euo pipefail
          node ../automation/scripts/react-parity-audit-v2.cjs
          node ../automation/scripts/react-catalog-map-live-gate.cjs

      - name: Verify anonymous private-route protection and backup
        shell: bash
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-cutover/node_modules/playwright
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url);
          const { chromium }=require(process.env.PLAYWRIGHT_MODULE);
          const base=process.env.STAGING_BASE_URL.replace(/\/$/,'');
          const sha=process.env.EXPECTED_REACT_SHA;
          const protectedRoutes=['/profilo','/preferiti','/dashboard','/messaggi','/aggiungi-attivita','/admin','/admin/blog'];
          const browser=await chromium.launch({headless:true});
          const failures=[];
          try {
            for (const route of protectedRoutes) {
              const context=await browser.newContext({serviceWorkers:'block'});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto(`${base}${route}?cutover=${sha}`,{waitUntil:'domcontentloaded',timeout:20000}).catch(()=>null);
              await page.waitForFunction(()=>location.pathname==='/login',{timeout:12000}).catch(()=>{});
              if(new URL(page.url()).pathname!=='/login') failures.push(`${route}: expected /login, got ${page.url()}`);
              if(errors.length) failures.push(`${route}: page errors ${errors.join(' | ')}`);
              await context.close();
            }
            const context=await browser.newContext({serviceWorkers:'block'});
            const page=await context.newPage();
            const response=await page.goto(`${base}/backup?cutover=${sha}`,{waitUntil:'domcontentloaded',timeout:20000}).catch(()=>null);
            await page.waitForSelector('#backup-root',{state:'visible',timeout:12000}).catch(()=>{});
            const backup=await page.evaluate(()=>({path:location.pathname,root:Boolean(document.querySelector('#backup-root')),title:document.querySelector('h1')?.textContent?.trim()||''}));
            if(response?.status()!==200||backup.path!=='/backup'||!backup.root||backup.title!=='Backup e ripristino') failures.push(`/backup: ${JSON.stringify({status:response?.status()||0,...backup})}`);
            await context.close();
          } finally { await browser.close(); }
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          console.log('CUTOVER_PRIVATE_ROUTE_GATE_GREEN');
          NODE

      - name: Verify main stayed frozen through all gates
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin main --prune
          current_main="$(git -C source rev-parse origin/main)"
          test "$current_main" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main advanced from $EXPECTED_MAIN_SHA to $current_main; cutover readiness is stale"
            exit 1
          }
          git -C source merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$EXPECTED_REACT_SHA"
          echo CUTOVER_READINESS_GREEN

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: react-cutover-readiness
          path: source/parity-audit-fast
          if-no-files-found: warn
          retention-days: 7
