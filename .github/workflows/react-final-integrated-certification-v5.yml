name: React final integrated certification v5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-integrated-certification-v5.yml'

permissions:
  contents: read

env:
  CANDIDATE_SHA: 3c18af318a2067edf8a263bbaa1300e26fc1494e
  ORACLE_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: react-final-integrated-certification-v5
      cancel-in-progress: true
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout public certification runner
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout exact integrated candidate
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact pre-React oracle
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.ORACLE_SHA }}
          path: oracle
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pin exact candidate and oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C oracle rev-parse HEAD)" = "$ORACLE_SHA"
          grep -F 'https://img.calabriavera.com/static/assets/Logo.png' source/frontend-react/src/components/Layout.tsx
          grep -F 'const STATIC_IMAGE_CDN = "https://img.calabriavera.com/static";' source/frontend-react/src/pages/OriginalHomePage.tsx

      - name: Install application dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd source && npm ci --no-audit --no-fund)
          (cd oracle && npm ci --no-audit --no-fund)
          (cd source/frontend-react && npm ci --no-audit --no-fund)

      - name: Full repository regression suite
        working-directory: source
        run: npm test

      - name: Build pre-React oracle
        working-directory: oracle
        run: npm run build

      - name: Build integrated React candidate
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: npm run build

      - name: Structural and semantic parity gate
        shell: bash
        run: python runner/scripts/react-final-certification-v4.py

      - name: Verify production R2 static assets byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-r2
          assets=(
            assets/Logo.png
            assets/images/home/tropea-960.webp
            assets/images/home/sila-720.webp
            assets/images/home/scilla-720.webp
            assets/images/home/capo-colonna-720.webp
          )
          for asset in "${assets[@]}"; do
            out="/tmp/cv-r2/$(basename "$asset")"
            curl --fail --silent --show-error --location --retry 3 --output "$out" "https://img.calabriavera.com/static/$asset"
            cmp "$out" "oracle/dist/$asset"
            echo "R2 exact: $asset"
          done

      - name: Install Chromium visual tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-visual
          npm install --prefix /tmp/cv-visual --no-package-lock --no-save playwright@1.62.1 pixelmatch@7.1.0 pngjs@7.0.0
          /tmp/cv-visual/node_modules/.bin/playwright install --with-deps chromium
          cp runner/scripts/react-final-visual-v5.mjs /tmp/cv-visual/compare.mjs

      - name: Final visual parity desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cv-visual
          node compare.mjs "$GITHUB_WORKSPACE/oracle/dist" "$GITHUB_WORKSPACE/source/frontend-react/dist" /tmp/cv-visual/out-v5

      - name: Upload final integrated certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-final-integrated-certification-v5
          path: /tmp/cv-visual/out-v5
          if-no-files-found: ignore
          retention-days: 7
