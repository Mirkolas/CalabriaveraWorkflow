name: React exact backup parity - home cards v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-exact-home-card-parity-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-exact-home-card-parity-v2
  cancel-in-progress: true

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - name: Verify access
        run: test -n "$PRIVATE_REPO" && test -n "$PRIVATE_REPO_PAT"

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false

      - name: Checkout exact backup
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify, patch and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          python3 - <<'PY'
          from pathlib import Path
          html=Path('legacy/index.html').read_text(); css=Path('legacy/assets/css/home-reference.css').read_text()
          required=['style="--bg:url(', 'data-favorite-id="', 'background:var(--bg) center/cover no-repeat', 'linear-gradient(180deg,transparent 42%,rgba(0,15,24,.86) 100%)']
          missing=[x for x in required if x not in html+css]
          if missing: raise SystemExit(f'exact home contract changed: {missing}')
          if 'cv-trust' in html: raise SystemExit('exact home DOM now includes cv-trust; update gate')
          PY
          cd source
          python3 ../workflow/scripts/patch-react-exact-home-cards.py
          cd frontend-react
          npm ci
          npm run build

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-home-v2
          npm install --prefix /tmp/cv-home-v2 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-home-v2/node_modules/.bin/playwright install --with-deps chromium

      - name: Start backup and React
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-home-v2/node_modules/.bin/serve legacy -l 4184 >/tmp/cv-home-v2-legacy.log 2>&1 & echo $! >/tmp/cv-home-v2-legacy.pid
          nohup /tmp/cv-home-v2/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-home-v2-react.log 2>&1 & echo $! >/tmp/cv-home-v2-react.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4184/index.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1

      - name: Enforce exact home card parity
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-home-v2/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true}),fail=[];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          const consent={version:3,scope:'technical-only',savedAt:new Date().toISOString(),expiresAt:new Date(Date.now()+30*864e5).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'gate'};
          const compact=x=>String(x||'').replace(/\s+/g,'');
          const bg=x=>compact(x).replace(/https?:\/\/127\.0\.0\.1:\d+/g,'');
          async function snap(p){return p.evaluate(()=>({hero:document.querySelector('.cv-home-hero')?.getBoundingClientRect().toJSON(),search:document.querySelector('#cv-home-search')?.getBoundingClientRect().toJSON(),categories:document.querySelector('.cv-categories')?.getBoundingClientRect().toJSON(),cards:[...document.querySelectorAll('.cv-experience-card')].map(el=>{const s=getComputedStyle(el),a=getComputedStyle(el,'::after'),r=el.getBoundingClientRect();return{title:el.querySelector('h3')?.textContent?.trim()||'',background:s.backgroundImage,size:s.backgroundSize,pos:s.backgroundPosition,after:a.backgroundImage,w:r.width,h:r.height,favorite:el.querySelector('[data-favorite-id]')?.getAttribute('data-favorite-id')||''}})}))}
          try{
            for(const [mode,viewport] of modes){
              const ctx=await browser.newContext({viewport,serviceWorkers:'block'});await ctx.addInitScript(v=>{try{localStorage.setItem('cv-cookie-consent-v3',JSON.stringify(v));localStorage.removeItem('cv-consent')}catch{}},consent);const sides={};
              for(const [side,origin,path] of [['legacy','http://127.0.0.1:4184','/index.html'],['react','http://127.0.0.1:4185','/']]){const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));await p.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});await p.locator('.cv-experience-card').first().waitFor({state:'visible',timeout:15000});await p.waitForTimeout(400);sides[side]={...(await snap(p)),errors};await p.close()}
              const a=sides.legacy,b=sides.react,m=[];if(a.cards.length!==4||b.cards.length!==4)m.push(`count:${a.cards.length}/${b.cards.length}`);
              for(let i=0;i<Math.min(a.cards.length,b.cards.length);i++){const x=a.cards[i],y=b.cards[i];if(x.title!==y.title)m.push(`card${i}.title`);if(bg(x.background)!==bg(y.background))m.push(`card${i}.bg:${bg(x.background)}/${bg(y.background)}`);if(compact(x.after)!==compact(y.after))m.push(`card${i}.after`);if(x.size!==y.size||x.pos!==y.pos)m.push(`card${i}.background-layout`);if(Math.abs(x.w-y.w)>2||Math.abs(x.h-y.h)>2)m.push(`card${i}.rect`);if(!y.favorite)m.push(`card${i}.favorite-marker`)}
              for(const key of ['hero','search','categories']){if(!a[key]||!b[key])m.push(`${key}-missing`);else if(Math.abs(a[key].width-b[key].width)>3||Math.abs(a[key].height-b[key].height)>4)m.push(`${key}.rect`)}
              if(b.errors.length)m.push(`react-errors:${b.errors.join(';')}`);console.log(`${mode}: ${m.length?m.join(' | '):'OK'}`);if(m.length)fail.push({mode,m,a,b});await ctx.close();
            }
          }finally{await browser.close()}
          if(fail.length){console.error(JSON.stringify(fail,null,2));process.exit(1)}
          console.log('EXACT_HOME_CARDS_GREEN');
          NODE

      - name: Commit exact home cards to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/OriginalHomePage.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: match home cards to exact pre-React backup'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-home-v2-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-home-v2-react.pid 2>/dev/null)" 2>/dev/null || true
