name: Cloudflare D1 - Sync Live After Deploy

on:
  workflow_run:
    workflows:
      - Firebase - Deploy CalabriaVera
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-workflow-storage
  cancel-in-progress: false

env:
  D1_DATABASE: calabriavera-workflows
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  sync-live-snapshots:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN mancante"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID mancante"; exit 1; }
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT repository privato mancante"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Verifica modalità workflow-only
        shell: bash
        run: |
          set -euo pipefail
          test -f source/frontend-react/scripts/build-d1-seed.mjs
          if grep -Eq '"d1_databases"|\[\[d1_databases\]\]' source/frontend-react/wrangler.jsonc; then
            echo "::error::D1 non deve essere collegato al Worker del sito."
            exit 1
          fi

      - name: Verifica database D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > "$RUNNER_TEMP/d1-list.json"
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/d1-list.json`, 'utf8'));
          if (!rows.some(row => row.name === process.env.D1_DATABASE)) throw new Error(`Database D1 ${process.env.D1_DATABASE} non trovato`);
          NODE

      - name: Scarica snapshot appena pubblicati
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/calabriavera-public-data"
          mkdir -p "$data_dir"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            https://calabriavera.com/assets/data/public-businesses-v1.json \
            --output "$data_dir/public-businesses-v1.json"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            https://calabriavera.com/assets/data/public-blog-v1.json \
            --output "$data_dir/public-blog-v1.json"
          D1_PUBLIC_DATA_DIR="$data_dir" node - <<'NODE'
          const fs = require('fs');
          const dir = process.env.D1_PUBLIC_DATA_DIR;
          const summary = {};
          for (const name of ['public-businesses-v1.json', 'public-blog-v1.json']) {
            const value = JSON.parse(fs.readFileSync(`${dir}/${name}`, 'utf8'));
            if (!value || !Array.isArray(value.items) || value.items.length === 0) throw new Error(`${name}: snapshot live non valido o vuoto`);
            summary[name] = { items: value.items.length, generatedAt: value.generatedAt || null };
          }
          console.log(JSON.stringify(summary, null, 2));
          NODE
          echo "D1_PUBLIC_DATA_DIR=$data_dir" >> "$GITHUB_ENV"

      - name: Applica migrazioni D1 idempotenti
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(source/frontend-react/d1/migrations/*.sql)
          test "${#migrations[@]}" -gt 0 || { echo "::error::Nessuna migrazione D1 trovata"; exit 1; }
          for migration in "${migrations[@]}"; do
            npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --file="$migration" --yes
          done

      - name: Genera seed dagli snapshot live
        working-directory: source/frontend-react
        run: node scripts/build-d1-seed.mjs

      - name: Aggiorna D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --file=source/frontend-react/d1/generated/seed-public.sql --yes

      - name: Verifica sincronizzazione
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --command="SELECT 'businesses' AS dataset, COUNT(*) AS rows FROM businesses UNION ALL SELECT 'blog_posts', COUNT(*) FROM blog_posts;" --json
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --command="SELECT key, value, updated_at FROM migration_meta WHERE key LIKE 'public_%' ORDER BY key;" --json
