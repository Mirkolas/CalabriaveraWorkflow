name: React migration - final public parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-public-final.yml'
      - 'scripts/patch-react-public-final.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-public-final
  cancel-in-progress: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply final public parity fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "4047f364addb28afb0b8d0aa15f1758c4f38e873"
          python3 automation/scripts/patch-react-public-final.py
      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate runtime and first-paint invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'main-route-css.json' source/frontend-react/scripts/copy-legacy-assets.mjs
          grep -q 'data-cv-main-parity' source/frontend-react/dist/catalogo/index.html
          grep -q 'catalog-activity-cover.css' source/frontend-react/dist/catalogo/index.html
          grep -q 'language-modern.css' source/frontend-react/dist/catalogo/index.html
          grep -q 'leafletModule.default' source/frontend-react/src/pages/MapPage.tsx
          grep -q 'Aktivitäten und Orte in Kalabrien' source/frontend-react/src/lib/language.ts
          grep -q 'Tropea Historic Center' source/frontend-react/src/pages/OriginalHomePage.tsx
          grep -q 'cv-language-trigger' source/frontend-react/src/components/Layout.tsx
          grep -q 'data-cv-main-parity' source/frontend-react/worker.ts
          git -C source diff --check
      - name: Commit verified public parity
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No public parity changes needed.'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react
          git -C source commit -m 'fix: finish public visual and runtime parity'
          git -C source push origin HEAD:react-migration
