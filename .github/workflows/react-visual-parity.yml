name: React migration - visual parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-visual-parity.yml'
      - 'scripts/patch-react-visual-parity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-visual-parity
  cancel-in-progress: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private-repo access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply exact main visual parity layer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "d75418ec607b6e5328caf05ffda91b63e13d75e1"
          python3 automation/scripts/patch-react-visual-parity.py

      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Validate parity markers
        shell: bash
        run: |
          set -euo pipefail
          test -f source/frontend-react/src/generated/main-parity.css
          grep -q 'redesign-final.css' source/frontend-react/src/generated/main-parity.css
          grep -q 'home-reference.css' source/frontend-react/src/generated/main-parity.css
          grep -q 'catalog-activity-cover.css' source/frontend-react/src/generated/main-parity.css
          grep -q 'className="catalog-layout"' source/frontend-react/src/pages/CatalogPage.tsx
          grep -q 'className="result-list"' source/frontend-react/src/pages/CatalogPage.tsx
          grep -q 'className="map-layout"' source/frontend-react/src/pages/MapPage.tsx
          grep -q 'className="article-hero container"' source/frontend-react/src/pages/MagazinePage.tsx
          grep -q 'document.body.dataset.page = page' source/frontend-react/src/components/Layout.tsx
          git -C source diff --check

      - name: Commit verified visual parity
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo "No visual parity changes needed."
            exit 0
          fi
          git -C source config user.name "CalabriaVera Automation"
          git -C source config user.email "actions@users.noreply.github.com"
          git -C source add frontend-react
          git -C source commit -m "fix: align React public UI with main"
          git -C source push origin HEAD:react-migration
