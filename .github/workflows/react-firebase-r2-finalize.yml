name: React migration - finalize Firebase hosting and R2 bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-r2-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Patch Firebase static production and R2 CORS bridge
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          editor = Path('frontend-react/src/lib/business-editor.ts')
          text = editor.read_text(encoding='utf-8')
          if 'function r2UploadEndpoint()' not in text:
              anchor = 'async function uploadEditorImageToR2('
              helper = '''const R2_WORKER_ORIGIN = "https://calabriavera.sonotacamirko.workers.dev";\n\nfunction r2UploadEndpoint() {\n  if (typeof location === "undefined") return "/api/images/upload";\n  const host = location.hostname.toLowerCase();\n  const firebaseHosted = host === "calabriavera.com" || host === "www.calabriavera.com" || host === "calabriavera-e08d4.web.app" || host === "calabriavera-e08d4.firebaseapp.com";\n  return firebaseHosted ? `${R2_WORKER_ORIGIN}/api/images/upload` : "/api/images/upload";\n}\n\n'''
              if anchor not in text:
                  raise SystemExit('business editor upload anchor missing')
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace('fetch("/api/images/upload", {', 'fetch(r2UploadEndpoint(), {')
          editor.write_text(text, encoding='utf-8')

          worker = Path('frontend-react/worker.ts')
          text = worker.read_text(encoding='utf-8')
          if 'UPLOAD_ALLOWED_ORIGINS' not in text:
              anchor = 'const IMAGE_CDN_ORIGIN = "https://img.calabriavera.com";\n'
              helper = '''const IMAGE_CDN_ORIGIN = "https://img.calabriavera.com";\nconst UPLOAD_ALLOWED_ORIGINS = new Set([\n  "https://calabriavera.com",\n  "https://www.calabriavera.com",\n  "https://calabriavera-e08d4.web.app",\n  "https://calabriavera-e08d4.firebaseapp.com",\n]);\n\nfunction uploadCorsOrigin(request: Request) {\n  const origin = (request.headers.get("origin") || "").trim();\n  return UPLOAD_ALLOWED_ORIGINS.has(origin) ? origin : "";\n}\n\nfunction withUploadCors(response: Response, request: Request) {\n  const origin = uploadCorsOrigin(request);\n  if (!origin) return response;\n  const headers = new Headers(response.headers);\n  headers.set("Access-Control-Allow-Origin", origin);\n  headers.set("Vary", "Origin");\n  return new Response(response.body, { status: response.status, statusText: response.statusText, headers });\n}\n\nfunction uploadCorsPreflight(request: Request) {\n  const origin = uploadCorsOrigin(request);\n  if (!origin) return new Response(null, { status: 403 });\n  return new Response(null, {\n    status: 204,\n    headers: {\n      "Access-Control-Allow-Origin": origin,\n      "Access-Control-Allow-Methods": "POST, OPTIONS",\n      "Access-Control-Allow-Headers": "Authorization, Content-Type, X-User-Id, X-Business-Id",\n      "Access-Control-Max-Age": "600",\n      "Vary": "Origin",\n    },\n  });\n}\n'''
              if anchor not in text:
                  raise SystemExit('worker image CDN anchor missing')
              text = text.replace(anchor, helper, 1)
          old = '    if (request.method === "POST" && url.pathname === "/api/images/upload") return uploadBusinessImage(request, env);'
          new = '''    if (url.pathname === "/api/images/upload") {\n      if (request.method === "OPTIONS") return uploadCorsPreflight(request);\n      if (request.method === "POST") return withUploadCors(await uploadBusinessImage(request, env), request);\n      return withUploadCors(apiJson({ error: "METHOD_NOT_ALLOWED" }, 405), request);\n    }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'uploadCorsPreflight(request)' not in text:
              raise SystemExit('worker upload route anchor missing')
          worker.write_text(text, encoding='utf-8')

          prerender = Path('frontend-react/scripts/prerender-home.mjs')
          text = prerender.read_text(encoding='utf-8')
          text = text.replace('const magazine = blogRows.slice(0, 48);', 'const magazine = blogRows.slice(0, 500);')
          old_robots = '  html = html.replace(/<meta\\s+name=["\\\']robots["\\\']\\s+content=["\\\'][^"\\\']*["\\\']\\s*\\/?\\s*>/i, `<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />`);'
          new_robots = '  const robots = page.robots || "index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1";\n  html = html.replace(/<meta\\s+name=["\\\']robots["\\\']\\s+content=["\\\'][^"\\\']*["\\\']\\s*\\/?\\s*>/i, `<meta name="robots" content="${robots}" />`);'
          if old_robots in text:
              text = text.replace(old_robots, new_robots, 1)
          if 'Prerender produzione completo' in text and '404.html' not in text:
              marker = '  console.log(`Prerender produzione completo: ${renderedPages} pagine pubbliche.`);\n'
              addition = '''  const notFoundPage = { path: "/__cv-not-found__", lang: "it", title: "Pagina non trovata | CalabriaVera", description: "La pagina richiesta non esiste o è stata spostata.", kind: "not-found", robots: "noindex,nofollow" };\n  const notFoundMarkup = await render(notFoundPage.path, {});\n  const notFoundHtml = withRoot(template, notFoundMarkup, notFoundPage, "").replace(/ data-prerender-path=["'][^"']+["'] data-prerender-search=["'][^"']*["']/, "");\n  await writeFile(resolve(dist, "404.html"), notFoundHtml, "utf8");\n  console.log(`Prerender produzione completo: ${renderedPages} pagine pubbliche + 404.`);\n'''
              if marker not in text:
                  raise SystemExit('prerender completion anchor missing')
              text = text.replace(marker, addition, 1)
          prerender.write_text(text, encoding='utf-8')

          config_path = Path('frontend-react/firebase.react.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          hosting = config['hosting']
          redirects = hosting.get('redirects', [])
          def ensure_redirect(source, destination):
              if not any(x.get('source') == source for x in redirects):
                  redirects.append({'source': source, 'destination': destination, 'type': 301})
          for src, dst in [('/attivita.html','/attivita'),('/backup.html','/backup'),('/privacy','/privacy-policy'),('/magazine','/blog'),('/register','/registrazione'),('/cerca.html','/catalogo')]:
              ensure_redirect(src, dst)
          hosting['redirects'] = redirects

          shell = '/app-shell.html'
          rewrites = []
          base_patterns = [
              '/catalogo', '/catalogo/**', '/mappa', '/mappa/**', '/blog-articolo.html', '/blog/**',
              '/attivita', '/attivita/**', '/login', '/registrazione', '/profilo', '/preferiti', '/dashboard',
              '/messaggi', '/aggiungi-attivita', '/aggiungi-attivita/**', '/backup', '/admin', '/admin/**', '/pages/admin/**'
          ]
          for pattern in base_patterns:
              rewrites.append({'source': pattern, 'destination': shell})
          localized = [
              '/catalogo', '/catalogo/**', '/mappa', '/mappa/**', '/blog', '/blog/**', '/blog-articolo.html',
              '/attivita', '/attivita/**', '/login', '/registrazione', '/profilo', '/preferiti', '/dashboard',
              '/messaggi', '/aggiungi-attivita', '/aggiungi-attivita/**', '/chi-siamo', '/contatti', '/privacy',
              '/privacy-policy', '/cookie-policy', '/termini', '/note-legali', '/backup', '/admin', '/admin/**', '/pages/admin/**'
          ]
          for lang in ('en','fr','de','es'):
              for pattern in localized:
                  rewrites.append({'source': f'/{lang}{pattern}', 'destination': shell})
          hosting['rewrites'] = rewrites
          config_path.write_text(json.dumps(config, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          smoke = Path('frontend-react/scripts/smoke-firebase-static.mjs')
          smoke.write_text('''import { existsSync, readFileSync } from "node:fs";\nimport { resolve } from "node:path";\n\nconst base = process.env.FIREBASE_HOSTING_EMULATOR_URL || "http://127.0.0.1:5000";\nconst expected = process.env.EXPECTED_SHA || "";\nconst paths = ["/", "/catalogo", "/mappa", "/blog", "/privacy-policy", "/login", "/legacy-data/public-businesses-v1.json", "/legacy-data/public-blog-v1.json", "/build-version.txt"];\nfor (const path of paths) {\n  const response = await fetch(base + path, { redirect: "manual" });\n  if (response.status !== 200) throw new Error(`${path}: HTTP ${response.status}`);\n  const body = await response.text();\n  if (!body.trim()) throw new Error(`${path}: empty response`);\n  if (path === "/build-version.txt" && expected && body.trim() !== expected) throw new Error(`build version ${body.trim()} != ${expected}`);\n  if (path === "/catalogo" && !body.includes("53 attività trovate")) throw new Error("catalog prerender total missing");\n  if (path === "/mappa" && !body.includes("data-prerender-path")) throw new Error("map prerender missing");\n  if (path === "/login" && !body.includes("noindex,nofollow")) throw new Error("private shell robots missing");\n  if (path.endsWith("public-businesses-v1.json") || path.endsWith("public-blog-v1.json")) JSON.parse(body);\n}\nconst missing = await fetch(base + "/__definitely_missing_calabriavera__", { redirect: "manual" });\nif (missing.status !== 404) throw new Error(`unknown route should be 404, got ${missing.status}`);\nconst missingBody = await missing.text();\nif (!missingBody.includes("Pagina non trovata") || !missingBody.includes("noindex,nofollow")) throw new Error("React 404 body/robots missing");\n\nconst blog = JSON.parse(readFileSync(resolve("dist/legacy-data/public-blog-v1.json"), "utf8"));\nconst slugs = [...new Set((blog.items || []).map((item) => String(item.slug || item.id || "").trim()).filter(Boolean))];\nfor (const slug of slugs) {\n  const target = resolve("dist/blog", encodeURIComponent(slug), "index.html");\n  if (!existsSync(target)) throw new Error(`missing prerender blog detail: ${slug}`);\n}\nconsole.log(`FIREBASE_REACT_HOSTING_SMOKE_GREEN blog_details=${slugs.length}`);\n''', encoding='utf-8')
          PY

      - name: Build exact React revision
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          private_sha="$(git -C .. rev-parse HEAD)"
          npm ci
          GITHUB_SHA="$private_sha" npm run build
          test "$(cat dist/build-version.txt)" = "$private_sha"
          test -s dist/404.html
          grep -q 'turismo-isola-dino' dist/catalogo/index.html
          grep -q 'index,follow,max-image-preview:large' dist/catalogo/index.html
          grep -q 'noindex,nofollow' dist/app-shell.html

      - name: Firebase Hosting emulator smoke
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          private_sha="$(git -C .. rev-parse HEAD)"
          npx --yes firebase-tools@15.22.1 emulators:exec --project demo-calabriavera --only hosting --config firebase.react.json "FIREBASE_HOSTING_EMULATOR_URL=http://127.0.0.1:5000 EXPECTED_SHA=$private_sha node scripts/smoke-firebase-static.mjs"

      - name: Worker upload CORS smoke
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/cv-wrangler.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/build-version.txt >/dev/null 2>&1; then break; fi
            sleep 1
          done
          headers="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://calabriavera.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-user-id,x-business-id' \
            http://127.0.0.1:8787/api/images/upload)"
          test "$code" = 204
          grep -qi '^access-control-allow-origin: https://calabriavera.com' "$headers"
          code="$(curl -sS -o /tmp/upload-body -D "$headers" -w '%{http_code}' -X POST \
            -H 'Origin: https://calabriavera.com' \
            -H 'Content-Type: image/webp' \
            http://127.0.0.1:8787/api/images/upload)"
          test "$code" = 401
          grep -qi '^access-control-allow-origin: https://calabriavera.com' "$headers"
          grep -q 'AUTH_REQUIRED' /tmp/upload-body
          echo R2_CORS_BRIDGE_GREEN

      - name: Commit only after all gates pass
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git diff --check
          git status --short
          git fetch origin react-migration
          test "$(git rev-parse origin/react-migration)" = "$base_sha" || { echo '::error::react-migration advanced during validation'; exit 1; }
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/lib/business-editor.ts frontend-react/worker.ts frontend-react/scripts/prerender-home.mjs frontend-react/scripts/smoke-firebase-static.mjs frontend-react/firebase.react.json
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: make Firebase React production fully functional'
          git push origin HEAD:react-migration
