name: Auth - Verify branded email flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-domain-config.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: auth-branded-email-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_ID: calabriavera-e08d4
      TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbybzwBASQBXjcITav3u40hM12SSezzBdBL9UyIJI-ld1eGNQ8Uly96iOdO4E_bVIbVMGQ/exec

    steps:
      - name: Verifica gateway Auth Apps Script
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --location --retry 3 "${APPS_SCRIPT_URL}?check=auth-links")"
          test "$(printf '%s' "$result" | jq -r '.ok')" = "true"
          test "$(printf '%s' "$result" | jq -r '.oauthAuthorized')" = "true"
          echo "Gateway Auth Spark autorizzato: OK"

      - name: Invia reset QA tramite CalabriaVera
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TEST_EMAIL}" || { echo "::error::SMOKE_TEST_EMAIL mancante"; exit 1; }
          body="$(jq -n --arg email "${TEST_EMAIL}" '{action:"auth.passwordReset",email:$email,continueUrl:"https://calabriavera.com/login?reset=1"}')"
          curl --fail --silent --show-error --location             -H 'Content-Type: text/plain;charset=UTF-8'             --data-binary "$body" "${APPS_SCRIPT_URL}" > /tmp/auth-mail-result.json
          test "$(jq -r '.ok' /tmp/auth-mail-result.json)" = "true"
          echo "Richiesta email reset QA accettata dal gateway CalabriaVera."

      - id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Diagnostica stato account e consegne verifica
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          lookup="$(jq -n --arg email "${TEST_EMAIL}" '{email:[$email]}')"
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer ${ACCESS_TOKEN}"             -H "X-Goog-User-Project: ${PROJECT_ID}"             -H "Content-Type: application/json"             --data-binary "$lookup"             "https://identitytoolkit.googleapis.com/v1/projects/${PROJECT_ID}/accounts:lookup" > /tmp/account.json
          node <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync('/tmp/account.json','utf8'));
          const user=(data.users||[])[0]||{};
          console.log(JSON.stringify({
            accountFound:Boolean(user.localId),
            emailVerified:user.emailVerified===true,
            disabled:user.disabled===true,
            providers:(user.providerUserInfo||[]).map(x=>x.providerId)
          }));
          NODE

          query="$(jq -n --arg email "${TEST_EMAIL}" '{
            structuredQuery:{
              from:[{collectionId:"_mailDeliveries"}],
              where:{fieldFilter:{field:{fieldPath:"to"},op:"EQUAL",value:{stringValue:$email}}},
              limit:50
            }
          }')"
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer ${ACCESS_TOKEN}"             -H "X-Goog-User-Project: ${PROJECT_ID}"             -H "Content-Type: application/json"             --data-binary "$query"             "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents:runQuery" > /tmp/mail-diagnostic.json
          node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/mail-diagnostic.json','utf8'));
          const out=rows.map(r=>r.document?.fields).filter(Boolean).map(f=>({
            type:f.type?.stringValue||'',
            status:f.status?.stringValue||'',
            actionHost:f.actionHost?.stringValue||'',
            attempts:Number(f.attempts?.integerValue||0),
            sentAt:f.sentAt?.timestampValue||f.sentAt?.stringValue||'',
            updatedAt:f.updatedAt?.timestampValue||f.updatedAt?.stringValue||''
          })).filter(x=>x.type==='email.verification'||x.type==='password.reset');
          out.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
          console.log(JSON.stringify({authDeliveries:out.slice(0,10)}));
          NODE

      - name: Verifica host salvato senza leggere il link
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          query="$(jq -n --arg email "${TEST_EMAIL}" '{
            structuredQuery:{
              from:[{collectionId:"_mailDeliveries"}],
              where:{fieldFilter:{field:{fieldPath:"to"},op:"EQUAL",value:{stringValue:$email}}},
              limit:50
            }
          }')"
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer ${ACCESS_TOKEN}"             -H "X-Goog-User-Project: ${PROJECT_ID}"             -H "Content-Type: application/json"             --data-binary "$query"             "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents:runQuery" > /tmp/mail-query.json
          node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/mail-query.json','utf8'));
          const docs=rows.map(row=>row.document?.fields||{}).filter(Boolean);
          const ok=docs.some(fields =>
            fields.type?.stringValue==='password.reset' &&
            fields.status?.stringValue==='sent' &&
            fields.actionHost?.stringValue==='calabriavera.com'
          );
          if(!ok) throw new Error('Nessuna email password.reset inviata con actionHost calabriavera.com');
          console.log('Email Auth verificata: actionHost=calabriavera.com, stato=sent');
          NODE
