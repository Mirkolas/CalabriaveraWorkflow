name: React migration - parity fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-parity-fixes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private-repo access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore favorite behavior from main
        working-directory: source
        shell: bash
        env:
          PATCH_B64:  
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/cv-react-parity.py
          python3 /tmp/cv-react-parity.py

      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          git diff --check

      - name: Commit verified parity fixes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react/src/lib/businesses.ts frontend-react/src/lib/account.ts frontend-react/src/pages/OriginalHomePage.tsx frontend-react/src/pages/FavoritesPage.tsx
          if git diff --cached --quiet; then
            echo "No parity changes needed"
            exit 0
          fi
          git commit -m "fix: restore favorites parity in React migration"
          git push origin HEAD:react-migration
