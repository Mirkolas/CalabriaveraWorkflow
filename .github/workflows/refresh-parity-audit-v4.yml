name: Refresh parity audit v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-parity-audit-v4.yml'
      - 'scripts/patch-parity-audit-v4.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Apply blog data-race correction
        run: python3 scripts/patch-parity-audit-v4.py
      - name: Validate audit
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/react-parity-audit-v2.cjs
          grep -q "clean==='/blog'&&row.main.blogCards===0" scripts/react-parity-audit-v2.cjs
          grep -q 'mainDataRace' scripts/react-parity-audit-v2.cjs
          git diff --check
      - name: Commit audit v4
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/react-parity-audit-v2.cjs
          git commit -m 'ci: ignore only main blog loading race'
          git push origin HEAD:main
