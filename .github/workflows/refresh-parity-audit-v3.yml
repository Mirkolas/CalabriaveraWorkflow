name: Refresh parity audit v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-parity-audit-v3.yml'
      - 'scripts/patch-parity-audit-v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Apply deterministic gate corrections
        run: python3 scripts/patch-parity-audit-v3.py
      - name: Validate audit syntax and changes
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/react-parity-audit-v2.cjs
          grep -q 'gatecss=' scripts/react-parity-audit-v2.cjs
          grep -q "clean==='/mappa'?1800:500" scripts/react-parity-audit-v2.cjs
          grep -q 'catalogDataRace' scripts/react-parity-audit-v2.cjs
          git diff --check
      - name: Commit corrected gate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/react-parity-audit-v2.cjs
          git commit -m 'ci: make React parity gate data-ready and cache-safe'
          git push origin HEAD:main
