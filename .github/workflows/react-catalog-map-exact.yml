name: React migration - exact catalog map parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-catalog-map-exact.yml'
      - 'scripts/patch-react-catalog-map-exact.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-catalog-map-exact
  cancel-in-progress: true

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Assert expected migration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "ce65efff3fd46a0ae44dced4d7991a8154b1c559"

      - name: Apply exact Catalog and Map patch
        run: python3 automation/scripts/patch-react-catalog-map-exact.py

      - name: Build React migration
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Validate exact parity invariants
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -o '"'"'"id"'"'":' source/frontend-react/src/generated/tourism-data-core.ts | wc -l | tr -d ' ')"
          test "$count" = "52"
          grep -q 'turismo-isola-dino' source/frontend-react/src/generated/tourism-data-core.ts
          grep -q 'turismo-paola-san-francesco' source/frontend-react/src/generated/tourism-data-core.ts
          grep -q 'turismo-catanzaro-centro' source/frontend-react/src/generated/tourism-data-core.ts
          grep -q 'ui-final-overrides.css?v=20260905-activity-shell-v4' source/frontend-react/src/generated/main-route-css.ts
          grep -q 'header-unified.css?v=20260905-header-v2' source/frontend-react/src/generated/main-route-css.ts
          grep -q 'catalog-activity-cover.css?v=20260905-cover-v5' source/frontend-react/src/generated/main-route-css.ts
          grep -q 'cv-map-toolbar' source/frontend-react/src/pages/MapPage.tsx
          grep -q 'cv-map-cluster-shell' source/frontend-react/src/pages/MapPage.tsx
          grep -q 'cv-map-pin-shell' source/frontend-react/src/pages/MapPage.tsx
          grep -q 'id="map-panel"' source/frontend-react/src/pages/MapPage.tsx
          grep -q 'id="map-fit-results"' source/frontend-react/src/pages/MapPage.tsx
          grep -q 'id="map-results"' source/frontend-react/src/pages/MapPage.tsx
          grep -q 'L.control.scale' source/frontend-react/src/pages/MapPage.tsx
          grep -q '53' source/frontend-react/src/generated/tourism-data-core.ts || true
          git -C source diff --check

      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/pages/MapPage.tsx frontend-react/src/generated/tourism-data-core.ts frontend-react/src/generated/main-route-css.ts frontend-react/public/main-route-css.json frontend-react/public/assets/css
          git -C source commit -m 'fix: match main catalog and map data shell'
          git -C source push origin HEAD:react-migration
