name: React font cascade culprit v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-font-cascade-culprit-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_BASE: f16b18b93d91b4e1ac278351c6ef7507f3f7a04e
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build diagnostic React
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd source && python3 ../workflow/scripts/patch-react-built-cascade-parity.py)
          (cd source/frontend-react && npm ci && npm run build)
      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-font-culprit
          npm install --prefix /tmp/cv-font-culprit --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-font-culprit/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-font-culprit/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-font-culprit.log 2>&1 & echo $! >/tmp/cv-font-culprit.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4185/questa-pagina-non-esiste >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - name: Toggle each stylesheet and inspect inheritance chain
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-font-culprit/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1365,height:900},serviceWorkers:'block'});
          await ctx.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});
          const p=await ctx.newPage();await p.goto('http://127.0.0.1:4185/questa-pagina-non-esiste',{waitUntil:'domcontentloaded',timeout:30000});await p.locator('main h1').waitFor({state:'visible',timeout:15000});await p.waitForTimeout(500);
          const result=await p.evaluate(()=>{
            const h=document.querySelector('main h1');
            const font=e=>{const s=getComputedStyle(e);return {tag:e.tagName,id:e.id,cls:e.className||'',family:s.fontFamily,weight:s.fontWeight,font:s.font}};
            const chain=[];for(let e=h;e;e=e.parentElement)chain.push(font(e));
            const sheets=[...document.styleSheets].map((s,i)=>({i,href:s.href?new URL(s.href,location.href).pathname:'INLINE',disabled:s.disabled}));
            const toggles=[];
            const baseline=font(h);
            for(let i=0;i<document.styleSheets.length;i++){
              const sheet=document.styleSheets[i],before=sheet.disabled;
              try{sheet.disabled=true;const now=font(h);toggles.push({i,href:sheet.href?new URL(sheet.href,location.href).pathname:'INLINE',family:now.family,weight:now.weight,changed:now.family!==baseline.family||now.weight!==baseline.weight});}catch(e){toggles.push({i,error:String(e)})}finally{try{sheet.disabled=before}catch{}}
            }
            const special=[];
            function walk(rules,href,context=[]){for(const rule of [...(rules||[])]){if(rule instanceof CSSStyleRule){let match=false;try{match=h.matches(rule.selectorText)}catch{}if(!match)continue;const font=rule.style.getPropertyValue('font'),all=rule.style.getPropertyValue('all'),family=rule.style.getPropertyValue('font-family'),weight=rule.style.getPropertyValue('font-weight');if(font||all||family||weight)special.push({href,context,selector:rule.selectorText,font,all,family,weight,fontPriority:rule.style.getPropertyPriority('font'),allPriority:rule.style.getPropertyPriority('all'),familyPriority:rule.style.getPropertyPriority('font-family'),weightPriority:rule.style.getPropertyPriority('font-weight')});}else if('cssRules' in rule){let active=true;if(rule instanceof CSSMediaRule)active=matchMedia(rule.conditionText).matches;if(active)walk(rule.cssRules,href,[...context,rule.cssText.slice(0,120)]);}}}
            for(const sheet of [...document.styleSheets]){let rules;try{rules=sheet.cssRules}catch{continue}walk(rules,sheet.href?new URL(sheet.href,location.href).pathname:'INLINE',[])}
            return {baseline,chain,sheets,toggles,special};
          });
          console.log('FONT_CULPRIT '+JSON.stringify(result));
          await p.close();await ctx.close();await browser.close();
          NODE
      - name: Stop
        if: always()
        run: kill "$(cat /tmp/cv-font-culprit.pid 2>/dev/null)" 2>/dev/null || true
