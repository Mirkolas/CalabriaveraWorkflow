name: React final built CSS parity v3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-final-built-css-parity-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-gate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 5f145eee5a37c4d765a758f01b83e61e62c3ef0c
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 8
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Build exact backup and stage final bundles
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd legacy && npm ci && npm run build)
          mkdir -p source/frontend-react/public/assets/css
          for file in cv-bundle-1dae388af7394278.css cv-bundle-603cc2ff50d0e016.css cv-bundle-d6726897b303029e.css cv-bundle-89794cb4f569c254.css cv-bundle-5605509f9b6e4dee.css cv-bundle-05735d3b1a3300b8.css cv-bundle-b23bf9fdf406ca6d.css cv-bundle-28783d3e87e06008.css cv-bundle-fe11938d8fd5afe9.css; do
            test -s "legacy/dist/assets/css/$file"
            actual="$(sha256sum "legacy/dist/assets/css/$file" | cut -d' ' -f1)"
            prefix="${file#cv-bundle-}"; prefix="${prefix%.css}"
            case "$actual" in "$prefix"*) ;; *) echo "Bundle hash mismatch $file => $actual"; exit 1;; esac
            cp "legacy/dist/assets/css/$file" "source/frontend-react/public/assets/css/$file"
          done
          cd source
          python3 ../workflow/scripts/patch-react-final-built-css.py
          grep -Fq '<div id="site-header">' frontend-react/src/components/Layout.tsx
          grep -Fq 'data-cv-exact-built-bootstrap' frontend-react/index.html
          ! grep -Fq 'import "./styles.css"' frontend-react/src/main.tsx
          ! grep -Fq 'import "./shell-parity.css"' frontend-react/src/main.tsx
          ! grep -Fq 'import "./consent.css"' frontend-react/src/main.tsx
          git diff --check

      - name: Build patched React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('public/main-route-css.json','utf8'));
          const one=(r,b)=>{const a=m.routeCss[r];if(!Array.isArray(a)||a.length!==1||a[0]!==`/assets/css/${b}`)throw new Error(`${r}: ${JSON.stringify(a)}`)};
          one('/','cv-bundle-89794cb4f569c254.css'); one('/catalogo','cv-bundle-d6726897b303029e.css'); one('/mappa','cv-bundle-5605509f9b6e4dee.css'); one('/attivita/:detail','cv-bundle-603cc2ff50d0e016.css'); one('/messaggi','cv-bundle-05735d3b1a3300b8.css'); one('/admin','cv-bundle-28783d3e87e06008.css'); one('/admin/attivita','cv-bundle-b23bf9fdf406ca6d.css'); one('/admin/utenti','cv-bundle-fe11938d8fd5afe9.css'); one('/404','cv-bundle-1dae388af7394278.css');
          const html=fs.readFileSync('dist/index.html','utf8');
          if(/assets\/index-[^"']+\.css/.test(html)) throw new Error('Global React visual CSS still emitted');
          console.log('EXACT_FINAL_BUNDLE_MANIFEST_GREEN');
          NODE

      - name: Install Chromium and serve builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-final-v3
          npm install --prefix /tmp/cv-final-v3 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-final-v3/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-final-v3/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-final-v3-legacy.log 2>&1 & echo $! >/tmp/cv-final-v3-legacy.pid
          nohup /tmp/cv-final-v3/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-final-v3-react.log 2>&1 & echo $! >/tmp/cv-final-v3-react.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4184/index.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1

      - name: Gate exact settled visual parity and language menu
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-final-v3/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const routes=[['home','/index.html','/'],['catalog','/catalogo.html','/catalogo'],['map','/mappa.html','/mappa'],['blog','/blog.html','/blog'],['about','/chi-siamo.html','/chi-siamo'],['contacts','/contatti.html','/contatti'],['privacy','/privacy-policy.html','/privacy-policy'],['cookie','/cookie-policy.html','/cookie-policy'],['terms','/termini.html','/termini'],['legal','/note-legali.html','/note-legali'],['login','/login.html','/login'],['register','/registrazione.html','/registrazione'],['404','/404.html','/ci-not-found']];
          const settledH1=new Set(['about','contacts','privacy','cookie','terms','legal','login','register','404']);
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]], failures=[];
          const near=(a,b,t=.35)=>Math.abs(Number(a)-Number(b))<=t;
          async function open(origin,path,v,name){const c=await browser.newContext({viewport:v,serviceWorkers:'block'});await c.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});const p=await c.newPage(),errors=[],asset404=[];p.on('pageerror',e=>errors.push(String(e.message||e)));p.on('response',r=>{try{const u=new URL(r.url());if(r.status()===404&&u.hostname==='127.0.0.1'&&u.pathname.startsWith('/assets/'))asset404.push(u.pathname)}catch{}});await p.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});await p.locator('.site-header').waitFor({state:'visible',timeout:15000});if(settledH1.has(name))await p.locator('main h1').waitFor({state:'visible',timeout:15000});await p.waitForTimeout(100);return{c,p,errors,asset404}}
          async function snap(p,lang=false){if(lang){await p.locator('details.header-language>summary').click();await p.waitForTimeout(100)}return p.evaluate(()=>{const q=s=>document.querySelector(s),rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}:null},style=e=>e?getComputedStyle(e):null;const h=q('main h1'),hs=style(h),head=q('.site-header'),heads=style(head),sh=q('#site-header'),shs=style(sh),list=q('.cv-language-list'),lr=list?.getBoundingClientRect(),hit=lr?document.elementFromPoint(lr.left+lr.width/2,lr.top+lr.height/2):null;return{bundle:[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>new URL(x.href,location.href).pathname).find(x=>/\/cv-bundle-[a-f0-9]+\.css$/.test(x))||'',header:rect(head),inner:rect(q('.header-inner')),logo:rect(q('.brand-logo')),main:rect(q('#main-content')),siteHeader:rect(sh),siteHeaderStyle:shs?{position:shs.position,z:shs.zIndex,overflow:shs.overflow}:null,headerStyle:heads?{bg:heads.backgroundColor,color:heads.color,pos:heads.position}:null,h1:h?.textContent?.trim()||'',h1Rect:rect(h),h1Style:hs?{font:hs.fontFamily,size:hs.fontSize,weight:hs.fontWeight,line:hs.lineHeight,letter:hs.letterSpacing,color:hs.color}:null,langSummary:rect(q('details.header-language>summary')),langList:rect(list),langOpen:q('details.header-language')?.hasAttribute('open')||false,langHit:!!(hit&&list?.contains(hit)),actions:rect(q('.header-actions')),options:list?.querySelectorAll('.cv-language-option').length||0}})}
          for(const [mode,v] of modes)for(const [name,lp,rp] of routes){const L=await open('http://127.0.0.1:4184',lp,v,name),R=await open('http://127.0.0.1:4185',rp,v,name);const lang=name==='home',a=await snap(L.p,lang),b=await snap(R.p,lang),m=[];if(!a.bundle||a.bundle!==b.bundle)m.push(`bundle:${a.bundle}/${b.bundle}`);for(const key of ['header','inner','logo','siteHeader']){const x=a[key],y=b[key];if(!x||!y)m.push(`${key}:missing`);else for(const d of ['x','y','w','h'])if(!near(x[d],y[d]))m.push(`${key}.${d}:${x[d]}/${y[d]}`)}if(!a.main||!b.main||!near(a.main.y,b.main.y)||!near(a.main.w,b.main.w))m.push(`main:${JSON.stringify(a.main)}/${JSON.stringify(b.main)}`);if(JSON.stringify(a.headerStyle)!==JSON.stringify(b.headerStyle))m.push(`headerStyle:${JSON.stringify(a.headerStyle)}/${JSON.stringify(b.headerStyle)}`);if(JSON.stringify(a.siteHeaderStyle)!==JSON.stringify(b.siteHeaderStyle))m.push(`siteHeaderStyle:${JSON.stringify(a.siteHeaderStyle)}/${JSON.stringify(b.siteHeaderStyle)}`);if(settledH1.has(name)){if(a.h1!==b.h1)m.push(`h1:${a.h1}/${b.h1}`);if(JSON.stringify(a.h1Style)!==JSON.stringify(b.h1Style))m.push(`h1Style:${JSON.stringify(a.h1Style)}/${JSON.stringify(b.h1Style)}`);if(!a.h1Rect||!b.h1Rect||!near(a.h1Rect.w,b.h1Rect.w)||!near(a.h1Rect.h,b.h1Rect.h))m.push(`h1Rect:${JSON.stringify(a.h1Rect)}/${JSON.stringify(b.h1Rect)}`)}if(lang){for(const key of ['langSummary','langList']){const x=a[key],y=b[key];if(!x||!y)m.push(`${key}:missing`);else for(const d of ['x','y','w','h'])if(!near(x[d],y[d]))m.push(`${key}.${d}:${x[d]}/${y[d]}`)}if(!b.langOpen)m.push('lang-not-open');if(!b.langHit)m.push('lang-not-hit');if(b.options!==5)m.push(`lang-options:${b.options}`);if(mode==='mobile'&&b.actions?.right>390.35)m.push(`actions-overflow:${b.actions.right}`)}if(R.errors.length)m.push(`errors:${R.errors.join(';')}`);if(R.asset404.length)m.push(`asset404:${[...new Set(R.asset404)].join(',')}`);console.log(`${mode}/${name}: ${m.length?m.join(' | '):'OK'}`);if(m.length)failures.push({mode,name,m});await L.c.close();await R.c.close()}
          await browser.close();if(failures.length){console.error(JSON.stringify(failures,null,2));process.exit(1)}console.log('EXACT_FINAL_SETTLED_VISUAL_GREEN');
          NODE

      - name: Gate React functionality after final CSS replacement
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-final-v3/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);const b=await chromium.launch({headless:true}),fails=[];
          async function open(path,v={width:1365,height:900}){const c=await b.newContext({viewport:v,serviceWorkers:'block'});await c.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});const p=await c.newPage();await p.goto('http://127.0.0.1:4185'+path,{waitUntil:'domcontentloaded'});return{c,p}}
          {const {c,p}=await open('/',{width:390,height:844});await p.locator('#cv-home-search').waitFor();await p.locator('details.header-language>summary').click();await p.locator('[data-language-value="en"]').click();await p.waitForURL(/\/en\/?$/,{timeout:10000});await c.close()}
          {const {c,p}=await open('/catalogo');await p.locator('#result-count').waitFor();await p.waitForFunction(()=>document.querySelector('#result-count')?.textContent?.includes('53 attività trovate'),null,{timeout:15000});if(await p.locator('#results > *').count()!==18)fails.push('catalog');await c.close()}
          {const {c,p}=await open('/mappa');await p.waitForFunction(()=>document.body.innerText.includes('53 attività sulla mappa'),null,{timeout:20000});if(await p.locator('.leaflet-container').count()!==1)fails.push('map');await c.close()}
          {const {c,p}=await open('/blog');await p.locator('#blog-lane-tabs').waitFor({timeout:15000});if(await p.locator('#blog-list > *').count()<1)fails.push('blog');await c.close()}
          {const {c,p}=await open('/ci-not-found');await p.locator('main h1').waitFor();const texts=(await p.locator('main .form-actions a').allTextContents()).map(x=>x.trim());if(JSON.stringify(texts)!==JSON.stringify(['Torna alla home','Apri il catalogo']))fails.push('404-actions');if(await p.locator('meta[name="robots"]').getAttribute('content')!=='noindex,follow')fails.push('404-robots');await c.close()}
          await b.close();if(fails.length){console.error(fails.join('\n'));process.exit(1)}console.log('EXACT_FINAL_RUNTIME_GREEN');
          NODE

      - name: Commit only after all gates are green
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/main.tsx frontend-react/src/pages/MapPage.tsx frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/components/Layout.tsx frontend-react/src/App.tsx frontend-react/index.html frontend-react/scripts/prerender-home.mjs frontend-react/public/assets/css/cv-bundle-*.css
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: use exact final built legacy CSS per route'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-final-v3-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-final-v3-react.pid 2>/dev/null)" 2>/dev/null || true
