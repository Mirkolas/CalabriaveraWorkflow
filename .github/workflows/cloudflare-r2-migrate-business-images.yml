name: Cloudflare R2 - Migrate Business Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-r2-migrate-business-images.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Scrivi realmente su R2 e Firestore (false = dry-run)'
        required: true
        type: boolean
        default: false
      limit:
        description: 'Numero massimo di documenti immagine da elaborare in questa esecuzione'
        required: true
        type: string
        default: '100'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-r2-business-image-migration
  cancel-in-progress: false

env:
  R2_BUCKET: calabriavera-images
  FIREBASE_PROJECT_ID: calabriavera-e08d4
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
  REQUESTED_APPLY: ${{ github.event_name == 'push' && 'true' || inputs.apply }}
  REQUESTED_LIMIT: ${{ github.event_name == 'push' && '5000' || inputs.limit }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN mancante"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID mancante"; exit 1; }
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT repository privato mancante"; exit 1; }
          case "$REQUESTED_LIMIT" in
            ''|*[!0-9]*) echo "::error::limit deve essere un intero positivo"; exit 1 ;;
          esac
          test "$REQUESTED_LIMIT" -ge 1 || { echo "::error::limit deve essere >= 1"; exit 1; }
          test "$REQUESTED_LIMIT" -le 5000 || { echo "::error::limit deve essere <= 5000"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: true

      - name: Correggi conversione WebP legacy nel sorgente
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('source/tools/admin/migrate-business-images-r2.mjs')
          text = p.read_text()
          old = "const output = path.join(tempRoot, `${label}.webp`);"
          new = "const output = path.join(tempRoot, `${label}-converted.webp`);"
          if old not in text and new not in text:
              raise SystemExit('Pattern conversione WebP non trovato')
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
          git -C source diff --check
          git -C source config user.name 'CalabriaVera Public Workflow'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add tools/admin/migrate-business-images-r2.mjs
          if ! git -C source diff --cached --quiet; then
            git -C source commit -m 'fix: avoid in-place WebP conversion during R2 migration [skip ci]'
            git -C source push origin HEAD:main
          fi

      - name: Installa dipendenze amministrative
        run: npm --prefix source/tools ci --no-audit --no-fund

      - name: Verifica ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Migra immagini business legacy verso R2
        working-directory: source
        env:
          MIGRATE_APPLY: ${{ env.REQUESTED_APPLY }}
          MIGRATE_LIMIT: ${{ env.REQUESTED_LIMIT }}
          MIGRATE_PAGE_SIZE: '25'
          MIGRATE_SCAN_LIMIT: '10000'
        run: node tools/admin/migrate-business-images-r2.mjs

      - name: Riepilogo modalità
        if: always()
        shell: bash
        run: |
          if [ "$REQUESTED_APPLY" = "true" ]; then
            echo "Migrazione eseguita in modalità APPLY."
          else
            echo "Migrazione eseguita in DRY-RUN: nessuna scrittura su R2 o Firestore."
          fi
