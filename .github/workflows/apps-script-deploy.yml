name: Production - Apps Script Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-apps-script-deploy]

permissions:
  contents: read

concurrency:
  group: apps-script-production-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      TARGET_WORKFLOW: apps-script-deploy.yml
    steps:
      - name: Avvia Apps Script nella repo privata e attende l'esito
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::PAT per repository privato mancante"; exit 1; }
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$TARGET_WORKFLOW" --repo "$PRIVATE_REPO" --ref main
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh api "repos/$PRIVATE_REPO/actions/workflows/$TARGET_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=20" --jq ".workflow_runs[] | select(.created_at >= \"$started\") | .id" | head -n1)"
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id" || { echo "::error::Run privato non trovato dopo il dispatch"; exit 1; }
          echo "Run privato: $run_id"
          gh run watch "$run_id" --repo "$PRIVATE_REPO" --exit-status
