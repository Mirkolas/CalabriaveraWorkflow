name: Apps Script deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-apps-script-deploy]

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
      LEGACY_SITE_URL: ${{ secrets.LEGACY_SITE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

    steps:
      - name: Verifica configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO PRIVATE_REPO_PAT CLASPRC_JSON APPS_SCRIPT_ID APPS_SCRIPT_DEPLOYMENT_ID SITE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret richiesto non configurato: $name"
              exit 1
            fi
          done

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Applica URL ufficiale senza esporlo
        if: env.LEGACY_SITE_URL != ''
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          old = os.environ['LEGACY_SITE_URL']
          new = os.environ['SITE_URL']
          for p in Path('apps-script').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  text = p.read_text()
              except UnicodeDecodeError:
                  continue
              if old in text:
                  p.write_text(text.replace(old, new))
          PY

      - name: Configura credenziale clasp temporanea
        working-directory: source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'), os=require('node:os'), path=require('node:path');
          let c;
          try { c=JSON.parse(process.env.CLASPRC_JSON || ''); }
          catch { console.error('CLASPRC_JSON mancante o non valido.'); process.exit(1); }
          const modern=c.tokens?.default;
          const validModern=modern?.type==='authorized_user' && modern.refresh_token && modern.client_id && modern.client_secret;
          const validLegacy=c.token?.refresh_token && c.oauth2ClientSettings?.clientId && c.oauth2ClientSettings?.clientSecret;
          const validGlobal=c.refresh_token && c.access_token;
          if(!validModern && !validLegacy && !validGlobal){ console.error('Credenziale OAuth clasp incompleta.'); process.exit(1); }
          fs.writeFileSync(path.join(os.homedir(),'.clasprc.json'),JSON.stringify(c),{mode:0o600});
          fs.writeFileSync('apps-script/.clasp.json',JSON.stringify({scriptId:process.env.APPS_SCRIPT_ID,rootDir:'.'}));
          console.log('Credenziale clasp configurata senza mostrarne il contenuto.');
          NODE

      - name: Verifica accesso al progetto Apps Script
        working-directory: source/apps-script
        run: npx --yes @google/clasp@3.4.1 deployments > /tmp/clasp-check.log 2>&1

      - name: Aggiorna codice e deployment
        working-directory: source/apps-script
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @google/clasp@3.4.1 push --force > /tmp/clasp-push.log 2>&1
          npx --yes @google/clasp@3.4.1 deploy --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA}" > /tmp/clasp-deploy.log 2>&1

      - name: Verifica worker pubblicato
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tools ci --no-audit --no-fund
          set +e
          output="$(node tools/check-apps-script.mjs 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then exit 0; fi
          if printf '%s' "$output" | grep -Eqi 'FIRESTORE_429|ADMIN_FIRESTORE_429|RESOURCE_EXHAUSTED|Quota exceeded|(^|[^0-9])429([^0-9]|$)'; then
            echo "::warning::Verifica rinviata per quota temporanea."
            exit 0
          fi
          exit "$code"

      - name: Rimuovi credenziali temporanee
        if: always()
        working-directory: source
        run: rm -f "$HOME/.clasprc.json" apps-script/.clasp.json /tmp/clasp-check.log /tmp/clasp-push.log /tmp/clasp-deploy.log
