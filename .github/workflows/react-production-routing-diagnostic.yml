name: React migration - production routing diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-production-routing-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect DNS and HTTP routing
        shell: bash
        run: |
          set -euo pipefail
          echo '=== NS ==='
          dig +short NS calabriavera.com || true
          echo '=== apex A/AAAA/CNAME ==='
          dig +short A calabriavera.com || true
          dig +short AAAA calabriavera.com || true
          dig +short CNAME calabriavera.com || true
          echo '=== www ==='
          dig +short CNAME www.calabriavera.com || true
          dig +short A www.calabriavera.com || true
          echo '=== img ==='
          dig +short CNAME img.calabriavera.com || true
          dig +short A img.calabriavera.com || true
          echo '=== production headers ==='
          curl -sSIL --max-time 20 https://calabriavera.com/ | sed -n '1,35p'
          echo '=== production build-version ==='
          curl -sS --max-time 20 https://calabriavera.com/build-version.txt || true
          echo
          echo '=== staging headers ==='
          curl -sSIL --max-time 20 https://calabriavera.sonotacamirko.workers.dev/ | sed -n '1,35p'
          echo '=== staging build-version ==='
          curl -sS --max-time 20 https://calabriavera.sonotacamirko.workers.dev/build-version.txt || true
          echo
