name: React exact final admin parity v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-exact-admin-final-parity-v2.yml'
      - 'scripts/patch-react-exact-admin-final-v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-exact-admin-final-parity
  cancel-in-progress: false

jobs:
  patch-gate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      BASE_SHA: 0dfc13772604f64cd9712468f6aca7cdd7c8a944
      ORACLE_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.ORACLE_SHA }}
          path: oracle
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Assert exact private base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$BASE_SHA" || { echo "Unexpected private base: $actual"; exit 1; }

      - name: Prove legacy admin sources still equal authoritative backup
        shell: bash
        run: |
          set -euo pipefail
          files=(assets/js/admin.js assets/js/admin-console.js assets/js/admin-upgrade.js assets/js/admin-critical-upgrades.js assets/js/admin-runtime-fixes.js assets/js/admin-user-profile-ui.js assets/js/admin-conversation-delete-ui.js assets/js/admin-conversation-delete.js assets/js/admin-maintenance-toggle.js assets/js/admin-automation-status.js assets/js/auth.js assets/js/firebase-app.js assets/js/firebase-auth-init.js assets/js/firebase-init.js assets/js/firestore.js assets/js/utils.js assets/js/components.js scripts/build.mjs)
          for f in "${files[@]}"; do cmp "source/$f" "oracle/$f" || { echo "Legacy source drift: $f"; exit 1; }; done

      - name: Build authoritative legacy oracle
        working-directory: oracle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -s dist/assets/js/admin.js
          test -s dist/assets/js/admin-console.js
          test -s dist/assets/js/admin-upgrade.js

      - name: Run authoritative admin contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test oracle/tests/admin-critical-upgrades.test.mjs oracle/tests/admin-user-profile-ui.test.mjs oracle/tests/admin-conversation-delete-ui.test.mjs

      - name: Apply exact admin bridge patch
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-react-exact-admin-final-v1.py
          git -C source diff --check

      - name: Build React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Prove copied runtime is byte-identical to built backup
        shell: bash
        run: |
          set -euo pipefail
          files=(admin.js admin-console.js admin-upgrade.js admin-critical-upgrades.js admin-runtime-fixes.js admin-user-profile-ui.js admin-conversation-delete-ui.js admin-conversation-delete.js admin-maintenance-toggle.js admin-automation-status.js auth.js firebase-app.js firebase-auth-init.js firebase-init.js firestore.js utils.js components.js)
          for f in "${files[@]}"; do
            cmp "source/frontend-react/public/assets/js/$f" "oracle/dist/assets/js/$f" || { echo "Built runtime mismatch: $f"; exit 1; }
            cmp "source/frontend-react/dist/assets/js/$f" "oracle/dist/assets/js/$f" || { echo "Deployed runtime mismatch: $f"; exit 1; }
          done
          cmp source/frontend-react/public/firebase/firebase-config.js oracle/dist/firebase/firebase-config.js
          cmp source/frontend-react/dist/firebase/firebase-config.js oracle/dist/firebase/firebase-config.js

      - name: Validate final admin ownership and bridge order
        shell: bash
        run: |
          set -euo pipefail
          page=source/frontend-react/src/pages/AdminPage.tsx
          for needle in 'importLegacy("auth.js")' 'importLegacy("admin.js")' 'importLegacy("admin-runtime-fixes.js")' 'importLegacy("admin-maintenance-toggle.js")' 'importLegacy("admin-automation-status.js")' 'importLegacy("admin-critical-upgrades.js")' 'importLegacy("admin-conversation-delete-ui.js")' 'importLegacy("admin-user-profile-ui.js")' 'importLegacy("admin-console.js")' 'importLegacy("admin-upgrade.js")'; do grep -Fq "$needle" "$page"; done
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source/frontend-react/src/pages/AdminPage.tsx').read_text()
          order=['importLegacy("auth.js")','importLegacy("admin.js")','importLegacy("admin-runtime-fixes.js")','importLegacy("admin-console.js")','importLegacy("admin-upgrade.js")']
          pos=[s.index(x) for x in order]
          assert pos == sorted(pos), (order,pos)
          msg=s.index('if (kind === "messaggi")')
          assert s.index('importLegacy("admin-critical-upgrades.js")', msg) < s.index('importLegacy("admin-conversation-delete-ui.js")', msg)
          PY
          built=source/frontend-react/public/assets/js/admin.js
          grep -q 'Centro controllo' "$built"
          grep -q 'Attività & CRM' "$built"
          grep -q 'modernAdminScreens' "$built"
          grep -Fq 'const CUSTOM_SCREENS = new Set(["segnalazioni"]);' source/frontend-react/public/assets/js/admin-console.js
          grep -q 'Panoramica · Impostazioni · SEO · Sistema' source/frontend-react/public/assets/js/admin-upgrade.js
          grep -q 'Categorie & Comuni' source/frontend-react/public/assets/js/admin-upgrade.js
          grep -q 'Vetrina €15/mese' source/frontend-react/public/assets/js/admin-upgrade.js
          grep -q 'data-critical-cid' source/frontend-react/public/assets/js/admin-critical-upgrades.js
          grep -q 'Controllo qualità schede' source/frontend-react/public/assets/js/admin-critical-upgrades.js
          grep -q 'data-admin-site-profile' source/frontend-react/public/assets/js/admin-user-profile-ui.js
          grep -q 'Elimina definitivamente' source/frontend-react/public/assets/js/admin-conversation-delete-ui.js

      - name: Validate exact admin route CSS and catch-all page contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('source/frontend-react/public/main-route-css.json','utf8'));
          const generic='/assets/css/cv-bundle-28783d3e87e06008.css';
          const activity='/assets/css/cv-bundle-b23bf9fdf406ca6d.css';
          const users='/assets/css/cv-bundle-fe11938d8fd5afe9.css';
          for (const route of ['/admin/segnalazioni','/admin/comunicazioni','/admin/sistema']) {
            if (JSON.stringify(p.routeCss[route]) !== JSON.stringify([generic])) throw new Error(`${route} CSS ${JSON.stringify(p.routeCss[route])}`);
            if (p.routePages[route] !== 'admin-index') throw new Error(`${route} page ${p.routePages[route]}`);
          }
          for (const route of ['/admin/attivita','/admin/messaggi']) if (JSON.stringify(p.routeCss[route]) !== JSON.stringify([activity])) throw new Error(`${route} CSS mismatch`);
          if (JSON.stringify(p.routeCss['/admin/utenti']) !== JSON.stringify([users])) throw new Error('/admin/utenti CSS mismatch');
          for (const route of ['/admin','/admin/recensioni','/admin/blog','/admin/categorie','/admin/comuni','/admin/seo','/admin/impostazioni']) if (JSON.stringify(p.routeCss[route]) !== JSON.stringify([generic])) throw new Error(`${route} CSS mismatch`);
          console.log('Admin route manifest exact:', ['/admin/segnalazioni','/admin/comunicazioni','/admin/sistema'].map(r=>[r,p.routePages[r],p.routeCss[r]]));
          NODE
          grep -R -q '/assets/js/' source/frontend-react/dist/assets
          grep -R -q 'admin.js' source/frontend-react/dist/assets
          grep -R -q 'admin-upgrade.js' source/frontend-react/dist/assets
          grep -R -q 'Admin legacy bridge:' source/frontend-react/dist/assets
          git -C source diff --check

      - name: Commit and push only after every parity gate is green
        shell: bash
        run: |
          set -euo pipefail
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/src/pages/AdminPage.tsx frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/generated/main-route-css.ts frontend-react/public/main-route-css.json
          git -C source diff --cached --check
          if git -C source diff --cached --quiet; then echo 'No tracked changes to commit.'; exit 0; fi
          git -C source commit -m 'fix: match final legacy admin runtime'
          git -C source push origin HEAD:react-migration
