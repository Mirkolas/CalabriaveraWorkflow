name: React migration - runtime catalog map v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-runtime-catalog-map-v2.yml'
      - 'scripts/patch-react-runtime-catalog-map-v2.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-runtime-catalog-map-v2
  cancel-in-progress: true

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Assert expected migration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "08055dbb79648261b3b767cf10a2ec7c87114c33"

      - name: Apply runtime Catalog and Map patch
        run: python3 automation/scripts/patch-react-runtime-catalog-map-v2.py

      - name: Build React migration
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Validate runtime bundle and source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          generated = Path('source/frontend-react/src/generated/tourism-data-core.ts').read_text(encoding='utf-8')
          ids = re.findall(r'"id"\s*:\s*"([^"]+)"', generated)
          assert len(ids) == 52, len(ids)
          assert len(set(ids)) == 52
          assert 'turismo-isola-dino' in ids
          assert 'turismo-catanzaro-centro' in ids
          catalog = Path('source/frontend-react/src/pages/CatalogPage.tsx').read_text(encoding='utf-8')
          map_page = Path('source/frontend-react/src/pages/MapPage.tsx').read_text(encoding='utf-8')
          for token in ['data-react-catalog-revision="20260912-catalog-map-v2"','id="result-count"','id="results"','id="category"','id="province"','id="city"']:
              assert token in catalog, token
          for token in ['data-react-map-revision="20260912-catalog-map-v2"','[mapReady, filtered','id="verified" hidden','id="map-results" hidden','globalThis as unknown as { L?: typeof import("leaflet") }']:
              assert token in map_page, token
          PY
          grep -R -q '20260912-catalog-map-v2' source/frontend-react/dist/assets
          grep -R -q 'turismo-isola-dino' source/frontend-react/dist/assets
          git -C source diff --check

      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/src/pages/CatalogPage.tsx frontend-react/src/pages/MapPage.tsx
          if git -C source diff --cached --quiet; then
            echo 'No staged changes'
            exit 0
          fi
          git -C source commit -m 'fix: render current catalog data and map markers'
          git -C source push origin HEAD:react-migration
