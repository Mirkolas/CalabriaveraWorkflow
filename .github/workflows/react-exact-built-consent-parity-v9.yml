name: React exact built backup parity - consent v9

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-exact-built-consent-parity-v9.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 8
      - uses: actions/setup-node@v7
        with: {node-version: '24'}

      - name: Build exact backup and candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          (cd legacy && npm ci && npm run build)
          cd source
          python3 ../workflow/scripts/patch-react-exact-consent.py
          python3 ../workflow/scripts/refine-react-exact-consent-v7.py
          cp ../legacy/assets/css/privacy-consent.css frontend-react/src/consent.css
          cd frontend-react
          npm ci
          npm run build
          grep -q 'letter-spacing:-0.672px!important' dist/assets/css/privacy-consent.css
          grep -q 'letter-spacing:-0.7098px!important' dist/assets/css/privacy-consent.css

      - name: Install browser and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-consent-v9
          npm install --prefix /tmp/cv-consent-v9 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-consent-v9/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-consent-v9/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-v9-l.log 2>&1 & echo $! >/tmp/cv-v9-l.pid
          nohup /tmp/cv-consent-v9/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-v9-r.log 2>&1 & echo $! >/tmp/cv-v9-r.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4184/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1

      - name: Gate exact desktop and mobile consent
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-consent-v9/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const failures=[];
          const near=(a,b,t=1)=>Math.abs(Number(a)-Number(b))<=t;
          async function open(origin,viewport){
            const ctx=await browser.newContext({viewport,serviceWorkers:'block'});
            await ctx.addInitScript(()=>{localStorage.clear();sessionStorage.clear()});
            const p=await ctx.newPage();
            await p.goto(origin+'/',{waitUntil:'domcontentloaded'});
            await p.locator('[data-cv-consent-banner]').waitFor({state:'visible'});
            await p.waitForTimeout(150);
            return {ctx,p};
          }
          async function snap(p){return p.evaluate(()=>{
            const banner=document.querySelector('[data-cv-consent-banner]');
            const h=banner.querySelector('h2'), hs=getComputedStyle(h), br=banner.getBoundingClientRect();
            const buttons=[...banner.querySelectorAll('.cv-consent-actions .button')].map(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return{height:r.height,family:s.fontFamily,size:s.fontSize,weight:s.fontWeight,line:s.lineHeight,letter:s.letterSpacing,padding:s.padding,minWidth:s.minWidth,maxWidth:s.maxWidth}});
            return {
              d:{x:br.x,y:br.y,w:br.width,h:br.height},
              h2:{family:hs.fontFamily,size:hs.fontSize,weight:hs.fontWeight,line:hs.lineHeight,letter:hs.letterSpacing,height:h.getBoundingClientRect().height},
              buttons,
              footer:document.querySelector('.cv-consent-footer-line')?.textContent?.replace(/\s+/g,'').trim(),
              footerChildren:document.querySelector('footer.footer .footer-grid')?.children.length||0,
              title:h.textContent,
              copy:banner.querySelector('.cv-consent-copy>p')?.textContent
            };
          })}
          for(const [mode,viewport] of [['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]]){
            const L=await open('http://127.0.0.1:4184',viewport),R=await open('http://127.0.0.1:4185',viewport);
            const a=await snap(L.p),b=await snap(R.p),m=[];
            if(a.title!==b.title||a.copy!==b.copy||a.footer!==b.footer||a.footerChildren!==b.footerChildren)m.push('content/footer');
            if(!near(a.d.x,b.d.x,2)||!near(a.d.y,b.d.y,.1)||!near(a.d.w,b.d.w,2)||!near(a.d.h,b.d.h,.1))m.push(`banner:${JSON.stringify(a.d)}/${JSON.stringify(b.d)}`);
            for(const key of ['family','size','weight','line','letter']) if(a.h2[key]!==b.h2[key]) m.push(`h2-${key}:${a.h2[key]}/${b.h2[key]}`);
            if(!near(a.h2.height,b.h2.height,.1))m.push(`h2-height:${a.h2.height}/${b.h2.height}`);
            if(JSON.stringify(a.buttons)!==JSON.stringify(b.buttons))m.push(`buttons:${JSON.stringify(a.buttons)}/${JSON.stringify(b.buttons)}`);
            for(const p of [L.p,R.p]){await p.locator('[data-cv-consent-customize]').click();await p.locator('[data-cv-consent-modal]').waitFor({state:'visible'})}
            const modal=async p=>p.evaluate(()=>{const e=document.querySelector('[data-cv-consent-modal] .cv-consent-dialog'),r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,title:e.querySelector('h2')?.textContent,categories:e.querySelectorAll('.cv-consent-category').length,buttons:[...e.querySelectorAll('.cv-consent-actions button')].map(x=>x.textContent?.trim())}});
            const am=await modal(L.p),bm=await modal(R.p);
            if(am.title!==bm.title||am.categories!==bm.categories||JSON.stringify(am.buttons)!==JSON.stringify(bm.buttons)||!near(am.x,bm.x,2)||!near(am.y,bm.y,2)||!near(am.w,bm.w,2)||!near(am.h,bm.h,3))m.push(`modal:${JSON.stringify(am)}/${JSON.stringify(bm)}`);
            await L.p.keyboard.press('Escape');await R.p.keyboard.press('Escape');await L.p.waitForTimeout(50);await R.p.waitForTimeout(50);
            if(await L.p.locator('[data-cv-consent-modal]').count()||await R.p.locator('[data-cv-consent-modal]').count())m.push('escape');
            for(const p of [L.p,R.p]){await p.locator('[data-cv-consent-continue]').click();await p.waitForTimeout(50)}
            for(const [side,p] of [['legacy',L.p],['react',R.p]]){const state=await p.evaluate(()=>JSON.parse(localStorage.getItem('cv-cookie-consent-v3')||'null'));if(state?.version!==3||state?.scope!=='technical-only'||state?.necessary!==true||state?.preferences!==false||state?.analytics!==false||state?.marketing!==false)m.push(`${side}-record`)}
            console.log(`${mode}: ${m.length?m.join(' | '):'OK'}`);if(m.length)failures.push({mode,m,a,b});
            await L.p.close();await R.p.close();await L.ctx.close();await R.ctx.close();
          }
          await browser.close();
          if(failures.length){console.error(JSON.stringify(failures,null,2));process.exit(1)}
          console.log('EXACT_BUILT_CONSENT_V9_GREEN');
          NODE

      - name: Commit exact consent parity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/components/Layout.tsx frontend-react/src/components/CookieConsent.tsx frontend-react/src/consent.css
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: match consent UI to exact built pre-React backup'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        run: |
          kill "$(cat /tmp/cv-v9-l.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-v9-r.pid 2>/dev/null)" 2>/dev/null || true
