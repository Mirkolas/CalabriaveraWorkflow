name: Validate Private R2 Avatars

on:
  pull_request:
    paths:
      - '.github/workflows/validate-private-r2-avatars.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Scarica branch privato avatar R2
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: migration/r2-avatars-hardening
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Verifica sintassi JS migrazione e profilo legacy
        working-directory: source
        run: |
          node --check assets/js/profile-avatar-r2.js
          node --check assets/js/profile-v2.js
          node --check assets/js/activity-data-core.js
          node --check tools/admin/migrate-business-images-r2.mjs

      - name: Valida sintassi regole Firestore
        working-directory: source
        run: npx --yes firebase-tools@15.22.1 emulators:exec --project demo-calabriavera --only firestore "echo firestore-rules-ok"

      - name: Installa dipendenze React
        working-directory: source/frontend-react
        run: npm ci --no-audit --no-fund

      - name: Verifica architettura definitiva
        working-directory: source/frontend-react
        run: npm run architecture:check

      - name: Build React completa
        working-directory: source/frontend-react
        run: npm run build
