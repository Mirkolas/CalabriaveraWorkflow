name: React exact built consent diagnostic v4
on:
  push:
    paths:
      - '.github/workflows/react-exact-built-consent-diagnostic-v4.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build both outputs with proposed consent patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          (cd legacy && npm ci && npm run build)
          cd source
          python3 ../workflow/scripts/patch-react-exact-consent.py
          cp ../legacy/assets/css/privacy-consent.css frontend-react/src/consent.css
          cd frontend-react
          npm ci
          npm run build
      - name: Install browser and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-consent-d4
          npm install --prefix /tmp/cv-consent-d4 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-consent-d4/node_modules/.bin/playwright install --with-deps chromium
          nohup /tmp/cv-consent-d4/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-d4-legacy.log 2>&1 & echo $! >/tmp/cv-d4-legacy.pid
          nohup /tmp/cv-consent-d4/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-d4-react.log 2>&1 & echo $! >/tmp/cv-d4-react.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4184/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - name: Print exact mobile geometry and computed styles
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-consent-d4/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'block'});
          await ctx.addInitScript(()=>{localStorage.clear();sessionStorage.clear()});
          async function collect(origin){
            const p=await ctx.newPage();
            await p.goto(origin+'/',{waitUntil:'domcontentloaded'});
            await p.locator('[data-cv-consent-banner]').waitFor({state:'visible'});
            await p.waitForTimeout(250);
            const out=await p.evaluate(()=>{
              const sels=['[data-cv-consent-banner]','.cv-consent-copy','.cv-consent-kicker','[data-cv-consent-banner] h2','.cv-consent-copy>p:not(.cv-consent-links)','.cv-consent-links','.cv-consent-actions','.cv-consent-actions .button'];
              const one=(el)=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return{tag:el.tagName,cls:el.className,text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,80),rect:{x:r.x,y:r.y,w:r.width,h:r.height},display:s.display,gap:s.gap,margin:s.margin,padding:s.padding,fontSize:s.fontSize,lineHeight:s.lineHeight,minHeight:s.minHeight,boxSizing:s.boxSizing,width:s.width,maxWidth:s.maxWidth}};
              const rows={};
              for(const sel of sels) rows[sel]=[...document.querySelectorAll(sel)].map(one);
              return rows;
            });
            await p.close();return out;
          }
          const legacy=await collect('http://127.0.0.1:4184');
          const react=await collect('http://127.0.0.1:4185');
          console.log('LEGACY='+JSON.stringify(legacy,null,2));
          console.log('REACT='+JSON.stringify(react,null,2));
          await ctx.close();await browser.close();
          NODE
      - name: Stop servers
        if: always()
        run: |
          kill "$(cat /tmp/cv-d4-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-d4-react.pid 2>/dev/null)" 2>/dev/null || true
