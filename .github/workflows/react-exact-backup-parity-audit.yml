name: React exact backup parity audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-exact-backup-parity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-exact-backup-parity-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - name: Verify access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout exact backup
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: react
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact refs and build React
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          echo "LEGACY=$LEGACY_SHA"
          echo "REACT=$(git -C react rev-parse HEAD)"
          cd react/frontend-react
          npm ci
          npm run build

      - name: Install audit browser tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-parity-audit
          npm install --prefix /tmp/cv-parity-audit --no-package-lock --no-save playwright@1.62.1 serve@14.2.4 pixelmatch@7.1.0 pngjs@7.0.0
          /tmp/cv-parity-audit/node_modules/.bin/playwright install --with-deps chromium

      - name: Start exact backup and React
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-parity-audit/node_modules/.bin/serve legacy -l 4180 >/tmp/cv-legacy.log 2>&1 & echo $! >/tmp/cv-legacy.pid
          nohup /tmp/cv-parity-audit/node_modules/.bin/serve -s react/frontend-react/dist -l 4181 >/tmp/cv-react.log 2>&1 & echo $! >/tmp/cv-react.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4180/index.html >/dev/null && curl -fsS http://127.0.0.1:4181/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cv-legacy.log || true
          cat /tmp/cv-react.log || true
          exit 1

      - name: Capture desktop and mobile parity report
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-parity-audit/node_modules/playwright
          PIXELMATCH_MODULE: /tmp/cv-parity-audit/node_modules/pixelmatch
          PNGJS_MODULE: /tmp/cv-parity-audit/node_modules/pngjs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity-output
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import fs from 'node:fs';
          import path from 'node:path';
          const require=createRequire(import.meta.url);
          const { chromium }=require(process.env.PLAYWRIGHT_MODULE);
          const pixelmatch=require(process.env.PIXELMATCH_MODULE).default || require(process.env.PIXELMATCH_MODULE);
          const { PNG }=require(process.env.PNGJS_MODULE);

          const routes=[
            ['home','/index.html','/'],
            ['catalogo','/catalogo.html','/catalogo'],
            ['mappa','/mappa.html','/mappa'],
            ['blog','/blog.html','/blog'],
            ['turismo','/attivita.html?turismo=centro-storico-di-tropea','/attivita?turismo=centro-storico-di-tropea'],
            ['login','/login.html','/login'],
            ['registrazione','/registrazione.html','/registrazione'],
            ['chi-siamo','/chi-siamo.html','/chi-siamo'],
            ['contatti','/contatti.html','/contatti'],
            ['privacy','/privacy-policy.html','/privacy-policy'],
            ['cookie','/cookie-policy.html','/cookie-policy'],
            ['termini','/termini.html','/termini'],
            ['note-legali','/note-legali.html','/note-legali'],
          ];
          const viewports={desktop:{width:1365,height:900},mobile:{width:390,height:844}};
          const browser=await chromium.launch({headless:true});
          const report=[];
          const normalize=(s)=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
          const tokens=(s)=>new Set(normalize(s).split(' ').filter(Boolean));
          const similarity=(a,b)=>{const A=tokens(a),B=tokens(b); if(!A.size&&!B.size)return 1; let i=0; for(const x of A)if(B.has(x))i++; return (2*i)/(A.size+B.size)};
          const consent={version:3,scope:'technical-only',savedAt:new Date().toISOString(),expiresAt:new Date(Date.now()+30*864e5).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'audit'};
          try{
            for(const [mode,viewport] of Object.entries(viewports)){
              const context=await browser.newContext({viewport,serviceWorkers:'block'});
              await context.addInitScript((value)=>{ try{localStorage.setItem('cv-cookie-consent-v3',JSON.stringify(value));localStorage.setItem('cv-consent','rejected');}catch{} },consent);
              for(const [name,legacyPath,reactPath] of routes){
                const pair={name,mode,legacyPath,reactPath};
                const shots={};
                const data={};
                for(const [side,base,p] of [['legacy','http://127.0.0.1:4180',legacyPath],['react','http://127.0.0.1:4181',reactPath]]){
                  const page=await context.newPage();
                  const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
                  await page.goto(base+p,{waitUntil:'domcontentloaded',timeout:30000});
                  await page.waitForTimeout(name==='mappa'?3500:name==='catalogo'||name==='blog'?2500:1200);
                  await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}'}).catch(()=>{});
                  const body=await page.locator('body').innerText().catch(()=> '');
                  const h1=await page.locator('h1').first().innerText().catch(()=> '');
                  const header=await page.locator('header').first().evaluate(el=>{const s=getComputedStyle(el);const r=el.getBoundingClientRect();return {bg:s.backgroundColor,color:s.color,height:Math.round(r.height)}}).catch(()=>null);
                  const main=await page.locator('#main-content').evaluate(el=>{const r=el.getBoundingClientRect();return {top:Math.round(r.top),height:Math.round(r.height),width:Math.round(r.width)}}).catch(()=>null);
                  const footer=await page.locator('footer').first().count();
                  const forms=await page.locator('form').count();
                  const buttons=await page.locator('button').count();
                  const links=await page.locator('a').count();
                  const url=page.url();
                  const file=`parity-output/${mode}-${name}-${side}.png`;
                  await page.screenshot({path:file,fullPage:true});
                  shots[side]=file; data[side]={body,h1,header,main,footer,forms,buttons,links,url,errors};
                  await page.close();
                }
                let visualDiff=null;
                try{
                  const a=PNG.sync.read(fs.readFileSync(shots.legacy)),b=PNG.sync.read(fs.readFileSync(shots.react));
                  const width=Math.min(a.width,b.width),height=Math.min(a.height,b.height);
                  const crop=(img)=>{const out=new PNG({width,height});PNG.bitblt(img,out,0,0,width,height,0,0);return out};
                  const aa=crop(a),bb=crop(b),diff=new PNG({width,height});
                  const mismatch=pixelmatch(aa.data,bb.data,diff.data,width,height,{threshold:0.12,includeAA:false});
                  visualDiff=mismatch/(width*height); fs.writeFileSync(`parity-output/${mode}-${name}-diff.png`,PNG.sync.write(diff));
                }catch(e){visualDiff=null;}
                report.push({...pair,textSimilarity:similarity(data.legacy.body,data.react.body),visualDiff,legacy:{...data.legacy,body:undefined},react:{...data.react,body:undefined}});
              }
              await context.close();
            }
          }finally{await browser.close();}
          fs.writeFileSync('parity-output/report.json',JSON.stringify(report,null,2));
          for(const r of report) console.log(`${r.mode.padEnd(7)} ${r.name.padEnd(14)} text=${r.textSimilarity.toFixed(3)} visual=${r.visualDiff==null?'n/a':r.visualDiff.toFixed(3)} h1=${JSON.stringify(r.legacy.h1)} -> ${JSON.stringify(r.react.h1)} header=${JSON.stringify(r.legacy.header)} -> ${JSON.stringify(r.react.header)}`);
          const routeErrors=report.filter(r=>r.react.errors?.length);
          if(routeErrors.length) console.log('REACT_PAGE_ERRORS',JSON.stringify(routeErrors.map(r=>[r.mode,r.name,r.react.errors])));
          NODE

      - name: Upload exact parity audit
        uses: actions/upload-artifact@v4
        with:
          name: react-exact-backup-parity-audit
          path: parity-output
          retention-days: 7

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-react.pid 2>/dev/null)" 2>/dev/null || true
