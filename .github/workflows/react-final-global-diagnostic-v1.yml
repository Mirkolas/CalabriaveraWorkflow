name: React final global parity diagnostic v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-global-diagnostic-v1.yml'

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SHA: fa0dfd603432da18580a2d5e67af77bda88f9f10
  ORACLE_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: react-final-global-diagnostic
      cancel-in-progress: true
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout oracle pre-React
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.ORACLE_SHA }}
          path: oracle
          persist-credentials: false
          fetch-depth: 1

      - name: Blocca SHA inatteso
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "React SHA: $actual"
          test "$actual" = "$EXPECTED_PRIVATE_SHA" || { echo "::error::react-migration inatteso: $actual"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installa dipendenze progetto
        shell: bash
        run: |
          set -euo pipefail
          (cd source && npm ci --no-audit --no-fund)
          (cd oracle && npm ci --no-audit --no-fund)
          (cd source/frontend-react && npm ci --no-audit --no-fund)

      - name: Regressione UI SEO runtime e admin pertinente a React
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm run test:syntax
          node --test tests/ui-regression.test.mjs
          node --test tests/privacy-consent.test.mjs
          node --test tests/admin-control.test.mjs
          node --test tests/admin-conversation-delete-ui.test.mjs
          node --test tests/admin-user-profile-ui.test.mjs
          node --test tests/admin-critical-upgrades.test.mjs
          node --test tests/render-ownership.test.mjs
          node --test tests/site-stability.test.mjs
          node --test tests/runtime-cache.test.mjs
          node --test --test-name-pattern='^(?!le pagine SEO attività mantengono un solo owner di routing$).*' tests/activity-url-favorites.test.mjs
          node --test tests/seo-and-public.test.mjs
          node --test tests/end-to-end-fixes.test.mjs
          node --test tests/responsive-i18n-complete.test.mjs
          node --test tests/seo-snapshot.test.mjs

      - name: Costruisci oracle
        working-directory: oracle
        run: npm run build

      - name: Costruisci React offline
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: npm run build

      - name: Gate route CSS runtime e shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('source/frontend-react')
          oracle = Path('oracle/dist')
          route_map = json.loads((root / 'public/main-route-css.json').read_text())
          css = route_map['routeCss']
          pages = route_map['routePages']

          expected_top = {
            '/404','/','/catalogo','/mappa','/blog','/blog/:detail','/attivita/:detail',
            '/login','/registrazione','/profilo','/preferiti','/dashboard','/messaggi',
            '/aggiungi-attivita','/chi-siamo','/contatti','/privacy-policy','/cookie-policy',
            '/termini','/note-legali','/backup','/admin','/admin/attivita','/admin/recensioni',
            '/admin/segnalazioni','/admin/blog','/admin/categorie','/admin/comuni','/admin/utenti',
            '/admin/messaggi','/admin/comunicazioni','/admin/seo','/admin/sistema','/admin/impostazioni'
          }
          missing = expected_top - set(css)
          extra_admin_backup = '/admin/backup' in css or '/admin/backup' in pages
          assert not missing, f'Route CSS mancanti: {sorted(missing)}'
          assert not extra_admin_backup, 'Route /admin/backup non presente nell oracle finale'

          unique_bundles = sorted({item for values in css.values() for item in values})
          assert len(unique_bundles) == 9, unique_bundles
          for url in unique_bundles:
            name = Path(url).name
            expected = oracle / 'assets/css' / name
            public = root / 'public/assets/css' / name
            built = root / 'dist/assets/css' / name
            assert expected.is_file(), f'Bundle oracle mancante: {name}'
            assert public.read_bytes() == expected.read_bytes(), f'CSS public diverso: {name}'
            assert built.read_bytes() == expected.read_bytes(), f'CSS dist diverso: {name}'
          print(f'CSS route: {len(css)} route, {len(unique_bundles)} bundle byte-per-byte OK')

          oracle_js = oracle / 'assets/js'
          public_js = root / 'public/assets/js'
          dist_js = root / 'dist/assets/js'
          oracle_files = sorted(p.relative_to(oracle_js) for p in oracle_js.rglob('*') if p.is_file())
          for rel in oracle_files:
            data = (oracle_js / rel).read_bytes()
            assert (public_js / rel).read_bytes() == data, f'Runtime public diverso: {rel}'
            assert (dist_js / rel).read_bytes() == data, f'Runtime dist diverso: {rel}'
          assert sorted(p.relative_to(public_js) for p in public_js.rglob('*') if p.is_file()) == oracle_files
          assert sorted(p.relative_to(dist_js) for p in dist_js.rglob('*') if p.is_file()) == oracle_files
          print(f'Runtime legacy: {len(oracle_files)} file byte-per-byte OK')

          app = (root / 'src/App.tsx').read_text()
          layout = (root / 'src/components/Layout.tsx').read_text()
          assert '<div id="site-footer">' in layout
          assert 'id="toast-root"' in layout and 'aria-live="polite"' in layout
          assert 'path === "/backup"' in app
          assert 'ADMIN_ROUTES.has(path)' in app and 'path.startsWith("/admin/")' not in app
          print('Shell e route applicative: OK')
          PY

      - name: Verifica semantica pagina backup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          legacy = Path('oracle/assets/js/backup-admin.js').read_text()
          react = Path('source/frontend-react/src/pages/BackupPage.tsx').read_text()
          legacy_text = re.findall(r'<(?:h2|p)[^>]*>(.*?)</(?:h2|p)>', legacy)
          for fragment in ('Backup cifrati','Ripristino protetto','Controlla o avvia backup','Apri la guida'):
            assert fragment in legacy and fragment in react, fragment
          assert 'id="backup-root"' in react
          # Report-only: the final repair pass will make security/link attributes exact too.
          legacy_rel = sorted(set(re.findall(r'rel=\\?"([^"\\]+)', legacy)))
          react_rel = sorted(set(re.findall(r'rel=\\?"([^"\\]+)', react)))
          print('Backup rel legacy:', legacy_rel)
          print('Backup rel React :', react_rel)
          if legacy_rel != react_rel:
            print('::warning::Backup link rel differisce dall oracle; da correggere nel repair pass')
          PY

      - name: Installa Chromium e strumenti visuali
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-visual
          npm install --prefix /tmp/cv-visual --no-package-lock --no-save playwright@1.62.1 pixelmatch@7.1.0 pngjs@7.0.0
          /tmp/cv-visual/node_modules/.bin/playwright install --with-deps chromium

      - name: Confronto visuale primo paint desktop e mobile
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cv-visual/compare.mjs <<'NODE'
          import { createServer } from 'node:http';
          import { readFile, stat, mkdir, writeFile } from 'node:fs/promises';
          import { extname, join, normalize } from 'node:path';
          import { chromium } from 'playwright';
          import pixelmatch from 'pixelmatch';
          import { PNG } from 'pngjs';

          const [oracleRoot, reactRoot] = process.argv.slice(2);
          const out = '/tmp/cv-visual/out';
          await mkdir(out, { recursive: true });
          const mime = {'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.svg':'image/svg+xml','.ico':'image/x-icon','.woff2':'font/woff2'};

          function safe(root, rel) {
            const cleaned = normalize(rel).replace(/^(\.\.(\/|\\|$))+/, '').replace(/^[/\\]+/, '');
            return join(root, cleaned);
          }
          async function exists(path) { try { return (await stat(path)).isFile(); } catch { return false; } }

          function serve(root, mode, port) {
            const server = createServer(async (req, res) => {
              try {
                const url = new URL(req.url || '/', `http://127.0.0.1:${port}`);
                let pathname = decodeURIComponent(url.pathname);
                let candidates = [];
                if (mode === 'oracle') {
                  if (pathname === '/') candidates.push('index.html');
                  else {
                    const rel = pathname.replace(/^\//, '');
                    candidates.push(rel);
                    if (!extname(rel)) candidates.push(`${rel}.html`);
                  }
                } else {
                  if (pathname === '/') candidates.push('index.html');
                  else {
                    const rel = pathname.replace(/^\//, '');
                    candidates.push(rel, `${rel}/index.html`);
                  }
                  candidates.push('index.html');
                }
                let file = null;
                for (const rel of candidates) {
                  const candidate = safe(root, rel);
                  if (await exists(candidate)) { file = candidate; break; }
                }
                if (!file) { res.writeHead(404); res.end('not found'); return; }
                const body = await readFile(file);
                res.writeHead(200, {'content-type': mime[extname(file).toLowerCase()] || 'application/octet-stream', 'cache-control':'no-store'});
                res.end(body);
              } catch (error) { res.writeHead(500); res.end(String(error)); }
            });
            return new Promise(resolve => server.listen(port, '127.0.0.1', () => resolve(server)));
          }

          const oracleServer = await serve(oracleRoot, 'oracle', 4173);
          const reactServer = await serve(reactRoot, 'react', 4174);
          const browser = await chromium.launch({ headless: true });
          const routes = ['/', '/catalogo', '/mappa', '/blog', '/chi-siamo', '/contatti', '/privacy-policy', '/cookie-policy', '/termini', '/note-legali', '/login', '/registrazione', '/backup'];
          const viewports = [{name:'desktop', width:1365, height:900}, {name:'mobile', width:390, height:844}];
          const results = [];
          const failures = [];

          async function shot(port, route, viewport, tag) {
            const context = await browser.newContext({ viewport: {width:viewport.width,height:viewport.height}, locale:'it-IT', serviceWorkers:'block' });
            await context.addInitScript(() => { try { localStorage.setItem('cv-consent','rejected'); } catch {} });
            const page = await context.newPage();
            await page.route('**/*', async r => {
              const u = new URL(r.request().url());
              if (u.hostname === '127.0.0.1' || u.protocol === 'data:' || u.protocol === 'blob:') return r.continue();
              return r.abort();
            });
            await page.goto(`http://127.0.0.1:${port}${route}`, { waitUntil:'domcontentloaded', timeout:30000 });
            await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}html{scroll-behavior:auto!important}'}).catch(()=>{});
            await page.evaluate(() => document.fonts?.ready).catch(()=>{});
            await page.waitForTimeout(1200);
            await page.evaluate(() => scrollTo(0,0)).catch(()=>{});
            const name = route === '/' ? 'home' : route.slice(1).replaceAll('/','-');
            const path = `${out}/${name}-${viewport.name}-${tag}.png`;
            await page.screenshot({path, fullPage:false, animations:'disabled'});
            await context.close();
            return path;
          }

          try {
            for (const viewport of viewports) {
              for (const route of routes) {
                const aPath = await shot(4173, route, viewport, 'legacy');
                const bPath = await shot(4174, route, viewport, 'react');
                const a = PNG.sync.read(await readFile(aPath));
                const b = PNG.sync.read(await readFile(bPath));
                if (a.width !== b.width || a.height !== b.height) throw new Error(`dimension mismatch ${route} ${viewport.name}`);
                const diff = new PNG({width:a.width,height:a.height});
                const changed = pixelmatch(a.data,b.data,diff.data,a.width,a.height,{threshold:0.1,includeAA:false});
                const ratio = changed/(a.width*a.height);
                const name = route === '/' ? 'home' : route.slice(1).replaceAll('/','-');
                await writeFile(`${out}/${name}-${viewport.name}-diff.png`, PNG.sync.write(diff));
                results.push({route, viewport:viewport.name, changed, ratio});
                console.log(`VISUAL ${viewport.name.padEnd(7)} ${route.padEnd(18)} ${(ratio*100).toFixed(3)}% (${changed} px)`);
                if (ratio > 0.010) failures.push(`${viewport.name} ${route}: ${(ratio*100).toFixed(3)}%`);
              }
            }
            await writeFile(`${out}/results.json`, JSON.stringify(results,null,2));
            if (failures.length) {
              console.error('::error::Visual parity >1%: '+failures.join(' | '));
              process.exitCode = 1;
            } else {
              console.log('Visual parity: tutte le route <= 1% pixel diff');
            }
          } finally {
            await browser.close();
            oracleServer.close(); reactServer.close();
          }
          NODE
          cd /tmp/cv-visual
          node compare.mjs "$GITHUB_WORKSPACE/oracle/dist" "$GITHUB_WORKSPACE/source/frontend-react/dist"

      - name: Pubblica diagnostica visuale
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-final-global-visual-diagnostic
          path: /tmp/cv-visual/out
          if-no-files-found: ignore
          retention-days: 3
