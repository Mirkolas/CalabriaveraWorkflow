name: React migration - tourism prerender parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-prerender-tourism.yml'
      - 'scripts/patch-react-prerender-tourism.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Assert exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "56cba199495617a7679dd665ce369dcf2b7c0d48"
      - name: Patch canonical tourism prerender
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-react-prerender-tourism.py
      - name: Build client SSR and prerender
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build | tee /tmp/react-build.log
          ! grep -q 'Tourism prerender fallback' /tmp/react-build.log
      - name: Validate prerendered tourism snapshot
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source/frontend-react/src/generated/tourism-data-core.js
          test ! -e source/frontend-react/src/generated/tourism-data-core.d.ts
          ! grep -q 'tourism-data-core.js' source/frontend-react/scripts/prerender-home.mjs
          grep -q 'tourismo-isola-dino' source/frontend-react/dist/catalogo/index.html && exit 7 || true
          grep -q 'turismo-isola-dino' source/frontend-react/dist/catalogo/index.html
          grep -q 'turismo-catanzaro-centro' source/frontend-react/dist/catalogo/index.html
          grep -q 'id="cv-react-businesses"' source/frontend-react/dist/catalogo/index.html
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          html=Path('source/frontend-react/dist/catalogo/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="application/json" id="cv-react-businesses">(.*?)</script>',html,re.S)
          assert m, 'catalog snapshot missing'
          data=json.loads(m.group(1))
          ids=[str(x.get('id','')) for x in data.get('items',[])]
          tourism=[x for x in ids if x.startswith('turismo-')]
          assert len(tourism)==52, len(tourism)
          assert len(set(tourism))==52
          print('PRERENDER_TOURISM_52_GREEN')
          PY
          git -C source diff --check
      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/scripts/prerender-home.mjs
          git -C source diff --cached --quiet && exit 0
          git -C source commit -m 'fix: prerender canonical tourism dataset'
          git -C source push origin HEAD:react-migration
