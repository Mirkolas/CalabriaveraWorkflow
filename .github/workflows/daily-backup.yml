name: Firebase - Backup completo cifrato

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Carica configurazione originale senza pubblicarla
        working-directory: source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('.github/workflows/firebase-deploy.yml','utf8');
          const project=text.match(/FIREBASE_PROJECT_ID:\s*([^\s]+)/)?.[1];
          const site=text.match(/SITE_URL:\s*(https:\/\/[^\s]+)/)?.[1];
          if(!project || !site) throw new Error('Configurazione deploy originale non trovata');
          console.log(`::add-mask::${project}`);
          console.log(`::add-mask::${site}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_PROJECT_ID=${project}\nSITE_URL=${site}\n`);
          NODE

      - name: Installa, valida, compila e testa
        working-directory: source
        run: npm ci && npm --prefix tools ci --no-audit --no-fund && npm run validate && npm run build && npm run test:backup

      - name: Autentica Google Cloud con WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_BACKUP_SERVICE_ACCOUNT }}

      - name: Allinea dist alla release Hosting
        working-directory: source
        run: npm run generate-sitemap:database

      - name: Backup, verifica remota e rotazione
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
        run: node tools/backup/run.mjs
