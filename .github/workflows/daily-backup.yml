name: Firebase - Backup cifrato incrementale

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-backup.yml'
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modalità backup'
        required: true
        default: incremental
        type: choice
        options: [incremental, full-emergency, baseline-v1]
      confirm:
        description: 'Per baseline-v1 scrivere: ACTIVATE BASELINE V1'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: firebase-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica motore backup incrementale
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/tools/package-lock.json

      - name: Installa dipendenze backup
        working-directory: source
        run: npm ci && npm --prefix tools ci --no-audit --no-fund

      - name: Preflight senza Firebase
        id: preflight
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          REQUESTED_MODE: ${{ github.event_name == 'push' && 'baseline-v1' || github.event_name == 'schedule' && 'incremental' || inputs.mode }}
          BASELINE_CONFIRM: ${{ github.event_name == 'push' && 'ACTIVATE BASELINE V1' || inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-incremental}"
          case "$mode" in
            incremental)
              node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { downloadBackup, latestVerifiedBackup } from "./tools/backup/releases.mjs"; const repository=process.env.PRIVATE_REPO || "Mirkolas/calabriavera"; const latest=await latestVerifiedBackup(repository); let ready=false; if (!latest) { console.log("Nessun backup verificato: safe-skip, zero letture Firestore."); } else { const { archive }=await downloadBackup(repository, latest.tag_name, process.env.CALABRIAVERA_BACKUP_ENCRYPTION_KEY); ready=Number(archive.metadata.incrementalSchemaVersion || 0)===1; console.log(`Ultimo backup ${latest.tag_name}: schema ${archive.metadata.incrementalSchemaVersion || 0}; ready=${ready}`); } appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\nmode=incremental\n`);'
              ;;
            full-emergency)
              echo 'Backup completo di emergenza: non abilita la baseline incrementale.'
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo 'mode=full-emergency' >> "$GITHUB_OUTPUT"
              ;;
            baseline-v1)
              test "$BASELINE_CONFIRM" = 'ACTIVATE BASELINE V1' || { echo '::error::Conferma baseline non corretta.'; exit 1; }
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo 'mode=baseline-v1' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Modalità sconosciuta: $mode"; exit 1 ;;
          esac

      - name: Safe-skip senza letture Firestore
        if: steps.preflight.outputs.ready != 'true'
        run: echo 'Incrementale non ancora attivato. Nessuna lettura Firestore eseguita.'

      - name: Test backup locale
        if: steps.preflight.outputs.ready == 'true'
        working-directory: source
        run: npm run test:backup

      - uses: google-github-actions/auth@v3
        if: steps.preflight.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_BACKUP_SERVICE_ACCOUNT }}

      - name: Build locale per verifica Hosting
        if: steps.preflight.outputs.ready == 'true'
        working-directory: source
        run: npm run build

      - name: Allinea dist alla release Hosting pubblicata
        if: steps.preflight.outputs.ready == 'true'
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
        run: node tools/backup/prepare-hosting-dist.mjs

      - name: Compatibilità backup con alias Firebase reindirizzato
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          cat > /tmp/cv-backup-fetch-compat.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const nativeFetch = globalThis.fetch;
          const responseWithOriginalUrl = (response, original) => new Proxy(response, {
            get(targetResponse, prop) {
              if (prop === 'url') return original.href;
              const value = Reflect.get(targetResponse, prop, targetResponse);
              return typeof value === 'function' ? value.bind(targetResponse) : value;
            }
          });
          globalThis.fetch = async function cvBackupFetch(input, init) {
            const raw = typeof input === 'string' || input instanceof URL ? String(input) : String(input?.url || '');
            let original;
            try { original = new URL(raw); } catch { return nativeFetch(input, init); }
            if (original.hostname === 'calabriavera-e08d4.web.app') {
              const generated = original.pathname === '/__/firebase/init.js' || original.pathname === '/__/firebase/init.json';
              if (generated) {
                const target = new URL(original.pathname + original.search, 'https://calabriavera.com');
                return responseWithOriginalUrl(await nativeFetch(target, init), original);
              }
              if (original.pathname === '/index.html') {
                const bytes = readFileSync(resolve(process.cwd(), 'legacy-host/index.html'));
                return responseWithOriginalUrl(new Response(bytes, { status: 200, headers: { 'content-type': 'text/html; charset=utf-8' } }), original);
              }
            }
            return nativeFetch(input, init);
          };
          EOF

      - name: Backup cifrato, verifica remota e rotazione
        if: steps.preflight.outputs.ready == 'true'
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
          BACKUP_MODE: ${{ steps.preflight.outputs.mode }}
          NODE_OPTIONS: --import=/tmp/cv-backup-fetch-compat.mjs
        shell: bash
        run: |
          set -euo pipefail
          case "$BACKUP_MODE" in
            incremental) node tools/backup/run.mjs --incremental ;;
            full-emergency) node tools/backup/run.mjs ;;
            baseline-v1) node tools/backup/run.mjs --baseline-v1 ;;
            *) echo "::error::Modalità inattesa $BACKUP_MODE"; exit 1 ;;
          esac
