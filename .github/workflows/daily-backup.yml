name: Encrypted backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNNER_ENABLED: ${{ secrets.RUNNER_ENABLED }}
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_BACKUP_SERVICE_ACCOUNT }}
      FIREBASE_WIF_PROVIDER: ${{ secrets.FIREBASE_WIF_PROVIDER }}
      FIREBASE_WIF_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_BACKUP_WIF_SERVICE_ACCOUNT }}

    steps:
      - name: Abilitazione runner
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$RUNNER_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Runner schedulato non ancora abilitato."
          fi

      - name: Verifica configurazione protetta
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO PRIVATE_REPO_PAT FIREBASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret richiesto non configurato: $name"
              exit 1
            fi
          done
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ] && { [ -z "${FIREBASE_WIF_PROVIDER:-}" ] || [ -z "${FIREBASE_WIF_SERVICE_ACCOUNT:-}" ]; }; then
            echo "::error::Configura FIREBASE_BACKUP_SERVICE_ACCOUNT oppure WIF per il backup."
            exit 1
          fi

      - name: Scarica sorgente privato
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installa, compila e testa
        if: steps.gate.outputs.enabled == 'true'
        working-directory: source
        run: npm ci && npm --prefix tools ci --no-audit --no-fund && npm run build && npm run test:backup

      - name: Autentica Google Cloud con JSON
        if: steps.gate.outputs.enabled == 'true' && env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_BACKUP_SERVICE_ACCOUNT }}

      - name: Autentica Google Cloud con Workload Identity Federation
        if: steps.gate.outputs.enabled == 'true' && env.FIREBASE_SERVICE_ACCOUNT_JSON == ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_BACKUP_WIF_SERVICE_ACCOUNT }}

      - name: Esegui backup
        if: steps.gate.outputs.enabled == 'true'
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
        run: node tools/backup/run.mjs
