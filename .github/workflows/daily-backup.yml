name: Firebase - Backup cifrato incrementale

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      hosting_diagnostics_only:
        description: 'Legge soltanto i metadati Hosting, senza Firestore/Auth o backup'
        type: boolean
        default: false
      mode:
        description: 'Modalità backup'
        required: true
        default: incremental
        type: choice
        options: [incremental, full-emergency, baseline-v1]
      confirm:
        description: 'Per baseline-v1 scrivere: ACTIVATE BASELINE V1'
        required: false
        type: string
      checkpoint_run_id:
        description: 'Run backup precedente da cui riprendere il checkpoint cifrato (facoltativo)'
        required: false
        type: string
      checkpoint_source_commit:
        description: 'SHA privato completo del checkpoint, per ripresa dopo una correzione del motore'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: firebase-production-backup
  cancel-in-progress: false

jobs:
  hosting-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.hosting_diagnostics_only == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_BACKUP_SERVICE_ACCOUNT }}
      - name: Leggi solo metadati dei file generati Hosting
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          CV_BACKUP_DIAGNOSE_ARCHIVE: 'true'
        run: node tools/backup/diagnose-hosting.mjs

  backup:
    if: vars.BACKUPS_ENABLED == 'true' && github.ref == 'refs/heads/main' && inputs.hosting_diagnostics_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica motore backup incrementale
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Recupera checkpoint cifrato da un eventuale rerun
        if: inputs.checkpoint_run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: backup-checkpoint
          path: source/backup-output

      - name: Valida richiesta di ripresa da un altro run
        if: inputs.checkpoint_run_id != ''
        env:
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          CHECKPOINT_SOURCE_COMMIT: ${{ inputs.checkpoint_source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHECKPOINT_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Run checkpoint non valido'; exit 1; }
          [[ "$CHECKPOINT_SOURCE_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]] || { echo '::error::SHA checkpoint completo richiesto'; exit 1; }

      - name: Recupera il solo checkpoint cifrato richiesto
        if: inputs.checkpoint_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backup-checkpoint
          path: source/backup-output
          run-id: ${{ inputs.checkpoint_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/tools/package-lock.json

      - name: Installa dipendenze backup
        working-directory: source
        run: npm ci --no-audit --no-fund && npm --prefix tools ci --no-audit --no-fund

      - name: Preflight senza Firebase
        id: preflight
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'incremental' || inputs.mode }}
          BASELINE_CONFIRM: ${{ inputs.confirm }}
          CV_BACKUP_RESUME_SOURCE_COMMIT: ${{ inputs.checkpoint_source_commit }}
          CV_BACKUP_REQUIRE_CHECKPOINT: ${{ inputs.checkpoint_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-incremental}"
          case "$mode" in
            incremental)
              node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { execFileSync } from "node:child_process"; import { readCheckpoint, validateCheckpoint } from "./tools/backup/checkpoint.mjs"; import { downloadBackup, latestVerifiedBackup } from "./tools/backup/releases.mjs"; const repository=process.env.PRIVATE_REPO || "Mirkolas/calabriavera"; let ready=false; const checkpoint=readCheckpoint("backup-output/resume.cvcheckpoint",process.env.CALABRIAVERA_BACKUP_ENCRYPTION_KEY); if(checkpoint){const validation=validateCheckpoint(checkpoint,{project:"calabriavera-e08d4",repository,sourceCommit:execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),mode:"incremental",incrementalSchemaVersion:1,resumeSourceCommit:process.env.CV_BACKUP_RESUME_SOURCE_COMMIT}); ready=validation.valid && checkpoint.completedPhases.includes("firestore"); if(!ready && process.env.CV_BACKUP_REQUIRE_CHECKPOINT==="true") throw Error(`Checkpoint richiesto rifiutato: ${validation.reason}`); } else if(process.env.CV_BACKUP_REQUIRE_CHECKPOINT==="true") throw Error("Checkpoint richiesto assente"); if(!ready){const latest=await latestVerifiedBackup(repository); if(!latest){console.log("Nessun backup verificato: safe-skip, zero letture Firestore.");}else{const {archive}=await downloadBackup(repository,latest.tag_name,process.env.CALABRIAVERA_BACKUP_ENCRYPTION_KEY); ready=Number(archive.metadata.incrementalSchemaVersion || 0)===1; console.log(`Ultimo backup ${latest.tag_name}: schema ${archive.metadata.incrementalSchemaVersion || 0}; ready=${ready}`);}} else console.log("Checkpoint cifrato valido: nessuna nuova acquisizione Firestore."); appendFileSync(process.env.GITHUB_OUTPUT,`ready=${ready}\nmode=incremental\n`);'
              ;;
            full-emergency)
              echo 'Backup completo di emergenza: non abilita la baseline incrementale.'
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo 'mode=full-emergency' >> "$GITHUB_OUTPUT"
              ;;
            baseline-v1)
              test "$BASELINE_CONFIRM" = 'ACTIVATE BASELINE V1' || { echo '::error::Conferma baseline non corretta.'; exit 1; }
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo 'mode=baseline-v1' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Modalità sconosciuta: $mode"; exit 1 ;;
          esac

      - name: Safe-skip senza letture Firestore
        if: steps.preflight.outputs.ready != 'true'
        run: echo 'Incrementale non ancora attivato. Nessuna lettura Firestore eseguita.'

      - name: Test backup locale
        if: steps.preflight.outputs.ready == 'true'
        working-directory: source
        run: npm run test:backup

      - name: Trova i byte della più recente release Hosting conservata
        if: steps.preflight.outputs.ready == 'true'
        id: hosting_artifact
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'firebase-deploy.yml', branch: 'main', per_page: 20
            });
            for (const run of runs.data.workflow_runs) {
              if (run.event === 'pull_request') continue;
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id });
              if (data.artifacts.some(a => a.name === 'firebase-hosting-release' && !a.expired)) {
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.warning('Artifact Hosting non disponibile: restano obbligatori gli hash della release e i fallback verificati.');

      - name: Recupera i byte pubblici esatti senza consumare Firebase Hosting
        if: steps.preflight.outputs.ready == 'true' && steps.hosting_artifact.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firebase-hosting-release
          path: source/frontend-react/dist
          run-id: ${{ steps.hosting_artifact.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.preflight.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_BACKUP_SERVICE_ACCOUNT }}

      - name: Build locale per verifica Hosting
        if: steps.preflight.outputs.ready == 'true'
        working-directory: source
        run: npm run build

      - name: Allinea dist alla release Hosting pubblicata con retry
        if: steps.preflight.outputs.ready == 'true'
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
        shell: bash
        run: |
          set -uo pipefail
          delays=(0 30 120 300)
          for i in 1 2 3 4; do
            wait_s="${delays[$((i-1))]}"
            if [ "$wait_s" -gt 0 ]; then
              echo "Retry preparazione Hosting $i/4 tra ${wait_s}s..."
              sleep "$wait_s"
            fi
            echo "Preparazione Hosting tentativo $i/4"
            set +e
            output="$(node tools/backup/prepare-hosting-dist.mjs 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! printf '%s' "$output" | grep -Eq 'HTTP 429|RESOURCE_EXHAUSTED|HTTP 5[0-9][0-9]|ETIMEDOUT|ECONNRESET|fetch failed'; then
              echo "::error::Preparazione Hosting fallita con errore non transitorio; nessun retry aggiuntivo."
              exit "$status"
            fi
            echo "::warning::Errore transitorio durante preparazione Hosting; verrà ritentato senza avviare ancora il motore backup."
          done
          echo "::error::Preparazione Hosting fallita dopo 4 tentativi."
          exit 1

      - name: Backup cifrato, checkpoint e retry immediati
        id: run_backup
        if: steps.preflight.outputs.ready == 'true'
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
          BACKUP_MODE: ${{ steps.preflight.outputs.mode }}
          CV_BACKUP_CHECKPOINT_PATH: backup-output/resume.cvcheckpoint
          CV_BACKUP_RETRY_DELAYS_MS: 30000,120000,300000
          CV_BACKUP_RESUME_SOURCE_COMMIT: ${{ inputs.checkpoint_source_commit }}
          CV_BACKUP_REQUIRE_CHECKPOINT: ${{ inputs.checkpoint_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BACKUP_MODE" in
            incremental) node tools/backup/run.mjs --incremental ;;
            full-emergency) node tools/backup/run.mjs ;;
            baseline-v1) node tools/backup/run.mjs --baseline-v1 ;;
            *) echo "::error::Modalità inattesa $BACKUP_MODE"; exit 1 ;;
          esac

      - name: Conserva checkpoint cifrato se tutti i retry falliscono
        if: failure() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-checkpoint
          path: source/backup-output/resume.cvcheckpoint
          if-no-files-found: ignore
          retention-days: 2
          overwrite: true

      - name: Evidenzia backup incompleto senza pubblicare dati sensibili
        if: failure()
        shell: bash
        run: |
          echo '::error::Backup non completato: il checkpoint non sostituisce una copia completa verificata. Controllare il run e riprendere entro 48 ore senza rileggere Firestore.'
          echo 'Backup incompleto. Nessuna copia precedente deve essere considerata sostituita da questo run.' >> "$GITHUB_STEP_SUMMARY"
