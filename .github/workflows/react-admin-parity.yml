name: React migration - admin parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-admin-parity.yml'
      - 'scripts/patch-react-admin-parity.py'
      - 'scripts/fix-react-admin-generated.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Assert exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "d1fdb3abe15e75890958adb113f29a43ebd41713"
      - name: Apply Admin parity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-react-admin-parity.py
          python3 automation/scripts/fix-react-admin-generated.py
      - name: Build React client SSR and prerender
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate Admin parity invariants
        shell: bash
        run: |
          set -euo pipefail
          f=source/frontend-react/src/pages/AdminPage.tsx
          grep -q 'id="admin-root"' "$f"
          grep -q 'id="admin-content"' "$f"
          grep -q 'className="admin-layout"' "$f"
          grep -q 'card stack' "$f"
          grep -q 'Fonti automatiche' "$f"
          grep -q 'magazineSources' "$f"
          grep -q 'id="magazine-source-form"' "$f"
          grep -q 'id="post-form"' "$f"
          grep -q 'listConversationsAdmin' "$f"
          grep -q 'deleteConversationAdmin' "$f"
          grep -q 'Elimina definitivamente' "$f"
          grep -q 'id="settings-form"' "$f"
          grep -q 'auditEvent("admin_conversation_deleted"' source/frontend-react/src/lib/admin.ts
          test -s source/frontend-react/src/pages/BackupPage.tsx
          grep -q 'id="backup-root"' source/frontend-react/src/pages/BackupPage.tsx
          grep -q 'calabriavera/actions/workflows/daily-backup.yml' source/frontend-react/src/pages/BackupPage.tsx
          grep -q 'if (path === "/backup") return <BackupPage />' source/frontend-react/src/App.tsx
          grep -q 'if (path === "/admin" || path.startsWith("/admin/")) return <AdminPage />' source/frontend-react/src/App.tsx
          ! grep -q 'CalabriaveraWorkflow/actions/workflows/daily-backup.yml' source/frontend-react/src/pages/BackupPage.tsx
          git -C source diff --check
      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/src/pages/AdminPage.tsx frontend-react/src/pages/BackupPage.tsx frontend-react/src/App.tsx frontend-react/src/lib/admin.ts
          git -C source diff --cached --quiet && exit 0
          git -C source commit -m 'fix: restore main admin workflows and layout'
          git -C source push origin HEAD:react-migration
