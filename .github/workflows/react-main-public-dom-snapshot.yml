name: React migration - public main catalog map diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-main-public-dom-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-public-diag out
          npm install --prefix /tmp/cv-public-diag --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-public-diag/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture public data and rendered DOM
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-public-diag/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://calabriavera.com/assets/data/public-businesses-v1.json -o out/main-businesses.json || printf '{"items":[]}' > out/main-businesses.json
          node <<'NODE'
          const fs=require('node:fs');
          const {chromium}=require(process.env.PLAYWRIGHT_MODULE);
          const data=JSON.parse(fs.readFileSync('out/main-businesses.json','utf8'));
          console.log('PUBLIC_SNAPSHOT_COUNT', Array.isArray(data.items)?data.items.length:-1);
          console.log('PUBLIC_SNAPSHOT_NAMES', JSON.stringify((data.items||[]).slice(0,60).map(x=>x.name||x.title||x.id)));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [route,label] of [['/catalogo','catalog'],['/mappa','map']]){
              const page=await browser.newPage({viewport:{width:1365,height:900}});
              await page.goto('https://calabriavera.com'+route,{waitUntil:'domcontentloaded',timeout:20000});
              await page.waitForTimeout(7000);
              const result=await page.evaluate(()=>({
                main:document.querySelector('#main-content')?.outerHTML||'',
                text:document.querySelector('#main-content')?.innerText||'',
                activityItems:document.querySelectorAll('.activity-item').length,
                cards:document.querySelectorAll('#results > *').length,
                mapMarkers:document.querySelectorAll('.leaflet-marker-icon').length,
                mapClusters:document.querySelectorAll('.marker-cluster').length,
                mapLayout:document.querySelector('.map-layout')?.outerHTML||'',
                catalogLayout:document.querySelector('.catalog-layout')?.outerHTML||'',
              }));
              fs.writeFileSync(`out/${label}-main.html`,result.main);
              fs.writeFileSync(`out/${label}-main.json`,JSON.stringify(result,null,2));
              console.log(label.toUpperCase(), JSON.stringify({activityItems:result.activityItems,cards:result.cards,mapMarkers:result.mapMarkers,mapClusters:result.mapClusters,text:result.text.slice(0,400)}));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload public diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: public-main-catalog-map
          path: out
          retention-days: 1
