name: Sorgente privato - Trigger automatici

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Esegue i controlli automatici anche senza nuove modifiche'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: private-source-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Trova l'ultimo controllo riuscito
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          since="$(gh api "repos/${GH_REPO}/actions/workflows/source-watch.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].run_started_at // empty' 2>/dev/null || true)"
          if [ -z "$since" ]; then
            since="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Applica i trigger del commit privato 34eb685
        id: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          SINCE: ${{ steps.previous.outputs.since }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          work=/tmp/cv-source-watch
          rm -rf "$work"
          mkdir -p "$work/commits"

          gh api --paginate "repos/${PRIVATE_REPO}/commits?sha=main&since=${SINCE}&per_page=100" --jq '.[].sha' > "$work/shas"

          n=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            echo "::add-mask::$sha"
            n=$((n + 1))
            gh api "repos/${PRIVATE_REPO}/commits/${sha}" > "$work/commits/${n}.json"
          done < "$work/shas"

          # verify.yml nel commit sorgente usa pull_request. Consideriamo solo PR
          # aperte verso main che sono cambiate dall'ultimo controllo riuscito.
          gh api "repos/${PRIVATE_REPO}/pulls?state=open&base=main&sort=updated&direction=desc&per_page=100" \
            | jq -r --arg since "$SINCE" '.[] | select(.updated_at >= $since) | .head.sha' > "$work/pr-heads"
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            echo "::add-mask::$sha"
          done < "$work/pr-heads"

          WORK="$work" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.WORK;

          function glob(pattern) {
            let out = '^';
            for (let i = 0; i < pattern.length; i++) {
              const ch = pattern[i];
              if (ch === '*') {
                if (pattern[i + 1] === '*') {
                  i++;
                  if (pattern[i + 1] === '/') { i++; out += '(?:.*/)?'; }
                  else out += '.*';
                } else out += '[^/]*';
              } else if (ch === '?') out += '[^/]';
              else out += ch.replace(/[\\^$.*+?()[\]{}|]/g, '\\$&');
            }
            return new RegExp(out + '$');
          }

          const rules = {
            apps: {
              paths: [
                'apps-script/**',
                'tools/check-apps-script.mjs',
                '.github/workflows/apps-script-deploy.yml'
              ].map(glob)
            },
            deploy: {
              ignore: [
                '**/*.md',
                'docs/**',
                '.github/workflow-templates/**'
              ].map(glob)
            },
            magazine: {
              paths: [
                '.github/workflows/magazine-sync.yml',
                '.github/workflows/social-watchdog.yml',
                '.github/workflows/promo-story.yml',
                'tools/automation-cadence-runner.mjs',
                'tools/queue-new-magazine-items.mjs',
                'tools/publish-magazine-batch.mjs',
                'tools/sync-magazine.mjs',
                'tools/sync-magazine-v2.mjs',
                'tools/sync-tourism-opendata.mjs',
                'tools/sync-regional-opendata.mjs',
                'tools/source-fetch-compat.mjs',
                'tools/cleanup-ingv-magnitude.mjs',
                'tools/magazine-policy.mjs',
                'tools/enforce-positive-magazine.mjs',
                'tools/reconcile-magazine.mjs',
                'tools/backfill-blog-covers.mjs',
                'tools/package.json',
                'tools/publish-social.mjs',
                'tools/publish-social-runner.mjs',
                'tools/publish-social-pair.mjs',
                'tools/publish-promo-story.mjs',
                'tools/meta-page-token.mjs',
                'tools/check-meta-config.mjs',
                'tools/check-meta-token-expiry.mjs',
                'data/magazine-sources.json',
                'data/magazine-sources-extra-commercial.json',
                'tools/source-registry.mjs',
                'tools/institutional-source.mjs',
                'tools/feed-parser.mjs',
                'tools/tourism-source.mjs',
                'tools/enforce-source-rights.mjs',
                'assets/js/magazine-lanes.js',
                'assets/js/magazine-rights.js',
                'assets/js/blog.js',
                'assets/css/blog-sections.css',
                'assets/images/blog-default-*.png',
                'assets/Story-Promo_instagram-facebook.png',
                'assets/Story-Promo_instagram-safe.png'
              ].map(glob)
            },
            promo: {
              paths: [
                'tools/publish-promo-story.mjs',
                'tools/automation-cadence-runner.mjs',
                '.github/workflows/promo-story.yml',
                'assets/Story-Promo_instagram-facebook.png',
                'assets/Story-Promo_instagram-safe.png'
              ].map(glob)
            },
            seo: {
              paths: [
                '.github/workflows/seo-sync.yml',
                'tools/check-seo-sync.mjs',
                'tools/lib/seo-snapshot.mjs'
              ].map(glob)
            }
          };

          function triggered(files, cfg) {
            if (cfg.paths?.length) return files.some(file => cfg.paths.some(rule => rule.test(file)));
            if (cfg.ignore?.length) return files.some(file => !cfg.ignore.some(rule => rule.test(file)));
            return true;
          }

          const forced = process.env.FORCE === 'true';
          const prChanged = fs.readFileSync(path.join(root, 'pr-heads'), 'utf8').trim().length > 0;
          const result = {
            apps: forced,
            deploy: forced,
            magazine: forced,
            promo: false,
            seo: forced,
            verify: forced || prChanged,
            magazine_force: false,
            social_dry_run: false,
            social_publish: false,
            social_republish_instagram: false,
            social_republish_ricadi: false
          };

          const dir = path.join(root, 'commits');
          const commitFiles = fs.readdirSync(dir).filter(name => name.endsWith('.json'));
          for (const filename of commitFiles) {
            const commit = JSON.parse(fs.readFileSync(path.join(dir, filename), 'utf8'));
            const files = (commit.files || []).map(file => file.filename);
            const message = commit.commit?.message || '';
            if (!files.length) continue;

            if (triggered(files, rules.apps)) result.apps = true;
            if (triggered(files, rules.deploy)) result.deploy = true;
            if (triggered(files, rules.seo)) result.seo = true;

            // promo-story.yml del commit esegue il job su push soltanto con questo marker.
            if (triggered(files, rules.promo) && message.includes('[promo-story-now]')) result.promo = true;

            if (triggered(files, rules.magazine)) {
              result.magazine = true;
              result.magazine_force ||= message.includes('[magazine-force]');
              result.social_dry_run ||= message.includes('[social-dry-run]');
              result.social_publish ||= message.includes('[social-publish]');
              result.social_republish_instagram ||= message.includes('[social-republish-instagram]');
              result.social_republish_ricadi ||= message.includes('[social-republish-ricadi]');
            }
          }

          for (const [key, value] of Object.entries(result)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

          rm -rf "$work"

      - name: Avvia gli equivalenti dei trigger privati
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_APPS: ${{ steps.source.outputs.apps }}
          RUN_DEPLOY: ${{ steps.source.outputs.deploy }}
          RUN_MAGAZINE: ${{ steps.source.outputs.magazine }}
          RUN_PROMO: ${{ steps.source.outputs.promo }}
          RUN_SEO: ${{ steps.source.outputs.seo }}
          RUN_VERIFY: ${{ steps.source.outputs.verify }}
          MAGAZINE_FORCE: ${{ steps.source.outputs.magazine_force }}
          SOCIAL_DRY_RUN: ${{ steps.source.outputs.social_dry_run }}
          SOCIAL_PUBLISH: ${{ steps.source.outputs.social_publish }}
          SOCIAL_REPUBLISH_INSTAGRAM: ${{ steps.source.outputs.social_republish_instagram }}
          SOCIAL_REPUBLISH_RICADI: ${{ steps.source.outputs.social_republish_ricadi }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch() {
            gh api --method POST "repos/${GH_REPO}/dispatches" -f event_type="$1" >/dev/null
          }

          [ "$RUN_VERIFY" = "true" ] && dispatch source-verify || true
          [ "$RUN_DEPLOY" = "true" ] && dispatch source-deploy || true
          [ "$RUN_APPS" = "true" ] && dispatch source-apps-script-deploy || true
          [ "$RUN_SEO" = "true" ] && dispatch source-seo-push || true
          [ "$RUN_PROMO" = "true" ] && dispatch source-promo-story-push || true

          if [ "$RUN_MAGAZINE" = "true" ]; then
            gh api --method POST "repos/${GH_REPO}/dispatches" \
              -f event_type=source-magazine-push \
              -F "client_payload[magazine_force]=${MAGAZINE_FORCE}" \
              -F "client_payload[social_dry_run]=${SOCIAL_DRY_RUN}" \
              -F "client_payload[social_publish]=${SOCIAL_PUBLISH}" \
              -F "client_payload[social_republish_instagram]=${SOCIAL_REPUBLISH_INSTAGRAM}" \
              -F "client_payload[social_republish_ricadi]=${SOCIAL_REPUBLISH_RICADI}" >/dev/null
          fi

          echo "Controllo automatico completato senza pubblicare dettagli del sorgente privato."
