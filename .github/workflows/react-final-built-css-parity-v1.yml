name: React final built CSS parity v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-final-built-css-parity-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-gate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 5f145eee5a37c4d765a758f01b83e61e62c3ef0c
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 8
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Build exact legacy deployment output
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LEGACY_SHA"
          npm ci
          npm run build
          for file in \
            cv-bundle-1dae388af7394278.css \
            cv-bundle-603cc2ff50d0e016.css \
            cv-bundle-d6726897b303029e.css \
            cv-bundle-89794cb4f569c254.css \
            cv-bundle-5605509f9b6e4dee.css \
            cv-bundle-05735d3b1a3300b8.css \
            cv-bundle-b23bf9fdf406ca6d.css \
            cv-bundle-28783d3e87e06008.css \
            cv-bundle-fe11938d8fd5afe9.css; do
            test -s "dist/assets/css/$file"
            actual="$(sha256sum "dist/assets/css/$file" | cut -d' ' -f1)"
            prefix="${file#cv-bundle-}"; prefix="${prefix%.css}"
            case "$actual" in "$prefix"*) ;; *) echo "Bundle hash mismatch $file => $actual"; exit 1;; esac
          done

      - name: Copy exact bundles and patch React
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          mkdir -p source/frontend-react/public/assets/css
          for file in \
            cv-bundle-1dae388af7394278.css \
            cv-bundle-603cc2ff50d0e016.css \
            cv-bundle-d6726897b303029e.css \
            cv-bundle-89794cb4f569c254.css \
            cv-bundle-5605509f9b6e4dee.css \
            cv-bundle-05735d3b1a3300b8.css \
            cv-bundle-b23bf9fdf406ca6d.css \
            cv-bundle-28783d3e87e06008.css \
            cv-bundle-fe11938d8fd5afe9.css; do
            cp "legacy/dist/assets/css/$file" "source/frontend-react/public/assets/css/$file"
          done
          cd source
          python3 ../workflow/scripts/patch-react-final-built-css.py
          ! grep -Fq 'import "./styles.css"' frontend-react/src/main.tsx
          ! grep -Fq 'import "./shell-parity.css"' frontend-react/src/main.tsx
          ! grep -Fq 'import "./consent.css"' frontend-react/src/main.tsx
          grep -Fq 'import "leaflet/dist/leaflet.css"' frontend-react/src/pages/MapPage.tsx
          grep -Fq '<div id="site-header">' frontend-react/src/components/Layout.tsx
          grep -Fq 'data-cv-exact-built-bootstrap' frontend-react/index.html
          grep -Fq 'Pagina non trovata' frontend-react/src/App.tsx
          git diff --check

      - name: Build patched React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('public/main-route-css.json','utf8'));
          const one=(r,b)=>{const a=m.routeCss[r];if(!Array.isArray(a)||a.length!==1||a[0]!==`/assets/css/${b}`)throw new Error(`${r}: ${JSON.stringify(a)}`)};
          one('/','cv-bundle-89794cb4f569c254.css');
          one('/catalogo','cv-bundle-d6726897b303029e.css');
          one('/mappa','cv-bundle-5605509f9b6e4dee.css');
          one('/attivita/:detail','cv-bundle-603cc2ff50d0e016.css');
          one('/messaggi','cv-bundle-05735d3b1a3300b8.css');
          one('/login','cv-bundle-1dae388af7394278.css');
          one('/404','cv-bundle-1dae388af7394278.css');
          one('/admin','cv-bundle-28783d3e87e06008.css');
          one('/admin/attivita','cv-bundle-b23bf9fdf406ca6d.css');
          one('/admin/messaggi','cv-bundle-b23bf9fdf406ca6d.css');
          one('/admin/utenti','cv-bundle-fe11938d8fd5afe9.css');
          const html=fs.readFileSync('dist/index.html','utf8');
          if(!html.includes('data-cv-exact-built-bootstrap')) throw new Error('Missing early exact bundle bootstrap');
          if(/assets\/index-[^"']+\.css/.test(html)) throw new Error('Global React visual CSS still emitted in index');
          console.log('EXACT_BUILT_ROUTE_MANIFEST_GREEN');
          NODE

      - name: Install Chromium and serve both builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-final-css
          npm install --prefix /tmp/cv-final-css --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-final-css/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-final-css/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-final-css-legacy.log 2>&1 & echo $! >/tmp/cv-final-css-legacy.pid
          nohup /tmp/cv-final-css/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-final-css-react.log 2>&1 & echo $! >/tmp/cv-final-css-react.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4184/index.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1

      - name: Gate exact shell and typography across deployed routes
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-final-css/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const routes=[
            ['home','/index.html','/'],['catalog','/catalogo.html','/catalogo'],['map','/mappa.html','/mappa'],['blog','/blog.html','/blog'],
            ['about','/chi-siamo.html','/chi-siamo'],['contacts','/contatti.html','/contatti'],['privacy','/privacy-policy.html','/privacy-policy'],
            ['cookie','/cookie-policy.html','/cookie-policy'],['terms','/termini.html','/termini'],['legal','/note-legali.html','/note-legali'],
            ['login','/login.html','/login'],['register','/registrazione.html','/registrazione'],['404','/404.html','/ci-not-found']
          ];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]],failures=[];
          const near=(a,b,t=.25)=>Math.abs(Number(a)-Number(b))<=t;
          async function open(origin,path,viewport){
            const ctx=await browser.newContext({viewport,serviceWorkers:'block'});
            await ctx.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});
            const p=await ctx.newPage(),errors=[],asset404=[];p.on('pageerror',e=>errors.push(String(e.message||e)));p.on('response',r=>{try{const u=new URL(r.url());if(r.status()===404&&u.hostname==='127.0.0.1'&&u.pathname.startsWith('/assets/'))asset404.push(u.pathname)}catch{}});
            await p.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});await p.locator('.site-header').waitFor({state:'visible',timeout:15000});await p.waitForTimeout(350);return{ctx,p,errors,asset404};
          }
          async function snap(p){return p.evaluate(()=>{const q=s=>document.querySelector(s),rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height}:null},style=e=>e?getComputedStyle(e):null;const h=q('main h1'),hs=style(h),head=q('.site-header'),heads=style(head),inner=q('.header-inner'),logo=q('.brand-logo'),footer=q('.footer'),fg=q('.footer-grid');return{page:document.body.dataset.page||'',css:[...document.querySelectorAll('link[data-cv-main-parity]')].map(x=>new URL(x.href,location.href).pathname),header:rect(head),inner:rect(inner),logo:rect(logo),main:rect(q('#main-content')),footer:rect(footer),footerGrid:rect(fg),headerStyle:heads?{bg:heads.backgroundColor,color:heads.color,pos:heads.position}:null,h1:h?.textContent?.trim()||'',h1Rect:rect(h),h1Style:hs?{font:hs.fontFamily,size:hs.fontSize,weight:hs.fontWeight,line:hs.lineHeight,letter:hs.letterSpacing,color:hs.color}:null}})}
          for(const [mode,v] of modes)for(const [name,lp,rp] of routes){
            const L=await open('http://127.0.0.1:4184',lp,v),R=await open('http://127.0.0.1:4185',rp,v);const a=await snap(L.p),b=await snap(R.p),m=[];
            if(a.css.length!==1||b.css.length!==1||a.css[0]!==b.css[0])m.push(`css:${JSON.stringify(a.css)}/${JSON.stringify(b.css)}`);
            for(const key of ['header','inner','logo']){const x=a[key],y=b[key];if(!x||!y)m.push(`${key}:missing`);else for(const d of ['x','y','w','h'])if(!near(x[d],y[d],.3))m.push(`${key}.${d}:${x[d]}/${y[d]}`)}
            if(!a.main||!b.main||!near(a.main.y,b.main.y,.3)||!near(a.main.w,b.main.w,.3))m.push(`main:${JSON.stringify(a.main)}/${JSON.stringify(b.main)}`);
            if(JSON.stringify(a.headerStyle)!==JSON.stringify(b.headerStyle))m.push(`headerStyle:${JSON.stringify(a.headerStyle)}/${JSON.stringify(b.headerStyle)}`);
            if(['about','contacts','privacy','cookie','terms','legal','login','register','404'].includes(name)){
              if(a.h1!==b.h1)m.push(`h1:${a.h1}/${b.h1}`);
              if(JSON.stringify(a.h1Style)!==JSON.stringify(b.h1Style))m.push(`h1Style:${JSON.stringify(a.h1Style)}/${JSON.stringify(b.h1Style)}`);
              if(a.h1Rect&&b.h1Rect&&(!near(a.h1Rect.w,b.h1Rect.w,.3)||!near(a.h1Rect.h,b.h1Rect.h,.3)))m.push(`h1Rect:${JSON.stringify(a.h1Rect)}/${JSON.stringify(b.h1Rect)}`);
            }
            if(R.errors.length)m.push(`errors:${R.errors.join(';')}`);if(R.asset404.length)m.push(`asset404:${[...new Set(R.asset404)].join(',')}`);
            console.log(`${mode}/${name}: ${m.length?m.join(' | '):'OK'}`);if(m.length)failures.push({mode,name,m,a,b});await L.ctx.close();await R.ctx.close();
          }
          await browser.close();if(failures.length){console.error(JSON.stringify(failures,null,2));process.exit(1)}console.log('EXACT_BUILT_SHELL_TYPOGRAPHY_GREEN');
          NODE

      - name: Gate React runtime functionality after CSS replacement
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-final-css/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);const b=await chromium.launch({headless:true});const failures=[];
          async function page(path,v={width:1365,height:900}){const c=await b.newContext({viewport:v,serviceWorkers:'block'});await c.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});const p=await c.newPage();await p.goto('http://127.0.0.1:4185'+path,{waitUntil:'domcontentloaded'});return{c,p}}
          {const {c,p}=await page('/');await p.locator('#cv-home-search').waitFor();if(await p.locator('.cv-experience-card').count()!==4)failures.push('home-featured-cards');await c.close()}
          {const {c,p}=await page('/catalogo');await p.locator('#result-count').waitFor();await p.waitForFunction(()=>document.querySelector('#result-count')?.textContent?.includes('53 attività trovate'),null,{timeout:15000});if(await p.locator('#results > *').count()!==18)failures.push(`catalog-initial:${await p.locator('#results > *').count()}`);await c.close()}
          {const {c,p}=await page('/mappa');await p.waitForFunction(()=>document.body.innerText.includes('53 attività sulla mappa'),null,{timeout:20000});if(await p.locator('.leaflet-container').count()!==1)failures.push('map-leaflet');await c.close()}
          {const {c,p}=await page('/blog');await p.locator('#blog-lane-tabs').waitFor({timeout:15000});if(await p.locator('#blog-list > *').count()<1)failures.push('blog-cards');await c.close()}
          {const {c,p}=await page('/ci-not-found');await p.locator('main h1').waitFor();const texts=await p.locator('main .form-actions a').allTextContents();if(JSON.stringify(texts.map(x=>x.trim()))!==JSON.stringify(['Torna alla home','Apri il catalogo']))failures.push(`404-actions:${JSON.stringify(texts)}`);const robots=await p.locator('meta[name="robots"]').getAttribute('content');if(robots!=='noindex,follow')failures.push(`404-robots:${robots}`);await c.close()}
          {const {c,p}=await page('/',{width:390,height:844});const lang=p.locator('details.header-language');await lang.locator('summary').click();if(!(await lang.evaluate(e=>e.hasAttribute('open'))))failures.push('language-open');const box=await p.locator('.cv-language-list').boundingBox();if(!box||box.x<0||box.x+box.width>391)failures.push(`language-box:${JSON.stringify(box)}`);await p.keyboard.press('Escape');if(await lang.evaluate(e=>e.hasAttribute('open')))failures.push('language-escape');await p.locator('#menu-toggle').click();if(await p.locator('#mobile-nav').count()!==1)failures.push('mobile-menu-open');await p.keyboard.press('Escape');if(await p.locator('#mobile-nav').count()!==0)failures.push('mobile-menu-close');await c.close()}
          await b.close();if(failures.length){console.error(failures.join('\n'));process.exit(1)}console.log('EXACT_BUILT_RUNTIME_GREEN');
          NODE

      - name: Commit exact built CSS architecture
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            frontend-react/src/main.tsx \
            frontend-react/src/pages/MapPage.tsx \
            frontend-react/src/components/Layout.tsx \
            frontend-react/src/App.tsx \
            frontend-react/scripts/copy-legacy-assets.mjs \
            frontend-react/scripts/prerender-home.mjs \
            frontend-react/index.html \
            frontend-react/src/generated/main-route-css.ts \
            frontend-react/public/main-route-css.json \
            frontend-react/public/assets/css/cv-bundle-1dae388af7394278.css \
            frontend-react/public/assets/css/cv-bundle-603cc2ff50d0e016.css \
            frontend-react/public/assets/css/cv-bundle-d6726897b303029e.css \
            frontend-react/public/assets/css/cv-bundle-89794cb4f569c254.css \
            frontend-react/public/assets/css/cv-bundle-5605509f9b6e4dee.css \
            frontend-react/public/assets/css/cv-bundle-05735d3b1a3300b8.css \
            frontend-react/public/assets/css/cv-bundle-b23bf9fdf406ca6d.css \
            frontend-react/public/assets/css/cv-bundle-28783d3e87e06008.css \
            frontend-react/public/assets/css/cv-bundle-fe11938d8fd5afe9.css
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: use exact pre-React final CSS bundles by route'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        run: |
          kill "$(cat /tmp/cv-final-css-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-final-css-react.pid 2>/dev/null)" 2>/dev/null || true
