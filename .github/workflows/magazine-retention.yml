name: Magazine - Pulizia sicura ogni 15 giorni

# GitHub controlla ogni giorno; Firestore consente la cancellazione una volta ogni 15 giorni.
# Safety test gate revision 2.
# Questa manutenzione NON può azzerare i download mensili Firebase Hosting.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magazine-retention.yml'
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Elimina i soli contenuti sicuri (false = anteprima)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: firestore-magazine-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verifica sorgente CalabriaVera
        shell: bash
        run: |
          set -euo pipefail
          test "$PRIVATE_REPO" = 'Mirkolas/calabriavera'
          test -n "$PRIVATE_REPO_PAT"
      - name: Checkout sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verifica invarianti cancellazione sicura
        working-directory: source
        run: node --test tests/magazine-retention.test.mjs
      - name: Installa dipendenze Firebase
        working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund
      - name: Autenticazione Firestore
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_BLOG_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_BLOG_SERVICE_ACCOUNT }}
      - name: Rimuovi soltanto news RSS scadute e ormai fuori dalle code social
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
          APPLY_REQUESTED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APPLY_REQUESTED" = 'true' ]; then
            if [ "$SCHEDULED" = 'true' ]; then
              node tools/magazine-retention.mjs --apply --scheduled
            else
              node tools/magazine-retention.mjs --apply
            fi
          else
            node tools/magazine-retention.mjs --dry-run
          fi
