name: React migration - direct Firebase production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-production-direct.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: react-firebase-production-cutover
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_SHA: 165f10c0203e928df1c0cb5ac75445249b7cade4
      PROJECT_ID: calabriavera-e08d4
    steps:
      - name: Verify deploy credentials are configured
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
          test -n "$WIF_PROVIDER" || { echo '::error::FIREBASE_WIF_PROVIDER missing'; exit 1; }
          test -n "$DEPLOY_SA" || { echo '::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT missing'; exit 1; }

      - name: Verify private main is still exact candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $PRIVATE_REPO_PAT" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$PRIVATE_REPO/branches/main" > /tmp/main.json
          actual="$(node -e "const x=require('/tmp/main.json');process.stdout.write(x.commit.sha)")"
          test "$actual" = "$EXPECTED_SHA" || { echo "::error::private main moved to $actual"; exit 1; }

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.EXPECTED_SHA }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Build exact validated React production bundle
        working-directory: source/frontend-react
        env:
          GITHUB_SHA: ${{ env.EXPECTED_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test "$(cat dist/build-version.txt | tr -d '\r\n')" = "$EXPECTED_SHA"
          node -e "const x=require('./firebase.react.json'); if(x.hosting.site!=='calabriavera') process.exit(1)"
          test -s dist/catalogo/index.html
          test -s dist/mappa/index.html
          test -s dist/blog/index.html
          test -s dist/legacy-data/public-businesses-v1.json
          test -s dist/legacy-data/public-blog-v1.json
          grep -q '53 attività trovate' dist/catalogo/index.html
          grep -q 'turismo-isola-dino' dist/catalogo/index.html
          grep -q 'data-prerender-path="/mappa"' dist/mappa/index.html
          grep -q 'index,follow,max-image-preview:large' dist/catalogo/index.html

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy only React Firebase Hosting
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 deploy \
            --project "$PROJECT_ID" \
            --only hosting \
            --config firebase.react.json \
            --non-interactive

      - name: Verify exact production revision and raw prerender
        shell: bash
        run: |
          set -euo pipefail
          base='https://calabriavera.com'
          for attempt in {1..45}; do
            live="$(curl -fsS --max-time 15 "$base/build-version.txt?deploy=$attempt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$live" = "$EXPECTED_SHA" ]; then break; fi
            sleep 5
          done
          test "$(curl -fsS --max-time 20 "$base/build-version.txt?final=1" | tr -d '\r\n')" = "$EXPECTED_SHA"
          curl -fsS --max-time 20 "$base/catalogo?deploy=$EXPECTED_SHA" > /tmp/catalog.html
          grep -q 'data-prerender-path="/catalogo"' /tmp/catalog.html
          grep -q '53 attività trovate' /tmp/catalog.html
          grep -q 'turismo-isola-dino' /tmp/catalog.html
          curl -fsS --max-time 20 "$base/mappa?deploy=$EXPECTED_SHA" > /tmp/map.html
          grep -q 'data-prerender-path="/mappa"' /tmp/map.html
          echo "FIREBASE_REACT_PRODUCTION_GREEN=$EXPECTED_SHA"
