name: React migration - dispatch Firebase production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-dispatch-firebase-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
      EXPECTED_MAIN_SHA: c8a420ba5302cd8ce223e344aedb3103e4468c75
    steps:
      - name: Verify exact main and dispatch existing private deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $PRIVATE_REPO_PAT" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$PRIVATE_REPO/branches/main" > /tmp/main.json
          actual="$(node -e "const x=require('/tmp/main.json');process.stdout.write(x.commit.sha)")"
          test "$actual" = "$EXPECTED_MAIN_SHA" || { echo "::error::main moved to $actual"; exit 1; }
          code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PRIVATE_REPO_PAT" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$PRIVATE_REPO/actions/workflows/firebase-deploy.yml/dispatches" \
            -d '{"ref":"main"}')"
          test "$code" = 204 || { echo "::error::workflow dispatch HTTP $code"; cat /tmp/dispatch.json; exit 1; }
          echo "FIREBASE_PRODUCTION_DISPATCHED=$EXPECTED_MAIN_SHA"
