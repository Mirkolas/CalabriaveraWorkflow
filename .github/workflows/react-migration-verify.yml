name: Verifica React migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-migration-verify.yml'
  repository_dispatch:
    types: [react-migration-verify]

permissions:
  contents: read

concurrency:
  group: react-migration-verify
  cancel-in-progress: true

# Validate with the same Node major used by the Cloudflare build environment.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica branch React dal repository privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Installa dipendenze React da lockfile
        working-directory: source/frontend-react
        run: npm ci --no-audit --no-fund

      - name: TypeScript e build Vite
        working-directory: source/frontend-react
        run: npm run build
