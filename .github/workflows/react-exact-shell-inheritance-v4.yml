name: React exact backup parity - shell inheritance v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-exact-shell-inheritance-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-exact-shell-inheritance-v4
  cancel-in-progress: true

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - name: Verify access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"; test -n "$PRIVATE_REPO_PAT"

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false

      - name: Checkout exact backup
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply inheritance patch and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          cd source
          python3 ../workflow/scripts/patch-react-exact-shell-inheritance.py
          cd frontend-react
          npm ci
          npm run build

      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-shell-v4
          npm install --prefix /tmp/cv-shell-v4 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-shell-v4/node_modules/.bin/playwright install --with-deps chromium

      - name: Start exact backup and React
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-shell-v4/node_modules/.bin/serve legacy -l 4184 >/tmp/cv-shell-v4-legacy.log 2>&1 & echo $! >/tmp/cv-shell-v4-legacy.pid
          nohup /tmp/cv-shell-v4/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-shell-v4-react.log 2>&1 & echo $! >/tmp/cv-shell-v4-react.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4184/index.html >/dev/null && curl -fsS http://127.0.0.1:4185/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Compare shell inheritance and geometry
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-shell-v4/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url),{chromium}=require(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const routes=[['home','/index.html','/'],['catalogo','/catalogo.html','/catalogo'],['mappa','/mappa.html','/mappa'],['blog','/blog.html','/blog'],['login','/login.html','/login'],['registrazione','/registrazione.html','/registrazione'],['privacy','/privacy-policy.html','/privacy-policy'],['cookie','/cookie-policy.html','/cookie-policy'],['termini','/termini.html','/termini'],['note-legali','/note-legali.html','/note-legali'],['chi-siamo','/chi-siamo.html','/chi-siamo'],['contatti','/contatti.html','/contatti']];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          const consent={version:3,scope:'technical-only',savedAt:new Date().toISOString(),expiresAt:new Date(Date.now()+30*864e5).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'gate'};
          const norm=x=>String(x||'').replace(/\s+/g,'');
          const bad=[];
          try {
            for(const [mode,viewport] of modes){
              const context=await browser.newContext({viewport,serviceWorkers:'block'});
              await context.addInitScript(v=>{try{localStorage.setItem('cv-cookie-consent-v3',JSON.stringify(v))}catch{}},consent);
              for(const [name,legacyPath,reactPath] of routes){
                const sides={};
                for(const [side,origin,path] of [['legacy','http://127.0.0.1:4184',legacyPath],['react','http://127.0.0.1:4185',reactPath]]){
                  const page=await context.newPage(),errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
                  await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(1200);
                  sides[side]=await page.evaluate(()=>{
                    const header=document.querySelector('header.site-header'),hs=header?getComputedStyle(header):null,hr=header?.getBoundingClientRect();
                    const logo=header?.querySelector('.brand-logo')?.getBoundingClientRect(),inner=header?.querySelector('.header-inner')?.getBoundingClientRect();
                    const body=getComputedStyle(document.body),footer=document.querySelector('footer.footer'),fs=footer?getComputedStyle(footer):null;
                    return {header:hs?{bg:hs.backgroundColor,color:hs.color,height:hr?.height||0,position:hs.position,logoW:logo?.width||0,logoH:logo?.height||0,innerH:inner?.height||0}:null,body:{bg:body.backgroundColor,color:body.color,font:body.fontFamily},footer:fs?{bg:fs.backgroundColor,color:fs.color,children:footer?.querySelector('.footer-grid')?.children.length||0}:null,menu:getComputedStyle(document.querySelector('#menu-toggle')).display};
                  }).catch(()=>null);
                  sides[side].errors=errors; await page.close();
                }
                const a=sides.legacy,b=sides.react,m=[];
                if(!a?.header||!b?.header)m.push('header-missing'); else {
                  for(const key of ['bg','color','position']) if(norm(a.header[key])!==norm(b.header[key]))m.push(`header.${key}:${a.header[key]}!=${b.header[key]}`);
                  for(const key of ['height','logoW','logoH','innerH']) if(Math.abs(a.header[key]-b.header[key])>1)m.push(`header.${key}:${a.header[key]}!=${b.header[key]}`);
                }
                if(norm(a?.body?.bg)!==norm(b?.body?.bg))m.push(`body.bg:${a?.body?.bg}!=${b?.body?.bg}`);
                if(norm(a?.body?.color)!==norm(b?.body?.color))m.push(`body.color:${a?.body?.color}!=${b?.body?.color}`);
                if(norm(a?.body?.font)!==norm(b?.body?.font))m.push(`body.font:${a?.body?.font}!=${b?.body?.font}`);
                if(norm(a?.footer?.bg)!==norm(b?.footer?.bg))m.push(`footer.bg:${a?.footer?.bg}!=${b?.footer?.bg}`);
                if(norm(a?.footer?.color)!==norm(b?.footer?.color))m.push(`footer.color:${a?.footer?.color}!=${b?.footer?.color}`);
                if(a?.footer?.children!==b?.footer?.children)m.push(`footer.children:${a?.footer?.children}!=${b?.footer?.children}`);
                if((a?.menu||'')!==(b?.menu||''))m.push(`menu:${a?.menu}!=${b?.menu}`);
                if(b?.errors?.length)m.push(`react-errors:${b.errors.join(';')}`);
                console.log(`${mode}/${name}: ${m.length?m.join(' | '):'OK'}`); if(m.length)bad.push({mode,name,m,a,b});
              }
              await context.close();
            }
          } finally { await browser.close(); }
          if(bad.length){console.error(JSON.stringify(bad,null,2));process.exit(1)}
          console.log('EXACT_SHELL_INHERITANCE_GREEN');
          NODE

      - name: Commit inheritance fix to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'; git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/styles.css
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: inherit exact legacy shell colors'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-shell-v4-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-shell-v4-react.pid 2>/dev/null)" 2>/dev/null || true
