name: React migration - Firebase production bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-production-bridge.yml'
      - 'scripts/patch-react-firebase-production.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7
        with:
          path: automation
      - name: Validate private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Freeze current public legacy snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/assets/data
          curl -fsSL --retry 4 --retry-all-errors --max-time 30 https://calabriavera-e08d4.web.app/assets/data/public-businesses-v1.json -o source/assets/data/public-businesses-v1.json
          curl -fsSL --retry 4 --retry-all-errors --max-time 30 https://calabriavera-e08d4.web.app/assets/data/public-blog-v1.json -o source/assets/data/public-blog-v1.json
          node - <<'NODE'
          const fs = require('fs');
          const business = JSON.parse(fs.readFileSync('source/assets/data/public-businesses-v1.json', 'utf8'));
          const blog = JSON.parse(fs.readFileSync('source/assets/data/public-blog-v1.json', 'utf8'));
          if (!Array.isArray(business.items) || business.items.length < 1) throw new Error('public businesses snapshot empty');
          if (!Array.isArray(blog.items) || blog.items.length < 200) throw new Error(`public blog snapshot too small: ${blog.items?.length || 0}`);
          console.log(`PUBLIC_SNAPSHOTS_GREEN businesses=${business.items.length} blog=${blog.items.length}`);
          NODE
      - name: Adapt bridge patcher to current implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('automation/scripts/patch-react-firebase-production.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace("if 'UPLOAD_CORS_ORIGINS' not in text:", "if 'UPLOAD_CORS_ORIGINS' not in text and 'R2_UPLOAD_ORIGINS' not in text:")
          text = text.replace("elif new.strip() not in text:\n    raise SystemExit('worker upload dispatch anchor missing')", "elif new.strip() not in text and 'uploadPreflight(request)' not in text:\n    raise SystemExit('worker upload dispatch anchor missing')")
          text = text.replace('attività sulla mappa', 'data-prerender-path')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply Firebase production bridge
        run: python automation/scripts/patch-react-firebase-production.py
      - name: Keep fallback shell non-indexable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('source/frontend-react/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1', 'noindex,nofollow')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Build React production
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          check_file(){ test -s "$1" || { echo "::error::missing $1"; exit 1; }; }
          check_text(){ grep -Fq "$1" "$2" || { echo "::error::$3 missing in $2"; exit 1; }; }
          npm ci
          npm run build
          check_file dist/build-version.txt
          check_file dist/catalogo/index.html
          check_file dist/mappa/index.html
          check_file dist/blog/index.html
          check_file dist/legacy-data/public-businesses-v1.json
          check_file dist/legacy-data/public-blog-v1.json
          check_text '53 attività trovate' dist/catalogo/index.html 'catalog total 53'
          check_text 'turismo-isola-dino' dist/catalogo/index.html 'canonical tourism payload'
          check_text 'data-prerender-path="/mappa"' dist/mappa/index.html 'map prerender marker'
          check_text 'index,follow,max-image-preview:large' dist/catalogo/index.html 'public robots index'
          check_text 'noindex,nofollow' dist/app-shell.html 'fallback robots noindex'
          BUSINESS_COUNT="$(node -e "const p=require('./dist/legacy-data/public-businesses-v1.json');process.stdout.write(String((p.items||[]).length))")"
          BLOG_COUNT="$(node -e "const p=require('./dist/legacy-data/public-blog-v1.json');process.stdout.write(String((p.items||[]).length))")"
          test "$BUSINESS_COUNT" -ge 1 || { echo "::error::business snapshot empty"; exit 1; }
          test "$BLOG_COUNT" -ge 200 || { echo "::error::blog snapshot too small: $BLOG_COUNT"; exit 1; }
          echo "REACT_STATIC_BUILD_GREEN businesses=$BUSINESS_COUNT blog=$BLOG_COUNT"
      - name: Validate Worker still builds
        working-directory: source/frontend-react
        run: npx wrangler deploy --dry-run
      - name: Validate Firebase Hosting locally
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(cat dist/build-version.txt)"
          export EXPECTED_SHA
          npx --yes firebase-tools@15.22.1 emulators:exec --only hosting --project demo-calabriavera --config firebase.react.json "node scripts/smoke-firebase-static.mjs"
      - name: Validate production bridge invariants
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'R2_UPLOAD_WORKER' frontend-react/src/lib/business-editor.ts
          grep -Eq 'UPLOAD_CORS_ORIGINS|R2_UPLOAD_ORIGINS' frontend-react/worker.ts
          grep -q 'public-blog-v1.json' frontend-react/scripts/copy-legacy-assets.mjs
          grep -q 'firebase.react.json' .github/workflows/firebase-deploy.yml
          grep -q 'workflow_dispatch' .github/workflows/firebase-deploy.yml
          test -s assets/data/public-businesses-v1.json
          test -s assets/data/public-blog-v1.json
          git diff --check
      - name: Commit and push bridge
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/data frontend-react .github/workflows/firebase-deploy.yml
          if git diff --cached --quiet; then
            echo 'No changes to push.'
            exit 0
          fi
          git commit -m 'deploy: prepare React Firebase production hosting'
          git push origin HEAD:react-migration
          echo "REACT_FIREBASE_BRIDGE_SHA=$(git rev-parse HEAD)"
