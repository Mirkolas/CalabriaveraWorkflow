name: React legacy parity - shell home fix v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-legacy-shell-home-fix-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-legacy-shell-home-fix-v3
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Patch route cascade and Home behavior
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          function replaceOnce(source, before, after, label) {
            const index = source.indexOf(before);
            if (index < 0) throw new Error(`${label}: target not found`);
            return source.slice(0, index) + after + source.slice(index + before.length);
          }

          {
            const file = 'frontend-react/scripts/copy-legacy-assets.mjs';
            let s = fs.readFileSync(file, 'utf8');
            const startToken = '  for (const href of [...CORE_STYLES, ...(PAGE_STYLES[page] || []), liveParityCss]) {';
            const endToken = '  routeCss[route] = styles;';
            const start = s.indexOf(startToken), end = s.indexOf(endToken, start);
            if (start < 0 || end < 0) throw new Error('copy-legacy-assets: cascade block not found');
            const block = `  const usesExtendedCascade = styles.some((href) => CORE_STYLES.some((core) => assetPath(core) === assetPath(href)));\n  const parityStyles = [...(usesExtendedCascade ? CORE_STYLES : []), ...(PAGE_STYLES[page] || []), liveParityCss];\n  for (const href of parityStyles) {\n    const pathOnly = assetPath(href);\n    styles = styles.filter((current) => assetPath(current) !== pathOnly);\n    styles.push(href);\n  }\n`;
            fs.writeFileSync(file, s.slice(0, start) + block + s.slice(end));
          }

          fs.writeFileSync('frontend-react/public/assets/css/react-live-parity.css', `html,body,#root,.cv-site-shell{max-width:100%;overflow-x:clip}\n.footer .social-link{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.16)!important;color:#fff!important}\n.cv-consent-footer-line{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.16);padding-top:24px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:.78rem;color:rgba(255,255,255,.82)}\n.cv-consent-footer-line button{border:0;background:transparent;color:inherit;padding:0;text-decoration:underline;cursor:pointer}.cv-consent-footer-line a{color:inherit;text-decoration:underline}\n.cv-whatsapp-help{position:absolute;right:68px;white-space:nowrap;background:#fff;color:#083b5f;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;box-shadow:0 5px 18px rgba(0,0,0,.14)}\n@media(max-width:700px){body[data-page="map"] .map-layout{grid-template-columns:minmax(0,1fr)!important;display:grid!important}body[data-page="map"] .map-layout>aside{grid-column:1!important;grid-row:1!important;border-right:0!important;border-bottom:1px solid var(--cv-line)!important}body[data-page="map"] .map-layout>section{grid-column:1!important;grid-row:2!important;min-width:0!important}}\n@media(max-width:620px){.cv-whatsapp-help{display:none}.cv-consent-footer-line{justify-content:flex-start;flex-wrap:wrap}}\n`);

          {
            const file = 'frontend-react/src/pages/OriginalHomePage.tsx';
            let s = fs.readFileSync(file, 'utf8');
            if (!s.includes('MAIN_COMMON_CITIES')) s = replaceOnce(s, 'import { setPageSeo } from "../lib/seo";\n', 'import { setPageSeo } from "../lib/seo";\nimport { MAIN_COMMON_CITIES } from "../generated/main-static-options";\n', 'home import');
            if (!s.includes('const [searchKeyword')) {
              const component = s.indexOf('export default function OriginalHomePage()');
              const lang = s.indexOf('  const language = languageFromPath();\n', component);
              if (component < 0 || lang < 0) throw new Error('OriginalHomePage state target not found');
              const line = '  const language = languageFromPath();\n';
              const after = `${line}  const [searchKeyword, setSearchKeyword] = useState("");\n  const [searchCity, setSearchCity] = useState("");\n  const [searchCategory, setSearchCategory] = useState("");\n`;
              s = s.slice(0, lang) + after + s.slice(lang + line.length);
            }
            const formStart = s.indexOf('      <form className="cv-searchbar container"');
            const formEnd = s.indexOf('</form>', formStart);
            if (formStart < 0 || formEnd < 0) throw new Error('home form target not found');
            const form = `      <form id="cv-home-search" className="cv-searchbar container" onSubmit={(event) => { event.preventDefault(); const data = new FormData(event.currentTarget); const params = new URLSearchParams(); for (const key of ["keyword", "comune", "categoria"]) { const value = String(data.get(key) || "").trim(); if (value) params.set(key, value); } navigate(withLanguage(\`/catalogo\${params.size ? \`?\${params}\` : ""}\`, language)); }}>\n        <label className="cv-searchbar__wide"><span className="cv-searchbar__icon">⌕</span><span><b>{uiText("searchWhat", language)}</b><small data-search-preview>{searchKeyword || uiText("searchWhatHint", language)}</small></span><input id="cv-search-keyword" name="keyword" autoComplete="off" aria-label={uiText("searchWhat", language)} value={searchKeyword} onChange={(event) => setSearchKeyword(event.target.value)} /></label>\n        <label><span className="cv-searchbar__icon">⌖</span><span><b>{uiText("where", language)}</b><small data-city-preview>{searchCity || uiText("allCalabria", language)}</small></span><input id="cv-search-city" name="comune" autoComplete="off" aria-label={uiText("where", language)} list="cv-search-city-options" value={searchCity} onChange={(event) => setSearchCity(event.target.value)} /></label>\n        <datalist id="cv-search-city-options">{MAIN_COMMON_CITIES.map((city) => <option key={city} value={city} />)}</datalist>\n        <label><span className="cv-searchbar__icon">▦</span><span><b>{uiText("categories", language)}</b><small data-category-preview>{searchCategory || uiText("allCategories", language)}</small></span><select id="cv-search-category" name="categoria" aria-label={uiText("categories", language)} value={searchCategory} onChange={(event) => setSearchCategory(event.target.value)}><option value="">{uiText("allCategories", language)}</option>{CATEGORIES.map((category) => <option key={category} value={category}>{category}</option>)}</select></label>\n        <button type="submit" className="cv-searchbar__submit"><span aria-hidden="true">⌕</span>&nbsp; <span>{uiText("search", language)}</span></button>\n      </form>`;
            s = s.slice(0, formStart) + form + s.slice(formEnd + '</form>'.length);
            fs.writeFileSync(file, s);
          }

          {
            const file = 'frontend-react/src/components/Layout.tsx';
            let s = fs.readFileSync(file, 'utf8');
            if (!s.includes('data-language-value={lang}')) s = replaceOnce(s, 'className="cv-language-option" role="menuitem"', 'className="cv-language-option" data-language-value={lang} role="menuitem"', 'language option');
            fs.writeFileSync(file, s);
          }
          NODE

      - name: Build patched React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Assert generated route cascade
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('frontend-react/public/main-route-css.json','utf8'));
          const login=payload.routeCss['/login']||[], home=payload.routeCss['/']||[];
          if(login.some(x=>x.includes('redesign-final.css')||x.includes('header-unified.css')||x.includes('reference-replica.css'))) throw new Error(`login still has public redesign cascade: ${login.join(', ')}`);
          if(!home.some(x=>x.includes('redesign-final.css'))||!home.some(x=>x.includes('header-unified.css'))) throw new Error('home lost extended legacy cascade');
          if(!login.some(x=>x.includes('react-live-parity.css'))) throw new Error('login missing React adapter');
          console.log(`LOGIN_CSS=${login.length} HOME_CSS=${home.length}`);
          NODE

      - name: Commit patch to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/scripts/copy-legacy-assets.mjs frontend-react/public/assets/css/react-live-parity.css frontend-react/src/pages/OriginalHomePage.tsx frontend-react/src/components/Layout.tsx frontend-react/src/generated/main-route-css.ts frontend-react/public/main-route-css.json
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: align route shell and home with legacy'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"
