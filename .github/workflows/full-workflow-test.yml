name: Full workflow test launcher

# test WIF paths for backup and content automation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-workflow-test.yml'

permissions:
  contents: read
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avvia backup e automazioni contenuti
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run daily-backup.yml --ref main
          gh workflow run magazine-sync.yml --ref main -f mode=meta-token-check
          gh workflow run magazine-sync.yml --ref main -f mode=social-dry-run
          gh workflow run magazine-sync.yml --ref main -f mode=blog
          echo 'Test WIF backup/content accodati.'
