name: Full workflow test launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-workflow-test.yml'

permissions:
  contents: read
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Avvia tutti i workflow pubblici
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run configuration-test.yml --ref main
          gh workflow run verify.yml --ref main
          gh workflow run firebase-deploy.yml --ref main
          gh workflow run apps-script-deploy.yml --ref main
          gh workflow run daily-backup.yml --ref main
          gh workflow run magazine-sync.yml --ref main -f mode=meta-token-check
          gh workflow run magazine-sync.yml --ref main -f mode=social-dry-run
          gh workflow run magazine-sync.yml --ref main -f mode=blog
          gh workflow run seo-sync.yml --ref main
          gh workflow run smoke-browser.yml --ref main
          gh workflow run cleanup-old-workflow-runs.yml --ref main
          gh workflow run social-watchdog.yml --ref main -f force=false
          gh workflow run promo-story.yml --ref main -f force=false
          gh workflow run restore.yml --ref main -f backup_tag=TEST-ONLY-DO-NOT-RESTORE -f apply=false -f exact=false -f site_settings=false
          gh workflow run source-watch.yml --ref main -f force=false
          echo 'Tutti i workflow sono stati accodati.'
