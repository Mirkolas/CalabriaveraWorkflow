name: Full workflow test launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-workflow-test.yml'

permissions:
  contents: read
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avvia nuovo Firebase deploy WIF
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run firebase-deploy.yml --ref main
          echo 'Nuovo deploy WIF accodato.'
