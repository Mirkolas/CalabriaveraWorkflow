name: Cleanup old workflow runs

on:
  schedule:
    - cron: "0 3 * * 0" # tentativo 1
    - cron: "15 3 * * 0" # tentativo 2
    - cron: "30 3 * * 0" # tentativo 3
    - cron: "45 3 * * 0" # tentativo 4
    - cron: "0 4 * * 0" # tentativo 5
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-workflow-runs
  cancel-in-progress: false

jobs:
  retry_gate:
    uses: ./.github/workflows/scheduled-retry-gate.yml
    with:
      workflow_file: cleanup-old-workflow-runs.yml
      cadence_minutes: 10080
      anchor_offset_minutes: 4500

  cleanup:
    needs: retry_gate
    if: needs.retry_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete old runs keeping latest 30
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff=$(date -d '30 days ago' -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Elimino le run precedenti a: $cutoff, mantenendo sempre le 30 più recenti."

          mapfile -t runs < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )

          total=${#runs[@]}
          echo "Run trovate: $total"

          if (( total <= 30 )); then
            echo "Ci sono 30 run o meno: non elimino nulla."
            exit 0
          fi

          deleted=0
          kept=0

          for i in "${!runs[@]}"; do
            IFS=$'\t' read -r run_id created_at <<< "${runs[$i]}"

            if (( i < 30 )); then
              echo "Mantengo run recente $run_id ($created_at)"
              ((kept+=1))
              continue
            fi

            if [[ "$created_at" < "$cutoff" ]]; then
              echo "Elimino run $run_id ($created_at)"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$REPO/actions/runs/$run_id"
              ((deleted+=1))
            else
              echo "Mantengo run $run_id: ha meno di 30 giorni ($created_at)"
              ((kept+=1))
            fi
          done

          echo "Pulizia completata: eliminate $deleted run, mantenute $kept run."
