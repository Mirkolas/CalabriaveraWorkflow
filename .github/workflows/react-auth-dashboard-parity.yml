name: React migration - auth dashboard parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-auth-dashboard-parity.yml'
      - 'scripts/patch-react-auth-dashboard-parity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-auth-dashboard-parity
  cancel-in-progress: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply authenticated parity fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "849266aecbb0cecc02caf6ce4c834f0e6caf2e34"
          python3 automation/scripts/patch-react-auth-dashboard-parity.py
      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate auth and dashboard invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Conferma password' source/frontend-react/src/pages/AuthPage.tsx
          grep -q 'termsConsent' source/frontend-react/src/pages/AuthPage.tsx
          grep -q 'Privacy Policy' source/frontend-react/src/pages/AuthPage.tsx
          grep -q 'Note legali' source/frontend-react/src/pages/AuthPage.tsx
          grep -q 'reset-form' source/frontend-react/src/pages/AuthPage.tsx
          grep -q '60_000' source/frontend-react/src/pages/AuthPage.tsx
          grep -q 'loginGoogle(extra' source/frontend-react/src/lib/auth.ts
          grep -q 'loadDashboardBusinesses' source/frontend-react/src/lib/account.ts
          grep -q 'Area amministratore' source/frontend-react/src/pages/DashboardPage.tsx
          grep -q 'cv-analytics-grid' source/frontend-react/src/pages/DashboardPage.tsx
          grep -q 'Preferiti ricevuti' source/frontend-react/src/pages/DashboardPage.tsx
          grep -q 'Click contatti' source/frontend-react/src/pages/DashboardPage.tsx
          git -C source diff --check
      - name: Commit verified authenticated parity
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No authenticated parity changes needed.'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/src
          git -C source commit -m 'fix: match main auth and dashboard flows'
          git -C source push origin HEAD:react-migration
