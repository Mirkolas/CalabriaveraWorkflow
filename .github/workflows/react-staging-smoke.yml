name: React staging - Browser smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-staging-smoke.yml'

permissions:
  contents: read

concurrency:
  group: react-staging-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      SMOKE_BASE_URL: https://calabriavera.sonotacamirko.workers.dev

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica branch React dal repository privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Attendi il deployment Cloudflare della commit verificata
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(git -C source rev-parse HEAD)"
          echo "Commit attesa: $EXPECTED_SHA"
          for attempt in {1..30}; do
            DEPLOYED_SHA="$(curl --fail --silent --show-error --max-time 15 "$SMOKE_BASE_URL/build-version.txt?check=$attempt" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              echo "Staging aggiornato alla commit $EXPECTED_SHA"
              exit 0
            fi
            echo "Staging non ancora aggiornato ($attempt/30): ${DEPLOYED_SHA:-nessuna versione}"
            sleep 10
          done
          echo "::error::Cloudflare non ha pubblicato la commit $EXPECTED_SHA entro il tempo previsto"
          exit 1

      - name: Installa Playwright e Chromium isolati dal progetto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-react-smoke
          npm install --prefix /tmp/cv-react-smoke --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-react-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Verifica staging React nel browser reale
        working-directory: source
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-react-smoke/node_modules/playwright
        run: node tests/react-staging-smoke.cjs
