name: Temporary - Guard incremental backup baseline

on:
  push:
    paths:
      - '.github/workflows/backup-incremental-apply.yml'
      - 'scripts/patch-incremental-baseline-guard.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-react-migration-writer
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_BASE: 23373081131461ada113ced08dcae3dfddf4aac9
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - name: Checkout private React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact private base
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Apply explicit baseline guard
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-incremental-baseline-guard.py
          git -C source diff --check
      - name: Test backup guard offline
        working-directory: source
        run: |
          npm ci
          npm run test:backup
          node --check tools/backup/run.mjs
          grep -q "process.argv.includes('--baseline-v1')" tools/backup/run.mjs
          grep -q "incrementalSchemaVersion: activateIncrementalBaseline ? INCREMENTAL_SCHEMA_VERSION : 0" tools/backup/run.mjs
      - name: Commit only after green gate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git add tools/backup/run.mjs tests/backup.test.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: require explicit incremental backup baseline'
          git push origin HEAD:react-migration
