name: Temporary - Gate incremental business counters

on:
  push:
    paths:
      - '.github/workflows/backup-incremental-apply.yml'
      - 'scripts/patch-incremental-business-counters.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-react-migration-writer
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_BASE: bac01da1101103fe17e457005493f6ae385e0dfa
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact private base
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/tools/package-lock.json
            source/frontend-react/package-lock.json
      - name: Apply counter tracking patch
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-incremental-business-counters.py
          git -C source diff --check
      - name: Gate backup and React offline
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm --prefix tools ci --no-audit --no-fund
          npm --prefix frontend-react ci
          npm run test:backup
          node --check tools/backup/incremental.mjs
          cd frontend-react
          npx tsc --noEmit
      - name: Gate field isolation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "businesses: \['backupUpdatedAt','updatedAt','createdAt'\]" tools/backup/incremental.mjs
          grep -q "favoriteCount: f.increment(1), backupUpdatedAt: f.serverTimestamp()" frontend-react/src/lib/businesses.ts
          grep -q "\[field\]: f.increment(1), backupUpdatedAt: f.serverTimestamp()" frontend-react/src/lib/business-detail-interactions.ts
          grep -q "affectedKeys().hasOnly(\['favoriteCount','backupUpdatedAt'\])" firestore.rules
          grep -q "affectedKeys().hasOnly(\[field,'backupUpdatedAt'\])" firestore.rules
          grep -q "backupUpdatedAt == request.time" firestore.rules
      - name: Commit only after green gate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git add tools/backup/incremental.mjs frontend-react/src/lib/businesses.ts frontend-react/src/lib/business-detail-interactions.ts firestore.rules tests/backup.test.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: include business counters in incremental backup'
          git push origin HEAD:react-migration
