name: One-time - Dispatch Facebook auth deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-dispatch-facebook-auth.yml'

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch source deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"source-deploy","client_payload":{"reason":"facebook-auth"}}'
          echo "source-deploy dispatched"
