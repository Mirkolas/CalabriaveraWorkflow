name: Pin and run final React certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-certification-pin-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  pin-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Pin certified private SHA
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/react-final-migration-certification-v2.yml
          sed -i 's/^  EXPECTED_PRIVATE_SHA: .*/  EXPECTED_PRIVATE_SHA: 73bd67e616885cd386f92edde8a57b98470352f1/' "$file"
          git diff --check
          git config user.name 'CalabriaVera CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "$file"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: pin final React migration certification'
            git push origin HEAD:main
          fi
      - name: Dispatch final certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run react-final-migration-certification-v2.yml --ref main
