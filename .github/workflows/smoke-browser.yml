# Smoke test reale della produzione dopo ogni deploy Firebase riuscito su main.
name: Production - Browser smoke test

on:
  workflow_run:
    workflows: ["Firebase - Deploy CalabriaVera"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installa Playwright e Chromium isolati dal progetto
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-smoke
          npm install --prefix /tmp/cv-smoke --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Verifica CalabriaVera nel browser reale
        working-directory: source
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-smoke/node_modules/playwright
          SMOKE_BASE_URL: https://calabriavera.com
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: node tests/smoke-browser.cjs

      - name: Verifica Le Ninfee da Catalogo e Mappa
        working-directory: source
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-smoke/node_modules/playwright
          SMOKE_BASE_URL: https://calabriavera.com
        run: node tests/smoke-activity-routing.cjs
