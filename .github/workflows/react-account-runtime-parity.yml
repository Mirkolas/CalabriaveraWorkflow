name: React migration - account runtime parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-account-runtime-parity.yml'
      - 'scripts/patch-react-account-runtime-parity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-account-runtime-parity
  cancel-in-progress: true

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private access
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Assert expected migration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "176e190d29b20e2b430068a5c33450e15b7af277"
      - name: Apply account runtime parity
        run: python3 automation/scripts/patch-react-account-runtime-parity.py
      - name: Build React migration
        working-directory: source/frontend-react
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate account parity markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'export type AuthResult' source/frontend-react/src/lib/auth.ts
          grep -q 'queueUserEmailEvent' source/frontend-react/src/lib/auth.ts
          grep -q 'account_created' source/frontend-react/src/lib/auth.ts
          grep -q 'const finish' source/frontend-react/src/pages/AuthPage.tsx
          grep -q 'created' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'Ho verificato l’email' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'roleLabel' source/frontend-react/src/lib/account.ts
          grep -q 'I miei messaggi' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'password_changed' source/frontend-react/src/lib/account.ts
          git -C source diff --check
      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/src/lib/auth.ts frontend-react/src/lib/account.ts frontend-react/src/pages/AuthPage.tsx frontend-react/src/pages/ProfilePage.tsx
          git -C source commit -m 'fix: complete account runtime and profile parity'
          git -C source push origin HEAD:react-migration
