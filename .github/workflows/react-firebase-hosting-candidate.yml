name: React migration - Firebase Hosting candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-hosting-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-firebase-hosting-candidate
  cancel-in-progress: false

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Patch production-static compatibility
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Static Firebase hosting serves the checked-in public snapshots directly.
          p = Path('frontend-react/src/lib/public-data.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('/legacy-data/public-businesses-v1.json', '/assets/data/public-businesses-v1.json')
          text = text.replace('/legacy-data/public-blog-v1.json', '/assets/data/public-blog-v1.json')
          p.write_text(text, encoding='utf-8')

          # Production HTML must be indexable. The Worker still rewrites workers.dev to noindex.
          replace_once(
              'frontend-react/index.html',
              '<meta name="robots" content="noindex,nofollow" />',
              '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />'
          )

          # Keep R2 uploads on the Worker when the frontend is served by Firebase Hosting.
          p = Path('frontend-react/src/lib/business-editor.ts')
          text = p.read_text(encoding='utf-8')
          marker = 'const CREATE_RATE_KEY = "cv-react-business-create";\n'
          insert = marker + 'const R2_UPLOAD_WORKER = "https://calabriavera.sonotacamirko.workers.dev/api/images/upload";\n\nfunction r2UploadEndpoint() {\n  if (typeof location !== "undefined" && /(^|[.])calabriavera[.]com$/i.test(location.hostname)) return R2_UPLOAD_WORKER;\n  return "/api/images/upload";\n}\n'
          if marker not in text: raise SystemExit('business-editor marker missing')
          text = text.replace(marker, insert, 1)
          text = text.replace('const response = await fetch("/api/images/upload", {', 'const response = await fetch(r2UploadEndpoint(), {', 1)
          p.write_text(text, encoding='utf-8')

          # Strict CORS only for CalabriaVera production origins on the R2 upload endpoint.
          p = Path('frontend-react/worker.ts')
          text = p.read_text(encoding='utf-8')
          marker = 'const IMAGE_CDN_ORIGIN = "https://img.calabriavera.com";\n\nfunction apiJson'
          cors = '''const IMAGE_CDN_ORIGIN = "https://img.calabriavera.com";\nconst R2_UPLOAD_ORIGINS = new Set(["https://calabriavera.com", "https://www.calabriavera.com"]);\n\nfunction uploadCorsHeaders(request: Request) {\n  const origin = request.headers.get("origin") || "";\n  if (!R2_UPLOAD_ORIGINS.has(origin)) return null;\n  return {\n    "Access-Control-Allow-Origin": origin,\n    "Access-Control-Allow-Methods": "POST, OPTIONS",\n    "Access-Control-Allow-Headers": "Authorization, Content-Type, X-User-Id, X-Business-Id",\n    "Access-Control-Max-Age": "86400",\n    "Vary": "Origin",\n  };\n}\n\nfunction withUploadCors(request: Request, response: Response) {\n  const cors = uploadCorsHeaders(request);\n  if (!cors) return response;\n  const headers = new Headers(response.headers);\n  for (const [key, value] of Object.entries(cors)) headers.set(key, value);\n  return new Response(response.body, { status: response.status, statusText: response.statusText, headers });\n}\n\nfunction uploadPreflight(request: Request) {\n  const cors = uploadCorsHeaders(request);\n  if (!cors) return new Response(null, { status: 403, headers: { "Cache-Control": "no-store" } });\n  return new Response(null, { status: 204, headers: { ...cors, "Cache-Control": "public, max-age=86400" } });\n}\n\nfunction apiJson'''
          if marker not in text: raise SystemExit('worker CORS marker missing')
          text = text.replace(marker, cors, 1)
          old = '    if (request.method === "POST" && url.pathname === "/api/images/upload") return uploadBusinessImage(request, env);'
          new = '    if (request.method === "OPTIONS" && url.pathname === "/api/images/upload") return uploadPreflight(request);\n    if (request.method === "POST" && url.pathname === "/api/images/upload") return withUploadCors(request, await uploadBusinessImage(request, env));'
          if old not in text: raise SystemExit('worker upload route marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Prerender is deterministic even if Firestore is rate-limited during CI.
          p = Path('frontend-react/scripts/prerender-home.mjs')
          text = p.read_text(encoding='utf-8')
          old = '''  const [businessRows, blogRows] = await Promise.all([\n    queryCollection("businesses", "approved", BUSINESS_FIELDS),\n    queryCollection("blogPosts", "published", BLOG_FIELDS),\n  ]);\n  if (!businessRows.length) console.warn("Prerender businesses empty: runtime data loader will hydrate the page.");\n  if (!blogRows.length) console.warn("Prerender blog empty: runtime data loader will hydrate the page.");'''
          new = '''  let [businessRows, blogRows] = await Promise.all([\n    queryCollection("businesses", "approved", BUSINESS_FIELDS),\n    queryCollection("blogPosts", "published", BLOG_FIELDS),\n  ]);\n  const readSnapshot = async (name) => {\n    try {\n      const payload = JSON.parse(await readFile(resolve(root, "public/assets/data", name), "utf8"));\n      return Array.isArray(payload.items) ? payload.items : [];\n    } catch { return []; }\n  };\n  if (!businessRows.length) businessRows = await readSnapshot("public-businesses-v1.json");\n  if (!blogRows.length) blogRows = await readSnapshot("public-blog-v1.json");\n  if (!businessRows.length) console.warn("Prerender businesses empty: runtime Firestore loader will hydrate the page.");\n  if (!blogRows.length) console.warn("Prerender blog empty: runtime Firestore loader will hydrate the page.");'''
          if old not in text: raise SystemExit('prerender fallback marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          private_paths = [
            '/login','/registrazione','/profilo','/preferiti','/dashboard','/messaggi','/aggiungi-attivita','/backup','/admin','/admin/**'
          ]
          private_headers = []
          for lang in ['', '/en', '/fr', '/de', '/es']:
              for route in private_paths:
                  source = f'{lang}{route}' if lang else route
                  private_headers.append({
                      'source': source,
                      'headers': [{'key':'X-Robots-Tag','value':'noindex,nofollow'}]
                  })

          rewrites = []
          for lang in ['', '/en', '/fr', '/de', '/es']:
              for route in ['/', '/catalogo', '/blog']:
                  path = (lang + route) if lang else route
                  if route == '/':
                      path = lang or '/'
                  dest = (lang + route).rstrip('/') + '/index.html' if (lang or route != '/') else '/index.html'
                  if lang and route == '/': dest = lang + '/index.html'
                  rewrites.append({'source': path, 'destination': dest})
          rewrites.append({'source': '**', 'destination': '/app-shell.html'})

          config = {
            'hosting': {
              'public': 'frontend-react/dist',
              'cleanUrls': False,
              'trailingSlash': False,
              'ignore': ['firebase.react.json', '**/.*', '**/node_modules/**'],
              'rewrites': rewrites,
              'headers': [
                {'source': '**', 'headers': [
                  {'key':'Cache-Control','value':'public,max-age=0,must-revalidate'},
                  {'key':'Content-Security-Policy','value':"base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests"},
                  {'key':'Referrer-Policy','value':'strict-origin-when-cross-origin'},
                  {'key':'X-Content-Type-Options','value':'nosniff'},
                  {'key':'X-Frame-Options','value':'SAMEORIGIN'},
                  {'key':'Permissions-Policy','value':'geolocation=(self),camera=(),microphone=()'},
                ]},
                {'source': '/assets/**', 'headers': [{'key':'Cache-Control','value':'public,max-age=31536000,immutable'}]},
                {'source': '/assets/data/**', 'headers': [{'key':'Cache-Control','value':'public,max-age=120,s-maxage=300,stale-while-revalidate=86400'}]},
                *private_headers,
              ],
            }
          }
          Path('firebase.react.json').write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build React candidate
        working-directory: source/frontend-react
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/build-version.txt
          test "$(cat dist/build-version.txt)" = "$(git -C .. rev-parse HEAD)" || { echo 'build-version is expected to be pre-commit before patch commit'; true; }
          grep -q 'index,follow,max-image-preview:large' dist/index.html
          test -s dist/assets/data/public-businesses-v1.json
          test -s dist/assets/data/public-blog-v1.json
          grep -q 'Le Ninfee' dist/catalogo/index.html

      - name: Validate Firebase React config
        working-directory: source
        run: |
          set -euo pipefail
          node -e 'const x=require("./firebase.react.json"); if(x.hosting.public!=="frontend-react/dist") process.exit(1); if(!x.hosting.rewrites.some(r=>r.source==="**"&&r.destination==="/app-shell.html")) process.exit(2)'
          npx --yes firebase-tools@15.22.1 emulators:start --project demo-calabriavera --only hosting --config firebase.react.json > /tmp/firebase-hosting.log 2>&1 &
          echo $! > /tmp/firebase-hosting.pid
          for i in {1..40}; do curl -fsS http://127.0.0.1:5000/ >/dev/null && break; sleep 1; done
          for path in / /catalogo /mappa /blog /login /registrazione /privacy-policy /cookie-policy /assets/data/public-businesses-v1.json /assets/data/public-blog-v1.json; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' "http://127.0.0.1:5000$path")"
            echo "$path -> $code"
            test "$code" = 200
          done
          curl -fsS http://127.0.0.1:5000/catalogo | grep -q 'Le Ninfee'
          curl -fsSI http://127.0.0.1:5000/dashboard | tr -d '\r' | grep -qi '^x-robots-tag: noindex,nofollow'
          kill "$(cat /tmp/firebase-hosting.pid)" || true
          echo FIREBASE_REACT_HOSTING_EMULATOR_GREEN

      - name: Commit candidate only after green build and hosting emulator
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/index.html frontend-react/src/lib/public-data.ts frontend-react/src/lib/business-editor.ts frontend-react/worker.ts frontend-react/scripts/prerender-home.mjs firebase.react.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'deploy: prepare React for Firebase production hosting'
          git push origin HEAD:react-migration
          echo "REACT_FIREBASE_CANDIDATE_SHA=$(git rev-parse HEAD)"
