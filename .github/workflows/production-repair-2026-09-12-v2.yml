name: Production finalize - React Firebase Firestore R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-repair-2026-09-12-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production-finalize-react
  cancel-in-progress: false

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: calabriavera-images

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo '::error::PRIVATE_REPO mancante'; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo '::error::PAT repository privato mancante'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN mancante'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID mancante'; exit 1; }

      - name: Scarica runner pubblico
        uses: actions/checkout@v7
        with:
          path: workflow-repo
          persist-credentials: false

      - name: Scarica main privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Applica fix finali React
        run: node workflow-repo/scripts/finalize-react-production-2026-09-12.mjs source

      - name: Verifica diff
        shell: bash
        run: |
          set -euo pipefail
          git -C source diff --check -- \
            frontend-react/src/App.tsx \
            frontend-react/src/lib/businesses.ts \
            frontend-react/src/styles.css \
            frontend-react/index.html \
            frontend-react/firebase.react.json
          git -C source status --short

      - name: Suite completa repository privato
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: Build React prima del commit
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit privato senza Actions private
        id: commit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Public Workflow'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            frontend-react/src/App.tsx \
            frontend-react/src/lib/businesses.ts \
            frontend-react/src/styles.css \
            frontend-react/index.html \
            frontend-react/firebase.react.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da committare.'
          else
            git commit -m 'fix: finalize React production UI images and SEO [skip ci]'
            git push origin HEAD:main
          fi
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Private main: $sha"

      - name: Sincronizza tutti gli asset statici R2
        shell: bash
        run: |
          set -euo pipefail
          put() {
            local rel="$1" type="$2"
            test -s "source/$rel" || { echo "::error::Asset mancante: $rel"; exit 1; }
            echo "R2 <- $rel"
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/static/$rel" \
              --file "source/$rel" --content-type "$type" \
              --cache-control 'public, max-age=86400' --remote --force
          }
          put assets/Logo.webp image/webp
          put assets/Logo.png image/png
          put assets/favicon.ico image/x-icon
          put assets/favicon-16x16.png image/png
          put assets/favicon-32x32.png image/png
          put assets/apple-touch-icon.png image/png
          put assets/android-chrome-192x192.png image/png
          put assets/android-chrome-512x512.png image/png
          put assets/images/favicon-96.png image/png
          put assets/images/icon-192.png image/png
          put assets/images/icon-512.png image/png
          put assets/images/og-calabriavera.png image/png
          put assets/images/blog-default-events.png image/png
          put assets/images/blog-default-news.png image/png
          put assets/images/home/tropea-960.webp image/webp
          put assets/images/home/tropea-1600.webp image/webp
          put assets/images/home/sila-720.webp image/webp
          put assets/images/home/sila-1280.webp image/webp
          put assets/images/home/scilla-720.webp image/webp
          put assets/images/home/capo-colonna-720.webp image/webp
          put assets/flags/it.svg image/svg+xml
          put assets/flags/en.svg image/svg+xml
          put assets/flags/fr.svg image/svg+xml
          put assets/flags/de.svg image/svg+xml
          put assets/flags/es.svg image/svg+xml

      - name: Build finale sul nuovo SHA
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(tr -d '\r\n' < dist/build-version.txt)" = "${{ steps.commit.outputs.sha }}"

      - name: Autenticazione Firebase
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy React su calabriavera.com Firebase Hosting
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 deploy \
            --project calabriavera-e08d4 \
            --config firebase.react.json \
            --only hosting

      - name: Deploy Worker supporto R2 upload
        working-directory: source/frontend-react
        run: npx wrangler deploy

      - name: Verifica produzione reale
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() { curl --fail --silent --show-error --location --connect-timeout 8 --max-time 30 --retry 8 --retry-delay 3 --retry-all-errors "$@"; }

          for url in \
            https://img.calabriavera.com/static/assets/Logo.webp \
            https://img.calabriavera.com/static/assets/images/home/tropea-960.webp \
            https://img.calabriavera.com/static/assets/images/home/sila-720.webp \
            https://img.calabriavera.com/static/assets/images/home/scilla-720.webp \
            https://img.calabriavera.com/static/assets/images/home/capo-colonna-720.webp \
            https://img.calabriavera.com/static/assets/images/blog-default-events.png; do
            retry_curl --head "$url" >/dev/null
            echo "OK R2 $url"
          done

          version="$(retry_curl -H 'Cache-Control: no-cache' "https://calabriavera.com/build-version.txt?finalize=$GITHUB_RUN_ID" | tr -d '\r\n')"
          test "$version" = "$SHA"
          echo "OK .com build $version"

          home="$(retry_curl -H 'Cache-Control: no-cache' "https://calabriavera.com/?finalize=$GITHUB_RUN_ID")"
          printf '%s' "$home" | grep -Eqi '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"']index,follow'
          if printf '%s' "$home" | grep -Eqi '<meta[^>]+name=["'"']robots["'"'][^>]+noindex'; then echo '::error::.com contiene noindex'; exit 1; fi

          clean='/attivita/reggio-calabria/marina-di-gioiosa-ionica/b-e-b/le-ninfee-b-e-b'
          dated='/attivita/reggio-calabria/marina-di-gioiosa-ionica/b-e-b/le-ninfee-b-e-b2026-09-05'
          headers="$(curl --silent --show-error --head --connect-timeout 8 --max-time 30 "https://calabriavera.com${dated}")"
          printf '%s' "$headers" | grep -Eqi '^HTTP/[^ ]+ 301'
          printf '%s' "$headers" | grep -Fiq "location: https://calabriavera.com${clean}"

          retry_curl --head 'https://calabriavera-e08d4.web.app/assets/images/businesses/5e0b9fe8f00df39c29857919-1440.webp' >/dev/null
          retry_curl --head 'https://calabriavera.sonotacamirko.workers.dev/build-version.txt' >/dev/null
          echo 'Produzione verificata: React su .com, R2 statico, immagine legacy, SEO e redirect.'
