name: SEO sync

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: seo-production
  cancel-in-progress: false

jobs:
  sync:
    if: vars.FIREBASE_AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Carica configurazione SEO originale senza pubblicarla
        working-directory: source
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('.github/workflows/seo-sync.yml','utf8');
          const project=text.match(/FIREBASE_PROJECT_ID:\s*([^\s]+)/)?.[1];
          const site=text.match(/SITE_URL:\s*(https:\/\/[^\s]+)/)?.[1];
          if(!project || !site) throw new Error('Configurazione SEO originale non trovata');
          fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_PROJECT_ID=${project}\nSITE_URL=${site}\n`);
          NODE

      - name: Confronta contenuti e sitemap
        id: changes
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          SEO_FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(node tools/check-seo-sync.mjs 2>&1)"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            printf '%s\n' "$output"
            exit 0
          fi
          if printf '%s' "$output" | grep -Eqi 'RESOURCE_EXHAUSTED|Quota exceeded|HTTP 429|FIRESTORE_429|(^|[^0-9])429([^0-9]|$)'; then
            echo "::warning::Verifica SEO rinviata per quota temporanea."
            exit 0
          fi
          echo "::error::Verifica SEO non riuscita; dettagli del sorgente privato omessi."
          exit "$code"

      - name: Avvia rigenerazione SEO e deploy pubblico
        if: steps.changes.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run firebase-deploy.yml --ref main
