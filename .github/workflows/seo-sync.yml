name: SEO - Sincronizza attività e sitemap

on:
  schedule:
    - cron: '3 */12 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [source-seo-push]

permissions:
  contents: read
  actions: write

concurrency:
  group: seo-production
  cancel-in-progress: false

jobs:
  retry_gate:
    uses: ./.github/workflows/scheduled-retry-gate.yml
    with:
      workflow_file: seo-sync.yml
      cadence_minutes: 720
      anchor_offset_minutes: 3

  sync:
    needs: retry_gate
    if: needs.retry_gate.outputs.should_run == 'true' && vars.FIREBASE_AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Confronta i contenuti pubblici con la sitemap online
        id: changes
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
          SITE_URL: https://calabriavera.com
          GH_TOKEN: ${{ github.token }}
          SEO_FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(node tools/check-seo-sync.mjs 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$output" | grep -Eqi 'RESOURCE_EXHAUSTED|Quota exceeded|HTTP 429|FIRESTORE_429|(^|[^0-9])429([^0-9]|$)'; then
            echo "::warning::Verifica SEO fermata: quota Firestore esaurita. Nessun retry automatico nella stessa finestra."
            exit 75
          fi
          exit "$code"

      - name: Avvia rigenerazione SEO e deploy Firebase
        if: steps.changes.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run firebase-deploy.yml --ref main
