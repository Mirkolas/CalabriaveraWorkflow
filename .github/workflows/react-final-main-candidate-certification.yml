name: React final main candidate certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-main-candidate-certification.yml'

permissions:
  contents: read

env:
  CANDIDATE_SHA: 69b947782cbc7921cdbb3a489125c26632cee574
  ORACLE_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout public certification runner
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout exact final React candidate
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact pre-React oracle
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.ORACLE_SHA }}
          path: oracle
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pin exact candidate and oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C oracle rev-parse HEAD)" = "$ORACLE_SHA"
          git -C source merge-base --is-ancestor 4fd4763449d172d74ccf95d57fc38c47c31aed5d HEAD || {
            echo '::error::Final candidate does not contain the current Firestore-only main'; exit 1;
          }

      - name: Install application dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd source && npm ci --no-audit --no-fund)
          (cd oracle && npm ci --no-audit --no-fund)
          (cd source/frontend-react && npm ci --no-audit --no-fund)

      - name: Full repository regression suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Build pre-React oracle
        working-directory: oracle
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Build final React candidate
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Structural and semantic parity gate
        shell: bash
        run: |
          set -euo pipefail
          python runner/scripts/react-final-certification-v4.py

      - name: Verify production R2 static assets byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-r2-final
          assets=(
            assets/Logo.png
            assets/images/home/tropea-1600.webp
            assets/images/home/tropea-960.webp
            assets/images/home/sila-1280.webp
            assets/images/home/sila-720.webp
            assets/images/home/scilla-720.webp
            assets/images/home/capo-colonna-720.webp
          )
          for asset in "${assets[@]}"; do
            out="/tmp/cv-r2-final/$(basename "$asset")"
            test -f "oracle/dist/$asset" || { echo "::error::Oracle asset missing: $asset"; exit 1; }
            curl --fail --silent --show-error --location \
              --connect-timeout 5 --max-time 20 --retry 3 --retry-all-errors \
              --output "$out" "https://img.calabriavera.com/static/$asset"
            cmp "$out" "oracle/dist/$asset"
            echo "R2 exact: $asset"
          done

      - name: Install browser certification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-final-browser
          npm install --prefix /tmp/cv-final-browser --no-package-lock --no-save playwright@1.62.1 pixelmatch@7.1.0 pngjs@7.0.0
          /tmp/cv-final-browser/node_modules/.bin/playwright install --with-deps chromium
          cp runner/scripts/react-route-css-no-flash.mjs /tmp/cv-final-browser/no-flash.mjs
          cp runner/scripts/react-final-visual-v5.mjs /tmp/cv-final-browser/visual.mjs

      - name: Route transition no-flash gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cv-final-browser
          node no-flash.mjs "$GITHUB_WORKSPACE/source/frontend-react/dist"

      - name: Final visual parity desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cv-final-browser
          node visual.mjs "$GITHUB_WORKSPACE/oracle/dist" "$GITHUB_WORKSPACE/source/frontend-react/dist" /tmp/cv-final-visual

      - name: Upload final certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-final-main-candidate-certification
          path: /tmp/cv-final-visual
          if-no-files-found: ignore
          retention-days: 7
