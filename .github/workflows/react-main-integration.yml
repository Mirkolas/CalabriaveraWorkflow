name: React main integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-main-integration.yml'

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: af00be9f26aa4df74606de314fb8db6d7a25cbe2
  CERTIFIED_REACT_SHA: edf19df9024d099a6f35133b815284c7545f3cec

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout private main as data only
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          path: source
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Merge certified React into current main
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CERTIFIED_REACT_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          git config user.name 'CalabriaVera Public Runner'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b react-main-integration-final "$EXPECTED_MAIN_SHA"
          git merge --no-ff "$CERTIFIED_REACT_SHA" -m 'merge: integrate certified React migration [skip ci]'
          echo "INTEGRATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate complete repository after merge
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^1 HEAD
          npm ci --no-audit --no-fund
          npm test

      - name: Validate React production build after merge
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Push validated integration branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/react-main-integration-final
          echo "Integrated SHA: $(git rev-parse HEAD)"
