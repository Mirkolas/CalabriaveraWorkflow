name: React main integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-main-integration.yml'

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: af00be9f26aa4df74606de314fb8db6d7a25cbe2
  CERTIFIED_REACT_SHA: edf19df9024d099a6f35133b815284c7545f3cec

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout public integration runner
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout private main as data only
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          path: source
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Merge certified React and resolve only expected conflicts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          git fetch origin "$CERTIFIED_REACT_SHA"
          git config user.name 'CalabriaVera Public Runner'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B react-main-integration-final "$EXPECTED_MAIN_SHA"

          set +e
          git merge --no-ff "$CERTIFIED_REACT_SHA" -m 'merge: integrate certified React migration [skip ci]'
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts: %s\n' "${conflicts[*]}"
            test "${#conflicts[@]}" -eq 2
            test "${conflicts[0]}" = 'frontend-react/src/components/Layout.tsx'
            test "${conflicts[1]}" = 'frontend-react/src/pages/OriginalHomePage.tsx'
            git checkout --theirs -- "${conflicts[@]}"
            python "$GITHUB_WORKSPACE/runner/scripts/react-main-integration-resolve.py" "$GITHUB_WORKSPACE/source"
            git add "${conflicts[@]}"
            git diff --check --cached
            git commit -m 'merge: certified React plus current R2 architecture [skip ci]'
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          echo "INTEGRATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Validate complete repository after merge
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^1 HEAD
          npm ci --no-audit --no-fund
          npm test

      - name: Validate React production build after merge
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Push validated integration branch without private Actions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/react-main-integration-final
          echo "Integrated SHA: $(git rev-parse HEAD)"
