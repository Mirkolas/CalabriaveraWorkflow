name: React exact built 404 CSS diagnostic v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-exact-404-css-diagnostic-v2.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: f16b18b93d91b4e1ac278351c6ef7507f3f7a04e
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build exact outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd legacy && npm ci && npm run build)
          cd source
          python3 ../workflow/scripts/patch-react-exact-404.py
          cd frontend-react && npm ci && npm run build
      - name: Install browser and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-404-d2
          npm install --prefix /tmp/cv-404-d2 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-404-d2/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-404-d2/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-404-d2-l.log 2>&1 & echo $! >/tmp/cv-404-d2-l.pid
          nohup /tmp/cv-404-d2/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-404-d2-r.log 2>&1 & echo $! >/tmp/cv-404-d2-r.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4184/404.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - name: Dump winning 404 CSS contract
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-404-d2/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          async function inspect(origin,path,viewport){
            const ctx=await browser.newContext({viewport,serviceWorkers:'block'});
            await ctx.addInitScript(()=>{const now=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(now).toISOString(),expiresAt:new Date(now+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});
            const p=await ctx.newPage();await p.goto(origin+path,{waitUntil:'domcontentloaded'});await p.locator('main h1').waitFor({state:'visible'});await p.waitForTimeout(150);
            const out=await p.evaluate(()=>{
              const targets={section:'main section.section.container',h1:'main h1',actions:'main .form-actions',button:'main .form-actions .button',main:'main#main-content'};
              const result={};
              const props=['display','position','width','maxWidth','margin','padding','fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','color','gap','gridTemplateColumns','alignItems','boxSizing'];
              function matched(el){
                const rows=[];
                for(const sh of [...document.styleSheets]){
                  let rules;try{rules=sh.cssRules}catch{continue}
                  const walk=list=>{for(const rule of [...list]){if(rule.cssRules){walk(rule.cssRules);continue}if(!rule.selectorText)continue;try{if(el.matches(rule.selectorText)){const css=rule.style?.cssText||'';if(/font|line-height|letter-spacing|width|margin|padding|display|gap|grid|align|box-sizing|color/.test(css))rows.push({sheet:sh.href?new URL(sh.href,location.href).pathname:'inline',selector:rule.selectorText,css})}}catch{}}};
                  walk(rules);
                }
                return rows;
              }
              for(const [name,sel] of Object.entries(targets)){
                const el=document.querySelector(sel);if(!el){result[name]=null;continue}
                const r=el.getBoundingClientRect(),s=getComputedStyle(el),computed={rect:{x:r.x,y:r.y,w:r.width,h:r.height}};for(const k of props)computed[k]=s[k];result[name]={computed,rules:matched(el)};
              }
              return result;
            });
            await p.close();await ctx.close();return out;
          }
          for(const [mode,viewport] of modes){
            console.log(`=== ${mode} LEGACY ===`);console.log(JSON.stringify(await inspect('http://127.0.0.1:4184','/404.html',viewport),null,2));
            console.log(`=== ${mode} REACT ===`);console.log(JSON.stringify(await inspect('http://127.0.0.1:4185','/questa-pagina-non-esiste',viewport),null,2));
          }
          await browser.close();
          NODE
      - name: Stop
        if: always()
        run: |
          kill "$(cat /tmp/cv-404-d2-l.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-404-d2-r.pid 2>/dev/null)" 2>/dev/null || true
