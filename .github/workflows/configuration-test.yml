name: Configuration test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configuration-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_TOKEN" || { echo "::error::Token per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installa, testa, valida e compila
        working-directory: source
        run: |
          npm ci
          npm --prefix tools ci --no-audit --no-fund
          npm test
          npm run test:backup
          npm run validate
          npm run build

      - name: Verifica riferimenti originali senza mostrare valori
        env:
          FIREBASE_WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          FIREBASE_BACKUP_SERVICE_ACCOUNT: ${{ vars.FIREBASE_BACKUP_SERVICE_ACCOUNT }}
          FIREBASE_RESTORE_SERVICE_ACCOUNT: ${{ vars.FIREBASE_RESTORE_SERVICE_ACCOUNT }}
          FIREBASE_BLOG_WIF_PROVIDER: ${{ vars.FIREBASE_BLOG_WIF_PROVIDER }}
          FIREBASE_BLOG_SERVICE_ACCOUNT: ${{ vars.FIREBASE_BLOG_SERVICE_ACCOUNT }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CALABRIAVERA_BACKUP_ENCRYPTION_KEY: ${{ secrets.CALABRIAVERA_BACKUP_ENCRYPTION_KEY }}
          FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in FIREBASE_WIF_PROVIDER FIREBASE_DEPLOY_SERVICE_ACCOUNT FIREBASE_BACKUP_SERVICE_ACCOUNT FIREBASE_RESTORE_SERVICE_ACCOUNT FIREBASE_BLOG_WIF_PROVIDER FIREBASE_BLOG_SERVICE_ACCOUNT CLASPRC_JSON CALABRIAVERA_BACKUP_ENCRYPTION_KEY FIREBASE_AUTH_HASH_CONFIG; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::Configurazione originale non valorizzata: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then echo "Variabili e secret principali del privato risultano disponibili."; fi
