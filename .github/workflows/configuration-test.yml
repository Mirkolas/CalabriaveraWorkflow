name: Configuration test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configuration-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT }}
      RUNNER_ENABLED: ${{ secrets.RUNNER_ENABLED }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_WIF_PROVIDER: ${{ secrets.FIREBASE_WIF_PROVIDER }}
      FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      FIREBASE_BACKUP_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_BACKUP_SERVICE_ACCOUNT }}
      FIREBASE_BACKUP_WIF_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_BACKUP_WIF_SERVICE_ACCOUNT }}
      FIREBASE_RESTORE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_RESTORE_SERVICE_ACCOUNT }}
      FIREBASE_RESTORE_WIF_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_RESTORE_WIF_SERVICE_ACCOUNT }}
      FIREBASE_BLOG_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_BLOG_SERVICE_ACCOUNT }}
      FIREBASE_BLOG_WIF_PROVIDER: ${{ secrets.FIREBASE_BLOG_WIF_PROVIDER }}
      FIREBASE_BLOG_WIF_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_BLOG_WIF_SERVICE_ACCOUNT }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      FIREBASE_AUTH_HASH_CONFIG: ${{ secrets.FIREBASE_AUTH_HASH_CONFIG }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}
      ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
      SOCIAL_FACEBOOK_ENABLED: ${{ secrets.SOCIAL_FACEBOOK_ENABLED }}
      SOCIAL_INSTAGRAM_ENABLED: ${{ secrets.SOCIAL_INSTAGRAM_ENABLED }}
      SOCIAL_MAX_DESTINATION_ATTEMPTS: ${{ secrets.SOCIAL_MAX_DESTINATION_ATTEMPTS }}
      PROMO_FACEBOOK_STORY_IMAGE_URL: ${{ secrets.PROMO_FACEBOOK_STORY_IMAGE_URL }}
      PROMO_INSTAGRAM_STORY_IMAGE_URL: ${{ secrets.PROMO_INSTAGRAM_STORY_IMAGE_URL }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

    steps:
      - name: Verifica configurazione senza mostrare valori
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in PRIVATE_REPO PRIVATE_REPO_PAT FIREBASE_PROJECT_ID SITE_URL BACKUP_ENCRYPTION_KEY FIREBASE_AUTH_HASH_CONFIG CLASPRC_JSON APPS_SCRIPT_ID APPS_SCRIPT_DEPLOYMENT_ID META_GRAPH_VERSION META_PAGE_ID META_IG_USER_ID META_PAGE_ACCESS_TOKEN META_INSTAGRAM_ACCESS_TOKEN ADMIN_ALERT_EMAIL SOCIAL_FACEBOOK_ENABLED SOCIAL_INSTAGRAM_ENABLED SOCIAL_MAX_DESTINATION_ATTEMPTS PROMO_FACEBOOK_STORY_IMAGE_URL PROMO_INSTAGRAM_STORY_IMAGE_URL SMOKE_TEST_EMAIL SMOKE_TEST_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Configurazione mancante: $name"
              missing=1
            fi
          done
          if [[ "$SITE_URL" != https://* ]]; then
            echo "::error::SITE_URL non valido"
            missing=1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && { [ -z "$FIREBASE_WIF_PROVIDER" ] || [ -z "$FIREBASE_DEPLOY_SERVICE_ACCOUNT" ]; }; then
            echo "::error::Autenticazione Firebase deploy non configurata"
            missing=1
          fi
          if [ -z "$FIREBASE_BACKUP_SERVICE_ACCOUNT" ] && { [ -z "$FIREBASE_WIF_PROVIDER" ] || [ -z "$FIREBASE_BACKUP_WIF_SERVICE_ACCOUNT" ]; }; then
            echo "::error::Autenticazione Firebase backup non configurata"
            missing=1
          fi
          if [ -z "$FIREBASE_RESTORE_SERVICE_ACCOUNT" ] && { [ -z "$FIREBASE_WIF_PROVIDER" ] || [ -z "$FIREBASE_RESTORE_WIF_SERVICE_ACCOUNT" ]; }; then
            echo "::error::Autenticazione Firebase restore non configurata"
            missing=1
          fi
          if [ -z "$FIREBASE_BLOG_SERVICE_ACCOUNT" ] && { [ -z "$FIREBASE_BLOG_WIF_PROVIDER" ] || [ -z "$FIREBASE_BLOG_WIF_SERVICE_ACCOUNT" ]; }; then
            echo "::error::Autenticazione Firebase automazioni non configurata"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          node -e 'JSON.parse(process.env.CLASPRC_JSON); console.log("CLASPRC_JSON: formato JSON valido")'
          for name in FIREBASE_SERVICE_ACCOUNT FIREBASE_BACKUP_SERVICE_ACCOUNT FIREBASE_RESTORE_SERVICE_ACCOUNT FIREBASE_BLOG_SERVICE_ACCOUNT; do
            if [ -n "${!name:-}" ]; then
              NAME="$name" node -e 'JSON.parse(process.env[process.env.NAME]); console.log(process.env.NAME + ": formato JSON valido")'
            fi
          done
          echo "Configurazione completa: valori presenti e formati base validi."

      - name: Prova accesso al repository privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT }}
          ref: main
          path: private-source-test
          persist-credentials: false

      - name: Verifica struttura minima del sorgente
        shell: bash
        run: |
          set -euo pipefail
          test -f private-source-test/package.json
          test -d private-source-test/.github/workflows
          echo "Checkout privato e struttura sorgente: OK"
