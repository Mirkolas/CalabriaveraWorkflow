name: React migration - main inline business snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-inline-business-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-inline-business-snapshot
  cancel-in-progress: true

jobs:
  capture-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      MAIN_BASE_URL: https://calabriavera.com
    steps:
      - name: Verify private access
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Assert expected migration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "e8d9997e12fca448001146f94e71c61a1d7995ad"
      - name: Capture exact user-facing inline public businesses from main
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 "$MAIN_BASE_URL/catalogo" -o /tmp/main-catalogo.html
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/main-catalogo.html','utf8');
          const match=html.match(/<script\b[^>]*id=["']cv-public-snapshot["'][^>]*>([\s\S]*?)<\/script>/i);
          if(!match) throw new Error('cv-public-snapshot missing from main HTML');
          const snapshot=JSON.parse(match[1]);
          const items=Array.isArray(snapshot.businesses)?snapshot.businesses:[];
          const total=Number(snapshot.totals?.businesses ?? items.length);
          console.log(`user-facing main inline businesses=${items.length}; declared total=${total}; with tourism=${items.length+24}`);
          if(items.length<20) throw new Error(`user-facing main inline businesses unexpectedly small: ${items.length}`);
          if(total<items.length) throw new Error(`invalid main total ${total} < ${items.length}`);
          const ids=new Set(items.map(x=>String(x.id||'')));
          if(ids.size!==items.length) throw new Error('duplicate business ids in main inline snapshot');
          const out={version:Number(snapshot.version||3),generatedAt:String(snapshot.generatedAt||new Date().toISOString()),items};
          fs.mkdirSync('source/frontend-react/public/assets/data',{recursive:true});
          fs.writeFileSync('source/frontend-react/public/assets/data/public-businesses-v1.json',JSON.stringify(out));
          fs.writeFileSync('/tmp/inline-count.txt',String(items.length));
          fs.writeFileSync('/tmp/main-total.txt',String(total));
          NODE
      - name: Build React migration
        working-directory: source/frontend-react
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate bundled snapshot
        shell: bash
        run: |
          set -euo pipefail
          count="$(cat /tmp/inline-count.txt)"
          test "$count" -ge 20
          node <<'NODE'
          const fs=require('fs');
          for(const p of ['source/frontend-react/public/assets/data/public-businesses-v1.json','source/frontend-react/dist/assets/data/public-businesses-v1.json']){
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            if(!Array.isArray(j.items)||j.items.length<20) throw new Error(`${p}: incomplete snapshot`);
          }
          NODE
          git -C source diff --check
      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'Inline snapshot already current.'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/public/assets/data/public-businesses-v1.json
          git -C source commit -m 'fix: bundle main inline public businesses'
          git -C source push origin HEAD:react-migration
