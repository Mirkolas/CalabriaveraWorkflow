name: React exact backup parity - shell v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-exact-shell-parity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-exact-shell-parity-v1
  cancel-in-progress: true

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - name: Verify access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"; test -n "$PRIVATE_REPO_PAT"

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false

      - name: Checkout exact backup
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact legacy shell contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          grep -q 'BRAND_LOGO_URL = "/assets/Logo.webp"' legacy/assets/js/components.js
          grep -q 'class="container header-inner"' legacy/assets/js/components.js
          grep -q 'class="desktop-account"' legacy/assets/js/components.js
          grep -q 'class="menu-button" id="menu-toggle"' legacy/assets/js/components.js
          grep -q 'class="container primary-mobile" id="mobile-nav"' legacy/assets/js/components.js
          grep -q 'link.href="/assets/css/language-modern.css"' legacy/assets/js/components.js
          ! grep -q 'social-links' legacy/assets/js/components.js
          ! grep -q 'cv-whatsapp-help' legacy/assets/js/components.js

      - name: Apply exact shell patch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../workflow/scripts/patch-react-exact-shell.py

      - name: Assert source shell contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const LOGO = "/assets/Logo.webp"' frontend-react/src/components/Layout.tsx
          grep -q '<header className="site-header cv-header">' frontend-react/src/components/Layout.tsx
          grep -q '<div className="container header-inner">' frontend-react/src/components/Layout.tsx
          grep -q 'className="desktop-account"' frontend-react/src/components/Layout.tsx
          grep -q 'className="menu-button" id="menu-toggle"' frontend-react/src/components/Layout.tsx
          grep -q 'id="mobile-nav" className="container primary-mobile"' frontend-react/src/components/Layout.tsx
          ! grep -q 'social-links' frontend-react/src/components/Layout.tsx
          ! grep -q 'cv-whatsapp-help' frontend-react/src/components/Layout.tsx
          grep -q 'const parityStyles = \["/assets/css/language-modern.css", liveParityCss\]' frontend-react/scripts/copy-legacy-assets.mjs

      - name: Build React and validate generated stylesheet lists
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          cd ..
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const payload=JSON.parse(fs.readFileSync('frontend-react/public/main-route-css.json','utf8'));
          const checks={
            '/':'index.html','/catalogo':'catalogo.html','/mappa':'mappa.html','/blog':'blog.html','/login':'login.html','/registrazione':'registrazione.html','/privacy-policy':'privacy-policy.html','/cookie-policy':'cookie-policy.html','/termini':'termini.html','/note-legali':'note-legali.html','/chi-siamo':'chi-siamo.html','/contatti':'contatti.html'
          };
          for(const [route,file] of Object.entries(checks)){
            const html=fs.readFileSync(path.join('../legacy',file),'utf8');
            const expected=[...html.matchAll(/<link\b[^>]*\brel=["']stylesheet["'][^>]*\bhref=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1]).filter(x=>x.startsWith('/assets/css/'));
            expected.push('/assets/css/language-modern.css','/assets/css/react-live-parity.css?v=20260912-2');
            const actual=payload.routeCss[route]||[];
            const clean=x=>String(x).split('?')[0];
            if(actual.length!==expected.length || actual.some((x,i)=>clean(x)!==clean(expected[i]))) throw new Error(`${route} CSS mismatch\nexpected=${expected.join(',')}\nactual=${actual.join(',')}`);
            if(route!=='/' && actual.some(x=>x.includes('header-unified.css'))) throw new Error(`${route} unexpected header-unified`);
          }
          console.log('EXACT_ROUTE_CSS_GREEN');
          NODE

      - name: Install browser comparison tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-shell-gate
          npm install --prefix /tmp/cv-shell-gate --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-shell-gate/node_modules/.bin/playwright install --with-deps chromium

      - name: Start exact backup and React
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-shell-gate/node_modules/.bin/serve legacy -l 4182 >/tmp/cv-shell-legacy.log 2>&1 & echo $! >/tmp/cv-shell-legacy.pid
          nohup /tmp/cv-shell-gate/node_modules/.bin/serve -s source/frontend-react/dist -l 4183 >/tmp/cv-shell-react.log 2>&1 & echo $! >/tmp/cv-shell-react.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4182/index.html >/dev/null && curl -fsS http://127.0.0.1:4183/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Compare shell styles backup to React
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-shell-gate/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url),{chromium}=require(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const routes=[['home','/index.html','/'],['catalogo','/catalogo.html','/catalogo'],['mappa','/mappa.html','/mappa'],['blog','/blog.html','/blog'],['login','/login.html','/login'],['privacy','/privacy-policy.html','/privacy-policy'],['chi-siamo','/chi-siamo.html','/chi-siamo']];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          const rgba=(value)=>value.replace(/\s+/g,'');
          const consent={version:3,scope:'technical-only',savedAt:new Date().toISOString(),expiresAt:new Date(Date.now()+30*864e5).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'gate'};
          try{
            for(const [mode,viewport] of modes){
              const context=await browser.newContext({viewport,serviceWorkers:'block'});
              await context.addInitScript(v=>{try{localStorage.setItem('cv-cookie-consent-v3',JSON.stringify(v))}catch{}},consent);
              for(const [name,legacyPath,reactPath] of routes){
                const result={};
                for(const [side,origin,p] of [['legacy','http://127.0.0.1:4182',legacyPath],['react','http://127.0.0.1:4183',reactPath]]){
                  const page=await context.newPage();
                  await page.goto(origin+p,{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(1200);
                  result[side]=await page.locator('header.site-header').evaluate(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect(),logo=el.querySelector('.brand-logo')?.getBoundingClientRect();return {bg:s.backgroundColor,color:s.color,height:Math.round(r.height),position:s.position,shadow:s.boxShadow,logoW:logo?Math.round(logo.width):0,logoH:logo?Math.round(logo.height):0}});
                  result[side].footerChildren=await page.locator('footer.footer .footer-grid').evaluate(el=>el.children.length).catch(()=>0);
                  await page.close();
                }
                const a=result.legacy,b=result.react;
                console.log(mode,name,JSON.stringify(a),JSON.stringify(b));
                if(rgba(a.bg)!==rgba(b.bg)) throw new Error(`${mode}/${name} header bg ${a.bg} != ${b.bg}`);
                if(Math.abs(a.height-b.height)>1) throw new Error(`${mode}/${name} header height ${a.height} != ${b.height}`);
                if(a.position!==b.position) throw new Error(`${mode}/${name} header position ${a.position} != ${b.position}`);
                if(Math.abs(a.logoW-b.logoW)>1 || Math.abs(a.logoH-b.logoH)>1) throw new Error(`${mode}/${name} logo ${a.logoW}x${a.logoH} != ${b.logoW}x${b.logoH}`);
                if(a.footerChildren!==b.footerChildren) throw new Error(`${mode}/${name} footer child count ${a.footerChildren} != ${b.footerChildren}`);
              }
              await context.close();
            }
            console.log('EXACT_SHELL_GREEN');
          }finally{await browser.close()}
          NODE

      - name: Commit exact shell to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'; git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/components/Layout.tsx frontend-react/src/generated/main-route-css.ts frontend-react/public/main-route-css.json
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: match React shell and CSS cascade to exact pre-React backup'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-shell-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-shell-react.pid 2>/dev/null)" 2>/dev/null || true
