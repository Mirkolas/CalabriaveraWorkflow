name: React exact backup parity - auth v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-exact-auth-parity-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-exact-auth-parity-v2
  cancel-in-progress: true

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - name: Verify access
        run: test -n "$PRIVATE_REPO" && test -n "$PRIVATE_REPO_PAT"

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false

      - name: Checkout exact backup
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify source, patch and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('legacy/assets/js/auth-page.js').read_text()
          required=['Accesso effettuato','Account sospeso. Contatta l’assistenza per informazioni.','resetForm.elements.resetEmail.value = form.elements.email.value','Creazione account e invio verifica…','Accesso con Google…']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'exact auth contract changed: {missing}')
          PY
          cd source
          python3 ../workflow/scripts/patch-react-exact-auth.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('frontend-react/src/pages/AuthPage.tsx').read_text()
          required=['watchUser','Accesso effettuato','accountNotice','id="auth-root"','id="auth-status"','id="reset-status"','Creazione account e invio verifica…','Accesso con Google…']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'patched auth source missing: {missing}')
          PY
          cd frontend-react
          npm ci
          npm run build

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-auth-v2
          npm install --prefix /tmp/cv-auth-v2 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-auth-v2/node_modules/.bin/playwright install --with-deps chromium

      - name: Start backup and React
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-auth-v2/node_modules/.bin/serve legacy -l 4184 >/tmp/cv-auth-v2-legacy.log 2>&1 & echo $! >/tmp/cv-auth-v2-legacy.pid
          nohup /tmp/cv-auth-v2/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-auth-v2-react.log 2>&1 & echo $! >/tmp/cv-auth-v2-react.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4184/login.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/login >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1

      - name: Enforce exact guest auth parity
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-auth-v2/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true}),fail=[];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          const cases=[['login','/login.html','/login','Bentornato'],['register','/registrazione.html','/registrazione','Crea il tuo account']];
          const consent={version:3,scope:'technical-only',savedAt:new Date().toISOString(),expiresAt:new Date(Date.now()+30*864e5).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'gate'};
          async function open(ctx,origin,path){const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));await p.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});await p.locator('#auth-root .auth-shell').waitFor({state:'visible',timeout:15000});return{p,errors}}
          async function snap(p){return p.evaluate(()=>{const card=document.querySelector('#auth-root .card')?.getBoundingClientRect(),form=document.querySelector('#auth-form');return{h1:document.querySelector('#auth-root h1')?.textContent?.trim()||'',card:card?{x:card.x,y:card.y,width:card.width}:null,fields:[...form?.querySelectorAll('input')||[]].map(x=>({name:x.name,type:x.type,id:x.id,required:x.required})),hasStatus:Boolean(document.querySelector('#auth-status'))}})}
          try{
            for(const [mode,viewport] of modes){
              const ctx=await browser.newContext({viewport,serviceWorkers:'block'});await ctx.addInitScript(v=>{try{localStorage.setItem('cv-cookie-consent-v3',JSON.stringify(v));localStorage.removeItem('cv-consent')}catch{}},consent);
              for(const [name,lp,rp,title] of cases){
                const L=await open(ctx,'http://127.0.0.1:4184',lp),R=await open(ctx,'http://127.0.0.1:4185',rp),a=await snap(L.p),b=await snap(R.p),m=[];
                if(a.h1!==title||b.h1!==title)m.push(`h1:${a.h1}/${b.h1}`);if(JSON.stringify(a.fields)!==JSON.stringify(b.fields))m.push('fields');if(!a.hasStatus||!b.hasStatus)m.push('status');
                if(!a.card||!b.card)m.push('card');else{if(Math.abs(a.card.width-b.card.width)>2)m.push(`width:${a.card.width}/${b.card.width}`);if(Math.abs(a.card.x-b.card.x)>2)m.push(`x:${a.card.x}/${b.card.x}`);if(Math.abs(a.card.y-b.card.y)>3)m.push(`y:${a.card.y}/${b.card.y}`)}
                if(R.errors.length)m.push(`react-errors:${R.errors.join(';')}`);console.log(`${mode}/${name}: ${m.length?m.join('|'):'OK'}`);if(m.length)fail.push({mode,name,m,a,b});await L.p.close();await R.p.close();
              }
              for(const [side,origin,path] of [['legacy','http://127.0.0.1:4184','/login.html'],['react','http://127.0.0.1:4185','/login']]){const {p}=await open(ctx,origin,path);await p.locator('#auth-form input[name="email"]').fill('parity@example.com');await p.locator('#reset').click();const input=p.locator('#reset-form input[name="resetEmail"]');await input.waitFor({state:'visible'});const value=await input.inputValue();if(value!=='parity@example.com')fail.push({mode,side,test:'reset-prefill',value});await p.close()}
              const R=await open(ctx,'http://127.0.0.1:4185','/login?suspended=1');const status=(await R.p.locator('#auth-status').textContent()||'').trim();if(!status.includes('Account sospeso. Contatta l’assistenza per informazioni.'))fail.push({mode,test:'react-suspended-contract',status});await R.p.close();
              await ctx.close();
            }
          }finally{await browser.close()}
          if(fail.length){console.error(JSON.stringify(fail,null,2));process.exit(1)}console.log('EXACT_AUTH_GREEN');
          NODE

      - name: Commit exact auth to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/AuthPage.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: match auth flow to exact pre-React backup'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-auth-v2-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-auth-v2-react.pid 2>/dev/null)" 2>/dev/null || true
