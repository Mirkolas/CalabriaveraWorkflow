name: Prune obsolete workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-unused-workflows.yml'

permissions:
  contents: write

concurrency:
  group: prune-obsolete-workflows
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
      - name: Remove obsolete one-shot and duplicate workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/react-*.yml
          rm -f .github/workflows/refresh-parity-*.yml
          rm -f .github/workflows/dispatch-final-css-language-indexing.yml
          rm -f .github/workflows/fix-r2-java21.yml
          rm -f .github/workflows/legacy-final-css-bundle-map-v1.yml
          rm -f .github/workflows/social-watchdog.yml
          rm -f .github/workflows/promo-story.yml

          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/source-watch.yml')
          s = p.read_text()
          s = s.replace('apps-script-deploy.yml firebase-deploy.yml magazine-sync.yml promo-story.yml seo-sync.yml', 'apps-script-deploy.yml firebase-deploy.yml magazine-sync.yml seo-sync.yml')
          s = s.replace("            promo: config('promo-story.yml'),\n", '')
          s = s.replace('            apps: forced, deploy: forced, magazine: forced, promo: false, seo: forced,', '            apps: forced, deploy: forced, magazine: forced, seo: forced,')
          s = s.replace('            if (triggered(files, workflows.promo) && message.includes(\'[promo-story-now]\')) result.promo = true;\n', '')
          s = s.replace('          RUN_PROMO: ${{ steps.source.outputs.promo }}\n', '')
          s = s.replace('          [ "$RUN_PROMO" = "true" ] && dispatch source-promo-story-push || true\n', '')
          p.write_text(s)
          PY

          rm -f .github/workflows/prune-unused-workflows.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo 'Nessuna pulizia necessaria.'
            exit 0
          fi
          git commit -m 'chore: remove obsolete and duplicate workflows'
          git push origin HEAD:main
