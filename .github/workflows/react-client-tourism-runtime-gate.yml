name: React client tourism runtime gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-client-tourism-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing $(git -C .. rev-parse HEAD)"
          npm ci
          npm run build

      - name: Install Chromium and static server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-runtime-gate
          npm install --prefix /tmp/cv-runtime-gate --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-runtime-gate/node_modules/.bin/playwright install --with-deps chromium

      - name: Start built app
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-runtime-gate/node_modules/.bin/serve -s source/frontend-react/dist -l 4175 >/tmp/cv-runtime-gate.log 2>&1 &
          echo $! >/tmp/cv-runtime-gate.pid
          for attempt in {1..30}; do
            curl -fsS --max-time 3 http://127.0.0.1:4175/catalogo >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-runtime-gate.log || true
          exit 1

      - name: Verify post-hydration Catalog and Map
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-runtime-gate/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url);
          const { chromium }=require(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          try {
            const context=await browser.newContext({serviceWorkers:'block',viewport:{width:1365,height:900}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));

            await page.goto('http://127.0.0.1:4175/catalogo',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#results .activity-item',{timeout:15000});
            await page.waitForTimeout(2500);
            const catalogText=(await page.locator('body').innerText()).toLowerCase();
            const cards=await page.locator('#results .activity-item').count();
            const resultCount=(await page.locator('#result-count').innerText()).trim();
            console.log(`catalog count=${resultCount} cards=${cards}`);
            if(!catalogText.includes('53 attività trovate')) throw new Error(`CATALOG_TOTAL_MISMATCH: ${resultCount}`);
            if(cards!==18) throw new Error(`CATALOG_INITIAL_CARDS_${cards}`);
            if(!catalogText.includes('isola di dino')) throw new Error('CATALOG_TOURISM_MISSING');

            await page.goto('http://127.0.0.1:4175/mappa',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('.leaflet-container',{timeout:15000});
            await page.waitForTimeout(3500);
            const mapText=(await page.locator('body').innerText()).toLowerCase();
            const clusterCount=await page.locator('.cv-map-cluster-shell').count();
            const pinCount=await page.locator('.cv-map-pin-shell').count();
            const mapCount=(await page.locator('#map-count').innerText()).trim();
            console.log(`map count=${mapCount} clusters=${clusterCount} pins=${pinCount}`);
            if(!mapText.includes('53 attività sulla mappa')) throw new Error(`MAP_TOTAL_MISMATCH: ${mapCount}`);
            if(clusterCount<1) throw new Error(`MAP_CLUSTERS_MISSING pins=${pinCount}`);
            if(errors.length) throw new Error(`PAGE_ERRORS: ${errors.join(' | ')}`);
            await context.close();
            console.log('CLIENT_TOURISM_RUNTIME_GREEN');
          } finally { await browser.close(); }
          NODE

      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/cv-runtime-gate.pid 2>/dev/null)" 2>/dev/null || true
