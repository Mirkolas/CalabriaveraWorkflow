name: Cloudflare - Deploy produzione completo
# Un solo percorso di deploy aggiorna prima Cloudflare e poi il fallback Firebase.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cloudflare-deploy-request
  cancel-in-progress: false

jobs:
  request-production-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Avvia build live, test, upload R2 e deploy coerente
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run firebase-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
