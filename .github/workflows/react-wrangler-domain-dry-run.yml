name: React migration - Wrangler domain dry run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-wrangler-domain-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      TEST_SHA: 7a95c570f470bb59e81da376795d7a5e14878301
    steps:
      - name: Checkout exact failed Cloudflare revision
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: ${{ env.TEST_SHA }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install and build exact React revision
        working-directory: source/frontend-react
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Validate Wrangler domain configuration without deploying
        working-directory: source/frontend-react
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir /tmp/cv-wrangler-dry
          test -s /tmp/cv-wrangler-dry/index.js
          echo "WRANGLER_DOMAIN_DRY_RUN_GREEN=$TEST_SHA"
