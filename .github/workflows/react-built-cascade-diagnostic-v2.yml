name: React built cascade diagnostic v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-built-cascade-diagnostic-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 5f145eee5a37c4d765a758f01b83e61e62c3ef0c
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Patch current React and build exact outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd source && python3 ../workflow/scripts/patch-react-built-cascade-parity.py)
          grep -Fq '<div id="site-header">' source/frontend-react/src/components/Layout.tsx
          grep -Fq '<div id="site-footer">' source/frontend-react/src/components/Layout.tsx
          grep -Fq 'cv-legacy-heading-weight-reset' source/frontend-react/src/styles.css
          (cd legacy && npm ci && npm run build)
          (cd source/frontend-react && npm ci && npm run build)
          if grep -Fq 'portal-refresh.css' source/frontend-react/public/assets/css/responsive.css; then echo 'portal-refresh import still active in React responsive.css'; exit 1; fi
          echo BUILT_CASCADE_PATCH_OK
      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-cascade-v2
          npm install --prefix /tmp/cv-cascade-v2 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-cascade-v2/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-cascade-v2/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-cascade-v2-l.log 2>&1 & echo $! >/tmp/cv-cascade-v2-l.pid
          nohup /tmp/cv-cascade-v2/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-cascade-v2-r.log 2>&1 & echo $! >/tmp/cv-cascade-v2-r.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4184/404.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/questa-pagina-non-esiste >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - name: Compare exact built shell typography and primary runtime
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-cascade-v2/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const routes=[
            ['404','/404.html','/questa-pagina-non-esiste'],
            ['about','/chi-siamo.html','/chi-siamo'],['contacts','/contatti.html','/contatti'],
            ['privacy','/privacy-policy.html','/privacy-policy'],['cookies','/cookie-policy.html','/cookie-policy'],
            ['terms','/termini.html','/termini'],['legal','/note-legali.html','/note-legali'],
            ['login','/login.html','/login'],['register','/registrazione.html','/registrazione'],
            ['home','/index.html','/'],['catalog','/catalogo.html','/catalogo'],['map','/mappa.html','/mappa'],['blog','/blog.html','/blog']
          ];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          const near=(a,b,t=.2)=>a!=null&&b!=null&&Math.abs(Number(a)-Number(b))<=t;
          async function snap(origin,path,viewport,name){
            const ctx=await browser.newContext({viewport,serviceWorkers:'block'});
            await ctx.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});
            const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));
            await p.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});
            await p.locator('main').waitFor({state:'attached',timeout:15000});
            if(name==='catalog') await p.waitForFunction(()=>document.querySelector('#result-count')?.textContent?.trim().startsWith('53 '),null,{timeout:15000}).catch(()=>{});
            if(name==='map') await p.waitForFunction(()=>/53/.test(document.querySelector('#map-count')?.textContent||document.body.textContent||''),null,{timeout:15000}).catch(()=>{});
            if(name==='blog') await p.waitForFunction(()=>document.querySelectorAll('#blog-list article').length>=12,null,{timeout:15000}).catch(()=>{});
            await p.waitForTimeout(550);
            const d=await p.evaluate(()=>{const q=s=>document.querySelector(s),r=e=>{const x=e?.getBoundingClientRect();return x?{x:x.x,y:x.y,w:x.width,h:x.height}:null},h=q('main h1'),hs=h?getComputedStyle(h):null,head=q('.site-header'),heads=head?getComputedStyle(head):null,inner=q('.header-inner'),footer=q('.footer'),footerGrid=q('.footer-grid');return {page:document.body.dataset.page||'',title:document.title,robots:q('meta[name="robots"]')?.getAttribute('content')||'',canonical:q('link[rel="canonical"]')?.getAttribute('href')||'',header:r(head),inner:r(inner),headerStyle:heads?{background:heads.backgroundColor,color:heads.color,position:heads.position}:null,h1:h?.textContent?.trim()||'',h1Rect:r(h),h1Style:hs?{font:hs.fontFamily,size:hs.fontSize,weight:hs.fontWeight,line:hs.lineHeight,letter:hs.letterSpacing,color:hs.color}:null,footer:r(footer),footerGrid:r(footerGrid),resultCount:q('#result-count')?.textContent?.trim()||'',cards:document.querySelectorAll('#results > *').length,mapCount:q('#map-count')?.textContent?.trim()||'',blogCards:document.querySelectorAll('#blog-list article').length,siteHeaderWrapper:!!q('#site-header'),siteFooterWrapper:!!q('#site-footer')};});d.errors=errors;await p.close();await ctx.close();return d;
          }
          const failures=[];
          for(const [mode,vp] of modes){for(const [name,lp,rp] of routes){const a=await snap('http://127.0.0.1:4184',lp,vp,name),b=await snap('http://127.0.0.1:4185',rp,vp,name),m=[];
            for(const key of ['h','x','w']) if(!near(a.header?.[key],b.header?.[key],.2))m.push(`header.${key}:${a.header?.[key]}/${b.header?.[key]}`);
            for(const key of ['h','x','w']) if(!near(a.inner?.[key],b.inner?.[key],.2))m.push(`inner.${key}:${a.inner?.[key]}/${b.inner?.[key]}`);
            if(JSON.stringify(a.headerStyle)!==JSON.stringify(b.headerStyle))m.push(`headerStyle:${JSON.stringify(a.headerStyle)}/${JSON.stringify(b.headerStyle)}`);
            if(a.h1!==b.h1)m.push(`h1-text:${a.h1}/${b.h1}`);
            if(a.h1Style&&b.h1Style&&JSON.stringify(a.h1Style)!==JSON.stringify(b.h1Style))m.push(`h1Style:${JSON.stringify(a.h1Style)}/${JSON.stringify(b.h1Style)}`);
            if(a.h1Rect&&b.h1Rect){for(const key of ['x','y','w','h'])if(!near(a.h1Rect[key],b.h1Rect[key],.5))m.push(`h1.${key}:${a.h1Rect[key]}/${b.h1Rect[key]}`)}
            if(name==='404'){for(const k of ['title','robots','canonical'])if(a[k]!==b[k])m.push(`${k}:${a[k]}/${b[k]}`)}
            if(name==='catalog'&&(!b.resultCount.startsWith('53 ')||b.cards!==18))m.push(`catalog-runtime:${b.resultCount}/${b.cards}`);
            if(name==='map'&&!/53/.test(b.mapCount||''))m.push(`map-runtime:${b.mapCount}`);
            if(name==='blog'&&b.blogCards!==12)m.push(`blog-runtime:${b.blogCards}`);
            if(!b.siteHeaderWrapper||!b.siteFooterWrapper)m.push('missing-shell-wrapper');if(b.errors.length)m.push(`errors:${b.errors.join(';')}`);
            const row={mode,name,m,legacy:a,react:b};console.log('CASCADE_V2_ROW '+JSON.stringify(row));if(m.length)failures.push(row);
          }}
          await browser.close();console.log(`CASCADE_V2_FAILURES=${failures.length}`);if(failures.length)console.log('CASCADE_V2_SUMMARY '+JSON.stringify(failures.map(x=>({mode:x.mode,name:x.name,m:x.m}))));
          NODE
      - name: Stop
        if: always()
        run: |
          kill "$(cat /tmp/cv-cascade-v2-l.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-cascade-v2-r.pid 2>/dev/null)" 2>/dev/null || true
