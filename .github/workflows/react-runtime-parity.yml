name: React migration - runtime parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-runtime-parity.yml'
      - 'scripts/patch-react-runtime-parity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private-repo access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply runtime parity fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-react-runtime-parity.py

      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Validate bundled legal and runtime markers
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend-react/src/generated/legal-content.ts
          grep -q 'La Calabria raccontata da chi la vive' frontend-react/src/generated/legal-content.ts
          grep -q '15. Aggiornamenti' frontend-react/src/generated/legal-content.ts
          grep -q 'for (let attempt = 0; attempt < 4' frontend-react/worker.ts
          grep -q 'async function retry<T>' frontend-react/src/lib/public-data.ts
          ! grep -q 'fetch(source' frontend-react/src/pages/LegalPage.tsx

      - name: Commit verified runtime parity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No runtime parity changes needed."
            exit 0
          fi
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react
          git commit -m "fix: bundle legal pages and harden public data parity"
          git push origin HEAD:react-migration
