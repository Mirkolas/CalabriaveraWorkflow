name: Blog automatico - RSS e OpenData

on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '44 */2 * * *'
    - cron: '11 1-23/2 * * *'
    - cron: '38 1-23/2 * * *'
    - cron: '5 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operazione da eseguire'
        type: choice
        required: true
        default: blog
        options:
          - blog
          - meta-token-check
          - social-watchdog
          - social-dry-run
          - social-publish
          - promo-story-watchdog
          - promo-story-publish
  repository_dispatch:
    types: [source-magazine-push]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: backend-automation-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'blog' }}
  cancel-in-progress: false

jobs:
  retry_gate:
    uses: ./.github/workflows/scheduled-retry-gate.yml
    with:
      workflow_file: magazine-sync.yml
      cadence_minutes: 240
      anchor_offset_minutes: 17

  import:
    needs: retry_gate
    if: needs.retry_gate.outputs.should_run == 'true' && vars.BLOG_AUTOMATION_DISABLED != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Carica configurazione originale senza pubblicarla
        working-directory: source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('.github/workflows/magazine-sync.yml','utf8');
          const project=text.match(/FIREBASE_PROJECT_ID:\s*([^\s]+)/)?.[1];
          const site=text.match(/SITE_URL:\s*(https:\/\/[^\s]+)/)?.[1];
          const admin=text.match(/ADMIN_ALERT_EMAIL:\s*([^\s]+)/)?.[1];
          if(!project || !site || !admin) throw new Error('Configurazione originale automazioni non trovata');
          console.log(`::add-mask::${project}`);
          console.log(`::add-mask::${site}`);
          console.log(`::add-mask::${admin}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_PROJECT_ID=${project}\nSITE_URL=${site}\nADMIN_ALERT_EMAIL=${admin}\n`);
          NODE

      - name: Autentica Google Cloud con WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_BLOG_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_BLOG_SERVICE_ACCOUNT }}

      - name: Installa dipendenze tools
        working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund

      - name: Controlla validità e scadenza token Meta
        continue-on-error: true
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'meta-token-check')
        working-directory: source
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "06" ]; then
            echo "Controllo token Meta non dovuto in questa finestra."
            exit 0
          fi
          node tools/check-meta-token-expiry.mjs

      - name: Controlla tutte le fonti e pubblica i nuovi contenuti
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'blog')
        working-directory: source
        env:
          NODE_OPTIONS: --import=./tools/source-fetch-compat.mjs
          AUTOMATION_INTERVAL_MINUTES: '240'
          AUTOMATION_LOCK_MINUTES: '35'
          AUTOMATION_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'blog') || (github.event_name == 'repository_dispatch' && github.event.client_payload.magazine_force == true) }}
        run: |
          node tools/automation-cadence-runner.mjs magazine-site -- bash -lc '
            set -euo pipefail
            export MAGAZINE_CYCLE_STARTED_AT_MS=$(date +%s%3N)
            node tools/enforce-source-rights.mjs
            # Il registro sorgenti e gia stato allineato nello step precedente: gli
            # importer possono evitare di riscrivere la stessa configurazione.
            export SOURCE_REGISTRY_ENFORCED=true
            node tools/cleanup-ingv-magnitude.mjs
            set +e
            node tools/sync-magazine-v2.mjs; rss_code=$?
            node tools/sync-tourism-opendata.mjs; tourism_code=$?
            node tools/sync-regional-opendata.mjs; regional_code=$?
            set -e

            # Una sola scansione di blogPosts per accodare tutti gli elementi importati
            # nel ciclo, invece di ripetere la stessa query dopo ogni sorgente.
            node tools/queue-new-magazine-items.mjs

            # Le scansioni storiche sono manutenzione: eseguirle una volta al giorno
            # evita di rileggere migliaia di documenti ad ogni ciclo.
            if [ "$(date -u +%H)" = "01" ]; then
              node tools/reconcile-magazine.mjs
              node tools/enforce-positive-magazine.mjs
              node tools/backfill-blog-covers.mjs
            fi

            node tools/publish-magazine-batch.mjs
            if [ "$rss_code" -ne 0 ] && [ "$tourism_code" -ne 0 ] && [ "$regional_code" -ne 0 ]; then exit 1; fi
          '

      - name: Pubblica la coppia Social se dovuta
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'social-watchdog' || inputs.mode == 'social-dry-run' || inputs.mode == 'social-publish')) || (github.event_name == 'repository_dispatch' && (github.event.client_payload.social_dry_run == true || github.event.client_payload.social_publish == true))
        working-directory: source
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}
          SOCIAL_FACEBOOK_ENABLED: ${{ vars.SOCIAL_FACEBOOK_ENABLED }}
          SOCIAL_INSTAGRAM_ENABLED: ${{ vars.SOCIAL_INSTAGRAM_ENABLED }}
          SOCIAL_FACEBOOK_STORY_ENABLED: 'false'
          SOCIAL_INSTAGRAM_STORY_ENABLED: 'false'
          SOCIAL_MAX_POST_AGE_HOURS: '8760'
          SOCIAL_MAX_DESTINATION_ATTEMPTS: ${{ vars.SOCIAL_MAX_DESTINATION_ATTEMPTS || '3' }}
          SOCIAL_FORCE_INSTAGRAM_REPUBLISH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.social_republish_instagram == true }}
          SOCIAL_FORCE_POST_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.social_republish_ricadi == true && 'ext-b531af8d21e352c377ddff4c712d' || '' }}
          SOCIAL_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'social-dry-run') || (github.event_name == 'repository_dispatch' && github.event.client_payload.social_dry_run == true) }}
          AUTOMATION_INTERVAL_MINUTES: '120'
          AUTOMATION_LOCK_MINUTES: '35'
          AUTOMATION_ADVANCE_ON_FAILURE: 'true'
          AUTOMATION_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'social-publish') || (github.event_name == 'repository_dispatch' && github.event.client_payload.social_publish == true) }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SOCIAL_DRY_RUN" = "true" ]; then
            node tools/check-meta-config.mjs
            node tools/publish-social-pair.mjs
          else
            node tools/automation-cadence-runner.mjs social-feed -- bash -lc '
              node tools/check-meta-config.mjs
              node tools/publish-social-pair.mjs
            '
          fi

      - name: Pubblica Story promozionale se dovuta
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'promo-story-watchdog' || inputs.mode == 'promo-story-publish'))
        working-directory: source
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}
          SOCIAL_FACEBOOK_ENABLED: ${{ vars.SOCIAL_FACEBOOK_ENABLED }}
          SOCIAL_INSTAGRAM_ENABLED: ${{ vars.SOCIAL_INSTAGRAM_ENABLED }}
          PROMO_STORY_TARGET: both
          PROMO_STORY_DRY_RUN: 'false'
          AUTOMATION_INTERVAL_MINUTES: '1440'
          AUTOMATION_LOCK_MINUTES: '30'
          AUTOMATION_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'promo-story-publish' }}
        shell: bash
        run: |
          set -euo pipefail
          private_version="$(git rev-parse HEAD | sha256sum | cut -c1-16)"
          export PROMO_STORY_IMAGE_URL="${SITE_URL}/assets/Story-Promo_instagram-facebook.png?v=${private_version}"
          export PROMO_FACEBOOK_STORY_IMAGE_URL="${SITE_URL}/assets/Story-Promo_instagram-facebook.png?v=${private_version}"
          export PROMO_INSTAGRAM_STORY_IMAGE_URL="${SITE_URL}/assets/Story-Promo_instagram-safe.png?v=${private_version}"
          node tools/automation-cadence-runner.mjs promo-story -- bash -lc '
            set -euo pipefail
            for base in "$PROMO_FACEBOOK_STORY_IMAGE_URL" "$PROMO_INSTAGRAM_STORY_IMAGE_URL"; do
              ok=0
              for attempt in $(seq 1 40); do
                url="${base}&check=${attempt}"
                status=$(curl -L -sS -o /tmp/story.png -w "%{http_code}" "$url" || true)
                type=$(file -b --mime-type /tmp/story.png 2>/dev/null || true)
                size=$(wc -c < /tmp/story.png 2>/dev/null || echo 0)
                if [ "$status" = "200" ] && [ "$type" = "image/png" ] && [ "$size" -gt 25000 ]; then ok=1; break; fi
                sleep 10
              done
              test "$ok" = "1"
            done
            node tools/check-meta-config.mjs
            node tools/publish-promo-story.mjs
          '
