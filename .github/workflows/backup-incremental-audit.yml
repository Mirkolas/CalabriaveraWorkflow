name: Temporary - Incremental backup mutation audit

on:
  push:
    paths:
      - '.github/workflows/backup-incremental-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_BASE: 09a2677b99508d41750325855048cfa66e9c5867
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          fetch-depth: 1
      - name: Verify base
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
      - name: Inventory Firestore mutation call sites
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Firebase SDK mutations ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' --glob '!frontend-react/dist/**' --glob '!frontend-react/dist-ssr/**' \
            '\b(setDoc|addDoc|updateDoc|deleteDoc|writeBatch|runTransaction|batch\.set|batch\.update|batch\.delete|transaction\.set|transaction\.update|transaction\.delete)\b' \
            assets frontend-react tools apps-script scripts tests firestore.rules || true
          echo '=== REST/Admin mutations ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' --glob '!frontend-react/dist/**' --glob '!frontend-react/dist-ssr/**' \
            '(documents:commit|documents:batchWrite|method:[[:space:]]*["'"'](PATCH|DELETE)["'"']|\.delete\(|deleteDocument|updateDocument)' \
            tools apps-script scripts assets frontend-react || true
          echo '=== Existing audit/change-log markers ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' '(_cvBackupChanges|auditEvent|adminActions|updatedAt|deletedAt)' assets frontend-react tools apps-script firestore.rules | head -n 500 || true
