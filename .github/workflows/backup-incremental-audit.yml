name: Temporary - Incremental backup mutation audit

on:
  push:
    paths:
      - '.github/workflows/backup-incremental-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_BASE: 09a2677b99508d41750325855048cfa66e9c5867
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          fetch-depth: 1
      - name: Verify base
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
      - name: Inventory Firestore mutation call sites
        shell: bash
        run: |
          set -euo pipefail
          find assets frontend-react tools apps-script scripts tests -type f \
            \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.gs' \) \
            ! -path '*/node_modules/*' ! -path '*/dist/*' ! -path '*/dist-ssr/*' -print0 > /tmp/cv-files
          echo '=== Firebase SDK mutations ==='
          xargs -0 grep -nEH '\b(setDoc|addDoc|updateDoc|deleteDoc|writeBatch|runTransaction|batch\.(set|update|delete)|transaction\.(set|update|delete))\b' < /tmp/cv-files || true
          echo '=== REST/Admin mutations ==='
          xargs -0 grep -nEH 'documents:(commit|batchWrite)|deleteDocument|updateDocument|\.delete\(' < /tmp/cv-files || true
          echo '=== Existing audit/change-log markers ==='
          xargs -0 grep -nEH '_cvBackupChanges|auditEvent|adminActions|updatedAt|deletedAt' < /tmp/cv-files | head -n 800 || true
          echo '=== Rules references ==='
          grep -nE '_cvBackupChanges|adminActions|auditLogs|allow (create|update|delete|write)' firestore.rules || true
