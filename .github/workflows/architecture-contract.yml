name: Architecture Contract - Firebase Firestore R2 Worker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-deploy]
  push:
    branches: [main]
    paths:
      - '.github/workflows/architecture-contract.yml'
      - '.github/workflows/magazine-sync.yml'
      - '.github/workflows/cloudflare-r2-static-images.yml'
      - '.github/workflows/cloudflare-r2-migrate-business-images.yml'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read

concurrency:
  group: architecture-contract
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT repository privato mancante"; exit 1; }

      - name: Scarica repository workflow
        uses: actions/checkout@v7
        with:
          path: workflow-repo
          persist-credentials: false

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verifica architettura runtime definitiva
        working-directory: source/frontend-react
        run: node scripts/verify-runtime-architecture.mjs

      - name: Verifica assenza D1 e presenza R2
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const fail = message => {
            console.error(`::error::${message}`);
            process.exitCode = 1;
          };

          const wranglerPath = 'source/frontend-react/wrangler.jsonc';
          const wrangler = fs.readFileSync(wranglerPath, 'utf8');
          if (/"d1_databases"|\[\[d1_databases\]\]/i.test(wrangler)) {
            fail('D1 non può essere collegato al Cloudflare Worker del sito.');
          }
          if (!/"binding"\s*:\s*"IMAGES"/.test(wrangler)) {
            fail('Binding R2 IMAGES mancante dal Worker del sito.');
          }
          if (!/"bucket_name"\s*:\s*"calabriavera-images"/.test(wrangler)) {
            fail('Il binding IMAGES deve puntare al bucket calabriavera-images.');
          }

          const obsoletePrivate = [
            'source/frontend-react/d1',
            'source/frontend-react/scripts/build-d1-seed.mjs',
            'source/tools/lib/d1-workflow-store.mjs',
          ];
          for (const file of obsoletePrivate) {
            if (fs.existsSync(file)) fail(`Artefatto D1 obsoleto ancora presente nel privato: ${file}`);
          }

          const workflowDir = 'workflow-repo/.github/workflows';
          const forbidden = [
            /AUTOMATION_STATE_BACKEND\s*:\s*d1/i,
            /\bD1_DATABASE\b/,
            /wrangler@4\s+d1/i,
          ];
          for (const name of fs.readdirSync(workflowDir).filter(name => name.endsWith('.yml') || name.endsWith('.yaml'))) {
            if (name === 'architecture-contract.yml') continue;
            const file = path.join(workflowDir, name);
            const text = fs.readFileSync(file, 'utf8');
            for (const pattern of forbidden) {
              if (pattern.test(text)) fail(`Uso D1 vietato trovato in ${name}: ${pattern}`);
            }
          }

          if (process.exitCode) process.exit(process.exitCode);
          console.log('Architettura: Firebase Auth/Firestore + R2 + Worker; D1 rimosso.');
          NODE

      - name: Verifica migrazione immagini R2 a letture Firestore limitate
        shell: bash
        run: |
          set -euo pipefail
          script=source/tools/admin/migrate-business-images-r2.mjs
          node --check "$script"
          grep -Fq 'scanPaged' "$script"
          grep -Fq 'FIRESTORE_QUOTA_EXHAUSTED' "$script"
          grep -Fq 'MIGRATE_PAGE_SIZE' "$script"
          grep -Fq 'MIGRATE_SCAN_LIMIT' "$script"
          grep -Fq 'orderBy(FieldPath.documentId())' "$script"
          if grep -Fq "db.collection('businesses').get()" "$script"; then
            echo "::error::La migrazione immagini non può ripristinare una scansione completa di businesses."
            exit 1
          fi
          if grep -Fq "db.collectionGroup('images').get()" "$script"; then
            echo "::error::La migrazione immagini non può ripristinare una scansione completa collectionGroup images."
            exit 1
          fi
          echo "Migrazione immagini R2: sintassi e limiti Firestore verificati."
