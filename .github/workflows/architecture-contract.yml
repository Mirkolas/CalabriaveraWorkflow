name: Architecture Contract - Firebase Firestore R2 Worker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-deploy]
  push:
    branches: [main]
    paths:
      - '.github/workflows/architecture-contract.yml'
      - '.github/workflows/magazine-sync.yml'
      - '.github/workflows/cloudflare-r2-migrate-business-images.yml'
      - '.github/workflows/cloudflare-worker-r2-api.yml'
      - '.github/workflows/firebase-deploy.yml'
      - '.github/workflows/daily-backup.yml'
      - '.github/workflows/restore.yml'

permissions:
  contents: read

concurrency:
  group: architecture-contract
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT repository privato mancante"; exit 1; }

      - name: Scarica repository workflow
        uses: actions/checkout@v7
        with:
          path: workflow-repo
          persist-credentials: false

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verifica architettura runtime definitiva
        working-directory: source/frontend-react
        run: node scripts/verify-runtime-architecture.mjs

      - name: Verifica Worker senza D1 e con R2
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const wrangler = fs.readFileSync('source/frontend-react/wrangler.jsonc', 'utf8');
          if (/"d1_databases"|\[\[d1_databases\]\]/i.test(wrangler)) throw new Error('D1 binding presente nel Worker');
          if (!/"binding"\s*:\s*"IMAGES"/.test(wrangler)) throw new Error('Binding R2 IMAGES mancante');
          if (!/"bucket_name"\s*:\s*"calabriavera-images"/.test(wrangler)) throw new Error('Bucket R2 IMAGES non corretto');
          console.log('Worker: D1 assente, R2 IMAGES presente.');
          NODE

      - name: Verifica artefatti D1 privati rimossi
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const obsolete = [
            'source/frontend-react/d1',
            'source/frontend-react/scripts/build-d1-seed.mjs',
            'source/tools/lib/d1-workflow-store.mjs',
          ];
          const found = obsolete.filter(file => fs.existsSync(file));
          if (found.length) throw new Error(`Artefatti D1 ancora presenti: ${found.join(', ')}`);
          console.log('Privato: artefatti D1 rimossi.');
          NODE

      - name: Verifica tool runtime privati senza riferimenti D1
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const offenders = [];
          const forbidden = /d1-workflow-store|\bd1Query\b|\bd1Rows\b|wrangler\s+(?:@\S+\s+)?d1\b|(?:AUTOMATION_STATE_BACKEND|WORKFLOW_STATE_BACKEND)\s*[,=:]\s*["']?d1/i;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(?:mjs|cjs|js)$/.test(entry.name)) {
                const text = fs.readFileSync(full, 'utf8');
                if (forbidden.test(text)) offenders.push(full.replace(/^source\//, ''));
              }
            }
          }
          walk('source/tools');
          if (offenders.length) throw new Error(`Riferimenti D1 nei tool runtime: ${offenders.join(', ')}`);
          console.log('Tool runtime privati: solo Firestore, nessun riferimento D1.');
          NODE

      - name: Verifica indici Firestore quota-safe
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('source/firestore.indexes.json', 'utf8'));
          const indexes = config.indexes || [];
          function hasIndex(expected) {
            return indexes.some(index => index.collectionGroup === 'blogPosts' && expected.every(([fieldPath, order]) =>
              index.fields?.some(field => field.fieldPath === fieldPath && field.order === order)
            ));
          }
          if (!hasIndex([['socialPending', 'ASCENDING'], ['sourcePublishedAt', 'DESCENDING']])) {
            throw new Error('Indice blogPosts socialPending/sourcePublishedAt mancante');
          }
          if (!hasIndex([['sourceId', 'ASCENDING'], ['importedAt', 'DESCENDING']])) {
            throw new Error('Indice blogPosts sourceId/importedAt mancante');
          }
          console.log('Indici Firestore quota-safe dichiarati.');
          NODE

      - name: Verifica workflow pubblici senza D1
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'workflow-repo/.github/workflows';
          const forbidden = [
            ['AUTOMATION_STATE_BACKEND=d1', /AUTOMATION_STATE_BACKEND\s*:\s*d1/i],
            ['D1_DATABASE', /\bD1_DATABASE\b/],
            ['wrangler d1', /wrangler@4\s+d1/i],
          ];
          const offenders = [];
          for (const name of fs.readdirSync(dir).filter(name => /[.]ya?ml$/.test(name))) {
            if (name === 'architecture-contract.yml') continue;
            const text = fs.readFileSync(path.join(dir, name), 'utf8');
            for (const [label, pattern] of forbidden) {
              if (pattern.test(text)) offenders.push(`${name} (${label})`);
            }
          }
          if (offenders.length) throw new Error(`Uso D1 nei workflow: ${offenders.join(', ')}`);
          console.log('Workflow pubblici: nessun uso D1.');
          NODE

      - name: Verifica guard quota Magazine
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('workflow-repo/.github/workflows/magazine-sync.yml', 'utf8');
          const required = [
            'id: magazine',
            'RESOURCE_EXHAUSTED',
            "quota_exhausted=true",
            "steps.magazine.outputs.quota_exhausted != 'true'",
            'Social e Story non verranno avviati in questa run'
          ];
          const missing = required.filter(marker => !text.includes(marker));
          if (missing.length) throw new Error(`Guard quota Magazine incompleto: ${missing.join(', ')}`);
          console.log('Magazine: guard quota Firestore presente.');
          NODE

      - name: Verifica migrazione immagini R2 a letture Firestore limitate
        shell: bash
        run: |
          set -euo pipefail
          script=source/tools/admin/migrate-business-images-r2.mjs
          node --check "$script"
          grep -Fq 'scanPaged' "$script"
          grep -Fq 'FIRESTORE_QUOTA_EXHAUSTED' "$script"
          grep -Fq 'MIGRATE_PAGE_SIZE' "$script"
          grep -Fq 'MIGRATE_SCAN_LIMIT' "$script"
          grep -Fq 'orderBy(FieldPath.documentId())' "$script"
          if grep -Fq "db.collection('businesses').get()" "$script"; then
            echo "::error::La migrazione immagini non può ripristinare una scansione completa di businesses."
            exit 1
          fi
          if grep -Fq "db.collectionGroup('images').get()" "$script"; then
            echo "::error::La migrazione immagini non può ripristinare una scansione completa collectionGroup images."
            exit 1
          fi
          echo "Migrazione immagini R2: sintassi e limiti Firestore verificati."
