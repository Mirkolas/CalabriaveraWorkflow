name: React migration - private Actions startup diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-private-actions-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - name: Read only startup annotations
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
          api="https://api.github.com/repos/$PRIVATE_REPO/check-runs"
          headers=(-H "Authorization: Bearer $PRIVATE_REPO_PAT" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          for job in 103546562945 103546563048; do
            curl -fsS --max-time 20 "${headers[@]}" "$api/$job/annotations" > "/tmp/$job.json"
            node - "$job" <<'NODE'
          const fs=require('fs');
          const job=process.argv[2];
          const rows=JSON.parse(fs.readFileSync(`/tmp/${job}.json`,'utf8'));
          for(const row of rows){
            console.log(`JOB ${job}: ${row.annotation_level||''}: ${row.message||''}`);
          }
          NODE
          done
