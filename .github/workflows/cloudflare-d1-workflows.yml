name: Cloudflare D1 - Workflow Storage

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione D1 da eseguire
        required: true
        default: status
        type: choice
        options:
          - status
          - bootstrap
          - migrate
          - sync-public-data
          - cadence-smoke-test
          - export

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-workflow-storage
  cancel-in-progress: false

env:
  D1_DATABASE: calabriavera-workflows
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  d1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verifica configurazione
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN mancante"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID mancante"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Controlla database D1
        id: db
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > /tmp/d1-list.json
          if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));process.exit(x.some(d=>d.name===process.env.D1_DATABASE)?0:1)'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Crea database D1
        if: github.event.inputs.operation == 'bootstrap' && steps.db.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 create "$D1_DATABASE" --location weur

      - name: Richiede database esistente
        if: github.event.inputs.operation != 'bootstrap' && steps.db.outputs.exists != 'true'
        shell: bash
        run: |
          echo "::error::Database $D1_DATABASE non esistente. Esegui prima operation=bootstrap."
          exit 1

      - name: Verifica accesso sorgente privato
        if: github.event.inputs.operation == 'bootstrap' || github.event.inputs.operation == 'migrate' || github.event.inputs.operation == 'sync-public-data' || github.event.inputs.operation == 'cadence-smoke-test'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        if: github.event.inputs.operation == 'bootstrap' || github.event.inputs.operation == 'migrate' || github.event.inputs.operation == 'sync-public-data' || github.event.inputs.operation == 'cadence-smoke-test'
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Verifica modalità workflow-only
        if: github.event.inputs.operation == 'bootstrap' || github.event.inputs.operation == 'migrate' || github.event.inputs.operation == 'sync-public-data' || github.event.inputs.operation == 'cadence-smoke-test'
        shell: bash
        run: |
          set -euo pipefail
          test -f source/frontend-react/d1/migrations/0001_public_content.sql
          test -f source/frontend-react/scripts/build-d1-seed.mjs
          if grep -Eq '"d1_databases"|\[\[d1_databases\]\]' source/frontend-react/wrangler.jsonc; then
            echo "::error::D1 non deve essere collegato al Worker del sito in modalità workflow-only."
            exit 1
          fi

      - name: Applica migrazioni D1
        if: github.event.inputs.operation == 'bootstrap' || github.event.inputs.operation == 'migrate' || github.event.inputs.operation == 'sync-public-data' || github.event.inputs.operation == 'cadence-smoke-test'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(source/frontend-react/d1/migrations/*.sql)
          test "${#migrations[@]}" -gt 0 || { echo "::error::Nessuna migrazione D1 trovata"; exit 1; }
          for migration in "${migrations[@]}"; do
            echo "Applico $(basename "$migration")"
            npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --file="$migration" --yes
          done

      - name: Genera seed dai dataset pubblici
        if: github.event.inputs.operation == 'sync-public-data'
        working-directory: source/frontend-react
        run: node scripts/build-d1-seed.mjs

      - name: Sincronizza dataset pubblici in D1
        if: github.event.inputs.operation == 'sync-public-data'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --file=source/frontend-react/d1/generated/seed-public.sql --yes

      - name: Test lock/cadenza workflow su D1
        if: github.event.inputs.operation == 'cadence-smoke-test'
        working-directory: source
        env:
          AUTOMATION_INTERVAL_MINUTES: '1'
          AUTOMATION_LOCK_MINUTES: '5'
          AUTOMATION_FORCE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/automation-cadence-runner.mjs maintenance-smoke -- node -e 'process.exit(0)'

      - name: Stato D1
        if: github.event.inputs.operation == 'status' || github.event.inputs.operation == 'bootstrap' || github.event.inputs.operation == 'migrate' || github.event.inputs.operation == 'sync-public-data' || github.event.inputs.operation == 'cadence-smoke-test'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 info "$D1_DATABASE" --json
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --command='SELECT key, value, updated_at FROM migration_meta ORDER BY key;' --json || true
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --command='SELECT key, interval_minutes, lock_id, lock_until_ms, next_due_at_ms, last_success_at_ms, last_failure_at_ms, last_exit_code, updated_at FROM automation_cadence ORDER BY key;' --json || true

      - name: Esporta D1
        if: github.event.inputs.operation == 'export'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          npx --yes wrangler@4 d1 export "$D1_DATABASE" --remote --output=export/calabriavera-workflows.sql --skip-confirmation

      - name: Carica export come artifact
        if: github.event.inputs.operation == 'export'
        uses: actions/upload-artifact@v4
        with:
          name: calabriavera-workflows-d1-export
          path: export/calabriavera-workflows.sql
          retention-days: 7
