name: React CSS winner diagnostic v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-css-winner-diagnostic-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: f16b18b93d91b4e1ac278351c6ef7507f3f7a04e
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build React with exact built cascade and wrapper anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd source && python3 ../workflow/scripts/patch-react-built-cascade-parity.py)
          grep -Fq '<div id="site-header">' source/frontend-react/src/components/Layout.tsx
          grep -Fq '<div id="site-footer">' source/frontend-react/src/components/Layout.tsx
          (cd source/frontend-react && npm ci && npm run build)
      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-css-winner
          npm install --prefix /tmp/cv-css-winner --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-css-winner/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-css-winner/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-css-winner-r.log 2>&1 & echo $! >/tmp/cv-css-winner-r.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4185/questa-pagina-non-esiste >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - name: Dump recursive React CSS winners
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-css-winner/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          async function inspect(path,label){
            const ctx=await browser.newContext({viewport:{width:1365,height:900},serviceWorkers:'block'});
            await ctx.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});
            const p=await ctx.newPage();await p.goto('http://127.0.0.1:4185'+path,{waitUntil:'domcontentloaded',timeout:30000});await p.locator('main h1').waitFor({state:'visible',timeout:15000});await p.waitForTimeout(650);
            const out=await p.evaluate(()=>{
              const el=document.querySelector('main h1');
              const props=['font-family','font-weight','font-size','line-height','letter-spacing'];
              const hits=[];
              function walk(rules,href,context=[]){for(const rule of [...(rules||[])]){if(rule instanceof CSSStyleRule){let match=false;try{match=el.matches(rule.selectorText)}catch{}if(!match)continue;const style={};for(const prop of props){const value=rule.style.getPropertyValue(prop);if(value)style[prop]={value,priority:rule.style.getPropertyPriority(prop)}}if(Object.keys(style).length)hits.push({href,context,selector:rule.selectorText,style});}else if('cssRules' in rule){let active=true;if(rule instanceof CSSMediaRule)active=matchMedia(rule.conditionText).matches;if(active)walk(rule.cssRules,href,[...context,rule.cssText.slice(0,Math.min(140,rule.cssText.indexOf('{')+1||140))]);}}}
              for(const sheet of [...document.styleSheets]){let rules;try{rules=sheet.cssRules}catch{continue}walk(rules,sheet.href?new URL(sheet.href,location.href).pathname:'INLINE',[])}
              const cs=getComputedStyle(el);return {computed:Object.fromEntries(props.map(x=>[x,cs.getPropertyValue(x)])),inline:el.getAttribute('style')||'',hits};
            });
            console.log('RECURSIVE_WINNER '+label+' '+JSON.stringify(out));await p.close();await ctx.close();
          }
          await inspect('/questa-pagina-non-esiste','react404');
          await inspect('/chi-siamo','reactAbout');
          await browser.close();
          NODE
      - name: Stop
        if: always()
        run: kill "$(cat /tmp/cv-css-winner-r.pid 2>/dev/null)" 2>/dev/null || true
