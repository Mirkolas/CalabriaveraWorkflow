name: React built static pages audit v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-built-static-pages-audit-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build exact backup and React
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          (cd legacy && npm ci && npm run build)
          (cd source/frontend-react && npm ci && npm run build)
      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-static-audit
          npm install --prefix /tmp/cv-static-audit --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-static-audit/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-static-audit/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-static-audit-l.log 2>&1 & echo $! >/tmp/cv-static-audit-l.pid
          nohup /tmp/cv-static-audit/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-static-audit-r.log 2>&1 & echo $! >/tmp/cv-static-audit-r.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4184/chi-siamo.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/chi-siamo >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - name: Compare built static routes
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-static-audit/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const routes=[
            ['chi-siamo','/chi-siamo.html','/chi-siamo'],['contatti','/contatti.html','/contatti'],
            ['privacy','/privacy-policy.html','/privacy-policy'],['cookie','/cookie-policy.html','/cookie-policy'],
            ['termini','/termini.html','/termini'],['note-legali','/note-legali.html','/note-legali'],
            ['login','/login.html','/login'],['registrazione','/registrazione.html','/registrazione']
          ];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          async function shot(origin,path,viewport){
            const ctx=await browser.newContext({viewport,serviceWorkers:'block'});
            await ctx.addInitScript(()=>{const now=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(now).toISOString(),expiresAt:new Date(now+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});
            const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));
            await p.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(350);
            const out=await p.evaluate(()=>{
              const header=document.querySelector('.site-header'),inner=document.querySelector('.header-inner'),main=document.querySelector('main'),h1=main?.querySelector('h1'),section=main?.querySelector('.section,.auth-shell,.cv-auth-shell,.legal-page,.prose');
              const rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height}:null};
              const hs=h1?getComputedStyle(h1):null,head=header?getComputedStyle(header):null;
              return {page:document.body.dataset.page||'',title:document.title,robots:document.querySelector('meta[name="robots"]')?.getAttribute('content')||'',header:rect(header),inner:rect(inner),main:rect(main),section:rect(section),h1:h1?.textContent?.trim()||'',h1Rect:rect(h1),h1Style:hs?{font:hs.fontFamily,size:hs.fontSize,weight:hs.fontWeight,line:hs.lineHeight,letter:hs.letterSpacing,color:hs.color}:null,headerStyle:head?{background:head.backgroundColor,color:head.color,position:head.position}:null,errors:[]};
            });out.errors=errors;await p.close();await ctx.close();return out;
          }
          const report=[];
          for(const [mode,viewport] of modes) for(const [name,lpath,rpath] of routes){
            const legacy=await shot('http://127.0.0.1:4184',lpath,viewport),react=await shot('http://127.0.0.1:4185',rpath,viewport);
            const row={mode,name,legacy,react};report.push(row);
            console.log(JSON.stringify(row));
          }
          await browser.close();
          console.log(`STATIC_AUDIT_ROWS=${report.length}`);
          NODE
      - name: Stop servers
        if: always()
        run: |
          kill "$(cat /tmp/cv-static-audit-l.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-static-audit-r.pid 2>/dev/null)" 2>/dev/null || true
