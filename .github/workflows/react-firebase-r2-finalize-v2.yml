name: React migration - final Firebase production path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-r2-finalize-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Finalize static hosting, 404 and R2 preview bridge
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          editor = Path('frontend-react/src/lib/business-editor.ts')
          text = editor.read_text(encoding='utf-8')
          old = '''function r2UploadEndpoint() {
            if (typeof location !== "undefined" && /(^|[.])calabriavera[.]com$/i.test(location.hostname)) return R2_UPLOAD_WORKER;
            return "/api/images/upload";
          }'''.replace('          ', '')
          new = '''function r2UploadEndpoint() {
            if (typeof location === "undefined") return "/api/images/upload";
            const host = location.hostname.toLowerCase();
            if (/(^|[.])calabriavera[.]com$/i.test(host) || host === "calabriavera-e08d4.web.app" || host === "calabriavera-e08d4.firebaseapp.com") return R2_UPLOAD_WORKER;
            return "/api/images/upload";
          }'''.replace('          ', '')
          if old in text:
              text = text.replace(old, new, 1)
          elif 'calabriavera-e08d4.web.app' not in text:
              raise SystemExit('unexpected r2UploadEndpoint implementation')
          editor.write_text(text, encoding='utf-8')

          worker = Path('frontend-react/worker.ts')
          text = worker.read_text(encoding='utf-8')
          old = 'const R2_UPLOAD_ORIGINS = new Set(["https://calabriavera.com", "https://www.calabriavera.com"]);'
          new = 'const R2_UPLOAD_ORIGINS = new Set(["https://calabriavera.com", "https://www.calabriavera.com", "https://calabriavera-e08d4.web.app", "https://calabriavera-e08d4.firebaseapp.com"]);'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'https://calabriavera-e08d4.web.app' not in text:
              raise SystemExit('unexpected R2_UPLOAD_ORIGINS implementation')
          if 'uploadPreflight(request)' not in text or 'withUploadCors(request, await uploadBusinessImage(request, env))' not in text:
              raise SystemExit('R2 CORS handler missing')
          worker.write_text(text, encoding='utf-8')

          prerender = Path('frontend-react/scripts/prerender-home.mjs')
          text = prerender.read_text(encoding='utf-8')
          text = text.replace('const magazine = blogRows.slice(0, 48);', 'const magazine = blogRows.slice(0, 500);')
          robots_line = '  html = html.replace(/<meta\\s+name=["\\\']robots["\\\']\\s+content=["\\\'][^"\\\']*["\\\']\\s*\\/?\\s*>/i, `<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />`);'
          if robots_line in text:
              text = text.replace(robots_line, '  const robots = page.robots || "index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1";\n  html = html.replace(/<meta\\s+name=["\\\']robots["\\\']\\s+content=["\\\'][^"\\\']*["\\\']\\s*\\/?\\s*>/i, `<meta name="robots" content="${robots}" />`);', 1)
          if 'resolve(dist, "404.html")' not in text:
              marker = '  console.log(`Prerender produzione completo: ${renderedPages} pagine pubbliche.`);\n'
              if marker not in text:
                  raise SystemExit('prerender completion marker missing')
              addition = '''  const notFoundPage = { path: "/__cv-not-found__", lang: "it", title: "Pagina non trovata | CalabriaVera", description: "La pagina richiesta non esiste o è stata spostata.", kind: "not-found", robots: "noindex,nofollow" };
          const notFoundMarkup = await render(notFoundPage.path, {});
          const notFoundHtml = withRoot(template, notFoundMarkup, notFoundPage, "").replace(/ data-prerender-path=["'][^"']+["'] data-prerender-search=["'][^"']*["']/, "");
          await writeFile(resolve(dist, "404.html"), notFoundHtml, "utf8");
          console.log(`Prerender produzione completo: ${renderedPages} pagine pubbliche + 404.`);
          '''
              text = text.replace(marker, addition, 1)
          prerender.write_text(text, encoding='utf-8')

          config_path = Path('frontend-react/firebase.react.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          hosting = config['hosting']
          redirects = hosting.get('redirects', [])
          def ensure_redirect(source, destination):
              if not any(item.get('source') == source for item in redirects):
                  redirects.append({'source': source, 'destination': destination, 'type': 301})
          for src, dst in [('/attivita.html','/attivita'),('/backup.html','/backup'),('/privacy','/privacy-policy'),('/magazine','/blog'),('/register','/registrazione'),('/cerca.html','/catalogo')]:
              ensure_redirect(src, dst)
          hosting['redirects'] = redirects
          shell = '/app-shell.html'
          base = ['/catalogo','/catalogo/**','/mappa','/mappa/**','/blog-articolo.html','/blog/**','/attivita','/attivita/**','/login','/registrazione','/profilo','/preferiti','/dashboard','/messaggi','/aggiungi-attivita','/aggiungi-attivita/**','/backup','/admin','/admin/**','/pages/admin/**']
          localized = ['/catalogo','/catalogo/**','/mappa','/mappa/**','/blog','/blog/**','/blog-articolo.html','/attivita','/attivita/**','/login','/registrazione','/profilo','/preferiti','/dashboard','/messaggi','/aggiungi-attivita','/aggiungi-attivita/**','/chi-siamo','/contatti','/privacy','/privacy-policy','/cookie-policy','/termini','/note-legali','/backup','/admin','/admin/**','/pages/admin/**']
          rewrites = [{'source': p, 'destination': shell} for p in base]
          for lang in ('en','fr','de','es'):
              rewrites.extend({'source': f'/{lang}{p}', 'destination': shell} for p in localized)
          hosting['rewrites'] = rewrites
          config_path.write_text(json.dumps(config, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          smoke = Path('frontend-react/scripts/smoke-firebase-static.mjs')
          smoke.write_text('''import { existsSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";
          const base = process.env.FIREBASE_HOSTING_EMULATOR_URL || "http://127.0.0.1:5000";
          const expected = process.env.EXPECTED_SHA || "";
          const paths = ["/", "/catalogo", "/mappa", "/blog", "/privacy-policy", "/login", "/legacy-data/public-businesses-v1.json", "/legacy-data/public-blog-v1.json", "/build-version.txt"];
          for (const path of paths) {
            const response = await fetch(base + path, { redirect: "manual" });
            if (response.status !== 200) throw new Error(`${path}: HTTP ${response.status}`);
            const body = await response.text();
            if (!body.trim()) throw new Error(`${path}: empty response`);
            if (path === "/build-version.txt" && expected && body.trim() !== expected) throw new Error(`build version ${body.trim()} != ${expected}`);
            if (path === "/catalogo" && !body.includes("53 attività trovate")) throw new Error("catalog prerender total missing");
            if (path === "/mappa" && !body.includes("data-prerender-path")) throw new Error("map prerender missing");
            if (path === "/login" && !body.includes("noindex,nofollow")) throw new Error("private shell robots missing");
            if (path.endsWith(".json")) JSON.parse(body);
          }
          const missing = await fetch(base + "/__definitely_missing_calabriavera__", { redirect: "manual" });
          if (missing.status !== 404) throw new Error(`unknown route should be 404, got ${missing.status}`);
          const missingBody = await missing.text();
          if (!missingBody.includes("Pagina non trovata") || !missingBody.includes("noindex,nofollow")) throw new Error("React 404 body/robots missing");
          const blog = JSON.parse(readFileSync(resolve("dist/legacy-data/public-blog-v1.json"), "utf8"));
          const slugs = [...new Set((blog.items || []).map((item) => String(item.slug || item.id || "").trim()).filter(Boolean))];
          for (const slug of slugs) if (!existsSync(resolve("dist/blog", encodeURIComponent(slug), "index.html"))) throw new Error(`missing prerender blog detail: ${slug}`);
          console.log(`FIREBASE_REACT_HOSTING_SMOKE_GREEN blog_details=${slugs.length}`);
          '''.replace(/^          /gm, ''), encoding='utf-8')
          PY

      - name: Build React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C .. rev-parse HEAD)"
          npm ci
          GITHUB_SHA="$sha" npm run build
          test "$(cat dist/build-version.txt)" = "$sha"
          test -s dist/404.html
          grep -q 'turismo-isola-dino' dist/catalogo/index.html
          grep -q 'index,follow,max-image-preview:large' dist/catalogo/index.html
          grep -q 'noindex,nofollow' dist/app-shell.html

      - name: Firebase Hosting emulator
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C .. rev-parse HEAD)"
          npx --yes firebase-tools@15.22.1 emulators:exec --project demo-calabriavera --only hosting --config firebase.react.json "FIREBASE_HOSTING_EMULATOR_URL=http://127.0.0.1:5000 EXPECTED_SHA=$sha node scripts/smoke-firebase-static.mjs"

      - name: Worker CORS bridge
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/wrangler.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS --max-time 2 http://127.0.0.1:8787/build-version.txt >/dev/null 2>&1 && break; sleep 1; done
          h="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$h" -w '%{http_code}' -X OPTIONS -H 'Origin: https://calabriavera.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type,x-user-id,x-business-id' http://127.0.0.1:8787/api/images/upload)"
          test "$code" = 204
          grep -qi '^access-control-allow-origin: https://calabriavera.com' "$h"
          code="$(curl -sS -o /tmp/body -D "$h" -w '%{http_code}' -X POST -H 'Origin: https://calabriavera.com' -H 'Content-Type: image/webp' http://127.0.0.1:8787/api/images/upload)"
          test "$code" = 401
          grep -qi '^access-control-allow-origin: https://calabriavera.com' "$h"
          grep -q AUTH_REQUIRED /tmp/body
          echo R2_CORS_BRIDGE_GREEN

      - name: Commit after green gates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          git diff --check
          git fetch origin react-migration
          test "$(git rev-parse origin/react-migration)" = "$base" || { echo '::error::react-migration changed during validation'; exit 1; }
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/lib/business-editor.ts frontend-react/worker.ts frontend-react/scripts/prerender-home.mjs frontend-react/scripts/smoke-firebase-static.mjs frontend-react/firebase.react.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finalize React Firebase production hosting'
          git push origin HEAD:react-migration
