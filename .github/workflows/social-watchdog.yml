name: Social dispatcher

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza la pubblicazione senza attendere la cadenza automatica'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: social-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Richiama automazione centrale
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          mode=social-watchdog
          if [ "$FORCE" = "true" ]; then mode=social-publish; fi
          gh workflow run magazine-sync.yml --ref main -f mode="$mode"
