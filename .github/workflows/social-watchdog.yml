name: Social watchdog - Facebook e Instagram

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza una coppia social anche se non e trascorsa la cadenza automatica'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: social-watchdog-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: vars.BLOG_AUTOMATION_DISABLED != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Richiama backend Social con cadenza protetta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          mode=social-watchdog
          if [ "$FORCE" = "true" ]; then mode=social-publish; fi
          gh workflow run magazine-sync.yml --ref main -f mode="$mode"
