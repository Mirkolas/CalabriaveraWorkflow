name: React migration - PWA parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-parity-pwa.yml'
      - 'scripts/patch-react-pwa-parity.py'
      - 'scripts/patch-react-prerender-resilience.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private-repo access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore PWA parity and resilient prerender
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-react-pwa-parity.py
          python3 automation/scripts/patch-react-prerender-resilience.py

      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit verified PWA parity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No PWA parity changes needed."
            exit 0
          fi
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react
          git commit -m "fix: restore PWA install offline and build resilience"
          git push origin HEAD:react-migration
