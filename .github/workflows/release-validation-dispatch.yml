# Temporary dispatcher for final production validation. Remove after green smoke.
name: Release validation dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-validation-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy production and wait for completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          previous="$(curl --fail --silent --show-error "${headers[@]}" "${api}/actions/workflows/firebase-deploy.yml/runs?event=workflow_dispatch&per_page=1" | jq -r '.workflow_runs[0].id // 0')"
          curl --fail --silent --show-error -X POST "${headers[@]}" \
            "${api}/actions/workflows/firebase-deploy.yml/dispatches" -d '{"ref":"main"}'

          run_id=""
          for _ in $(seq 1 36); do
            candidate="$(curl --fail --silent --show-error "${headers[@]}" "${api}/actions/workflows/firebase-deploy.yml/runs?event=workflow_dispatch&per_page=1" | jq -r '.workflow_runs[0].id // 0')"
            if [[ "${candidate}" != "0" && "${candidate}" != "${previous}" ]]; then run_id="${candidate}"; break; fi
            sleep 5
          done
          [[ -n "${run_id}" ]] || { echo "Firebase deploy run non trovato"; exit 1; }
          echo "Firebase deploy run: ${run_id}"

          for _ in $(seq 1 90); do
            payload="$(curl --fail --silent --show-error "${headers[@]}" "${api}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"${payload}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${payload}")"
            echo "firebase-deploy: ${status} ${conclusion}"
            if [[ "${status}" == "completed" ]]; then [[ "${conclusion}" == "success" ]] && exit 0 || exit 1; fi
            sleep 8
          done
          echo "Timeout firebase-deploy"; exit 1

      - name: Run final production browser smoke
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          previous="$(curl --fail --silent --show-error "${headers[@]}" "${api}/actions/workflows/smoke-browser.yml/runs?event=workflow_dispatch&per_page=1" | jq -r '.workflow_runs[0].id // 0')"
          curl --fail --silent --show-error -X POST "${headers[@]}" \
            "${api}/actions/workflows/smoke-browser.yml/dispatches" -d '{"ref":"main"}'

          run_id=""
          for _ in $(seq 1 36); do
            candidate="$(curl --fail --silent --show-error "${headers[@]}" "${api}/actions/workflows/smoke-browser.yml/runs?event=workflow_dispatch&per_page=1" | jq -r '.workflow_runs[0].id // 0')"
            if [[ "${candidate}" != "0" && "${candidate}" != "${previous}" ]]; then run_id="${candidate}"; break; fi
            sleep 5
          done
          [[ -n "${run_id}" ]] || { echo "Smoke run non trovato"; exit 1; }
          echo "Smoke run: ${run_id}"

          for _ in $(seq 1 90); do
            payload="$(curl --fail --silent --show-error "${headers[@]}" "${api}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"${payload}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${payload}")"
            echo "smoke-browser: ${status} ${conclusion}"
            if [[ "${status}" == "completed" ]]; then [[ "${conclusion}" == "success" ]] && exit 0 || exit 1; fi
            sleep 8
          done
          echo "Timeout smoke-browser"; exit 1
