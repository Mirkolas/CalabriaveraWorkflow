name: React migration - favorites parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-favorites-parity.yml'
      - 'scripts/patch-react-favorites-parity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-favorites-parity
  cancel-in-progress: true

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Assert exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "a10c3653d11c6007fbe55767ecd5adf66f3fd787"
      - name: Apply Favorites parity patch
        run: python3 automation/scripts/patch-react-favorites-parity.py
      - name: Build React client SSR and prerender
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate Favorites parity invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          fav=Path('source/frontend-react/src/pages/FavoritesPage.tsx').read_text(encoding='utf-8')
          account=Path('source/frontend-react/src/lib/account.ts').read_text(encoding='utf-8')
          for token in ['id="favorites-root"','cv-favorites-toolbar','cv-favorites-grid','cv-favorite-card','cv-favorite-media','cv-favorite-body','cv-favorite-meta','cv-favorite-actions','cv-remove-favorite','cv-favorites-empty','Apri scheda','Aggiungi altri preferiti']:
              assert token in fav, token
          assert 'BusinessCard' not in fav
          assert '{ ALL_TOURISM }' in account
          assert '.concat(ALL_TOURISM)' in account
          assert 'FEATURED_TOURISM' not in account[account.index('export async function loadFavoriteBusinesses'):account.index('export async function loadOwnBusinesses')]
          assert not Path('source/frontend-react/src/generated/tourism-data-core.js').exists()
          assert not Path('source/frontend-react/src/generated/tourism-data-core.d.ts').exists()
          bundle='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in Path('source/frontend-react/dist/assets').glob('*.js'))
          assert 'cv-favorites-toolbar' in bundle
          assert 'turismo-isola-dino' in bundle
          print('FAVORITES_PARITY_GREEN')
          PY
          git -C source diff --check
      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/src/pages/FavoritesPage.tsx frontend-react/src/lib/account.ts
          if git -C source diff --cached --quiet; then
            echo 'No staged changes'
            exit 0
          fi
          git -C source commit -m 'fix: match main favorites page and full tourism set'
          git -C source push origin HEAD:react-migration
