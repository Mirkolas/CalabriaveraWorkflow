name: React exact backup parity - auth v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-exact-auth-parity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-exact-auth-parity-v1
  cancel-in-progress: true

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - name: Verify access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"; test -n "$PRIVATE_REPO_PAT"

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false

      - name: Checkout exact backup
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact auth contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('legacy/assets/js/auth-page.js').read_text()
          required=[
            'Accesso effettuato',
            'Account sospeso. Contatta l’assistenza per informazioni.',
            'resetForm.elements.resetEmail.value = form.elements.email.value',
            'Creazione account e invio verifica…',
            'Accesso con Google…',
            '<section class="auth-shell"><div class="card" style="max-width:620px;margin:auto">',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'exact auth contract changed: {missing}')
          loader=Path('legacy/assets/js/page-loader-core.js').read_text()
          if 'main.innerHTML = \'<section class="section container"><div id="auth-root"></div></section>\'' not in loader:
            raise SystemExit('exact auth wrapper contract changed')
          print('EXACT_AUTH_SOURCE_CONTRACT_OK')
          PY

      - name: Apply exact auth patch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../workflow/scripts/patch-react-exact-auth.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('frontend-react/src/pages/AuthPage.tsx').read_text()
          required=[
            'watchUser', 'Accesso effettuato', 'accountNotice',
            'id="auth-root"', 'id="auth-status"', 'id="reset-status"',
            'Creazione account e invio verifica…', 'Accesso con Google…',
            "document.querySelector<HTMLInputElement>('#auth-form input[name=\"email\"]')",
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'patched auth source missing: {missing}')
          print('PATCHED_AUTH_SOURCE_OK')
          PY

      - name: Build React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-auth
          npm install --prefix /tmp/cv-auth --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-auth/node_modules/.bin/playwright install --with-deps chromium

      - name: Start exact backup and React
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-auth/node_modules/.bin/serve legacy -l 4184 >/tmp/cv-auth-legacy.log 2>&1 & echo $! >/tmp/cv-auth-legacy.pid
          nohup /tmp/cv-auth/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-auth-react.log 2>&1 & echo $! >/tmp/cv-auth-react.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4184/login.html >/dev/null && curl -fsS http://127.0.0.1:4185/login >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Compare guest auth behavior backup to React
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-auth/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url),{chromium}=require(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          const cases=[['login','/login.html','/login','Bentornato'],['register','/registrazione.html','/registrazione','Crea il tuo account']];
          const failures=[];
          const consent={version:3,scope:'technical-only',savedAt:new Date().toISOString(),expiresAt:new Date(Date.now()+30*864e5).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'gate'};
          async function open(context,origin,path){
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#auth-root .auth-shell').waitFor({state:'visible',timeout:15000});
            return {page,errors};
          }
          try {
            for(const [mode,viewport] of modes){
              const context=await browser.newContext({viewport,serviceWorkers:'block'});
              await context.addInitScript(v=>{try{localStorage.setItem('cv-cookie-consent-v3',JSON.stringify(v));localStorage.removeItem('cv-consent')}catch{}},consent);
              for(const [name,legacyPath,reactPath,title] of cases){
                const legacy=await open(context,'http://127.0.0.1:4184',legacyPath);
                const react=await open(context,'http://127.0.0.1:4185',reactPath);
                const row=[];
                const L=await legacy.page.evaluate(()=>{const card=document.querySelector('#auth-root .card')?.getBoundingClientRect(),form=document.querySelector('#auth-form');return{h1:document.querySelector('#auth-root h1')?.textContent?.trim()||'',card:card?{x:card.x,y:card.y,width:card.width}:null,fields:[...form?.querySelectorAll('input')||[]].map(x=>({name:x.name,type:x.type,id:x.id,required:x.required})),hasStatus:Boolean(document.querySelector('#auth-status'))}});
                const R=await react.page.evaluate(()=>{const card=document.querySelector('#auth-root .card')?.getBoundingClientRect(),form=document.querySelector('#auth-form');return{h1:document.querySelector('#auth-root h1')?.textContent?.trim()||'',card:card?{x:card.x,y:card.y,width:card.width}:null,fields:[...form?.querySelectorAll('input')||[]].map(x=>({name:x.name,type:x.type,id:x.id,required:x.required})),hasStatus:Boolean(document.querySelector('#auth-status'))}});
                if(L.h1!==title||R.h1!==title)row.push(`h1:${L.h1}/${R.h1}`);
                if(JSON.stringify(L.fields)!==JSON.stringify(R.fields))row.push(`fields:${JSON.stringify(L.fields)}!=${JSON.stringify(R.fields)}`);
                if(!L.hasStatus||!R.hasStatus)row.push('auth-status-missing');
                if(!L.card||!R.card)row.push('card-missing'); else {
                  if(Math.abs(L.card.width-R.card.width)>2)row.push(`card-width:${L.card.width}!=${R.card.width}`);
                  if(Math.abs(L.card.x-R.card.x)>2)row.push(`card-x:${L.card.x}!=${R.card.x}`);
                  if(Math.abs(L.card.y-R.card.y)>3)row.push(`card-y:${L.card.y}!=${R.card.y}`);
                }
                if(react.errors.length)row.push(`react-errors:${react.errors.join(';')}`);
                console.log(`${mode}/${name}: ${row.length?row.join(' | '):'OK'}`);
                if(row.length) failures.push({mode,name,row,L,R});
                await legacy.page.close(); await react.page.close();
              }

              for(const [side,origin,path] of [['legacy','http://127.0.0.1:4184','/login.html'],['react','http://127.0.0.1:4185','/login']]){
                const {page}=await open(context,origin,path);
                await page.locator('#auth-form input[name="email"]').fill('parity@example.com');
                await page.locator('#reset').click();
                const reset=page.locator('#reset-form input[name="resetEmail"]');
                await reset.waitFor({state:'visible'});
                const value=await reset.inputValue();
                if(value!=='parity@example.com') failures.push({mode,side,test:'reset-prefill',value});
                await page.close();
              }

              for(const [side,origin,path] of [['legacy','http://127.0.0.1:4184','/login.html?suspended=1'],['react','http://127.0.0.1:4185','/login?suspended=1']]){
                const {page}=await open(context,origin,path);
                const status=(await page.locator('#auth-status').textContent()||'').trim();
                if(!status.includes('Account sospeso. Contatta l’assistenza per informazioni.')) failures.push({mode,side,test:'suspended-notice',status});
                await page.close();
              }
              await context.close();
            }
          } finally { await browser.close(); }
          if(failures.length){console.error(JSON.stringify(failures,null,2));process.exit(1)}
          console.log('EXACT_AUTH_GUEST_GREEN');
          NODE

      - name: Commit exact auth to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'; git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/AuthPage.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: match auth flow to exact pre-React backup'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-auth-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-auth-react.pid 2>/dev/null)" 2>/dev/null || true
