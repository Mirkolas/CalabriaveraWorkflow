name: React migration - exact main filter options

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-main-filter-options.yml'
      - 'scripts/patch-react-main-filter-options.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-main-filter-options
  cancel-in-progress: true

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Assert expected migration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "ac88051d14a377c0ba816646ea13cd259b14f3fc"
      - name: Apply canonical main filter options
        run: python3 automation/scripts/patch-react-main-filter-options.py
      - name: Build React migration
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate filter parity invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          options = Path('source/frontend-react/src/generated/main-static-options.ts').read_text()
          names = re.findall(r'^\s+"([^"]+)",?$', options, re.M)
          print(f'Generated canonical cities: {len(names)}')
          if len(names) != 116:
              raise SystemExit(f'expected 116 main cities, got {len(names)}')
          for expected in ['Acri','Capo Vaticano','Camigliatello Silano','Zambrone']:
              if expected not in names:
                  raise SystemExit(f'missing canonical city {expected}')
          catalog = Path('source/frontend-react/src/pages/CatalogPage.tsx').read_text()
          for needle in ['id="filters"','id="keyword"','id="category"','id="province"','id="city"','id="result-count"','id="results"','id="load-more"','cityCounts.get(value)']:
              if needle not in catalog:
                  raise SystemExit(f'Catalog missing {needle}')
          map_page = Path('source/frontend-react/src/pages/MapPage.tsx').read_text()
          if 'const cities = MAIN_COMMON_CITIES;' not in map_page:
              raise SystemExit('Map does not use canonical main cities')
          PY
          git -C source diff --check
      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/pages/CatalogPage.tsx frontend-react/src/pages/MapPage.tsx frontend-react/src/generated/main-static-options.ts
          git -C source commit -m 'fix: match main catalog and map filter options'
          git -C source push origin HEAD:react-migration
