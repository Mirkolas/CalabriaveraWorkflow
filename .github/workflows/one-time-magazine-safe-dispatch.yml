name: One-time Magazine safe dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-magazine-safe-dispatch.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Avvia backend centrale senza force
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/${GH_REPO}/dispatches" -f event_type=source-magazine-push
      - name: Rimuovi questo trigger monouso
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Workflow Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-magazine-safe-dispatch.yml
          git commit -m 'chore: remove one-time Magazine dispatch'
          git push origin HEAD:main
