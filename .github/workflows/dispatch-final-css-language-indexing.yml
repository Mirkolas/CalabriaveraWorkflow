name: Dispatch latest final CSS language indexing gate
# rerun latest parity after robust prerender SEO anchor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dispatch-final-css-language-indexing.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v4 on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/react-final-css-language-indexing-v4.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'Dispatched v4 at latest main.'
