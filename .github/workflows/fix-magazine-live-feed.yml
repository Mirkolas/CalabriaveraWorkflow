name: Fix production page audit findings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-magazine-live-feed.yml'
      - 'scripts/fix-page-audit-round1.py'
      - 'scripts/fix-magazine-publication-order.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-production-page-audit
  cancel-in-progress: true

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Applica correzioni pagina e recenza Magazine
        run: |
          set -euo pipefail
          python runner/scripts/fix-page-audit-round1.py source
          python runner/scripts/fix-magazine-publication-order.py source
          git -C source diff --check

      - name: Suite completa repository privato
        working-directory: source
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Build React
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit privato senza Actions private
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Public Workflow'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/components/Layout.tsx frontend-react/src/lib/magazine.ts tools/publish-magazine-batch.mjs tests/site-stability.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: keep fresh Magazine content first [skip ci]'
            git push origin HEAD:main
          fi
          echo "Private main: $(git rev-parse HEAD)"
