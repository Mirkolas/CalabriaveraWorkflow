name: Fix Magazine live feed freshness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-magazine-live-feed.yml'
      - 'scripts/fix-magazine-live-feed.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-magazine-live-feed
  cancel-in-progress: true

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Applica live feed immediato Blog/Eventi
        run: |
          set -euo pipefail
          python runner/scripts/fix-magazine-live-feed.py source
          git -C source diff --check

      - name: Suite completa repository privato
        working-directory: source
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Build React
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit privato senza Actions private
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Public Workflow'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/MagazinePage.tsx frontend-react/src/lib/public-data.ts frontend-react/src/lib/magazine.ts tests/site-stability.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: show fresh Blog and Events immediately [skip ci]'
            git push origin HEAD:main
          fi
          echo "PRIVATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Richiedi deploy Firebase dal runner pubblico
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=source-deploy
          echo "Deploy richiesto per ${PRIVATE_SHA}"
