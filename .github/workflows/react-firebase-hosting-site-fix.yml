name: React migration - bind Firebase production Hosting site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-firebase-hosting-site-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
      EXPECTED_BASE: c8a420ba5302cd8ce223e344aedb3103e4468c75
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Freeze exact React base and bind production site
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('frontend-react/firebase.react.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          hosting=data.get('hosting')
          if not isinstance(hosting, dict):
              raise SystemExit('hosting config missing')
          hosting['site']='calabriavera'
          # Keep site first for clarity; semantic content of all other keys is preserved.
          ordered={'site': hosting.pop('site')}
          ordered.update(hosting)
          data['hosting']=ordered
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          node -e "const x=require('./frontend-react/firebase.react.json'); if(x.hosting.site!=='calabriavera') process.exit(1)"
          git diff --check
      - name: Build exact production candidate
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/build-version.txt
          test -s dist/catalogo/index.html
          grep -q '53 attività trovate' dist/catalogo/index.html
          grep -q 'turismo-isola-dino' dist/catalogo/index.html
          grep -q 'data-prerender-path="/mappa"' dist/mappa/index.html
      - name: Validate Firebase Hosting config with emulator
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 emulators:start --only hosting --project calabriavera-e08d4 --config firebase.react.json > /tmp/firebase-hosting.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:5000/catalogo -o /tmp/catalog.html; then break; fi
            sleep 1
          done
          grep -q 'data-prerender-path="/catalogo"' /tmp/catalog.html
          grep -q '53 attività trovate' /tmp/catalog.html
          curl -fsS http://127.0.0.1:5000/mappa -o /tmp/map.html
          grep -q 'data-prerender-path="/mappa"' /tmp/map.html
          echo FIREBASE_SITE_CONFIG_GREEN
      - name: Commit and push React branch atomically
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin react-migration
          test "$(git rev-parse origin/react-migration)" = "$EXPECTED_BASE" || { echo '::error::react-migration moved'; exit 1; }
          git config user.name 'CalabriaVera Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/firebase.react.json
          git commit -m 'deploy: target production Firebase Hosting site'
          git push origin HEAD:react-migration
          echo "FIREBASE_SITE_FIX_GREEN=$(git rev-parse HEAD)"
