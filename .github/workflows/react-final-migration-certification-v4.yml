name: React final migration certification v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-migration-certification-v4.yml'
      - 'scripts/react-final-certification-v4.py'
      - 'scripts/react-final-visual-v4.mjs'

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SHA: 48c171595e71dfdcc6668c5d32bd92c8bac5d187
  ORACLE_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076

jobs:
  certify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: react-final-migration-certification-v4
      cancel-in-progress: true
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout public certification runner
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout exact React migration commit
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.EXPECTED_PRIVATE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact pre-React oracle
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.ORACLE_SHA }}
          path: oracle
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pin exact commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_PRIVATE_SHA"
          test "$(git -C oracle rev-parse HEAD)" = "$ORACLE_SHA"
          echo "React:  $EXPECTED_PRIVATE_SHA"
          echo "Oracle: $ORACLE_SHA"

      - name: Install application dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd source && npm ci --no-audit --no-fund)
          (cd oracle && npm ci --no-audit --no-fund)
          (cd source/frontend-react && npm ci --no-audit --no-fund)

      - name: Full regression suite
        working-directory: source
        run: npm test

      - name: Build pre-React oracle
        working-directory: oracle
        run: npm run build

      - name: Build React offline
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: npm run build

      - name: Structural and semantic parity gate
        shell: bash
        run: python runner/scripts/react-final-certification-v4.py

      - name: Install Chromium visual tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-visual
          npm install --prefix /tmp/cv-visual --no-package-lock --no-save playwright@1.62.1 pixelmatch@7.1.0 pngjs@7.0.0
          /tmp/cv-visual/node_modules/.bin/playwright install --with-deps chromium
          cp runner/scripts/react-final-visual-v4.mjs /tmp/cv-visual/compare.mjs

      - name: Visual parity desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cv-visual
          node compare.mjs "$GITHUB_WORKSPACE/oracle/dist" "$GITHUB_WORKSPACE/source/frontend-react/dist" /tmp/cv-visual/out-v4

      - name: Upload final certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-final-migration-certification-v4
          path: /tmp/cv-visual/out-v4
          if-no-files-found: ignore
          retention-days: 7
