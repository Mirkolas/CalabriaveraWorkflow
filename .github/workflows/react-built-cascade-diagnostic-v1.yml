name: React built cascade diagnostic v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-built-cascade-diagnostic-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: f16b18b93d91b4e1ac278351c6ef7507f3f7a04e
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Verify base CSS assets are authoritative
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          for f in figma-modern.css enhancements.css compact-modern.css ux-refine.css reference-replica.css redesign-runtime.css redesign-functional.css redesign-final.css responsive-polish.css authentic-local.css site-audit.css responsive-final.css device-polish.css language-modern.css platform-features.css responsive-hardening.css critical-shell.css growth-enhancements.css ui-final-overrides.css header-unified.css activity-experience.css render-performance.css review-stars.css; do
            cmp "legacy/assets/css/$f" "source/assets/css/$f" || { echo "CSS drift: $f"; exit 1; }
          done
          echo AUTHORITATIVE_CSS_IDENTICAL
      - name: Patch React and build both outputs
        shell: bash
        run: |
          set -euo pipefail
          (cd source && python3 ../workflow/scripts/patch-react-built-cascade-parity.py)
          (cd legacy && npm ci && npm run build)
          (cd source/frontend-react && npm ci && npm run build)
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('source/frontend-react/public/main-route-css.json','utf8'));
          for(const route of ['/404','/chi-siamo','/contatti','/privacy-policy','/login','/catalogo']){
            const css=data.routeCss[route]||[];
            for(const expected of ['/assets/css/redesign-final.css','/assets/css/header-unified.css','/assets/css/activity-experience.css','/assets/css/render-performance.css','/assets/css/review-stars.css','/assets/css/react-live-parity.css']) if(!css.some(x=>String(x).split(/[?#]/)[0]===expected)) throw new Error(`${route} missing ${expected}`);
            console.log(route, css.length, css.map(x=>String(x).split(/[?#]/)[0]).join(','));
          }
          NODE
      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-built-cascade
          npm install --prefix /tmp/cv-built-cascade --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-built-cascade/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-built-cascade/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-built-cascade-l.log 2>&1 & echo $! >/tmp/cv-built-cascade-l.pid
          nohup /tmp/cv-built-cascade/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-built-cascade-r.log 2>&1 & echo $! >/tmp/cv-built-cascade-r.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4184/404.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - name: Compare built shell and primary content
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-built-cascade/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const routes=[
            ['404','/404.html','/questa-pagina-non-esiste'],['about','/chi-siamo.html','/chi-siamo'],['contacts','/contatti.html','/contatti'],
            ['privacy','/privacy-policy.html','/privacy-policy'],['cookies','/cookie-policy.html','/cookie-policy'],['terms','/termini.html','/termini'],['legal','/note-legali.html','/note-legali'],
            ['login','/login.html','/login'],['register','/registrazione.html','/registrazione'],['home','/index.html','/'],['catalog','/catalogo.html','/catalogo'],['map','/mappa.html','/mappa'],['blog','/blog.html','/blog']
          ];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          async function snap(origin,path,viewport){const ctx=await browser.newContext({viewport,serviceWorkers:'block'});await ctx.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+30*86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));await p.goto(origin+path,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(450);const d=await p.evaluate(()=>{const q=s=>document.querySelector(s),rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height}:null},cs=e=>e?getComputedStyle(e):null,h=q('main h1'),hs=cs(h),head=q('.site-header'),heads=cs(head);return {page:document.body.dataset.page||'',title:document.title,robots:q('meta[name="robots"]')?.getAttribute('content')||'',header:rect(head),inner:rect(q('.header-inner')),main:rect(q('main')),h1:h?.textContent?.trim()||'',h1Rect:rect(h),h1Style:hs?{font:hs.fontFamily,size:hs.fontSize,weight:hs.fontWeight,line:hs.lineHeight,letter:hs.letterSpacing,color:hs.color}:null,headerStyle:heads?{background:heads.backgroundColor,color:heads.color,position:heads.position}:null,resultCount:q('#result-count')?.textContent?.trim()||'',cards:document.querySelectorAll('#results > *').length,mapCount:q('#map-count')?.textContent?.trim()||'',blogCards:document.querySelectorAll('#blog-list article').length}});d.errors=errors;await p.close();await ctx.close();return d;}
          for(const [mode,vp] of modes)for(const [name,lp,rp] of routes){const legacy=await snap('http://127.0.0.1:4184',lp,vp),react=await snap('http://127.0.0.1:4185',rp,vp);console.log('CASCADE_ROW '+JSON.stringify({mode,name,legacy,react}));}
          await browser.close();console.log('BUILT_CASCADE_DIAGNOSTIC_DONE');
          NODE
      - name: Stop
        if: always()
        run: |
          kill "$(cat /tmp/cv-built-cascade-l.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-built-cascade-r.pid 2>/dev/null)" 2>/dev/null || true
