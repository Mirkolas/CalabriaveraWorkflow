name: React sync current private main

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-sync-current-main.yml'

permissions:
  contents: read

env:
  EXPECTED_CANDIDATE_SHA: 8628a1711393dc8351c3bd0a07b3fd8371676062
  EXPECTED_MAIN_SHA: 4fd4763449d172d74ccf95d57fc38c47c31aed5d

jobs:
  merge-certify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout exact private integration branch
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-main-integration-final
          path: source
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Merge exact current private main
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          git fetch origin main react-main-integration-final
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/react-main-integration-final)" = "$EXPECTED_CANDIDATE_SHA"
          git config user.name 'CalabriaVera Public Runner'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-ff "$EXPECTED_MAIN_SHA" -m 'merge: preserve current Firestore-only main in React candidate [skip ci]'
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          git merge-base --is-ancestor "$EXPECTED_CANDIDATE_SHA" HEAD
          git diff --check "$EXPECTED_CANDIDATE_SHA"..HEAD

      - name: Full private regression suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: Build React production candidate
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Install browser guard runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-flash
          npm install --prefix /tmp/cv-flash --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-flash/node_modules/.bin/playwright install --with-deps chromium
          cp runner/scripts/react-route-css-no-flash.mjs /tmp/cv-flash/test.mjs

      - name: Reprove route transition without flash
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/cv-flash/test.mjs "$GITHUB_WORKSPACE/source/frontend-react/dist"

      - name: Push merged candidate only if refs are unchanged
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main react-main-integration-final
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA" || { echo '::error::Private main changed during certification'; exit 1; }
          test "$(git rev-parse origin/react-main-integration-final)" = "$EXPECTED_CANDIDATE_SHA" || { echo '::error::React candidate changed during certification'; exit 1; }
          git push origin HEAD:react-main-integration-final
          echo "Merged certified candidate SHA: $(git rev-parse HEAD)"
