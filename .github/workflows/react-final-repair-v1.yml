name: React final parity repair v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-repair-v1.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout private React branch
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Repair exact legacy presentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          styles = Path('source/frontend-react/src/styles.css')
          text = styles.read_text()
          start_marker = '.cv-legacy-content{line-height:1.7}'
          end_marker = '.cv-legacy-content a{color:#075a92;text-decoration:underline}'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Legacy override block not found')
          end += len(end_marker)
          text = text[:start] + '.cv-legacy-content{display:contents}' + text[end:]
          styles.write_text(text)

          backup = Path('source/frontend-react/src/pages/BackupPage.tsx')
          backup_text = backup.read_text()
          if 'rel="noopener noreferrer"' not in backup_text:
              raise SystemExit('Expected Backup rel not found')
          backup.write_text(backup_text.replace('rel="noopener noreferrer"', 'rel="noopener"'))
          PY

          git -C source diff --check
          git -C source diff -- frontend-react/src/styles.css frontend-react/src/pages/BackupPage.tsx

      - name: Validate React build
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit repair to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'CalabriaVera CI'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/styles.css frontend-react/src/pages/BackupPage.tsx
          git commit -m 'fix: close final React legacy parity gaps'
          git push origin HEAD:react-migration
