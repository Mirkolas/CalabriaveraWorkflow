name: React final UI parity repair v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/react-final-ui-parity-repair-v5.yml'
      - 'scripts/react-final-ui-parity-repair-v5.py'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout public workflow repo
        uses: actions/checkout@v7
        with:
          path: runner

      - name: Checkout private React branch as data only
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply repair from public runner
        run: python runner/scripts/react-final-ui-parity-repair-v5.py source

      - name: Validate full private repository suite
        working-directory: source
        run: |
          set -euo pipefail
          git diff --check
          npm ci --no-audit --no-fund
          npm test

      - name: Validate React production build
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Push verified code without private Actions
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Public Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/CatalogPage.tsx frontend-react/src/pages/MagazinePage.tsx frontend-react/src/pages/LegalPage.tsx frontend-react/src/styles.css
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: close remaining React visual parity gaps [skip ci]'
          git push origin HEAD:react-migration
