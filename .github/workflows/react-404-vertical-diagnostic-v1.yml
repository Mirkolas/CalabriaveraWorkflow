name: React 404 vertical diagnostic v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-404-vertical-diagnostic-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 5f145eee5a37c4d765a758f01b83e61e62c3ef0c
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build both
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd legacy && npm ci && npm run build)
          (cd source && python3 ../workflow/scripts/patch-react-exact-404.py && cd frontend-react && npm ci && npm run build)
      - name: Install browser and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv404vd
          npm install --prefix /tmp/cv404vd --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv404vd/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv404vd/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/l.log 2>&1 & echo $! >/tmp/l.pid
          nohup /tmp/cv404vd/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/r.log 2>&1 & echo $! >/tmp/r.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4184/404.html >/dev/null && curl -fsS http://127.0.0.1:4185/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Dump vertical chain
        env:
          PLAYWRIGHT_MODULE: /tmp/cv404vd/node_modules/playwright
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const sels={section:'main section.section.container',eyebrow:'main .eyebrow',h1:'main h1',prose:'main .prose',para:'main .prose>p',actions:'main .form-actions',first:'main .form-actions a:first-child'};
          async function inspect(origin,path,viewport){
            const c=await browser.newContext({viewport,serviceWorkers:'block'});await c.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});
            const p=await c.newPage();await p.goto(origin+path,{waitUntil:'domcontentloaded'});await p.locator('main h1').waitFor();await p.waitForTimeout(200);
            const o=await p.evaluate(sels=>{const out={};for(const [k,sel] of Object.entries(sels)){const e=document.querySelector(sel);if(!e){out[k]=null;continue}const r=e.getBoundingClientRect(),s=getComputedStyle(e);out[k]={rect:{x:r.x,y:r.y,w:r.width,h:r.height},margin:s.margin,padding:s.padding,font:s.fontFamily,size:s.fontSize,weight:s.fontWeight,line:s.lineHeight,letter:s.letterSpacing,display:s.display,gap:s.gap,color:s.color}}return out},sels);await c.close();return o;
          }
          for(const [mode,v] of [['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]]){console.log(`===${mode} LEGACY===`);console.log(JSON.stringify(await inspect('http://127.0.0.1:4184','/404.html',v),null,2));console.log(`===${mode} REACT===`);console.log(JSON.stringify(await inspect('http://127.0.0.1:4185','/x-not-found',v),null,2));}
          await browser.close();
          NODE
      - name: Stop
        if: always()
        run: |
          kill "$(cat /tmp/l.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/r.pid 2>/dev/null)" 2>/dev/null || true
