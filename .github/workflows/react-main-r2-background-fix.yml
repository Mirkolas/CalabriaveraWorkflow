name: React integrated R2 and route transition repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-main-r2-background-fix.yml'
      - 'scripts/react-main-r2-background-fix.py'
      - 'scripts/react-route-css-transition-fix.py'
      - 'scripts/react-route-css-no-flash.mjs'

permissions:
  contents: read

env:
  EXPECTED_BASE_SHA: 3c18af318a2067edf8a263bbaa1300e26fc1494e

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout public repair runner
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false

      - name: Checkout integrated candidate branch
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-main-integration-final
          path: source
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify candidate ancestry and R2 objects
        shell: bash
        run: |
          set -euo pipefail
          git -C source merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          echo "CHECKOUT_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          for asset in \
            assets/images/home/tropea-1600.webp \
            assets/images/home/tropea-960.webp \
            assets/images/home/sila-1280.webp \
            assets/images/home/sila-720.webp; do
            curl --fail --silent --show-error --location \
              --connect-timeout 5 --max-time 20 --retry 2 --retry-all-errors \
              --output /dev/null "https://img.calabriavera.com/static/$asset"
            echo "R2 reachable: $asset"
          done

      - name: Apply R2 backgrounds and atomic route CSS swap
        shell: bash
        run: |
          set -euo pipefail
          python runner/scripts/react-main-r2-background-fix.py source
          python runner/scripts/react-route-css-transition-fix.py source
          git -C source diff --check -- \
            frontend-react/src/pages/OriginalHomePage.tsx \
            frontend-react/src/pages/MagazinePage.tsx \
            frontend-react/src/components/Layout.tsx
          git -C source diff -- \
            frontend-react/src/pages/OriginalHomePage.tsx \
            frontend-react/src/pages/MagazinePage.tsx \
            frontend-react/src/components/Layout.tsx

      - name: Full repository regression suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: React production build
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Browser guard against route CSS flash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-flash
          npm install --prefix /tmp/cv-flash --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-flash/node_modules/.bin/playwright install --with-deps chromium
          cp runner/scripts/react-route-css-no-flash.mjs /tmp/cv-flash/test.mjs
          node /tmp/cv-flash/test.mjs "$GITHUB_WORKSPACE/source/frontend-react/dist"

      - name: Commit verified fixes to integration branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            frontend-react/src/pages/OriginalHomePage.tsx \
            frontend-react/src/pages/MagazinePage.tsx \
            frontend-react/src/components/Layout.tsx
          if git diff --cached --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git fetch origin react-main-integration-final
          remote_sha="$(git rev-parse FETCH_HEAD)"
          test "$remote_sha" = "$CHECKOUT_SHA" || { echo "::error::Integration branch changed during certification; refusing non-fast-forward write"; exit 1; }
          git config user.name 'CalabriaVera Public Runner'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: preserve R2 visuals and eliminate route CSS flash [skip ci]'
          git push origin HEAD:react-main-integration-final
          echo "Candidate SHA: $(git rev-parse HEAD)"
