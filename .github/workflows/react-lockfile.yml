name: React migration - lock dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-private-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verifica accesso
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT mancante"; exit 1; }

      - name: Checkout branch React privata
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Genera lockfile e verifica build
        working-directory: source/frontend-react
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build

      - name: Salva lockfile
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- frontend-react/package-lock.json; then
            echo "Lockfile già aggiornato."
            exit 0
          fi
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react/package-lock.json
          git commit -m "chore: lock React staging dependencies"
          git push origin HEAD:react-migration
