name: React migration - profile parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-profile-parity.yml'
      - 'scripts/patch-react-profile-parity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Assert exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "daefac1fc59d84f37cbd7d0556b5ac0ef5c9c952"
      - name: Apply Profile parity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-react-profile-parity.py
      - name: Build React client SSR and prerender
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate Profile parity invariants
        shell: bash
        run: |
          set -euo pipefail
          test ! -e source/frontend-react/src/generated/tourism-data-core.js
          test ! -e source/frontend-react/src/generated/tourism-data-core.d.ts
          grep -q 'className="section container"' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'id="profile-root"' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'className="grid-2"' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'cv-profile-avatar-editor' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'cv-avatar-pencil' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'id="profile-form"' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'id="password-form"' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'verification-controls' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'await ensureUserDoc(user);' source/frontend-react/src/lib/account.ts
          grep -q 'changeAccountPassword' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'saveProfileAvatar' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'resendVerificationEmail' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'refreshVerification' source/frontend-react/src/pages/ProfilePage.tsx
          grep -q 'logout' source/frontend-react/src/pages/ProfilePage.tsx
          git -C source diff --check
      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react/src/pages/ProfilePage.tsx frontend-react/src/lib/account.ts
          git -C source diff --cached --quiet && exit 0
          git -C source commit -m 'fix: match main profile page and account initialization'
          git -C source push origin HEAD:react-migration
