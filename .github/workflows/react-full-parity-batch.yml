name: React migration - full parity batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-full-parity-batch.yml'
      - 'scripts/patch-react-shell-tourism-copy.py'
      - 'scripts/patch-react-messages-parity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private-repo access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false

      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply complete parity tranche
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/scripts/patch-react-shell-tourism-copy.py
          python3 automation/scripts/patch-react-messages-parity.py

      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Validate generated local parity assets
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend-react/public/legacy/privacy-policy.html
          test -f frontend-react/public/legacy/termini.html
          test -f frontend-react/public/assets/Logo.webp
          test -f frontend-react/public/assets/images/home/tropea-960.webp
          test -f frontend-react/src/generated/tourism-data-core.ts
          grep -q 'export const ALL_TOURISM' frontend-react/src/lib/tourism-static.ts
          grep -q 'watchUnreadCounts' frontend-react/src/lib/messages.ts
          grep -q 'Risposte rapide' frontend-react/src/pages/MessagesPage.tsx

      - name: Commit verified full parity tranche
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No parity changes needed."
            exit 0
          fi
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react
          git commit -m "fix: align React content shell legal and messages with main"
          git push origin HEAD:react-migration
