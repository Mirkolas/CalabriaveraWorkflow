name: React final admin parity gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-admin-final-parity-gate.yml'

permissions:
  contents: read

env:
  EXPECTED_PRIVATE_SHA: 282b428ac9dc24b7c1da476544d5c3e91ab4f858
  ORACLE_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076

jobs:
  parity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: private-react-migration-writer
      cancel-in-progress: false
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - name: Checkout oracle legacy
        uses: actions/checkout@v7
        with:
          repository: Mirkolas/calabriavera
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: ${{ env.ORACLE_SHA }}
          path: oracle
          persist-credentials: false
          fetch-depth: 1

      - name: Blocca base inattesa
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "React base: $actual"
          test "$actual" = "$EXPECTED_PRIVATE_SHA" || { echo "::error::react-migration inatteso: $actual"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installa dipendenze oracle
        working-directory: oracle
        run: npm ci --no-audit --no-fund

      - name: Installa dipendenze sorgente
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Installa dipendenze React
        working-directory: source/frontend-react
        run: npm ci --no-audit --no-fund

      - name: Test legacy admin
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm run test:syntax
          node --test \
            tests/admin-control.test.mjs \
            tests/admin-backend.test.mjs \
            tests/admin-conversation-delete.test.mjs \
            tests/admin-conversation-delete-ui.test.mjs \
            tests/admin-user-profile-ui.test.mjs \
            tests/admin-critical-upgrades.test.mjs

      - name: Costruisci oracle finale
        working-directory: oracle
        run: npm run build

      - name: Vendor runtime oracle, route esatte e gate offline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/frontend-react/oracle-admin
          mkdir -p source/frontend-react/oracle-admin/assets source/frontend-react/oracle-admin/firebase
          cp -a oracle/dist/assets/js source/frontend-react/oracle-admin/assets/js
          cp oracle/dist/firebase/firebase-config.js source/frontend-react/oracle-admin/firebase/firebase-config.js

          python - <<'PY'
          from pathlib import Path

          copier = Path('source/frontend-react/scripts/copy-legacy-assets.mjs')
          text = copier.read_text()
          text = text.replace('import { spawnSync } from "node:child_process";\n', '')
          old = '''// Admin parity uses the exact BUILD-PATCHED legacy modules rather than a rewritten approximation.\n// Running build.mjs here reproduces patchAdminRuntime() from the authoritative pipeline.\nconst legacyBuild = spawnSync(process.execPath, [resolve(repoRoot, "scripts/build.mjs")], {\n  cwd: repoRoot,\n  stdio: "inherit",\n});\nif (legacyBuild.status !== 0) throw new Error(`Build legacy admin fallita (${legacyBuild.status})`);\nconst builtLegacyJs = resolve(repoRoot, "dist/assets/js");\nconst publicLegacyJs = resolve(reactRoot, "public/assets/js");\nif (!existsSync(builtLegacyJs)) throw new Error(`Asset JS legacy build mancanti: ${builtLegacyJs}`);\nif (existsSync(publicLegacyJs)) rmSync(publicLegacyJs, { recursive: true, force: true });\nmkdirSync(dirname(publicLegacyJs), { recursive: true });\ncpSync(builtLegacyJs, publicLegacyJs, { recursive: true });\nconst builtFirebaseConfig = resolve(repoRoot, "dist/firebase/firebase-config.js");\nif (!existsSync(builtFirebaseConfig)) throw new Error(`Config Firebase legacy build mancante: ${builtFirebaseConfig}`);\nconst publicFirebaseConfig = resolve(reactRoot, "public/firebase/firebase-config.js");\nmkdirSync(dirname(publicFirebaseConfig), { recursive: true });\ncopyFileSync(builtFirebaseConfig, publicFirebaseConfig);\nconsole.log(`Bridge admin legacy: ${publicLegacyJs}`);\n'''
          new = '''// Admin parity is pinned to the immutable BUILD-PATCHED runtime produced by the authoritative pre-React oracle.\n// The vendored files live outside public so every React build recreates public/assets/js deterministically.\nconst oracleAdminRoot = resolve(reactRoot, "oracle-admin");\nconst oracleLegacyJs = resolve(oracleAdminRoot, "assets/js");\nconst publicLegacyJs = resolve(reactRoot, "public/assets/js");\nif (!existsSync(oracleLegacyJs)) throw new Error(`Runtime admin oracle mancante: ${oracleLegacyJs}`);\nif (existsSync(publicLegacyJs)) rmSync(publicLegacyJs, { recursive: true, force: true });\nmkdirSync(dirname(publicLegacyJs), { recursive: true });\ncpSync(oracleLegacyJs, publicLegacyJs, { recursive: true });\nconst oracleFirebaseConfig = resolve(oracleAdminRoot, "firebase/firebase-config.js");\nif (!existsSync(oracleFirebaseConfig)) throw new Error(`Config Firebase oracle mancante: ${oracleFirebaseConfig}`);\nconst publicFirebaseConfig = resolve(reactRoot, "public/firebase/firebase-config.js");\nmkdirSync(dirname(publicFirebaseConfig), { recursive: true });\ncopyFileSync(oracleFirebaseConfig, publicFirebaseConfig);\nconsole.log(`Bridge admin oracle: ${publicLegacyJs}`);\n'''
          if old not in text:
              raise SystemExit('blocco build/copy legacy non riconosciuto')
          text = text.replace(old, new, 1)
          text = text.replace('  "/admin/backup": "pages/admin/backup.html",\n', '')
          copier.write_text(text)

          prerender = Path('source/frontend-react/scripts/prerender-home.mjs')
          text = prerender.read_text()
          anchor = 'const FIRESTORE_PROJECT_ID = "calabriavera-e08d4";\n'
          if anchor not in text:
              raise SystemExit('anchor prerender Firestore non trovato')
          text = text.replace(anchor, anchor + 'const PRERENDER_OFFLINE = process.env.CV_PRERENDER_OFFLINE === "1";\n', 1)
          query_anchor = 'async function queryCollection(collectionId, status, fields) {\n'
          if query_anchor not in text:
              raise SystemExit('queryCollection non trovata')
          text = text.replace(query_anchor, query_anchor + '  if (PRERENDER_OFFLINE) return [];\n', 1)
          prerender.write_text(text)

          admin = Path('source/frontend-react/src/pages/AdminPage.tsx').read_text()
          if 'backup' in admin.lower():
              raise SystemExit('AdminPage contiene una sezione backup non presente nell’oracle')

          app = Path('source/frontend-react/src/App.tsx')
          text = app.read_text()
          insert_after = 'const serverRendering = typeof window === "undefined";\n'
          admin_routes = '''const ADMIN_ROUTES = new Set([\n  "/admin/attivita", "/admin/recensioni", "/admin/segnalazioni", "/admin/utenti",\n  "/admin/comunicazioni", "/admin/messaggi", "/admin/blog", "/admin/categorie",\n  "/admin/comuni", "/admin/impostazioni", "/admin/seo", "/admin/sistema",\n]);\n'''
          if insert_after not in text:
              raise SystemExit('anchor App admin routes non trovato')
          text = text.replace(insert_after, insert_after + admin_routes, 1)
          old_route = '  if (path === "/admin" || path.startsWith("/admin/")) return <AdminPage />;\n'
          new_route = '  if (path === "/admin" || ADMIN_ROUTES.has(path)) return <AdminPage />;\n'
          if old_route not in text:
              raise SystemExit('wildcard admin route non trovato')
          app.write_text(text.replace(old_route, new_route, 1))
          PY

      - name: Verifica vendor identico all'oracle
        shell: bash
        run: |
          set -euo pipefail
          diff -qr oracle/dist/assets/js source/frontend-react/oracle-admin/assets/js
          cmp -s oracle/dist/firebase/firebase-config.js source/frontend-react/oracle-admin/firebase/firebase-config.js
          echo "Vendor admin oracle: byte-per-byte OK"

      - name: Costruisci React completo offline
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: npm run build

      - name: Verifica runtime pubblico byte-per-byte
        shell: bash
        run: |
          set -euo pipefail
          diff -qr oracle/dist/assets/js source/frontend-react/public/assets/js
          cmp -s oracle/dist/firebase/firebase-config.js source/frontend-react/public/firebase/firebase-config.js
          diff -qr oracle/dist/assets/js source/frontend-react/dist/assets/js
          cmp -s oracle/dist/firebase/firebase-config.js source/frontend-react/dist/firebase/firebase-config.js
          echo "Runtime admin pubblico/dist: byte-per-byte OK"

      - name: Verifica bundle CSS admin byte-per-byte
        shell: bash
        run: |
          set -euo pipefail
          bundles=(
            cv-bundle-b23bf9fdf406ca6d.css
            cv-bundle-28783d3e87e06008.css
            cv-bundle-fe11938d8fd5afe9.css
          )
          for file in "${bundles[@]}"; do
            test -s "oracle/dist/assets/css/$file"
            test -s "source/frontend-react/public/assets/css/$file"
            cmp -s "oracle/dist/assets/css/$file" "source/frontend-react/public/assets/css/$file" || {
              echo "::error::Bundle CSS admin diverso dall'oracle: $file"
              sha256sum "oracle/dist/assets/css/$file" "source/frontend-react/public/assets/css/$file"
              exit 1
            }
          done
          echo "Bundle CSS admin: parità byte-per-byte OK"

      - name: Verifica bridge, menu, route e output build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          admin = Path('source/frontend-react/src/pages/AdminPage.tsx').read_text()
          app = Path('source/frontend-react/src/App.tsx').read_text()
          route_map = json.loads(Path('source/frontend-react/public/main-route-css.json').read_text())
          css = route_map['routeCss']
          pages = route_map['routePages']
          legacy_console = Path('oracle/assets/js/admin-console.js').read_text()

          expected_slugs = [
            'attivita', 'recensioni', 'segnalazioni', 'utenti', 'comunicazioni', 'messaggi',
            'blog', 'categorie', 'comuni', 'impostazioni', 'seo', 'sistema',
          ]
          for slug in expected_slugs:
              assert f'["{slug}",' in legacy_console, slug
              assert f'"/admin/{slug}"' in app, slug
          assert '["backup",' not in legacy_console
          assert 'backup' not in admin.lower()
          assert '"/admin/backup"' not in app
          assert 'path.startsWith("/admin/")' not in app
          assert 'ADMIN_ROUTES.has(path)' in app

          expected_css = {
            '/admin': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/attivita': '/assets/css/cv-bundle-b23bf9fdf406ca6d.css',
            '/admin/recensioni': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/segnalazioni': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/blog': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/categorie': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/comuni': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/utenti': '/assets/css/cv-bundle-fe11938d8fd5afe9.css',
            '/admin/messaggi': '/assets/css/cv-bundle-b23bf9fdf406ca6d.css',
            '/admin/comunicazioni': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/seo': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/sistema': '/assets/css/cv-bundle-28783d3e87e06008.css',
            '/admin/impostazioni': '/assets/css/cv-bundle-28783d3e87e06008.css',
          }
          for route, bundle in expected_css.items():
              assert css.get(route) == [bundle], (route, css.get(route), bundle)
          assert '/admin/backup' not in css
          assert '/admin/backup' not in pages

          for route in ('/admin/segnalazioni', '/admin/comunicazioni', '/admin/sistema'):
              assert pages.get(route) == 'admin-index', (route, pages.get(route))

          required = [
            'importLegacy("auth.js")',
            'importLegacy("admin.js")',
            'importLegacy("admin-runtime-fixes.js")',
            'importLegacy("admin-maintenance-toggle.js")',
            'importLegacy("admin-automation-status.js")',
            'importLegacy("admin-critical-upgrades.js")',
            'importLegacy("admin-conversation-delete-ui.js")',
            'importLegacy("admin-user-profile-ui.js")',
            'importLegacy("admin-console.js")',
            'importLegacy("admin-upgrade.js")',
          ]
          for token in required:
              assert token in admin, token
          assert admin.index('importLegacy("auth.js")') < admin.index('importLegacy("admin.js")') < admin.index('importLegacy("admin-runtime-fixes.js")')
          assert admin.index('importLegacy("admin-console.js")') < admin.index('importLegacy("admin-upgrade.js")')
          assert 'const url = `/assets/js/${file}`' in admin
          assert '/* @vite-ignore */ url' in admin
          assert 'robots: "noindex,nofollow"' in admin

          prerender = Path('source/frontend-react/scripts/prerender-home.mjs').read_text()
          assert 'CV_PRERENDER_OFFLINE' in prerender
          assert 'if (PRERENDER_OFFLINE) return [];' in prerender

          dist = Path('source/frontend-react/dist')
          assert (dist / 'index.html').exists()
          assert list((dist / 'assets').glob('AdminPage-*.js'))
          print('Admin bridge/menu/routes/offline build: OK')
          PY

      - name: Commit runtime oracle immutabile
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CalabriaVera CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react/oracle-admin \
                  frontend-react/scripts/copy-legacy-assets.mjs \
                  frontend-react/scripts/prerender-home.mjs \
                  frontend-react/src/App.tsx
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::Nessuna modifica da committare"; exit 1; }
          git commit -m "fix: pin exact oracle admin runtime and routes"
          git push origin HEAD:react-migration
