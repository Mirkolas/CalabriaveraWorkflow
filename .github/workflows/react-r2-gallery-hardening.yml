name: React migration - R2 gallery hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-r2-gallery-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-private-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
    steps:
      - name: Verifica accesso
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT mancante"; exit 1; }

      - name: Checkout branch React privata
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Preserva chiavi R2 e immagini legacy
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          businesses = Path('frontend-react/src/lib/businesses.ts')
          text = businesses.read_text(encoding='utf-8')
          old = '  const key = String(item.imageKey || "").replace(/^\\/+/, "");'
          new = '  const key = String(item.imageKey || item.r2ImageKey || "").replace(/^\\/+/, "");'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('imageUrlFromGallery inatteso')
          businesses.write_text(text, encoding='utf-8')

          editor = Path('frontend-react/src/lib/business-editor.ts')
          text = editor.read_text(encoding='utf-8')
          old_head = '  const imageDataUrl = String(image.imageDataUrl || "").trim();\n  const resolvedUrl = String(image.imageUrl || ((image.imageKey || image.r2ImageKey) ? imageUrlFromGallery(image as BusinessImage) : "")).trim();\n  const imageUrl = /^https:\\/\\//i.test(resolvedUrl) ? resolvedUrl : "";'
          new_head = '  const imageDataUrl = String(image.imageDataUrl || "").trim();\n  const imageKey = String(image.imageKey || image.r2ImageKey || "").replace(/^\\/+/, "").trim();\n  const resolvedUrl = String(image.imageUrl || (imageKey ? imageUrlFromGallery({ ...image, imageKey } as BusinessImage) : "")).trim();\n  const imageUrl = /^https:\\/\\//i.test(resolvedUrl) ? resolvedUrl : "";'
          if old_head in text:
              text = text.replace(old_head, new_head, 1)
          elif new_head not in text:
              raise SystemExit('Testata normalizedImage inattesa')

          old_return = '  return { imageUrl, order, ownerId };\n}'
          new_return = '  return imageKey ? { imageKey, imageUrl, order, ownerId } : { imageUrl, order, ownerId };\n}'
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          elif new_return not in text:
              raise SystemExit('Return normalizedImage inatteso')

          old_patch = '      imageUrl: f.deleteField(),\n      imageDataUrl: f.deleteField(),\n      imageMime: f.deleteField(),\n      imageBytes: f.deleteField(),'
          new_patch = '      imageUrl: f.deleteField(),\n      imageKey: f.deleteField(),\n      r2ImageKey: f.deleteField(),\n      imageDataUrl: f.deleteField(),\n      imageMime: f.deleteField(),\n      imageBytes: f.deleteField(),'
          if old_patch in text:
              text = text.replace(old_patch, new_patch, 1)
          elif new_patch not in text:
              raise SystemExit('Patch cover inattesa')

          old_set = '    if ("imageUrl" in cover) patch.imageUrl = cover.imageUrl;\n    if ("imageDataUrl" in cover) {'
          new_set = '    if ("imageUrl" in cover) patch.imageUrl = cover.imageUrl;\n    if ("imageKey" in cover) patch.imageKey = cover.imageKey;\n    if ("imageDataUrl" in cover) {'
          if old_set in text:
              text = text.replace(old_set, new_set, 1)
          elif new_set not in text:
              raise SystemExit('Assegnazione cover inattesa')

          old_empty = '      imageDataUrl: f.deleteField(),\n      imageMime: f.deleteField(),\n      imageBytes: f.deleteField(),\n      imageUrl: f.deleteField(),\n      updatedAt: f.serverTimestamp(),'
          new_empty = '      imageDataUrl: f.deleteField(),\n      imageMime: f.deleteField(),\n      imageBytes: f.deleteField(),\n      imageUrl: f.deleteField(),\n      imageKey: f.deleteField(),\n      r2ImageKey: f.deleteField(),\n      updatedAt: f.serverTimestamp(),'
          if old_empty in text:
              text = text.replace(old_empty, new_empty, 1)
          elif new_empty not in text:
              raise SystemExit('Pulizia cover vuota inattesa')

          editor.write_text(text, encoding='utf-8')
          PY

          cd frontend-react
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          git diff --check
          git config user.name "CalabriaVera Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend-react/src/lib/businesses.ts frontend-react/src/lib/business-editor.ts
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria."
            exit 0
          fi
          git commit -m "fix: preserve R2 gallery keys during edits"
          git push origin HEAD:react-migration
