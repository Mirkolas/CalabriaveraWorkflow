name: React migration - final live public parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-final-public-gate.yml'
      - 'scripts/patch-react-final-public-gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-final-live-public-parity
  cancel-in-progress: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Verify private repository access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - name: Checkout automation repo
        uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - name: Checkout React migration
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply final live parity fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "94868a091a8f66d83b51c17f9fbe0310d0377e9a"
          python3 automation/scripts/patch-react-final-public-gate.py
      - name: Build React with Node 24
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate public parity invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'react-live-parity.css' source/frontend-react/src/generated/main-route-css.ts
          grep -q 'tropea-1600.webp' source/frontend-react/public/assets/css/react-live-parity.css
          grep -q 'grid-template-columns:minmax(0,1fr)' source/frontend-react/public/assets/css/react-live-parity.css
          grep -q 'htmlRequest = request' source/frontend-react/worker.ts
          grep -q 'index.html' source/frontend-react/worker.ts
          grep -q 'rawCleanPath' source/frontend-react/src/components/Layout.tsx
          grep -q 'cv-account-login' source/frontend-react/src/components/Layout.tsx
          grep -q 'Ispirazioni, curiosità, guide ed eventi' source/frontend-react/src/lib/language.ts
          grep -q 'CATEGORIES.map' source/frontend-react/src/pages/OriginalHomePage.tsx
          grep -q 'catalog-activity-cover.css' source/frontend-react/dist/catalogo/index.html
          grep -q 'react-live-parity.css' source/frontend-react/dist/catalogo/index.html
          git -C source diff --check
      - name: Commit verified final public parity
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add frontend-react
          git -C source commit -m 'fix: close live public parity gaps'
          git -C source push origin HEAD:react-migration
