name: Internal - Scheduled retry gate

on:
  workflow_call:
    inputs:
      workflow_file:
        description: Workflow file name used by the Actions API
        required: true
        type: string
      cadence_minutes:
        description: Logical interval between scheduled campaigns, in minutes
        required: true
        type: number
      anchor_offset_minutes:
        description: Campaign start offset in minutes from the Unix epoch
        required: true
        type: number
    outputs:
      should_run:
        description: true when this attempt may execute the real job
        value: ${{ jobs.gate.outputs.should_run }}
      campaign:
        description: Logical campaign identifier
        value: ${{ jobs.gate.outputs.campaign }}

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      campaign: ${{ steps.guard.outputs.campaign }}
    steps:
      - name: Proteggi la quota Firestore e deduplica i tentativi
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          CADENCE_MINUTES: ${{ inputs.cadence_minutes }}
          ANCHOR_OFFSET_MINUTES: ${{ inputs.anchor_offset_minutes }}
        run: |
          set -euo pipefail

          # Un avvio umano esplicito resta sempre disponibile per emergenze/manutenzione.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "campaign=manual" >> "$GITHUB_OUTPUT"
            echo "Avvio manuale: esecuzione consentita."
            exit 0
          fi

          cadence="$CADENCE_MINUTES"
          anchor="$ANCHOR_OFFSET_MINUTES"
          if ! [[ "$cadence" =~ ^[0-9]+$ ]] || [ "$cadence" -le 0 ]; then
            echo "::error::Cadenza non valida: $cadence"
            exit 1
          fi
          if ! [[ "$anchor" =~ ^-?[0-9]+$ ]]; then
            echo "::error::Anchor non valido: $anchor"
            exit 1
          fi

          # Tetti conservativi per il piano gratuito Firestore. I valori qui prevalgono
          # sulle cadenze più aggressive dichiarate dai singoli workflow.
          quota_floor=0
          case "$WORKFLOW_FILE" in
            magazine-sync.yml) quota_floor=360 ;;      # max 4 cicli/giorno
            seo-sync.yml) quota_floor=720 ;;           # max 2 scansioni SEO/giorno
            firebase-deploy.yml) quota_floor=1440 ;;   # manutenzione admin max 1/giorno
            daily-backup.yml) quota_floor=10080 ;;     # backup completo max 1/settimana
          esac
          if [ "$quota_floor" -gt 0 ] && [ "$cadence" -lt "$quota_floor" ]; then
            echo "Protezione quota Firestore: cadenza $WORKFLOW_FILE aumentata da ${cadence} a ${quota_floor} minuti."
            cadence="$quota_floor"
          fi

          now_epoch="$(date -u +%s)"
          now_minutes=$((now_epoch / 60))
          campaign=$(((now_minutes - anchor) / cadence))
          campaign_start_minutes=$((campaign * cadence + anchor))
          campaign_end_minutes=$((campaign_start_minutes + cadence))
          campaign_start="$(date -u -d "@$((campaign_start_minutes * 60))" '+%Y-%m-%dT%H:%M:%SZ')"
          campaign_end="$(date -u -d "@$((campaign_end_minutes * 60))" '+%Y-%m-%dT%H:%M:%SZ')"

          echo "campaign=$campaign" >> "$GITHUB_OUTPUT"
          echo "Finestra quota $campaign: $campaign_start -> $campaign_end ($cadence minuti)"

          # Per schedule e repository_dispatch conta QUALSIASI tentativo reale completato
          # nella finestra, non soltanto i successi. In questo modo un errore quota non
          # scatena altri 4-5 retry costosi nella stessa campagna.
          set +e
          runs_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?branch=main&status=completed&per_page=100" 2>/tmp/retry-gate.err)"
          api_code=$?
          set -e

          if [ "$api_code" -ne 0 ]; then
            # Fail closed sui workflow quota-sensitive: un problema dell'API GitHub non
            # deve trasformarsi in migliaia di letture Firestore duplicate.
            if [ "$quota_floor" -gt 0 ]; then
              echo "::warning::Impossibile verificare i tentativi precedenti: blocco prudenziale di $WORKFLOW_FILE."
              cat /tmp/retry-gate.err || true
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Impossibile verificare i tentativi precedenti; workflow non Firestore consentito."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_attempt="$(printf '%s' "$runs_json" | jq -r \
            --arg current "$RUN_ID" \
            --arg start "$campaign_start" \
            --arg end "$campaign_end" '
              first(
                .workflow_runs[]
                | select((.id | tostring) != $current)
                | select(.created_at >= $start and .created_at < $end)
                | select(.event == "schedule" or .event == "repository_dispatch")
                | [.id, .event, .conclusion, .created_at] | @tsv
              ) // empty
            ')"

          if [ -n "$previous_attempt" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Tentativo reale già completato nella finestra: $previous_attempt"
            echo "Nuove letture Firestore bloccate fino alla prossima finestra."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Nessun tentativo precedente nella finestra: esecuzione consentita."
          fi
