name: Firebase - Deploy CalabriaVera

on:
  schedule:
    - cron: '17 */4 * * *'
    - cron: '32 */4 * * *'
    - cron: '47 */4 * * *'
    - cron: '2 1-21/4 * * *'
    - cron: '17 1-21/4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [source-deploy]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: firebase-workflow-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  retry_gate:
    uses: ./.github/workflows/scheduled-retry-gate.yml
    with:
      workflow_file: firebase-deploy.yml
      cadence_minutes: 240
      anchor_offset_minutes: 17

  deploy:
    needs: retry_gate
    if: needs.retry_gate.outputs.should_run == 'true' && vars.FIREBASE_AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Genera Story Instagram 9:16 con safe area
        working-directory: source
        run: |
          set -euo pipefail
          src="assets/Story-Promo_instagram-facebook.png"
          out="assets/Story-Promo_instagram-safe.png"
          test -f "$src"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -i "$src" -filter_complex "[0:v]split=2[bgsrc][fgsrc];[bgsrc]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=28[bg];[fgsrc]scale=920:1640:force_original_aspect_ratio=decrease[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2" -frames:v 1 "$out"
          dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$out")
          type=$(file -b --mime-type "$out")
          size=$(wc -c < "$out")
          echo "Story Instagram: ${dims}, ${size} byte"
          test "$dims" = "1080x1920"
          test "$type" = "image/png"
          test "$size" -gt 25000

      - name: Valida PNG Story promozionale
        working-directory: source
        run: |
          set -euo pipefail
          for story in assets/Story-Promo_instagram-facebook.png assets/Story-Promo_instagram-safe.png; do
            test -f "$story"
            type=$(file -b --mime-type "$story")
            info=$(file -b "$story")
            size=$(wc -c < "$story")
            echo "$story: $info"
            echo "Dimensione: $size byte"
            test "$type" = "image/png"
            test "$size" -gt 25000
          done

      - name: Valida favicon e icone ufficiali
        working-directory: source
        run: |
          set -euo pipefail
          for file in favicon.ico favicon-32x32.png favicon-16x16.png apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png; do
            test -s "assets/$file"
            echo "$file: $(file -b "assets/$file")"
          done
          test -s assets/site.webmanifest
          echo "Favicon e icone dirette in assets validate correttamente"

      - working-directory: source
        run: npm ci

      - working-directory: source
        run: npm test

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - working-directory: source
        run: npm run deploy

      - name: Verifica SEO pubblicato
        working-directory: source
        env:
          SITE_URL: https://calabriavera.com
          FIREBASE_PROJECT_ID: calabriavera-e08d4
        run: node tools/verify-seo-deploy.mjs

  admin-maintenance:
    needs: retry_gate
    if: needs.retry_gate.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
    concurrency:
      group: firebase-admin-maintenance
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Esegue manutenzione amministrativa
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
        shell: bash
        run: |
          set -euo pipefail
          run_admin_task() {
            local label="$1"
            shift
            local output code
            set +e
            output="$("$@" 2>&1)"
            code=$?
            set -e
            printf '%s\n' "$output"
            if [ "$code" -eq 0 ]; then
              return 0
            fi
            if printf '%s' "$output" | grep -Eqi 'RESOURCE_EXHAUSTED|Quota exceeded|FIRESTORE_429|ADMIN_FIRESTORE_429|(^|[^0-9])429([^0-9]|$)'; then
              echo "::warning::${label} rinviata: quota Firestore temporaneamente esaurita. La prossima manutenzione programmata riproverà automaticamente."
              return 0
            fi
            return "$code"
          }
          run_admin_task process-actions node tools/admin/process-actions.mjs
          run_admin_task cleanup-business-actions node tools/admin/cleanup-business-actions.mjs
          run_admin_task cleanup-actions node tools/admin/cleanup-actions.mjs
