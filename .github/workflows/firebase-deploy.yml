name: Firebase deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-deploy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_WIF_PROVIDER: ${{ secrets.FIREBASE_WIF_PROVIDER }}
      FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Verifica configurazione protetta
        shell: bash
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO PRIVATE_REPO_PAT FIREBASE_PROJECT_ID SITE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret richiesto non configurato: $name"
              exit 1
            fi
          done
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ] && { [ -z "${FIREBASE_WIF_PROVIDER:-}" ] || [ -z "${FIREBASE_DEPLOY_SERVICE_ACCOUNT:-}" ]; }; then
            echo "::error::Configura FIREBASE_SERVICE_ACCOUNT oppure la coppia FIREBASE_WIF_PROVIDER/FIREBASE_DEPLOY_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Genera e valida asset di deploy
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          src="assets/Story-Promo_instagram-facebook.png"
          out="assets/Story-Promo_instagram-safe.png"
          if [ -f "$src" ]; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y ffmpeg
            fi
            ffmpeg -hide_banner -loglevel error -y -i "$src" -filter_complex "[0:v]split=2[bgsrc][fgsrc];[bgsrc]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=28[bg];[fgsrc]scale=920:1640:force_original_aspect_ratio=decrease[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2" -frames:v 1 "$out"
          fi

      - name: Installa dipendenze e testa
        working-directory: source
        run: npm ci && npm test

      - name: Autentica Google Cloud con JSON
        if: env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Autentica Google Cloud con Workload Identity Federation
        if: env.FIREBASE_SERVICE_ACCOUNT_JSON == ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy produzione
        working-directory: source
        run: npm run deploy

      - name: Verifica pubblicazione
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node tools/verify-seo-deploy.mjs

      - name: Manutenzione amministrativa
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tools ci --no-audit --no-fund
          run_admin_task() {
            local label="$1"
            shift
            local output code
            set +e
            output="$("$@" 2>&1)"
            code=$?
            set -e
            printf '%s\n' "$output"
            if [ "$code" -eq 0 ]; then return 0; fi
            if printf '%s' "$output" | grep -Eqi 'RESOURCE_EXHAUSTED|Quota exceeded|FIRESTORE_429|ADMIN_FIRESTORE_429|(^|[^0-9])429([^0-9]|$)'; then
              echo "::warning::${label} rinviata per quota temporanea."
              return 0
            fi
            return "$code"
          }
          run_admin_task process-actions node tools/admin/process-actions.mjs
          run_admin_task cleanup-business-actions node tools/admin/cleanup-business-actions.mjs
          run_admin_task cleanup-actions node tools/admin/cleanup-actions.mjs
