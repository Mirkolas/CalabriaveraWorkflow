name: Firebase - Deploy CalabriaVera

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [source-deploy]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: firebase-workflow-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  retry_gate:
    uses: ./.github/workflows/scheduled-retry-gate.yml
    with:
      workflow_file: firebase-deploy.yml
      cadence_minutes: 1440
      anchor_offset_minutes: 137

  deploy:
    needs: retry_gate
    if: needs.retry_gate.outputs.should_run == 'true' && vars.FIREBASE_AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Suite completa repository
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: Build React produzione
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules e indexes
        working-directory: source
        run: npx --yes firebase-tools@15.22.1 deploy --project calabriavera-e08d4 --only firestore:rules,firestore:indexes

      - name: Deploy React su Firebase Hosting
        working-directory: source/frontend-react
        run: npx --yes firebase-tools@15.22.1 deploy --project calabriavera-e08d4 --config firebase.react.json --only hosting

      - name: Verifica build pubblicata su calabriavera.com
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          live="$(curl --fail --silent --show-error --location --retry 6 --retry-delay 3 -H 'Cache-Control: no-cache' "https://calabriavera.com/build-version.txt?run=$GITHUB_RUN_ID" | tr -d '\r\n')"
          test "$live" = "$expected"
          html="$(curl --fail --silent --show-error --location --retry 6 --retry-delay 3 -H 'Cache-Control: no-cache' "https://calabriavera.com/?run=$GITHUB_RUN_ID")"
          printf '%s' "$html" | grep -Eqi '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"']index,follow'
          echo "React produzione verificato: $live"

  admin-maintenance:
    needs: retry_gate
    if: needs.retry_gate.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
    concurrency:
      group: firebase-admin-maintenance
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Esegue manutenzione amministrativa
        working-directory: source
        env:
          FIREBASE_PROJECT_ID: calabriavera-e08d4
        shell: bash
        run: |
          set -euo pipefail
          run_admin_task() {
            local label="$1"
            shift
            local output code
            set +e
            output="$("$@" 2>&1)"
            code=$?
            set -e
            printf '%s\n' "$output"
            if [ "$code" -eq 0 ]; then
              return 0
            fi
            if printf '%s' "$output" | grep -Eqi 'RESOURCE_EXHAUSTED|Quota exceeded|FIRESTORE_429|ADMIN_FIRESTORE_429|(^|[^0-9])429([^0-9]|$)'; then
              echo "::warning::${label} fermata: quota Firestore temporaneamente esaurita. Nessun retry automatico nella stessa finestra."
              return 75
            fi
            return "$code"
          }
          run_admin_task process-actions node tools/admin/process-actions.mjs
          run_admin_task cleanup-business-actions node tools/admin/cleanup-business-actions.mjs
          run_admin_task cleanup-actions node tools/admin/cleanup-actions.mjs
