name: Firebase deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-deploy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-workflow-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.FIREBASE_AUTO_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo "::error::PRIVATE_REPO mancante"; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo "::error::PAT per repository privato mancante"; exit 1; }

      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Carica configurazione originale senza pubblicarla
        working-directory: source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('.github/workflows/firebase-deploy.yml','utf8');
          const project=text.match(/FIREBASE_PROJECT_ID:\s*([^\s]+)/)?.[1];
          const site=text.match(/SITE_URL:\s*(https:\/\/[^\s]+)/)?.[1];
          if(!project || !site) throw new Error('Configurazione deploy originale non trovata');
          fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_PROJECT_ID=${project}\nSITE_URL=${site}\n`);
          NODE

      - name: Genera Story Instagram 9:16 con safe area
        working-directory: source
        run: |
          set -euo pipefail
          src="assets/Story-Promo_instagram-facebook.png"
          out="assets/Story-Promo_instagram-safe.png"
          test -f "$src"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -i "$src" -filter_complex "[0:v]split=2[bgsrc][fgsrc];[bgsrc]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,gblur=sigma=28[bg];[fgsrc]scale=920:1640:force_original_aspect_ratio=decrease[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2" -frames:v 1 "$out"
          dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$out")
          type=$(file -b --mime-type "$out")
          size=$(wc -c < "$out")
          test "$dims" = "1080x1920"
          test "$type" = "image/png"
          test "$size" -gt 25000

      - name: Valida asset ufficiali
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for story in assets/Story-Promo_instagram-facebook.png assets/Story-Promo_instagram-safe.png; do
            test -f "$story"
            test "$(file -b --mime-type "$story")" = "image/png"
            test "$(wc -c < "$story")" -gt 25000
          done
          for file in favicon.ico favicon-32x32.png favicon-16x16.png apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png; do
            test -s "assets/$file"
          done
          test -s assets/site.webmanifest

      - name: Installa e testa
        working-directory: source
        run: npm ci && npm test

      - name: Autentica Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy produzione
        working-directory: source
        run: npm run deploy

      - name: Verifica SEO pubblicato
        working-directory: source
        env:
          SITE_URL: ${{ env.SITE_URL }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        run: node tools/verify-seo-deploy.mjs

  admin-maintenance:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: firebase-admin-maintenance
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
    steps:
      - name: Scarica sorgente privato
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: main
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Carica progetto originale senza pubblicarlo
        working-directory: source
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('.github/workflows/firebase-deploy.yml','utf8');
          const project=text.match(/FIREBASE_PROJECT_ID:\s*([^\s]+)/)?.[1];
          if(!project) throw new Error('Progetto originale non trovato');
          fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_PROJECT_ID=${project}\n`);
          NODE
      - working-directory: source
        run: npm --prefix tools ci --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Esegue manutenzione amministrativa
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          run_admin_task() {
            local label="$1"; shift
            local output code
            set +e; output="$("$@" 2>&1)"; code=$?; set -e
            printf '%s\n' "$output"
            if [ "$code" -eq 0 ]; then return 0; fi
            if printf '%s' "$output" | grep -Eqi 'RESOURCE_EXHAUSTED|Quota exceeded|FIRESTORE_429|ADMIN_FIRESTORE_429|(^|[^0-9])429([^0-9]|$)'; then
              echo "::warning::${label} rinviata per quota temporaneamente esaurita."
              return 0
            fi
            return "$code"
          }
          run_admin_task process-actions node tools/admin/process-actions.mjs
          run_admin_task cleanup-business-actions node tools/admin/cleanup-business-actions.mjs
          run_admin_task cleanup-actions node tools/admin/cleanup-actions.mjs
