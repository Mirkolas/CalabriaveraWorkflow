name: React migration - mobile overflow diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-mobile-overflow-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING: https://calabriavera.sonotacamirko.workers.dev
      MAIN: https://calabriavera.com
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Inspect raw server HTML
        shell: bash
        run: |
          set -euo pipefail
          echo '--- headers /catalogo ---'
          curl -sS -D /tmp/headers -o /tmp/catalogo.html "$STAGING/catalogo?diag=$(date +%s)"
          cat /tmp/headers
          echo '--- parity markers ---'
          grep -o 'data-cv-main-parity' /tmp/catalogo.html | head || true
          grep -o '/assets/css/catalog-activity-cover.css' /tmp/catalogo.html | head || true
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cvdiag
          npm install --prefix /tmp/cvdiag --no-package-lock --no-save playwright@1.62.1
          /tmp/cvdiag/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect overflow and live main visual sources
        shell: bash
        env:
          PLAYWRIGHT: /tmp/cvdiag/node_modules/playwright
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require(process.env.PLAYWRIGHT);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const route of ['/', '/mappa', '/chi-siamo']){
              const ctx=await browser.newContext({viewport:{width:390,height:844}}); const page=await ctx.newPage();
              await page.goto(process.env.STAGING+route,{waitUntil:'domcontentloaded',timeout:20000}); await page.waitForTimeout(1800);
              const result=await page.evaluate(()=>({docClient:document.documentElement.clientWidth,docScroll:document.documentElement.scrollWidth,bodyClient:document.body.clientWidth,bodyScroll:document.body.scrollWidth,overflowers:[...document.querySelectorAll('body *')].map(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return{tag:el.tagName.toLowerCase(),id:el.id,cls:String(el.className||'').slice(0,120),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),scrollWidth:el.scrollWidth,position:cs.position}}).filter(x=>x.position!=='absolute'&&(x.right>document.documentElement.clientWidth+2||x.left<-2)).slice(0,30)}));
              console.log('\n=== staging',route,'===\n'+JSON.stringify(result,null,2)); await ctx.close();
            }
            for(const width of [1365,390]){
              const ctx=await browser.newContext({viewport:{width,height:900}}); const page=await ctx.newPage();
              await page.goto(process.env.MAIN+'/?diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000}); await page.waitForTimeout(1800);
              const info=await page.evaluate(()=>{const hero=document.querySelector('.cv-home-hero'),footer=document.querySelector('#site-footer')||document.querySelector('footer');return{heroBackground:hero?getComputedStyle(hero).backgroundImage:'',heroPosition:hero?getComputedStyle(hero).backgroundPosition:'',headerHtml:(document.querySelector('#site-header')?.innerHTML||'').slice(0,12000),footerHtml:(footer?.innerHTML||'').slice(0,20000),footerLinks:[...document.querySelectorAll('#site-footer a[href],footer a[href]')].map(a=>({text:(a.textContent||'').trim(),href:a.getAttribute('href'),cls:a.className,aria:a.getAttribute('aria-label')}))};});
              console.log('\n=== MAIN HOME width='+width+' ===\n'+JSON.stringify(info,null,2)); await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
