name: React legacy header wrapper experiment v1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-legacy-header-wrapper-experiment-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 5f145eee5a37c4d765a758f01b83e61e62c3ef0c
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Build outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd legacy && npm ci && npm run build)
          mkdir -p source/frontend-react/public/assets/css/exact-built
          cp legacy/dist/assets/css/cv-bundle-1dae388af7394278.css source/frontend-react/public/assets/css/exact-built/generic.css
          (cd source/frontend-react && npm ci && npm run build)
      - name: Browser compare
        shell: bash
        env:
          PLAYWRIGHT_MODULE: /tmp/cvhw/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/cvhw
          npm install --prefix /tmp/cvhw --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cvhw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cvhw/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/l.log 2>&1 & echo $! >/tmp/l.pid
          nohup /tmp/cvhw/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/r.log 2>&1 & echo $! >/tmp/r.pid
          for i in {1..30};do curl -fsS http://127.0.0.1:4184/404.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && break;sleep 1;done
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);const b=await chromium.launch({headless:true});
          async function snap(origin,path,v,wrap=false){const c=await b.newContext({viewport:v,serviceWorkers:'block'});await c.addInitScript(()=>{const n=Date.now();localStorage.setItem('cv-cookie-consent-v3',JSON.stringify({version:3,scope:'technical-only',savedAt:new Date(n).toISOString(),expiresAt:new Date(n+86400000).toISOString(),necessary:true,preferences:false,analytics:false,marketing:false,source:'ci'}))});const p=await c.newPage();await p.goto(origin+path,{waitUntil:'domcontentloaded'});if(origin.includes('4185')){await p.evaluate((wrap)=>{for(const x of [...document.querySelectorAll('link[rel="stylesheet"],style')])x.remove();if(wrap){const h=document.querySelector('.site-header');if(h&&!h.parentElement?.matches('#site-header')){const w=document.createElement('div');w.id='site-header';h.before(w);w.append(h)}}},wrap);await p.addStyleTag({url:'/assets/css/exact-built/generic.css'});}await p.locator('.site-header').waitFor();await p.waitForTimeout(120);const o=await p.evaluate(()=>{const r=e=>{const x=e?.getBoundingClientRect();return x?{x:x.x,y:x.y,w:x.width,h:x.height}:null};const h=document.querySelector('.site-header'),i=document.querySelector('.header-inner'),logo=document.querySelector('.brand-logo'),main=document.querySelector('#main-content'),root=document.querySelector('#site-header');const s=e=>e?getComputedStyle(e):null;return{root:r(root),header:r(h),inner:r(i),logo:r(logo),main:r(main),headerMargin:s(h)?.margin,headerPadding:s(h)?.padding,innerMargin:s(i)?.margin,innerPadding:s(i)?.padding,logoDisplay:s(logo)?.display,logoSize:s(logo)?[s(logo).width,s(logo).height]:null}});await c.close();return o;}
          for(const [m,v] of [['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]]){console.log(m,'LEGACY',JSON.stringify(await snap('http://127.0.0.1:4184','/404.html',v)));console.log(m,'REACT-NOWRAP',JSON.stringify(await snap('http://127.0.0.1:4185','/zz',v,false)));console.log(m,'REACT-WRAP',JSON.stringify(await snap('http://127.0.0.1:4185','/zz',v,true)));}await b.close();
          NODE
      - name: Stop
        if: always()
        run: |
          kill "$(cat /tmp/l.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/r.pid 2>/dev/null)" 2>/dev/null || true
