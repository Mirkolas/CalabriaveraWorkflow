name: React exact built backup parity - consent v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-exact-built-consent-parity-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-exact-built-consent-parity-v3
  cancel-in-progress: true

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build both deploy outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          (cd legacy && npm ci && npm run build)
          cd source
          python3 ../workflow/scripts/patch-react-exact-consent.py
          cp ../legacy/assets/css/privacy-consent.css frontend-react/src/consent.css
          cd frontend-react
          npm ci
          npm run build
          test -f dist/assets/css/privacy-consent.css
          grep -q 'privacy-consent.css' src/components/Layout.tsx
          grep -q 'assets/css/privacy-consent.css' scripts/copy-legacy-assets.mjs

      - name: Install Chromium and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-consent-v3
          npm install --prefix /tmp/cv-consent-v3 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-consent-v3/node_modules/.bin/playwright install --with-deps chromium
          nohup /tmp/cv-consent-v3/node_modules/.bin/serve legacy/dist -l 4184 >/tmp/cv-consent-v3-legacy.log 2>&1 & echo $! >/tmp/cv-consent-v3-legacy.pid
          nohup /tmp/cv-consent-v3/node_modules/.bin/serve -s source/frontend-react/dist -l 4185 >/tmp/cv-consent-v3-react.log 2>&1 & echo $! >/tmp/cv-consent-v3-react.pid
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4184/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4185/ >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1

      - name: Gate built consent cascade and interactions
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-consent-v3/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(import.meta.url)(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true}),fail=[];
          const modes=[['desktop',{width:1365,height:900}],['mobile',{width:390,height:844}]];
          const clean=x=>String(x||'').replace(/\s+/g,' ').trim();
          async function open(ctx,origin){const p=await ctx.newPage(),errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));await p.goto(origin+'/',{waitUntil:'domcontentloaded'});await p.locator('[data-cv-consent-banner]').waitFor({state:'visible'});await p.waitForTimeout(250);return{p,errors}}
          async function snap(p){return p.evaluate(()=>{const b=document.querySelector('[data-cv-consent-banner]'),r=b?.getBoundingClientRect();const buttons=[...b?.querySelectorAll('.cv-consent-actions .button')||[]].map(el=>{const q=el.getBoundingClientRect(),s=getComputedStyle(el);return{text:el.textContent?.trim(),h:q.height,padding:s.padding,lineHeight:s.lineHeight,fontSize:s.fontSize}});return{title:b?.querySelector('h2')?.textContent||'',copy:b?.querySelector('.cv-consent-copy>p')?.textContent||'',rect:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null,buttons,footer:document.querySelector('.cv-consent-footer-line')?.textContent||'',footerChildren:document.querySelector('footer.footer .footer-grid')?.children.length||0,routeLinks:[...document.querySelectorAll('link[data-cv-main-parity]')].map(x=>new URL(x.href,location.origin).pathname)}})}
          try{
            for(const [mode,viewport] of modes){
              const ctx=await browser.newContext({viewport,serviceWorkers:'block'});await ctx.addInitScript(()=>{localStorage.clear();sessionStorage.clear()});
              const L=await open(ctx,'http://127.0.0.1:4184'),R=await open(ctx,'http://127.0.0.1:4185'),a=await snap(L.p),b=await snap(R.p),m=[];
              if(clean(a.title)!==clean(b.title)||clean(a.copy)!==clean(b.copy))m.push('copy');
              if(clean(a.footer)!==clean(b.footer)||a.footerChildren!==b.footerChildren)m.push(`footer:${a.footerChildren}/${b.footerChildren}`);
              if(!b.routeLinks.length||b.routeLinks.at(-1)!=='/assets/css/privacy-consent.css')m.push(`css-order:${JSON.stringify(b.routeLinks)}`);
              if(!a.rect||!b.rect)m.push('banner');else if(Math.abs(a.rect.x-b.rect.x)>2||Math.abs(a.rect.y-b.rect.y)>3||Math.abs(a.rect.width-b.rect.width)>2||Math.abs(a.rect.height-b.rect.height)>3)m.push(`rect:${JSON.stringify(a.rect)}/${JSON.stringify(b.rect)}`);
              if(a.buttons.length!==b.buttons.length)m.push('buttons');else for(let i=0;i<a.buttons.length;i++){if(a.buttons[i].text!==b.buttons[i].text)m.push(`button${i}.text`);if(Math.abs(a.buttons[i].h-b.buttons[i].h)>1)m.push(`button${i}.h:${a.buttons[i].h}/${b.buttons[i].h}`);if(a.buttons[i].padding!==b.buttons[i].padding)m.push(`button${i}.padding:${a.buttons[i].padding}/${b.buttons[i].padding}`);if(a.buttons[i].lineHeight!==b.buttons[i].lineHeight)m.push(`button${i}.line:${a.buttons[i].lineHeight}/${b.buttons[i].lineHeight}`)}
              for(const p of [L.p,R.p]){await p.locator('[data-cv-consent-customize]').click();await p.locator('[data-cv-consent-modal]').waitFor({state:'visible'})}
              await L.p.keyboard.press('Escape');await R.p.keyboard.press('Escape');await L.p.waitForTimeout(80);await R.p.waitForTimeout(80);if(await L.p.locator('[data-cv-consent-modal]').count()||await R.p.locator('[data-cv-consent-modal]').count())m.push('escape');
              for(const p of [L.p,R.p]){await p.locator('[data-cv-consent-customize]').click();await p.locator('[data-cv-consent-modal]').waitFor({state:'visible'});await p.locator('[data-cv-consent-modal]').click({position:{x:2,y:2}});await p.waitForTimeout(80)}
              if(await L.p.locator('[data-cv-consent-modal]').count()||await R.p.locator('[data-cv-consent-modal]').count())m.push('overlay');
              for(const p of [L.p,R.p]){await p.locator('[data-cv-consent-customize]').click();await p.locator('[data-cv-consent-save]').click();await p.waitForTimeout(80)}
              const states=await Promise.all([L.p,R.p].map(p=>p.evaluate(()=>({banner:Boolean(document.querySelector('[data-cv-consent-banner]')),record:JSON.parse(localStorage.getItem('cv-cookie-consent-v3')||'null'),old1:localStorage.getItem('cv-cookie-consent-v2'),old2:localStorage.getItem('cv-consent')}))));
              for(const [i,state] of states.entries()){if(state.banner||state.record?.version!==3||state.record?.scope!=='technical-only'||state.record?.necessary!==true||state.record?.preferences!==false||state.record?.analytics!==false||state.record?.marketing!==false||state.old1||state.old2)m.push(`${i?'react':'legacy'}-record`)}
              if(R.errors.length)m.push(`react-errors:${R.errors.join(';')}`);console.log(`${mode}: ${m.length?m.join(' | '):'OK'}`);if(m.length)fail.push({mode,m,a,b});await L.p.close();await R.p.close();await ctx.close();
            }
          }finally{await browser.close()}
          if(fail.length){console.error(JSON.stringify(fail,null,2));process.exit(1)}
          console.log('EXACT_BUILT_CONSENT_V3_GREEN');
          NODE

      - name: Commit exact built consent
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'; git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/scripts/copy-legacy-assets.mjs frontend-react/src/components/Layout.tsx frontend-react/src/components/CookieConsent.tsx frontend-react/src/consent.css
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: match consent UI to exact built pre-React backup'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        run: |
          kill "$(cat /tmp/cv-consent-v3-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-consent-v3-react.pid 2>/dev/null)" 2>/dev/null || true
