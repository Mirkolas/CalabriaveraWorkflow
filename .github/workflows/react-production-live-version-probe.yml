name: React migration - production live version probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-production-live-version-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current production routing and revision
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DNS ==='
          dig +short A calabriavera.com || true
          echo '=== VERSION HEADERS ==='
          curl -sS -D /tmp/h -o /tmp/b --max-time 20 'https://calabriavera.com/build-version.txt?live-probe=1'
          sed -n '1,40p' /tmp/h
          echo '=== VERSION BODY ==='
          cat /tmp/b
          echo
          echo '=== HOME HEADERS ==='
          curl -sSIL --max-time 20 'https://calabriavera.com/?live-probe=1' | sed -n '1,40p'
