name: Production verify - menu gallery favicon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-menu-gallery-favicon-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verifica build live
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl --fail --silent --show-error --location --connect-timeout 8 --max-time 30 --retry 4 -H 'Cache-Control: no-cache' "https://calabriavera.com/build-version.txt?verify=$GITHUB_RUN_ID" | tr -d '\r\n')"
          test "$version" = 'c42f5b230a4226cf9750b4bab1157cdbc7b991c2'
          echo "Build live: $version"

      - name: Installa browser
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-live
          npm install --prefix /tmp/cv-live --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-live/node_modules/.bin/playwright install --with-deps chromium

      - name: Audit browser reale desktop compatto e mobile
        env:
          PLAYWRIGHT_PATH: /tmp/cv-live/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cv-live/check.cjs <<'NODE'
          const { chromium } = require(process.env.PLAYWRIGHT_PATH);
          const assert = (ok,msg)=>{ if(!ok) throw new Error(msg); };
          async function open(page,url){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('#site-header').waitFor({state:'visible',timeout:15000});
            await page.waitForTimeout(2500);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1024,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror '+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console '+m.text())});
            await open(page,'https://calabriavera.com/catalogo?verify='+Date.now());
            const menu=page.locator('#menu-toggle');
            assert(await menu.isVisible(),'Menu compatto non visibile a 1024px');
            await menu.click();
            const mobile=page.locator('#mobile-nav');
            await mobile.waitFor({state:'visible',timeout:5000});
            const box=await mobile.boundingBox();
            assert(box && box.height<520 && box.width<=1024,'Menu compatto fuori geometria: '+JSON.stringify(box));
            const links=await mobile.locator(':scope > a').count();
            assert(links>=5,'Menu principale incompleto: '+links);
            await page.screenshot({path:'/tmp/cv-live/menu-1024.png',fullPage:false});
            await menu.click();

            const language=page.locator('[data-language-menu] summary').first();
            await language.click();
            const languageList=page.locator('[data-language-menu] .cv-language-list').first();
            await languageList.waitFor({state:'visible',timeout:5000});
            assert(await languageList.locator('[data-language-value]').count()===5,'Selettore lingue incompleto');
            await page.screenshot({path:'/tmp/cv-live/language-1024.png',fullPage:false});
            await language.click();

            const card=page.locator('article.activity-item').filter({hasText:'Le Ninfee B&B'}).first();
            await card.waitFor({state:'visible',timeout:20000});
            const img=card.locator('img').first();
            await img.waitFor({state:'attached',timeout:20000});
            const handle=await img.elementHandle();
            await page.waitForFunction(el=>el && el.complete && el.naturalWidth>20,handle,{timeout:20000});
            const src=await img.getAttribute('src');
            const natural=await img.evaluate(el=>({w:el.naturalWidth,h:el.naturalHeight}));
            console.log('Le Ninfee:',src,natural);
            assert(natural.w>20 && natural.h>20,'Foto Le Ninfee non caricata');
            await page.screenshot({path:'/tmp/cv-live/catalogo-1024.png',fullPage:true});

            await open(page,'https://calabriavera.com/?verify='+Date.now());
            const favicon=await page.locator('link[rel="icon"]').first().getAttribute('href');
            assert(String(favicon).includes('img.calabriavera.com/static/assets/Logo.png?v=20260912c'),'Favicon inatteso: '+favicon);

            const phone=await browser.newPage({viewport:{width:390,height:844}});
            await open(phone,'https://calabriavera.com/?verify='+Date.now());
            const phoneMenu=phone.locator('#menu-toggle');
            assert(await phoneMenu.isVisible(),'Menu mobile non visibile a 390px');
            await phoneMenu.click();
            const phoneNav=phone.locator('#mobile-nav');
            await phoneNav.waitFor({state:'visible',timeout:5000});
            const phoneBox=await phoneNav.boundingBox();
            assert(phoneBox && phoneBox.width<=390,'Menu mobile overflow: '+JSON.stringify(phoneBox));
            await phone.screenshot({path:'/tmp/cv-live/menu-390.png',fullPage:false});
            console.log('Browser errors:',errors);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/cv-live/check.cjs

      - name: Screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-menu-gallery-favicon
          path: /tmp/cv-live/*.png
          retention-days: 3
          if-no-files-found: warn
