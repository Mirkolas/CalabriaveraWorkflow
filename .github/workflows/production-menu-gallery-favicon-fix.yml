name: Production repair - broken covers and favicon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-menu-gallery-favicon-fix.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-broken-cover-favicon
  cancel-in-progress: false

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: calabriavera-images

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checkout runner pubblico
        uses: actions/checkout@v7
        with:
          path: workflow-repo
          persist-credentials: false

      - name: Checkout main privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: true
          fetch-depth: 1

      - name: Applica fallback cover e favicon originale
        run: node workflow-repo/scripts/fix-broken-cover-favicon-2026-09-12.mjs source

      - name: Verifica diff
        shell: bash
        run: |
          set -euo pipefail
          git -C source diff --check -- \
            frontend-react/src/components/LegacyCatalogCard.tsx \
            frontend-react/src/components/BusinessCard.tsx \
            frontend-react/index.html
          git -C source status --short

      - name: Test completi
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: Build React
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit privato senza Actions private
        id: commit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Public Workflow'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/components/LegacyCatalogCard.tsx frontend-react/src/components/BusinessCard.tsx frontend-react/index.html
          git commit -m 'fix: recover broken business covers and favicon [skip ci]'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sincronizza favicon originale su R2
        shell: bash
        run: |
          set -euo pipefail
          test -s source/assets/images/favicon-96.png
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/static/assets/images/favicon-96.png" \
            --file source/assets/images/favicon-96.png \
            --content-type image/png \
            --cache-control 'public, max-age=86400' \
            --remote --force
          curl --fail --silent --show-error --location --retry 5 \
            'https://img.calabriavera.com/static/assets/images/favicon-96.png?v=20260912d' \
            -o /tmp/favicon-live.png
          cmp source/assets/images/favicon-96.png /tmp/favicon-live.png
          echo 'Favicon R2 identico al favicon originale del repository.'

      - name: Build finale sul nuovo SHA
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(tr -d '\r\n' < dist/build-version.txt)" = "${{ steps.commit.outputs.sha }}"

      - name: Autenticazione Firebase
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy React su calabriavera.com
        working-directory: source/frontend-react
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 deploy \
            --project calabriavera-e08d4 \
            --config firebase.react.json \
            --only hosting

      - name: Verifica build HTTP
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl --fail --silent --show-error --location --retry 6 -H 'Cache-Control: no-cache' "https://calabriavera.com/build-version.txt?repair=$GITHUB_RUN_ID" | tr -d '\r\n')"
          test "$version" = "$SHA"
          echo "Live .com: $version"

      - name: Installa Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-live
          npm install --prefix /tmp/cv-live --no-package-lock --no-save playwright@1.62.1
          /tmp/cv-live/node_modules/.bin/playwright install --with-deps chromium

      - name: Audit browser produzione
        env:
          PLAYWRIGHT_PATH: /tmp/cv-live/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cv-live/check.cjs <<'NODE'
          const { chromium } = require(process.env.PLAYWRIGHT_PATH);
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          async function open(page,url){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('#site-header').waitFor({state:'visible',timeout:15000});
            await page.waitForTimeout(2500);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});

            const desktop=await browser.newPage({viewport:{width:1440,height:900}});
            await open(desktop,'https://calabriavera.com/?audit='+Date.now());
            assert(await desktop.locator('.primary-nav').isVisible(),'Nav desktop non visibile a 1440');
            assert(!(await desktop.locator('#menu-toggle').isVisible()),'Hamburger non deve essere visibile a 1440');
            assert(await desktop.locator('.primary-nav > a').count()===5,'Nav desktop deve avere 5 voci');
            await desktop.screenshot({path:'/tmp/cv-live/header-1440.png',fullPage:false});

            const compact=await browser.newPage({viewport:{width:1024,height:900}});
            await open(compact,'https://calabriavera.com/catalogo?audit='+Date.now());
            const menu=compact.locator('#menu-toggle');
            assert(await menu.isVisible(),'Menu compatto non visibile a 1024');
            await menu.click();
            const nav=compact.locator('#mobile-nav');
            await nav.waitFor({state:'visible',timeout:5000});
            const navBox=await nav.boundingBox();
            assert(navBox&&navBox.height<520&&navBox.width<=1024,'Menu compatto fuori geometria '+JSON.stringify(navBox));
            await compact.screenshot({path:'/tmp/cv-live/menu-1024.png',fullPage:false});
            await menu.click();
            const lang=compact.locator('[data-language-menu] summary').first();
            await lang.click();
            const langList=compact.locator('[data-language-menu] .cv-language-list').first();
            await langList.waitFor({state:'visible',timeout:5000});
            assert(await langList.locator('[data-language-value]').count()===5,'Lingue != 5');
            await compact.screenshot({path:'/tmp/cv-live/language-1024.png',fullPage:false});
            await lang.click();

            const card=compact.locator('article.activity-item').filter({hasText:'Le Ninfee B&B'}).first();
            await card.waitFor({state:'visible',timeout:20000});
            const img=card.locator('img').first();
            await img.waitFor({state:'attached',timeout:20000});
            const handle=await img.elementHandle();
            await compact.waitForFunction(el=>el&&el.complete&&el.naturalWidth>20,handle,{timeout:30000});
            console.log('Catalog image',await img.getAttribute('src'),await img.evaluate(el=>({w:el.naturalWidth,h:el.naturalHeight})));
            await compact.screenshot({path:'/tmp/cv-live/catalogo-1024.png',fullPage:true});

            const detail=await browser.newPage({viewport:{width:1024,height:900}});
            await open(detail,'https://calabriavera.com/attivita/reggio-calabria/marina-di-gioiosa-ionica/b-e-b/le-ninfee-b-e-b?audit='+Date.now());
            const detailImg=detail.locator('#business-cover img').first();
            await detailImg.waitFor({state:'attached',timeout:20000});
            const detailHandle=await detailImg.elementHandle();
            await detail.waitForFunction(el=>el&&el.complete&&el.naturalWidth>20,detailHandle,{timeout:30000});
            console.log('Detail image',await detailImg.getAttribute('src'));
            await detail.screenshot({path:'/tmp/cv-live/le-ninfee-detail.png',fullPage:false});

            const icon=await desktop.locator('link[rel="icon"]').first().getAttribute('href');
            assert(String(icon).includes('favicon-96.png?v=20260912d'),'Favicon errato '+icon);

            const phone=await browser.newPage({viewport:{width:390,height:844}});
            await open(phone,'https://calabriavera.com/?audit='+Date.now());
            const phoneMenu=phone.locator('#menu-toggle');
            assert(await phoneMenu.isVisible(),'Menu mobile non visibile');
            await phoneMenu.click();
            const phoneNav=phone.locator('#mobile-nav');
            await phoneNav.waitFor({state:'visible',timeout:5000});
            const phoneBox=await phoneNav.boundingBox();
            assert(phoneBox&&phoneBox.width<=390,'Overflow mobile '+JSON.stringify(phoneBox));
            await phone.screenshot({path:'/tmp/cv-live/menu-390.png',fullPage:false});

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/cv-live/check.cjs

      - name: Screenshot finali
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-final-ui-check
          path: /tmp/cv-live/*.png
          retention-days: 3
          if-no-files-found: warn
