name: One-time admin messages quota optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-messages-quota-optimization.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  optimize-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo '::error::PRIVATE_REPO mancante'; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo '::error::PAT repository privato mancante'; exit 1; }

      - name: Checkout main privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Riduci letture Firestore Admin Messaggi
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'assets/js/admin-upgrade.js';
          let s = fs.readFileSync(file, 'utf8');

          const helperAnchor = 'async function safeRows(name, max = 600) { try { return await listRows(name, max); } catch { return []; } }\n';
          if (!s.includes(helperAnchor)) throw new Error('Anchor safeRows non trovato');
          const helpers = `async function recentRows(name, field = "updatedAt", max = 120) {\n  try { const f = await services(), snap = await f.getDocs(f.query(f.collection(f.db, name), f.orderBy(field, "desc"), f.limit(max))); return snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); }\n  catch { return safeRows(name, max); }\n}\nasync function queryRows(name, field, op, value, max = 300) {\n  try { const f = await services(), snap = await f.getDocs(f.query(f.collection(f.db, name), f.where(field, op, value), f.limit(max))); return snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); }\n  catch { return []; }\n}\nasync function rowsByIds(name, ids, max = 300) {\n  const unique = [...new Set((ids || []).map(String).filter(Boolean))].slice(0, max);\n  if (!unique.length) return [];\n  try {\n    const f = await services(), rows = [];\n    for (let offset = 0; offset < unique.length; offset += 30) {\n      const chunk = unique.slice(offset, offset + 30);\n      const snap = await f.getDocs(f.query(f.collection(f.db, name), f.where(f.documentId(), "in", chunk)));\n      rows.push(...snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));\n    }\n    return rows;\n  } catch { return []; }\n}\n`;
          if (!s.includes('async function recentRows(')) s = s.replace(helperAnchor, helperAnchor + helpers);

          const replacement = `async function renderAdminMessages(output){\n  output.innerHTML='<div class="notice">Caricamento messaggi…</div>';\n  const conversations=await recentRows("conversations","updatedAt",120);\n  const participantIds=[...new Set(conversations.flatMap(c=>c.participantIds||[]).map(String).filter(Boolean))];\n  const businessIds=[...new Set(conversations.map(c=>String(c.businessId||"")).filter(Boolean))];\n  const [users,businesses,unreadMessages]=await Promise.all([rowsByIds("users",participantIds,240),rowsByIds("businesses",businessIds,120),queryRows("messages","status","==","sent",300)]);\n  const userById=new Map(users.map(x=>[x.id,x])),businessById=new Map(businesses.map(x=>[x.id,x])),unreadByConversation=new Map();\n  unreadMessages.forEach(message=>{const id=String(message.conversationId||"");if(id)unreadByConversation.set(id,(unreadByConversation.get(id)||0)+1);});\n  output.innerHTML=\`<div class="section-heading"><div><p class="eyebrow">Messaggistica</p><h2>Centro conversazioni</h2><p class="muted">Ultime 120 conversazioni · caricamento quota-safe</p></div><span class="badge">\${conversations.length}</span></div><div class="cv-admin-toolbar"><label>Cerca<input id="cv-admin-message-search" placeholder="Attività, utente, email, testo"></label><label>Filtro<select id="cv-admin-message-filter"><option value="">Tutte</option><option value="unread">Con messaggi non letti</option></select></label></div><div id="cv-admin-message-list" class="result-list"></div>\`;\n  const list=output.querySelector("#cv-admin-message-list"),search=output.querySelector("#cv-admin-message-search"),filter=output.querySelector("#cv-admin-message-filter");\n  function render(){\n    const q=search.value.trim().toLowerCase();\n    list.innerHTML=conversations.filter(c=>{const people=(c.participantIds||[]).map(id=>userById.get(id)),unread=Number(unreadByConversation.get(c.id)||0);return (!filter.value||unread>0)&&(!q||[businessById.get(c.businessId)?.name,c.lastMessage,...people.flatMap(p=>[p?.displayName,p?.email])].join(" ").toLowerCase().includes(q));}).map(c=>{const people=(c.participantIds||[]).map(id=>userById.get(id)),unread=Number(unreadByConversation.get(c.id)||0),participants=(c.participantIds||[]).length;return \`<article class="card"><div class="cv-admin-card-head"><div><p class="eyebrow">\${dateLabel(c.updatedAt)}</p><h3>\${escapeHtml(businessById.get(c.businessId)?.name||c.businessId||"Conversazione")}</h3></div>\${unread?statusBadge(\`\${unread} non letti\`):statusBadge("letta")}</div><p>\${escapeHtml(c.lastMessage||"Nessun messaggio")}</p><div class="cv-admin-metrics"><span><strong>\${participants}</strong> partecipanti</span><span><strong>\${unread}</strong> non letti</span></div><div class="cv-admin-participants">\${people.map((p,i)=>\`<span>\${escapeHtml(p?.displayName||p?.email||c.participantIds?.[i]||"Utente")}\${p?.email?\` · \${escapeHtml(p.email)}\`:""}</span>\`).join("")}</div>\${c.businessId?\`<a class="button button-secondary" href="/attivita?id=\${encodeURIComponent(c.businessId)}" target="_blank">Apri attività</a>\`:""}</article>\`;}).join("")||'<div class="notice">Nessuna conversazione trovata.</div>';\n  }\n  search.oninput=render;filter.onchange=render;render();\n}\n\nasync function init(){`;
          const renderPattern = /async function renderAdminMessages\(output\)\{[\s\S]*?\n\}\n\nasync function init\(\)\{/;
          if (!renderPattern.test(s)) throw new Error('renderAdminMessages non trovato');
          s = s.replace(renderPattern, replacement);

          const scheduleReplacements = [
            ['["Email worker", "Ogni 1 minuto"', '["Email worker", "Ogni 10 minuti"'],
            ['["Manutenzione admin", "Ogni 5 minuti"', '["Manutenzione admin", "Ogni giorno, 02:17 UTC"'],
            ['["Social Facebook / Instagram", "Ogni 12 ore, minuto 23 UTC"', '["Social Facebook / Instagram", "Ogni 6 ore, minuto 17 UTC"'],
            ['["Controllo token Meta", "Ogni giorno 07:15 UTC"', '["Controllo token Meta", "Ogni giorno, finestra 06:17 UTC"'],
            ['["SEO / nuove attività", "Ogni 5 minuti"', '["SEO / nuove attività", "Ogni 12 ore, minuto 03 UTC"'],
            ['["Story promozionale", "Ogni 12 ore (00:00 / 12:00 UTC)"', '["Story promozionale", "Ogni 24 ore (controllo ogni 6 ore)"'],
            ['["Backup cifrato", "Domenica 02:30 UTC"', '["Backup cifrato", "Ogni giorno, 02:41 UTC"']
          ];
          for (const [before, after] of scheduleReplacements) {
            if (!s.includes(before)) throw new Error(`Etichetta automazione non trovata: ${before}`);
            s = s.replace(before, after);
          }
          fs.writeFileSync(file, s);

          const testFile = 'tests/admin-control.test.mjs';
          let t = fs.readFileSync(testFile, 'utf8');
          t = t.replace("  assert.match(adminUpgrade, /Ogni 1 minuto/);\n  assert.match(adminUpgrade, /Ogni 5 minuti/);\n  assert.match(adminUpgrade, /Ogni 6 ore, minuto 17 UTC/);\n  assert.match(adminUpgrade, /Ogni 12 ore, minuto 23 UTC/);\n  assert.match(adminUpgrade, /Domenica 02:30 UTC/);", "  assert.match(adminUpgrade, /Ogni 10 minuti/);\n  assert.match(adminUpgrade, /Ogni giorno, 02:17 UTC/);\n  assert.match(adminUpgrade, /Ogni 6 ore, minuto 17 UTC/);\n  assert.match(adminUpgrade, /Ogni 12 ore, minuto 03 UTC/);\n  assert.match(adminUpgrade, /Ogni giorno, 02:41 UTC/);");
          const insertion = `\n\ntest('admin messages use bounded targeted Firestore reads', () => {\n  assert.match(adminUpgrade, /recentRows\\(\"conversations\",\"updatedAt\",120\\)/);\n  assert.match(adminUpgrade, /rowsByIds\\(\"users\",participantIds,240\\)/);\n  assert.match(adminUpgrade, /rowsByIds\\(\"businesses\",businessIds,120\\)/);\n  assert.match(adminUpgrade, /queryRows\\(\"messages\",\"status\",\"==\",\"sent\",300\\)/);\n  assert.doesNotMatch(adminUpgrade, /safeRows\\(\"messages\",\\s*1200\\)/);\n  assert.match(adminUpgrade, /Ultime 120 conversazioni · caricamento quota-safe/);\n});`;
          if (!t.includes("admin messages use bounded targeted Firestore reads")) t += insertion + '\n';
          fs.writeFileSync(testFile, t);
          NODE

          node --check assets/js/admin-upgrade.js
          git diff --check -- assets/js/admin-upgrade.js tests/admin-control.test.mjs
          git diff -- assets/js/admin-upgrade.js tests/admin-control.test.mjs

      - name: Suite completa repository privato
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: Build React prima del commit
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit privato senza Actions private
        id: commit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Public Workflow'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/admin-upgrade.js tests/admin-control.test.mjs
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da committare.'
          else
            git commit -m 'perf: reduce admin message Firestore reads [skip ci]'
            git push origin HEAD:main
          fi
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Private main: $sha"

      - name: Build finale sul nuovo SHA
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        run: |
          set -euo pipefail
          npm run build
          test "$(tr -d '\r\n' < dist/build-version.txt)" = "${{ steps.commit.outputs.sha }}"

      - name: Autenticazione Firebase
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy React su calabriavera.com
        working-directory: source/frontend-react
        run: npx --yes firebase-tools@15.22.1 deploy --project calabriavera-e08d4 --config firebase.react.json --only hosting

      - name: Verifica produzione
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() { curl --fail --silent --show-error --location --connect-timeout 8 --max-time 30 --retry 8 --retry-delay 3 --retry-all-errors "$@"; }
          version="$(retry_curl -H 'Cache-Control: no-cache' "https://calabriavera.com/build-version.txt?adminquota=$GITHUB_RUN_ID" | tr -d '\r\n')"
          test "$version" = "$SHA"
          js="$(retry_curl -H 'Cache-Control: no-cache' "https://calabriavera.com/assets/js/admin-upgrade.js?adminquota=$GITHUB_RUN_ID")"
          printf '%s' "$js" | grep -Fq 'Ultime 120 conversazioni · caricamento quota-safe'
          printf '%s' "$js" | grep -Fq 'queryRows("messages","status","==","sent",300)'
          if printf '%s' "$js" | grep -Fq 'safeRows("messages",1200)'; then
            echo '::error::La scansione messages da 1200 documenti è ancora online.'
            exit 1
          fi
          echo "Produzione verificata sullo SHA $version"
