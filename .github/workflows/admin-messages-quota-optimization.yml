name: One-time admin messages quota optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-messages-quota-optimization.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
  PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}

jobs:
  optimize-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verifica accesso sorgente privato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO" || { echo '::error::PRIVATE_REPO mancante'; exit 1; }
          test -n "$PRIVATE_REPO_PAT" || { echo '::error::PAT repository privato mancante'; exit 1; }

      - name: Checkout main privato
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          path: source
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Allinea runtime admin autorevole
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const rootFile = 'assets/js/admin-upgrade.js';
          const oracleFile = 'frontend-react/oracle-admin/assets/js/admin-upgrade.js';
          const testFile = 'tests/admin-control.test.mjs';
          const root = fs.readFileSync(rootFile, 'utf8');
          let oracle = fs.readFileSync(oracleFile, 'utf8');

          function extract(text, pattern, label) {
            const match = text.match(pattern);
            if (!match) throw new Error(`${label} non trovato`);
            return match[0];
          }

          const rootHelpers = extract(root, /async function recentRows\([\s\S]*?\n}\nasync function queryRows\([\s\S]*?\n}\nasync function rowsByIds\([\s\S]*?\n}\n/, 'helper quota-safe root');
          if (/async function recentRows\(/.test(oracle)) {
            oracle = oracle.replace(/async function recentRows\([\s\S]*?\n}\nasync function queryRows\([\s\S]*?\n}\nasync function rowsByIds\([\s\S]*?\n}\n/, rootHelpers);
          } else {
            const anchor = 'async function safeRows(name, max = 600) { try { return await listRows(name, max); } catch { return []; } }\n';
            if (!oracle.includes(anchor)) throw new Error('safeRows oracle non trovato');
            oracle = oracle.replace(anchor, anchor + rootHelpers);
          }

          const rootRenderer = extract(root, /async function renderAdminMessages\(output\)\{[\s\S]*?\n}\n\nasync function init\(\)\{/, 'renderAdminMessages root');
          if (!/async function renderAdminMessages\(output\)\{/.test(oracle)) throw new Error('renderAdminMessages oracle non trovato');
          oracle = oracle.replace(/async function renderAdminMessages\(output\)\{[\s\S]*?\n}\n\nasync function init\(\)\{/, rootRenderer);

          const schedules = [
            ['Ogni 1 minuto', 'Ogni 10 minuti'],
            ['Ogni 5 minuti', 'Ogni giorno, 02:17 UTC'],
            ['Ogni 12 ore, minuto 23 UTC', 'Ogni 6 ore, minuto 17 UTC'],
            ['Ogni giorno 07:15 UTC', 'Ogni giorno, finestra 06:17 UTC'],
            ['Ogni 5 minuti', 'Ogni 12 ore, minuto 03 UTC'],
            ['Ogni 12 ore (00:00 / 12:00 UTC)', 'Ogni 24 ore (controllo ogni 6 ore)'],
            ['Domenica 02:30 UTC', 'Ogni giorno, 02:41 UTC']
          ];
          for (const [before, after] of schedules) {
            if (oracle.includes(before)) oracle = oracle.replace(before, after);
          }
          fs.writeFileSync(oracleFile, oracle);

          let tests = fs.readFileSync(testFile, 'utf8');
          const oracleConst = "const adminOracle = readFileSync(new URL('../frontend-react/oracle-admin/assets/js/admin-upgrade.js', import.meta.url), 'utf8');\n";
          if (!tests.includes('const adminOracle =')) {
            tests = tests.replace("const adminUpgrade = readFileSync(new URL('../assets/js/admin-upgrade.js', import.meta.url), 'utf8');\n", "const adminUpgrade = readFileSync(new URL('../assets/js/admin-upgrade.js', import.meta.url), 'utf8');\n" + oracleConst);
          }
          if (!tests.includes("authoritative admin oracle keeps quota-safe messages")) {
            tests += `\n\ntest('authoritative admin oracle keeps quota-safe messages', () => {\n  assert.match(adminOracle, /recentRows\\(\"conversations\",\"updatedAt\",120\\)/);\n  assert.match(adminOracle, /rowsByIds\\(\"users\",participantIds,240\\)/);\n  assert.match(adminOracle, /queryRows\\(\"messages\",\"status\",\"==\",\"sent\",300\\)/);\n  assert.match(adminOracle, /Ultime 120 conversazioni · caricamento quota-safe/);\n  assert.doesNotMatch(adminOracle, /safeRows\\(\"messages\",\\s*1200\\)/);\n});\n`;
          }
          fs.writeFileSync(testFile, tests);
          NODE

          node --check frontend-react/oracle-admin/assets/js/admin-upgrade.js
          git diff --check -- frontend-react/oracle-admin/assets/js/admin-upgrade.js tests/admin-control.test.mjs
          git diff -- frontend-react/oracle-admin/assets/js/admin-upgrade.js tests/admin-control.test.mjs

      - name: Suite completa repository privato
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test

      - name: Build React e verifica asset costruito
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          grep -Fq 'Ultime 120 conversazioni · caricamento quota-safe' dist/assets/js/admin-upgrade.js
          grep -Fq 'queryRows("messages","status","==","sent",300)' dist/assets/js/admin-upgrade.js
          ! grep -Fq 'safeRows("messages",1200)' dist/assets/js/admin-upgrade.js

      - name: Commit privato senza Actions private
        id: commit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CalabriaVera Public Workflow'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/oracle-admin/assets/js/admin-upgrade.js tests/admin-control.test.mjs
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da committare.'
          else
            git commit -m 'perf: align quota-safe admin oracle [skip ci]'
            git push origin HEAD:main
          fi
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Private main: $sha"

      - name: Build finale sul nuovo SHA
        working-directory: source/frontend-react
        env:
          CV_PRERENDER_OFFLINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test "$(tr -d '\r\n' < dist/build-version.txt)" = "${{ steps.commit.outputs.sha }}"
          grep -Fq 'Ultime 120 conversazioni · caricamento quota-safe' dist/assets/js/admin-upgrade.js

      - name: Autenticazione Firebase
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy React su calabriavera.com
        working-directory: source/frontend-react
        run: npx --yes firebase-tools@15.22.1 deploy --project calabriavera-e08d4 --config firebase.react.json --only hosting

      - name: Verifica produzione
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() { curl --fail --silent --show-error --location --connect-timeout 8 --max-time 30 --retry 8 --retry-delay 3 --retry-all-errors "$@"; }
          version="$(retry_curl -H 'Cache-Control: no-cache' "https://calabriavera.com/build-version.txt?adminquota=$GITHUB_RUN_ID" | tr -d '\r\n')"
          test "$version" = "$SHA"
          js="$(retry_curl -H 'Cache-Control: no-cache' "https://calabriavera.com/assets/js/admin-upgrade.js?adminquota=$GITHUB_RUN_ID")"
          printf '%s' "$js" | grep -Fq 'Ultime 120 conversazioni · caricamento quota-safe'
          printf '%s' "$js" | grep -Fq 'queryRows("messages","status","==","sent",300)'
          if printf '%s' "$js" | grep -Fq 'safeRows("messages",1200)'; then
            echo '::error::La scansione messages da 1200 documenti è ancora online.'
            exit 1
          fi
          echo "Produzione verificata sullo SHA $version"
