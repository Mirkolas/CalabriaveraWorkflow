name: React legacy parity - blog v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-legacy-blog-parity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-legacy-blog-parity-v1
  cancel-in-progress: true

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
    steps:
      - name: Verify access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"

      - name: Checkout workflow tools
        uses: actions/checkout@v7
        with:
          path: workflow
          persist-credentials: false

      - name: Checkout exact backup
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout React branch
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify backup blog contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          grep -q 'id="blog-list" class="card-grid"' legacy/blog.html
          grep -q 'id="blog-more"' legacy/blog.html
          grep -q 'tabs.id = "blog-lane-tabs"' legacy/assets/js/blog.js
          grep -q 'tabs.className = "cv-blog-tabs"' legacy/assets/js/blog.js
          grep -q 'class="media-placeholder blog-media"' legacy/assets/js/blog.js
          grep -q 'data-blog-fallback' legacy/assets/js/blog.js
          grep -q 'Fonte:' legacy/assets/js/blog.js
          grep -q 'VISIBLE_PAGE_SIZE = 12' legacy/assets/js/blog.js
          grep -q 'blog-sections.css?v=20260905-2' legacy/assets/js/blog.js

      - name: Apply blog parity patch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../workflow/scripts/patch-react-blog-parity.py

      - name: Assert source contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="blog-lane-tabs"' frontend-react/src/pages/MagazinePage.tsx
          grep -q 'className="cv-blog-tabs"' frontend-react/src/pages/MagazinePage.tsx
          grep -q 'media-placeholder blog-media' frontend-react/src/pages/MagazinePage.tsx
          grep -q 'data-blog-fallback' frontend-react/src/pages/MagazinePage.tsx
          grep -q 'Fonte:' frontend-react/src/pages/MagazinePage.tsx
          grep -q 'VISIBLE_PAGE_SIZE = 12' frontend-react/src/pages/MagazinePage.tsx
          grep -q 'blog-sections.css?v=20260905-2' frontend-react/src/pages/MagazinePage.tsx
          ! grep -q 'className={`tab ' frontend-react/src/pages/MagazinePage.tsx

      - name: Build React
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install browser gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-blog-gate
          npm install --prefix /tmp/cv-blog-gate --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-blog-gate/node_modules/.bin/playwright install --with-deps chromium

      - name: Start built app
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cv-blog-gate/node_modules/.bin/serve -s source/frontend-react/dist -l 4177 >/tmp/cv-blog-gate.log 2>&1 &
          echo $! >/tmp/cv-blog-gate.pid
          for attempt in {1..30}; do
            curl -fsS --max-time 3 http://127.0.0.1:4177/blog >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Browser blog parity gate
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-blog-gate/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require=createRequire(import.meta.url);
          const { chromium }=require(process.env.PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          try {
            const context=await browser.newContext({serviceWorkers:'block',viewport:{width:1365,height:900}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:4177/blog',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#blog-lane-tabs',{timeout:10000});
            await page.waitForTimeout(2500);
            const tabs=await page.locator('#blog-lane-tabs .cv-blog-tab').count();
            if(tabs!==2) throw new Error(`BLOG_TABS_${tabs}`);
            if(await page.locator('.article-hero #blog-lane-tabs').count()) throw new Error('BLOG_TABS_INSIDE_HERO');
            const list=page.locator('#blog-list');
            const precedes=await list.evaluate((el)=>el.previousElementSibling?.id==='blog-lane-tabs');
            if(!precedes) throw new Error('BLOG_TABS_NOT_BEFORE_LIST');
            const cards=await page.locator('#blog-list .blog-card').count();
            if(cards>0){
              if(await page.locator('#blog-list > a').count()) throw new Error('BLOG_CARD_WRAPPED_IN_ANCHOR');
              if(await page.locator('.blog-card .media-placeholder.blog-media').count()!==cards) throw new Error('BLOG_MEDIA_STRUCTURE');
              if(await page.locator('.blog-card .text-link').count()!==cards) throw new Error('BLOG_TEXT_LINK_STRUCTURE');
              const fallbackCount=await page.locator('.blog-card img[data-blog-fallback]').count();
              if(fallbackCount!==cards) throw new Error('BLOG_FALLBACK_ATTRS');
            }
            const css=await page.locator('link[data-cv-blog-sections]').getAttribute('href');
            if(!css?.includes('/assets/css/blog-sections.css')) throw new Error(`BLOG_SECTION_CSS_${css}`);
            const activeBefore=await page.locator('#blog-lane-tabs .is-active').getAttribute('data-blog-lane');
            if(activeBefore!=='events') throw new Error(`BLOG_DEFAULT_LANE_${activeBefore}`);
            await page.locator('button[data-blog-lane="news"]').click();
            const activeAfter=await page.locator('#blog-lane-tabs .is-active').getAttribute('data-blog-lane');
            if(activeAfter!=='news') throw new Error(`BLOG_SWITCH_LANE_${activeAfter}`);
            if(errors.length) throw new Error(`PAGE_ERRORS_${errors.join('|')}`);
            console.log(`LEGACY_BLOG_GREEN tabs=${tabs} cards=${cards}`);
            await context.close();
          } finally { await browser.close(); }
          NODE

      - name: Commit to react-migration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calabriavera-parity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/MagazinePage.tsx
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: align React blog with exact pre-React backup'
          git push origin HEAD:react-migration
          echo "PATCH_SHA=$(git rev-parse HEAD)"

      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/cv-blog-gate.pid 2>/dev/null)" 2>/dev/null || true
