name: React migration - exact live shell footer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-live-shell-footer.yml'
      - 'scripts/patch-react-live-shell-footer.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-live-shell-footer
  cancel-in-progress: true

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      MAIN_BASE_URL: https://calabriavera.com
    steps:
      - name: Verify private access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO"
          test -n "$PRIVATE_REPO_PAT"
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
          ref: react-migration
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json
      - name: Assert expected migration base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "07859b3fcdf3b43020239b9fd23b6e8776a34914"
      - name: Snapshot exact live hero assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/assets/images/home /tmp/live-main-assets
          for file in tropea-1600.webp tropea-960.webp; do
            curl --fail --silent --show-error --location --retry 3 "$MAIN_BASE_URL/assets/images/home/$file?migration=$(date +%s)" -o "/tmp/live-main-assets/$file"
            test -s "/tmp/live-main-assets/$file"
            cp "/tmp/live-main-assets/$file" "source/assets/images/home/$file"
          done
          sha256sum /tmp/live-main-assets/tropea-1600.webp source/assets/images/home/tropea-1600.webp
          sha256sum /tmp/live-main-assets/tropea-960.webp source/assets/images/home/tropea-960.webp
          test "$(sha256sum /tmp/live-main-assets/tropea-1600.webp | cut -d' ' -f1)" = "$(sha256sum source/assets/images/home/tropea-1600.webp | cut -d' ' -f1)"
          test "$(sha256sum /tmp/live-main-assets/tropea-960.webp | cut -d' ' -f1)" = "$(sha256sum source/assets/images/home/tropea-960.webp | cut -d' ' -f1)"
      - name: Apply exact live shell footer patch
        run: python3 automation/scripts/patch-react-live-shell-footer.py
      - name: Build React migration
        working-directory: source/frontend-react
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate exact live markers
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'scrollbar-gutter: stable' source/frontend-react/src/styles.css
          grep -q 'const LOGO = "/assets/Logo.png"' source/frontend-react/src/components/Layout.tsx
          grep -q 'social-links' source/frontend-react/src/components/Layout.tsx
          grep -q 'https://www.instagram.com/info.calabriavera/' source/frontend-react/src/components/Layout.tsx
          grep -q 'https://www.facebook.com/profile.php?id=61580665768182' source/frontend-react/src/components/Layout.tsx
          grep -q 'cv-consent-footer-line' source/frontend-react/src/components/Layout.tsx
          grep -q 'Ti serve aiuto?' source/frontend-react/src/components/Layout.tsx
          grep -q 'center 48%' source/frontend-react/public/assets/css/react-live-parity.css
          test -s source/frontend-react/public/assets/images/home/tropea-1600.webp
          test -s source/frontend-react/public/assets/images/home/tropea-960.webp
          test "$(sha256sum /tmp/live-main-assets/tropea-1600.webp | cut -d' ' -f1)" = "$(sha256sum source/frontend-react/public/assets/images/home/tropea-1600.webp | cut -d' ' -f1)"
          test "$(sha256sum /tmp/live-main-assets/tropea-960.webp | cut -d' ' -f1)" = "$(sha256sum source/frontend-react/public/assets/images/home/tropea-960.webp | cut -d' ' -f1)"
          git -C source diff --check
      - name: Commit and push only after green build
        shell: bash
        run: |
          set -euo pipefail
          if git -C source diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git -C source config user.name 'CalabriaVera Automation'
          git -C source config user.email 'actions@users.noreply.github.com'
          git -C source add assets/images/home/tropea-1600.webp assets/images/home/tropea-960.webp frontend-react/src/components/Layout.tsx frontend-react/src/styles.css frontend-react/public/assets/css/react-live-parity.css frontend-react/public/assets/images/home/tropea-1600.webp frontend-react/public/assets/images/home/tropea-960.webp
          git -C source commit -m 'fix: match live main shell footer and hero'
          git -C source push origin HEAD:react-migration
