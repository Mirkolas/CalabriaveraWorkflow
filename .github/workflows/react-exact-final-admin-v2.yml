name: React exact final admin parity v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/react-exact-final-admin-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-admin-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      LEGACY_SHA: 7be434e3418e95cff9825e4cc3f4b4ed75cd1076
      EXPECTED_BASE: 0dfc13772604f64cd9712468f6aca7cdd7c8a944
    steps:
      - uses: actions/checkout@v7
        with: {path: workflow, persist-credentials: false}
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: backup-main-pre-react-2026-09-11
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: react-migration
          path: source
          persist-credentials: true
          fetch-depth: 8
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/frontend-react/package-lock.json

      - name: Build exact backup and verify final admin contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          (cd legacy && npm ci && npm run build)
          cd legacy
          node --test tests/admin-control.test.mjs tests/admin-backend.test.mjs tests/admin-conversation-delete.test.mjs tests/admin-conversation-delete-ui.test.mjs tests/admin-user-profile-ui.test.mjs
          grep -Fq 'Panoramica · Impostazioni · SEO · Sistema' dist/assets/js/admin-upgrade.js
          grep -Fq 'Attività & CRM' dist/assets/js/admin-upgrade.js
          grep -Fq 'Vetrina €15/mese' dist/assets/js/admin-upgrade.js
          grep -Fq 'Elimina definitivamente' dist/assets/js/admin-upgrade.js
          grep -Fq 'const CUSTOM_SCREENS = new Set(["segnalazioni"]);' dist/assets/js/admin-console.js

      - name: Prepare exact backup clean-route oracle locally
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir='legacy/dist/pages/admin';
          const mappings={
            'index.html':'/admin',
            'attivita.html':'/admin/attivita',
            'recensioni.html':'/admin/recensioni',
            'segnalazioni.html':'/admin/segnalazioni',
            'utenti.html':'/admin/utenti',
            'comunicazioni.html':'/admin/comunicazioni',
            'messaggi.html':'/admin/messaggi',
            'blog.html':'/admin/blog',
            'categorie.html':'/admin/categorie',
            'impostazioni.html':'/admin/impostazioni',
            'seo.html':'/admin/seo',
            'sistema.html':'/admin/sistema'
          };
          const shell=fs.readFileSync(path.join(dir,'index.html'),'utf8');
          for(const [file,canonical] of Object.entries(mappings)){
            const target=path.join(dir,file);
            let html=fs.existsSync(target)?fs.readFileSync(target,'utf8'):shell;
            const routeScript=`<script data-cv-ci-clean-route>history.replaceState({},"",${JSON.stringify(canonical)});</script>`;
            html=html.replace(/<body([^>]*)>/i,`<body$1>${routeScript}`);
            fs.writeFileSync(target,html);
          }
          console.log('Prepared clean-route oracle aliases:',Object.keys(mappings).length);
          NODE

      - name: Apply exact built admin runtime to React
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 ../workflow/scripts/patch-react-exact-final-admin-runtime.py
          python3 ../workflow/scripts/copy-exact-built-admin-runtime.py ../legacy/dist frontend-react/public
          grep -Fq 'legacyModule("/assets/js/admin-upgrade.js")' frontend-react/src/pages/AdminPage.tsx
          grep -Fq 'Panoramica · Impostazioni · SEO · Sistema' frontend-react/public/assets/js/admin-upgrade.js
          grep -Fq 'const CUSTOM_SCREENS = new Set(["segnalazioni"]);' frontend-react/public/assets/js/admin-console.js
          git diff --check

      - name: Build React and verify exact admin bundles/runtime assets
        working-directory: source/frontend-react
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          for f in admin.js admin-console.js admin-upgrade.js admin-runtime-fixes.js admin-maintenance-toggle.js admin-automation-status.js; do
            cmp "../../legacy/dist/assets/js/$f" "dist/assets/js/$f"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('public/main-route-css.json','utf8')).routeCss;
          const routes={
            '/admin':'index.html','/admin/attivita':'attivita.html','/admin/recensioni':'recensioni.html','/admin/segnalazioni':'segnalazioni.html','/admin/utenti':'utenti.html','/admin/comunicazioni':'comunicazioni.html','/admin/messaggi':'messaggi.html','/admin/blog':'blog.html','/admin/categorie':'categorie.html','/admin/impostazioni':'impostazioni.html','/admin/seo':'seo.html','/admin/sistema':'sistema.html'
          };
          for(const [route,file] of Object.entries(routes)){
            const raw=fs.readFileSync(`../../legacy/dist/pages/admin/${file}`,'utf8');
            const match=raw.match(/href="(\/assets\/css\/cv-bundle-[a-f0-9]+\.css)/);
            if(!match)throw new Error(`legacy final bundle missing ${route}`);
            const got=manifest[route] || manifest['/admin'];
            if(!Array.isArray(got)||got.length!==1||got[0]!==match[1])throw new Error(`${route} bundle ${JSON.stringify(got)} != ${match[1]}`);
          }
          for(const route of ['/admin/segnalazioni','/admin/comunicazioni','/admin/sistema']){
            if(manifest[route])throw new Error(`${route} unexpectedly has a physical route bundle; clean-route alias assumption changed`);
          }
          console.log('EXACT_FINAL_ADMIN_BUNDLES_GREEN');
          NODE

      - name: Install Chromium and serve exact backup plus React
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv-admin-v2
          npm install --prefix /tmp/cv-admin-v2 --no-package-lock --no-save playwright@1.62.1 serve@14.2.4
          /tmp/cv-admin-v2/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          nohup /tmp/cv-admin-v2/node_modules/.bin/serve legacy/dist -l 4190 >/tmp/cv-admin-v2-legacy.log 2>&1 & echo $! >/tmp/cv-admin-v2-legacy.pid
          nohup /tmp/cv-admin-v2/node_modules/.bin/serve -s source/frontend-react/dist -l 4191 >/tmp/cv-admin-v2-react.log 2>&1 & echo $! >/tmp/cv-admin-v2-react.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4190/pages/admin/index.html >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4191/admin >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1

      - name: Compare final admin DOM against exact built backup
        env:
          PLAYWRIGHT_MODULE: /tmp/cv-admin-v2/node_modules/playwright
        shell: bash
        run: |
          set -euo pipefail
          node workflow/scripts/gate-exact-final-admin.mjs

      - name: Commit only after exact admin gate is green
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_BASE"
          cd source
          git config user.name 'CalabriaVera Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend-react/src/pages/AdminPage.tsx frontend-react/public/assets/js
          if [ -d frontend-react/public/firebase ]; then git add frontend-react/public/firebase; fi
          git diff --cached --check
          git commit -m 'fix: match exact final pre-React admin runtime'
          git push origin HEAD:react-migration
          echo "PRIVATE_SHA=$(git rev-parse HEAD)"

      - name: Stop servers
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/cv-admin-v2-legacy.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/cv-admin-v2-react.pid 2>/dev/null)" 2>/dev/null || true
