name: React migration - trigger production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/react-trigger-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.PAT || secrets.GH_PAT || secrets.GITHUB_PAT }}
      EXPECTED_SHA: 243c33a029eb55ae94310b2daabd75cd66154a86
    steps:
      - name: Verify exact production branch revision
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ env.PRIVATE_REPO_PAT }}
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Assert main and dispatch existing Firebase deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$PRIVATE_REPO_PAT"
          code="$(curl --silent --show-error --output /tmp/dispatch-response --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PRIVATE_REPO_PAT" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$PRIVATE_REPO/actions/workflows/firebase-deploy.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch-response
            echo "::error::Firebase deploy workflow dispatch failed with HTTP $code"
            exit 1
          fi
          echo "FIREBASE_DEPLOY_DISPATCH_GREEN=$EXPECTED_SHA"
